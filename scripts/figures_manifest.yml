# Final figures deployment manifest.
#
# Used by figures_deploy to resolve figures whose source filenames are not
# globally unique.  A filename may be produced by more than one experiment;
# in that case each producer is deployed under the name listed below.
#
# Keep canonical source directories unchanged.  This file only controls the
# names used in the assembled results/figures/ directory.
#
# Schema:
#   figures:
#     <source filename>:
#       <experiment_id>: <deployed filename>
#
# The two mappings below are the known suppB/suppB_sc collisions.

figures:
  fig11_recovery_heatmap.pdf:
    suppB: fig11_recovery_heatmap__suppB.pdf
    suppB_sc: fig11_recovery_heatmap__suppB_sc.pdf
  fig11_recovery_heatmap.png:
    suppB: fig11_recovery_heatmap__suppB.png
    suppB_sc: fig11_recovery_heatmap__suppB_sc.png

  fig_comparative_table.pdf:
    suppB: fig_comparative_table__suppB.pdf
    suppB_sc: fig_comparative_table__suppB_sc.pdf
  fig_comparative_table.png:
    suppB: fig_comparative_table__suppB.png
    suppB_sc: fig_comparative_table__suppB_sc.png
