[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hypatiax"
version = "0.11.0"
description = "HypatiaX — hybrid LLM + symbolic regression research framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "pysr>=0.19",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "networkx>=3.3",        # import-DAG cycle detection
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25",
    "openai>=1.20",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "graphviz>=0.20",       # render import_graph.dot
]
repro = [
    "graphviz>=0.20",
]

[project.scripts]
hx-scan-imports = "reproducibility.scan_internal_imports:main"

[tool.setuptools.packages.find]
where   = ["."]
include = [
    "hypatiax*",
    "core*",
    "protocols*",
    "tools*",
    "shared*",
    "scripts*",
    "figures*",
    "reproducibility*",
    "experiments*",
    "analysis*",
]
exclude = ["data*", "logs*", "__pycache__*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore  = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths  = ["experiments/tests"]
addopts    = "-v --tb=short"
