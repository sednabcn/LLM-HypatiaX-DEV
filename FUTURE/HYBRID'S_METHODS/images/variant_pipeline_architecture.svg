<svg width="100%" viewBox="0 0 680 520" role="img" style="" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">How the variant scripts, the protocol, the skeleton, and the future orchestrator relate</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A four-tier vertical diagram. Tier 1: the 8 variant scripts, real gate logic. Tier 2: experiment_protocol_hybrid.py, the case catalog and capability manifest. Tier 3: exp_cross_variant_skeleton.py, a stub runner that proves the gating mechanism works. Tier 4, dashed border indicating not yet built: run_comparative_hybrid_methods.py, the real orchestrator that will call tier 1's real functions using tier 2's catalog.</desc>
