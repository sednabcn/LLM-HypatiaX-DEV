exp2-matrix:
    name: "exp2 · shard ${{ matrix.equation_range }}"
    runs-on: ubuntu-latest          # ← orchestrator stays on GitHub
    needs: exp1b
    strategy:
      fail-fast: false
      matrix:
        equation_range: ["1-6","7-12","13-18","19-24","25-30"]
    steps:
      - uses: actions/checkout@v4
      - name: Trigger CodeBuild shard
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: hypatiax-exp2-shard
          env-vars-for-codebuild: |
            EXP2_EQUATION_RANGE,ANTHROPIC_API_KEY,PYSR_TIMEOUT
        env:
          EXP2_EQUATION_RANGE: ${{ matrix.equation_range }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
