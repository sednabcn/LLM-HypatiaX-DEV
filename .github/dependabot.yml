name: Dependabot

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt in to Node.js 24 (avoids deprecation warning)

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Dependabot Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dependabot action
        uses: github/dependabot-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "torch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
