# =============================================================================
#  ci_create_pdf.yml
#  GitHub Actions Workflow — HypatiaX JMLR Paper PDF Compilation
#
#  Triggers: push / PR to main or dev branches, or manual dispatch
#  Jobs:
#    1. validate       — source file & cross-reference checks
#    2. compile-main   — main paper (4-pass pdflatex + bibtex, via `make main`)
#    3. compile-supp-a — Supplementary A (via `make suppa`)
#    4. compile-supp-b — Supplementary B (via `make suppb`)
#    5. merge-pdf      — combine all three PDFs into one
#    6. commit-pdfs    — download all PDFs & commit them to repo root
#    7. report         — upload artefacts & post summary
#
#  Build logic lives in the repo's Makefile (`make main|suppa|suppb|
#  verify-main|...`) so local builds and CI builds share one implementation —
#  see Makefile and scripts/check_xrefs.py.
# =============================================================================

name: Build HypatiaX PDF

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - "**.tex"
      - "**.bib"
      - "figures/**"
      - ".github/workflows/ci_create_pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Force clean build (rm -rf build/ output/ before compiling)"
        required: false
        default: false
        type: boolean
      target:
        description: "What to compile"
        required: false
        default: "all"
        type: choice
        options: [all, main-only, supp-only]

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_TEX:    jmlr_paper_main.tex
  SUPP_A_TEX:  supp_routing_improvements.tex
  SUPP_B_TEX:  supp_benchmark_report.tex
  BIB_FILE:    references.bib
  BUILD_DIR:   build
  OUTPUT_DIR:  output

# =============================================================================
# JOB 1 — Validate source files & cross-references (no LaTeX needed)
# =============================================================================
jobs:
  validate:
    name: "Step 1–3 · Validate Sources & Cross-References"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Check required files exist ──────────────────────────────────────
      - name: Check required source files
        run: |
          echo "::group::Source file check"
          missing=0
          for f in "$MAIN_TEX" "$SUPP_A_TEX" "$SUPP_B_TEX" "$BIB_FILE"; do
            if [[ -f "$f" ]]; then
              echo "✔  $f  ($(wc -c < "$f") bytes)"
            else
              echo "::error file=$f::Required file missing: $f"
              missing=$((missing + 1))
            fi
          done
          echo "::endgroup::"
          [[ $missing -eq 0 ]] || exit 3

      # ── Document structure check ────────────────────────────────────────
      - name: Check document environments
        run: |
          echo "::group::Document structure"
          fail=0
          for tex in "$MAIN_TEX" "$SUPP_A_TEX" "$SUPP_B_TEX"; do
            begins=$(grep -c '\\begin{document}' "$tex" || true)
            ends=$(grep -c   '\\end{document}'   "$tex" || true)
            if [[ "$begins" -eq 1 && "$ends" -eq 1 ]]; then
              echo "✔  $tex — \\begin/\\end{document} balanced"
            else
              echo "::warning file=$tex::Unbalanced document environment (begin=$begins end=$ends)"
              fail=$((fail + 1))
            fi
          done
          echo "::endgroup::"
          # Warn only — don't abort; LaTeX will catch real errors
          exit 0

      # ── Static cross-reference analysis ────────────────────────────────
      # Delegates to scripts/check_xrefs.py — the same script `make validate`
      # uses — instead of a separate inline bash/awk implementation. (The
      # previous inline version used the .tex filename as an `awk -F`
      # separator; since "." is an ERE metacharacter, that could silently
      # mis-split labels containing characters near a literal dot.)
      # python3 ships preinstalled on ubuntu-latest runners — no setup step needed.
      - name: Cross-reference static analysis
        id: xref
        run: python3 scripts/check_xrefs.py "$MAIN_TEX" "$SUPP_A_TEX" "$SUPP_B_TEX" "$BIB_FILE"

      - name: Annotate PR with cross-reference summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### Cross-Reference Check" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Undefined \\\\ref targets | ${{ steps.xref.outputs.undef_refs }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Undefined \\\\cite keys   | ${{ steps.xref.outputs.undef_cites }} |" >> "$GITHUB_STEP_SUMMARY"

# =============================================================================
# JOB 2 — Compile Main Paper
# =============================================================================
  compile-main:
    name: "Steps 4–5 · Compile Main Paper"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'main-only' ||
      github.event.inputs.target == ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install TeX Live ──────────────────────────────────────────────────
      # NOTE: there is no apt package literally named "bibtex" on Ubuntu —
      # the bibtex binary is shipped inside texlive-binaries, which the
      # packages below already pull in transitively. Listing "bibtex"
      # explicitly used to make this whole `apt-get install` fail.
      - name: Install TeX Live (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-science \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-publishers \
            qpdf \
            poppler-utils \
            latexmk

      - name: Clean build dirs (clean_build requested)
        if: github.event.inputs.clean_build == 'true'
        run: make clean

      # ── Debug: confirm jmlr2e.sty (and other required style files) are
      # actually present in the checkout before `make main` runs. Mirrors
      # the equivalent check in ci_report_submission.yml's local-build
      # fallback, so both pipelines can be compared directly if one starts
      # failing on a missing style file and the other doesn't.
      - name: "Debug — confirm required style files are present in checkout"
        run: |
          echo "::group::Working directory"
          echo "cwd: $(pwd)"
          echo "::endgroup::"

          echo "::group::jmlr2e.sty on disk"
          ls -la jmlr2e.sty 2>/dev/null || echo "MISSING in checkout: jmlr2e.sty"
          echo "::endgroup::"

          echo "::group::jmlr2e.sty tracked by git?"
          git ls-files | grep -i jmlr2e || echo "NOT TRACKED by git: jmlr2e.sty"
          echo "::endgroup::"

          echo "::group::.gitignore rules matching jmlr2e.sty"
          git check-ignore -v jmlr2e.sty 2>/dev/null || echo "No .gitignore rule matches jmlr2e.sty"
          echo "::endgroup::"

          echo "::group::All *.sty files present in checkout"
          find . -maxdepth 3 -name "*.sty" -print || echo "No .sty files found anywhere"
          echo "::endgroup::"

          echo "::group::kpsewhich lookup (what LaTeX itself would find)"
          kpsewhich jmlr2e.sty || echo "kpsewhich could NOT resolve jmlr2e.sty"
          echo "::endgroup::"

      # ── Build via the shared Makefile (4-pass pdflatex + bibtex) ─────────
      - name: "Compile main paper (make main)"
        run: make main

      - name: Scan log for undefined refs / citations
        run: |
          logfile="$BUILD_DIR/jmlr_paper_main.log"
          undef=$(grep -c 'undefined' "$logfile" || true)
          citewarns=$(grep -c 'Citation.*undefined' "$logfile" || true)
          echo "Undefined refs in log: $undef"
          echo "Undefined citations:   $citewarns"
          if [[ $undef -gt 0 ]]; then
            echo "::warning::Main paper has $undef undefined reference(s)"
            grep 'undefined' "$logfile" | head -20 || true
          fi

      # ── Verify & inspect generated PDF ─────────────────────────────────
      - name: Verify main paper PDF
        run: make verify-main

      - name: Upload main paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: main-paper-pdf
          path: ${{ env.OUTPUT_DIR }}/jmlr_paper_main.pdf
          retention-days: 30

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-paper-logs
          path: |
            build/jmlr_paper_main.log
            build/jmlr_paper_main.blg
          retention-days: 7

# =============================================================================
# JOB 3 — Compile Supplementary A
# =============================================================================
  compile-supp-a:
    name: "Steps 4–6 · Compile Supplementary A"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'supp-only' ||
      github.event.inputs.target == ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # See compile-main for why "bibtex" is intentionally not in this list.
      - name: Install TeX Live (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-bibtex-extra \
            qpdf poppler-utils

      - name: Clean build dirs (clean_build requested)
        if: github.event.inputs.clean_build == 'true'
        run: make clean

      - name: "Compile Supplementary A (make suppa)"
        run: make suppa

      # ── Verify & inspect generated PDF ─────────────────────────────────
      - name: Verify Supplementary A PDF
        run: make verify-suppa

      - name: Upload Supplementary A PDF
        uses: actions/upload-artifact@v4
        with:
          name: supp-a-pdf
          path: ${{ env.OUTPUT_DIR }}/supp_routing_improvements.pdf
          retention-days: 30

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supp-a-logs
          path: |
            build/supp_routing_improvements.log
            build/supp_routing_improvements.blg
          retention-days: 7

# =============================================================================
# JOB 4 — Compile Supplementary B
# =============================================================================
  compile-supp-b:
    name: "Steps 4–7 · Compile Supplementary B"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'supp-only' ||
      github.event.inputs.target == ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # See compile-main for why "bibtex" is intentionally not in this list.
      - name: Install TeX Live (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-bibtex-extra \
            qpdf poppler-utils

      - name: Clean build dirs (clean_build requested)
        if: github.event.inputs.clean_build == 'true'
        run: make clean

      - name: "Compile Supplementary B (make suppb)"
        run: make suppb

      # ── Verify & inspect generated PDF ─────────────────────────────────
      - name: Verify Supplementary B PDF
        run: make verify-suppb

      - name: Upload Supplementary B PDF
        uses: actions/upload-artifact@v4
        with:
          name: supp-b-pdf
          path: ${{ env.OUTPUT_DIR }}/supp_benchmark_report.pdf
          retention-days: 30

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supp-b-logs
          path: |
            build/supp_benchmark_report.log
            build/supp_benchmark_report.blg
          retention-days: 7

# =============================================================================
# JOB 5 — Merge all PDFs into one combined output
# =============================================================================
  merge-pdf:
    name: "Step 8 · Merge PDFs → HypatiaX_JMLR_complete.pdf"
    runs-on: ubuntu-latest
    needs: [compile-main, compile-supp-a, compile-supp-b]
    if: >
      always() &&
      needs.compile-main.result == 'success' &&
      needs.compile-supp-a.result == 'success' &&
      needs.compile-supp-b.result == 'success' &&
      (github.event.inputs.target == 'all' || github.event.inputs.target == '')

    steps:
      - name: Install qpdf
        run: sudo apt-get install -y --no-install-recommends qpdf

      - name: Download main paper PDF
        uses: actions/download-artifact@v4
        with:
          name: main-paper-pdf
          path: pdfs/

      - name: Download Supplementary A PDF
        uses: actions/download-artifact@v4
        with:
          name: supp-a-pdf
          path: pdfs/

      - name: Download Supplementary B PDF
        uses: actions/download-artifact@v4
        with:
          name: supp-b-pdf
          path: pdfs/

      - name: Merge PDFs with qpdf
        run: |
          mkdir -p output
          qpdf --empty --pages \
            pdfs/jmlr_paper_main.pdf \
            pdfs/supp_routing_improvements.pdf \
            pdfs/supp_benchmark_report.pdf \
            -- output/HypatiaX_JMLR_complete.pdf
          echo "✔ Combined PDF: $(du -h output/HypatiaX_JMLR_complete.pdf | cut -f1)"

      - name: Upload combined PDF
        uses: actions/upload-artifact@v4
        with:
          name: HypatiaX-JMLR-complete
          path: output/HypatiaX_JMLR_complete.pdf
          retention-days: 90

# =============================================================================
# JOB 6 — Download all PDFs and commit them to the repository root
# =============================================================================
  commit-pdfs:
    name: "Step 9 · Commit PDFs to Repo Root"
    runs-on: ubuntu-latest
    needs: [compile-main, compile-supp-a, compile-supp-b, merge-pdf]
    if: >
      always() &&
      needs.compile-main.result == 'success' &&
      needs.compile-supp-a.result == 'success' &&
      needs.compile-supp-b.result == 'success' &&
      github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN with write permission
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Download all three individual PDFs ─────────────────────────────
      - name: Download main paper PDF
        uses: actions/download-artifact@v4
        with:
          name: main-paper-pdf
          path: downloaded-pdfs/

      - name: Download Supplementary A PDF
        uses: actions/download-artifact@v4
        with:
          name: supp-a-pdf
          path: downloaded-pdfs/

      - name: Download Supplementary B PDF
        uses: actions/download-artifact@v4
        with:
          name: supp-b-pdf
          path: downloaded-pdfs/

      # ── Download combined PDF (only available when target == all) ───────
      - name: Download combined PDF
        if: needs.merge-pdf.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: HypatiaX-JMLR-complete
          path: downloaded-pdfs/
        continue-on-error: true  # not produced for partial builds

      # ── Copy PDFs to repo root & commit ────────────────────────────────
      - name: Copy PDFs to repo root
        run: |
          echo "::group::Files downloaded"
          ls -lh downloaded-pdfs/
          echo "::endgroup::"

          cp downloaded-pdfs/*.pdf .

          echo "::group::PDFs staged for commit"
          ls -lh *.pdf
          echo "::endgroup::"

      - name: Commit and push PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add *.pdf

          # Only commit if there is something new / changed
          if git diff --cached --quiet; then
            echo "No PDF changes detected — nothing to commit."
          else
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            COMMIT_MSG="ci: update compiled PDFs [${SHORT_SHA}]\n\nBuilt from commit ${{ github.sha }}\nTriggered by: ${{ github.event_name }} on ${{ github.ref_name }}\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git commit -m "$(printf '%b' "$COMMIT_MSG")"

            git push origin HEAD:${{ github.ref_name }}
            echo "✔ PDFs committed and pushed to ${{ github.ref_name }}"
          fi

# =============================================================================
# JOB 7 — Final report & job summary
# =============================================================================
  report:
    name: "Step 10–11 · Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [validate, compile-main, compile-supp-a, compile-supp-b, merge-pdf, commit-pdfs]
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "## HypatiaX JMLR — CI Pipeline Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate sources & cross-refs | ${{ needs.validate.result }} |"       >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile main paper            | ${{ needs.compile-main.result }} |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile Supplementary A       | ${{ needs.compile-supp-a.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile Supplementary B       | ${{ needs.compile-supp-b.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge PDFs                    | ${{ needs.merge-pdf.result }} |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit PDFs to repo           | ${{ needs.commit-pdfs.result }} |"    >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail pipeline if any compile job failed
        if: >
          needs.compile-main.result == 'failure' ||
          needs.compile-supp-a.result == 'failure' ||
          needs.compile-supp-b.result == 'failure'
        run: |
          echo "One or more compile jobs failed."
          exit 1
