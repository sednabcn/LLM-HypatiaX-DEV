# ==============================================================================
#  ci_pipeline_reviewers.yml  —  HypatiaX · JMLR reviewer pipeline (STANDALONE)
#
#  PURPOSE
#  -------
#  Lives in a PUBLIC repository that reviewers have access to. The actual
#  experiments, notebooks, and audits run in a separate PRIVATE repository;
#  reviewers are never given access to that repo, so this workflow has
#  NO secrets, NO PAT, and NO Actions-API access into it.
#
#  Instead, it consumes the single self-contained zip produced by
#  ci_export_reviewer_bundle.yml (which runs in the private repo and attaches
#  the zip to a GitHub Release or plain artefact). You give this workflow a
#  public URL to that zip — that's the only required input.
#
#  Stages exposed to reviewers (from hypatia_pipeline_reviewer_map.svg):
#
#    R1 · collect-artefacts   — unpacks bundle/c1_c2 (_report.md + _analysis.json
#                               + figures/*.pdf + tables/*.tex) and bundle/scripts
#                               (the generator scripts themselves, for provenance)
#    R2 · checkpoint-summary  — reads bundle/c3_checkpoint/qualify_run.log,
#                               pre-reconstructed at export time by
#                               ci_export_reviewer_bundle.yml
#                               (reproducibility completeness — include)
#    R3 · paper-audit-summary — reads bundle/c4_audit/paper_audit_findings.json
#                               (numerical claim verification — include)
#    R4 · notebooks-summary   — reads bundle/c5_notebooks (executed NB-01…NB-06
#                               + notebooks_audit_summary.json)
#                               (citation/consistency audit — include)
#    R5 · final-summary       — prints a consolidated reviewer health table
#                               and sets the workflow conclusion
#
#  Stages intentionally ABSENT (excluded per reviewer map):
#    C0  ci_runner.yml          — infrastructure; not reproducible without full env
#    C5b ci_report.yml          — Pages deploy; reviewers use the published URL
#    C6  self-dispatch/next-slot — pure orchestration; no scientific content
#    diagnose job               — internal idempotency guard only
#    dispatch-checkpoint        — was needed to trigger ci_pipeline_check.yml
#                                  live; the bundle already ships a pre-baked
#                                  qualify_run.log, so reviewers never need to
#                                  dispatch anything in the private repo
#
#  HOW TO TRIGGER
#  --------------
#  workflow_dispatch (manual only — reviewers run this once per review cycle):
#    bundle_url : REQUIRED. Public, unauthenticated URL to the reviewer bundle
#                 zip produced by ci_export_reviewer_bundle.yml — typically a
#                 GitHub Release asset URL, e.g.
#                 https://github.com/<org>/<private-repo>/releases/download/
#                 reviewer-bundle-v1/hypatia-reviewer-bundle-<run>.zip
#                 The asset must be on a PUBLIC release (or any plain HTTPS
#                 host) — this workflow never authenticates to fetch it.
#    pages_url  : optional. Deployed GitHub Pages URL produced by ci_report.yml
#                 in the private repo, printed in the final summary if given.
#
#  PERMISSIONS
#  -----------
#  contents: read   — default token permissions; no writes, nothing dispatched.
#  No `actions:` permission, no PAT, no GITHUB secrets of any kind are used
#  anywhere in this workflow — it only ever performs a plain HTTPS GET against
#  bundle_url and reads files out of the resulting zip.
#
#  TIMEOUT CONTRACT
#  ----------------
#  fetch-bundle         : 10 min  (download + unzip + manifest validation)
#  collect-artefacts    :  5 min  (re-stage c1_c2 + scripts from the bundle)
#  checkpoint-summary   :  5 min  (read qualify_run.log)
#  paper-audit-summary  :  5 min  (JSON read + echo)
#  notebooks-summary    :  5 min  (notebook list + findings echo)
#  final-summary        :  5 min  (table print; no external calls)
# ==============================================================================

name: "HypatiaX - reviewer pipeline (standalone)"
run-name: >-
  HypatiaX reviewer pipeline — standalone — run ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: >
          REQUIRED. Public URL to the reviewer bundle zip produced by
          ci_export_reviewer_bundle.yml in the private repo (GitHub Release
          asset URL, or any other direct HTTPS link). No authentication is
          ever sent with this request.
        required: true
        default: ""

      pages_url:
        description: >
          GitHub Pages URL produced by ci_report.yml in the private repo
          (e.g. https://<org>.github.io/<repo>/). Leave blank to skip.
        required: false
        default: ""

permissions:
  contents: read

env:
  BUNDLE_DIR: reviewer_bundle

jobs:

  # ============================================================================
  #  JOB fetch-bundle
  #
  #  Downloads bundle_url with a plain, unauthenticated HTTPS GET, unzips it,
  #  validates manifest.json, and re-uploads the extracted tree as a single
  #  Actions artefact so every downstream job can pull it without re-fetching.
  # ============================================================================
  fetch-bundle:
    name: "Fetch + validate reviewer bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      bundle_ok: ${{ steps.validate.outputs.bundle_ok }}

    steps:
      - name: Validate bundle_url was supplied
        run: |
          if [[ -z "${{ github.event.inputs.bundle_url }}" ]]; then
            echo "::error::bundle_url is required. Supply the public Release asset URL produced by ci_export_reviewer_bundle.yml."
            exit 1
          fi

      - name: Download bundle (no auth)
        run: |
          set -euo pipefail
          echo "Downloading: ${{ github.event.inputs.bundle_url }}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o bundle.zip \
            "${{ github.event.inputs.bundle_url }}"
          echo "Downloaded: $(du -h bundle.zip | cut -f1)"

      - name: Unzip bundle
        run: |
          set -euo pipefail
          mkdir -p "${BUNDLE_DIR}"
          unzip -q bundle.zip -d "${BUNDLE_DIR}"
          echo "Extracted tree:"
          find "${BUNDLE_DIR}" -maxdepth 2 -type d | sort

      - name: Validate manifest.json
        id: validate
        run: |
          set -euo pipefail
          MANIFEST="${BUNDLE_DIR}/manifest.json"
          if [[ ! -f "${MANIFEST}" ]]; then
            echo "::error::manifest.json not found in bundle — this does not look like a hypatia-reviewer-bundle zip."
            echo "bundle_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python3 - "${MANIFEST}" <<'PYEOF'
          import json, sys
          from pathlib import Path
          m = json.loads(Path(sys.argv[1]).read_text())
          print("=== Bundle manifest ===")
          print(f"  schema   : {m.get('schema','?')}")
          print(f"  repo     : {m.get('repo','?')}")
          print(f"  branch   : {m.get('branch','?')}")
          print(f"  sha      : {m.get('sha','?')}")
          print(f"  exported : {m.get('exported_at','?')}")
          print(f"  file counts: {m.get('file_counts', {})}")
          PYEOF
          echo "bundle_ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload extracted bundle for downstream jobs
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name:              bundle-extracted-${{ github.run_id }}
          path:              ${{ env.BUNDLE_DIR }}/
          if-no-files-found: error
          retention-days:    7


  # ============================================================================
  #  JOB R1 — collect-artefacts
  #
  #  Re-stages bundle/c1_c2 (analysis, figures, tables) and bundle/scripts
  #  (the generator scripts themselves) under a single reviewer-scoped
  #  artefact so reviewers have one download target, same as before — only
  #  the source has changed (bundle instead of a live cross-repo API call).
  # ============================================================================
  collect-artefacts:
    name: "R1 · Collect C1+C2 output artefacts + generator scripts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-bundle]

    steps:
      - name: Download extracted bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-extracted-${{ github.run_id }}
          path: ${{ env.BUNDLE_DIR }}/

      - name: Stage C1+C2 artefacts + scripts + report for upload
        run: |
          set -euo pipefail
          mkdir -p reviewer_artefacts
          [[ -d "${BUNDLE_DIR}/c1_c2"   ]] && cp -r "${BUNDLE_DIR}/c1_c2"   reviewer_artefacts/analysis_figures_tables
          [[ -d "${BUNDLE_DIR}/scripts" ]] && cp -r "${BUNDLE_DIR}/scripts" reviewer_artefacts/scripts
          [[ -d "${BUNDLE_DIR}/report"  ]] && cp -r "${BUNDLE_DIR}/report"  reviewer_artefacts/report

          echo "=== C1+C2 + scripts + report staging summary ==="
          echo "  analysis : $(find reviewer_artefacts/analysis_figures_tables/analysis -type f 2>/dev/null | wc -l) file(s)"
          echo "  figures  : $(find reviewer_artefacts/analysis_figures_tables/figures  -type f 2>/dev/null | wc -l) file(s)"
          echo "  tables   : $(find reviewer_artefacts/analysis_figures_tables/tables   -type f 2>/dev/null | wc -l) file(s)"
          echo "  scripts  : $(find reviewer_artefacts/scripts -type f 2>/dev/null | wc -l) file(s)"
          if [[ -f reviewer_artefacts/report/hypatia_clean_report.html ]]; then
            echo "  report   : hypatia_clean_report.html ($(wc -c < reviewer_artefacts/report/hypatia_clean_report.html) bytes) — open this first."
          else
            echo "  report   : not present in this bundle"
          fi

          if [[ ! -d "${BUNDLE_DIR}/c1_c2" ]]; then
            echo "::warning::No c1_c2/ folder in bundle — C1+C2 artefacts may not have been collected at export time."
          fi
          if [[ ! -d "${BUNDLE_DIR}/scripts" ]]; then
            echo "::warning::No scripts/ folder in bundle — generator scripts were not included in this export."
          fi
          if [[ ! -f "${BUNDLE_DIR}/report/hypatia_clean_report.html" ]]; then
            echo "::notice::No rendered report in this bundle — the export run's tex/bib paths may need tex_path/bib_path overrides."
          fi

      - name: Upload reviewer C1+C2 + scripts + report artefacts
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name:              reviewer-c1-c2-artefacts-${{ github.run_id }}
          path:              reviewer_artefacts/
          if-no-files-found: warn
          retention-days:    90


  # ============================================================================
  #  JOB R2 — checkpoint-summary
  #
  #  Reads bundle/c3_checkpoint/qualify_run.log, which ci_export_reviewer_bundle.yml
  #  already reconstructed from the "Qualify all experiments" job log at export
  #  time. No live dispatch or Actions API call is needed here — reviewers in
  #  the public repo couldn't reach the private repo's Actions API anyway.
  # ============================================================================
  checkpoint-summary:
    name: "R2 · C3 Checkpoint — qualify_run.log"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-bundle]

    outputs:
      checkpoint_status: ${{ steps.read.outputs.checkpoint_status }}

    steps:
      - name: Download extracted bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-extracted-${{ github.run_id }}
          path: ${{ env.BUNDLE_DIR }}/

      - name: Print checkpoint summary
        id: read
        run: |
          set -euo pipefail
          echo "=== C3 Checkpoint — qualify_run.log ==="
          LOG="${BUNDLE_DIR}/c3_checkpoint/qualify_run.log"
          if [[ -s "${LOG}" ]]; then
            echo "qualify_run.log present in bundle (reconstructed at export time)."
            echo "---"
            # Surface just the per-experiment qualification table inline; the
            # full raw job log is still uploaded in full as the artefact below.
            grep -E "Qualification:|Experiment|✅|❌|FAILED" "${LOG}" || cat "${LOG}"
            echo "checkpoint_status=present" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::qualify_run.log missing or empty in bundle."
            echo "  Possible reasons:"
            echo "    - ci_pipeline_check.yml had not run yet when the bundle was exported"
            echo "    - The export run's log fetch failed (Actions log retention window elapsed)"
            echo "checkpoint_status=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload checkpoint summary for reviewer
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name:              reviewer-c3-checkpoint-${{ github.run_id }}
          path:              ${{ env.BUNDLE_DIR }}/c3_checkpoint/
          if-no-files-found: warn
          retention-days:    90


  # ============================================================================
  #  JOB R3 — paper-audit-summary
  #
  #  Reads bundle/c4_audit/paper_audit_findings.json, which cross-checks every
  #  numerical claim in the paper against actual result file values.
  # ============================================================================
  paper-audit-summary:
    name: "R3 · C4 Paper audit — paper_audit_findings.json"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-bundle]

    outputs:
      audit_status: ${{ steps.read.outputs.audit_status }}
      n_fail:       ${{ steps.read.outputs.n_fail }}
      n_pass:       ${{ steps.read.outputs.n_pass }}
      n_warn:       ${{ steps.read.outputs.n_warn }}
      n_missing:    ${{ steps.read.outputs.n_missing }}

    steps:
      - name: Download extracted bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-extracted-${{ github.run_id }}
          path: ${{ env.BUNDLE_DIR }}/

      - name: Parse and print audit findings
        id: read
        env:
          BUNDLE_DIR: ${{ env.BUNDLE_DIR }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          bundle_dir = Path(os.environ.get("BUNDLE_DIR", "reviewer_bundle"))
          findings_path = next((bundle_dir / "c4_audit").rglob("paper_audit_findings.json"), None)

          if findings_path is None:
            print("::warning::paper_audit_findings.json not found in bundle/c4_audit/.")
            print("  Possible reasons:")
            print("    - ci_paper_audit.yml had not run yet when the bundle was exported")
            print("    - The export run's artefact download for C4 found nothing (non-fatal there too)")
            env_file = os.environ.get("GITHUB_OUTPUT", "")
            if env_file:
              with open(env_file, "a") as f:
                f.write("audit_status=missing\nn_fail=0\nn_pass=0\nn_warn=0\nn_missing=0\n")
            sys.exit(0)

          findings = json.loads(findings_path.read_text())
          items = findings.get("findings", []) if isinstance(findings, dict) else findings

          SEP = "=" * 70
          print(SEP)
          print("  C4 PAPER AUDIT  —  paper_audit_findings.json")
          print(SEP)

          n_pass = n_fail = n_warn = n_missing = 0
          for item in items:
            status = str(item.get("status", "UNKNOWN")).upper()
            if   status == "PASS":    n_pass    += 1
            elif status == "FAIL":    n_fail    += 1
            elif status == "WARN":    n_warn    += 1
            elif status == "MISSING": n_missing += 1

          print(f"  Total claims : {len(items)}")
          print(f"  PASS         : {n_pass}")
          print(f"  WARN         : {n_warn}")
          print(f"  FAIL         : {n_fail}")
          print(f"  MISSING      : {n_missing}")
          print(SEP)

          for item in items:
            status = str(item.get("status", "UNKNOWN")).upper()
            icon = {"PASS": "✅", "WARN": "⚠ ", "FAIL": "❌", "MISSING": "❓"}.get(status, "  ")
            exp    = item.get("exp",    item.get("experiment", "?"))
            metric = item.get("metric", item.get("claim",      "?"))
            detail = item.get("detail", item.get("message",    ""))
            print(f"  {icon}  exp={exp:<25}  metric={metric}")
            if detail:
              print(f"      {detail}")
          print(SEP)

          env_file = os.environ.get("GITHUB_OUTPUT", "")
          if env_file:
            with open(env_file, "a") as f:
              status_str = "pass" if (n_fail == 0 and n_missing == 0) else "fail"
              f.write(f"audit_status={status_str}\n")
              f.write(f"n_fail={n_fail}\n")
              f.write(f"n_pass={n_pass}\n")
              f.write(f"n_warn={n_warn}\n")
              f.write(f"n_missing={n_missing}\n")
          PYEOF

      - name: Upload reviewer paper-audit artefacts
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name:              reviewer-c4-paper-audit-${{ github.run_id }}
          path:              ${{ env.BUNDLE_DIR }}/c4_audit/
          if-no-files-found: warn
          retention-days:    90


  # ============================================================================
  #  JOB R4 — notebooks-summary
  #
  #  Reads the executed NB-01…NB-06 notebooks and notebooks_audit_summary.json
  #  out of bundle/c5_notebooks/.
  # ============================================================================
  notebooks-summary:
    name: "R4 · C5 Paper notebooks — NB-01…NB-06 + audit summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-bundle]

    outputs:
      notebooks_status: ${{ steps.read.outputs.notebooks_status }}
      open_issues:      ${{ steps.read.outputs.open_issues }}

    steps:
      - name: Download extracted bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-extracted-${{ github.run_id }}
          path: ${{ env.BUNDLE_DIR }}/

      - name: Print notebooks audit summary
        id: read
        env:
          BUNDLE_DIR: ${{ env.BUNDLE_DIR }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          bundle_dir = Path(os.environ.get("BUNDLE_DIR", "reviewer_bundle"))
          nb_dir = bundle_dir / "c5_notebooks"
          summary_path = next(nb_dir.rglob("notebooks_audit_summary.json"), None)

          notebooks = sorted(nb_dir.rglob("*.ipynb"))
          print("=== C5 Paper Notebooks ===")
          print(f"  Executed notebooks retrieved: {len(notebooks)}")
          for nb in notebooks:
            print(f"    {nb.name}")

          if summary_path is None:
            print("\n::warning::notebooks_audit_summary.json not found in bundle/c5_notebooks/.")
            env_file = os.environ.get("GITHUB_OUTPUT", "")
            if env_file:
              with open(env_file, "a") as f:
                f.write("notebooks_status=missing\nopen_issues=0\n")
            sys.exit(0)

          summary = json.loads(summary_path.read_text())
          findings = summary.get("findings", [])
          open_issues = [f for f in findings if str(f.get("status","")).upper() not in ("RESOLVED","CLOSED")]
          resolved    = [f for f in findings if str(f.get("status","")).upper() in ("RESOLVED","CLOSED")]

          SEP = "=" * 70
          print(SEP)
          print("  C5 NOTEBOOKS AUDIT SUMMARY")
          print(SEP)
          print(f"  Source     : {summary.get('source','?')}")
          print(f"  Generated  : {summary.get('generated_at','?')}")
          print(f"  Total FIX-*: {len(findings)}")
          print(f"  Open       : {len(open_issues)}")
          print(f"  Resolved   : {len(resolved)}")
          print(SEP)

          if open_issues:
            print("  OPEN issues:")
            for f in open_issues:
              sev  = str(f.get("severity","?")).upper()
              icon = {"CRITICAL":"🔴","HIGH":"🟠","MEDIUM":"🟡","LOW":"🟢"}.get(sev, "⚪")
              print(f"    {icon} [{f['id']}]  {f.get('nb','?')}  —  {f.get('description','')}")
              if f.get("action"):
                print(f"       Action: {f['action']}")
          if resolved:
            print(f"\n  RESOLVED issues ({len(resolved)}):")
            for f in resolved:
              print(f"    ✅ [{f['id']}]  {f.get('nb','?')}  —  {f.get('description','')}")
          print(SEP)

          env_file = os.environ.get("GITHUB_OUTPUT", "")
          if env_file:
            with open(env_file, "a") as f:
              status = "pass" if len(open_issues) == 0 else "open_issues"
              f.write(f"notebooks_status={status}\nopen_issues={len(open_issues)}\n")
          PYEOF

      - name: Upload reviewer notebooks artefacts
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name:              reviewer-c5-notebooks-${{ github.run_id }}
          path:              ${{ env.BUNDLE_DIR }}/c5_notebooks/
          if-no-files-found: warn
          retention-days:    90


  # ============================================================================
  #  JOB R5 — final-summary
  #
  #  Consolidates the status from R2, R3, R4 and prints a single health table
  #  for reviewers. Sets the workflow conclusion: exits 0 only if the audit
  #  passed (no FAIL/MISSING). Open notebook issues are reported but do not
  #  block the workflow conclusion.
  # ============================================================================
  final-summary:
    name: "R5 · Reviewer health table"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fetch-bundle, collect-artefacts, checkpoint-summary, paper-audit-summary, notebooks-summary]
    if: always()

    steps:
      - name: Print consolidated reviewer health table
        env:
          PAGES_URL:          ${{ github.event.inputs.pages_url || '' }}
          BUNDLE_URL:         ${{ github.event.inputs.bundle_url }}
          CHECKPOINT_STATUS:  ${{ needs.checkpoint-summary.outputs.checkpoint_status }}
          AUDIT_STATUS:       ${{ needs.paper-audit-summary.outputs.audit_status }}
          N_FAIL:             ${{ needs.paper-audit-summary.outputs.n_fail }}
          N_PASS:             ${{ needs.paper-audit-summary.outputs.n_pass }}
          N_WARN:             ${{ needs.paper-audit-summary.outputs.n_warn }}
          N_MISSING:          ${{ needs.paper-audit-summary.outputs.n_missing }}
          NOTEBOOKS_STATUS:   ${{ needs.notebooks-summary.outputs.notebooks_status }}
          OPEN_ISSUES:        ${{ needs.notebooks-summary.outputs.open_issues }}
          COLLECT_RESULT:     ${{ needs.collect-artefacts.result }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          SEP   = "=" * 72
          pages  = os.environ.get("PAGES_URL", "").strip()
          bundle = os.environ.get("BUNDLE_URL", "").strip()

          def gate(status, ok_vals=("present","pass","success")):
            return "✅" if str(status).lower() in ok_vals else \
                   "❓" if str(status).lower() in ("missing","") else "❌"

          ck  = os.environ.get("CHECKPOINT_STATUS", "")
          au  = os.environ.get("AUDIT_STATUS", "")
          nb  = os.environ.get("NOTEBOOKS_STATUS", "")
          col = os.environ.get("COLLECT_RESULT", "")

          n_fail    = int(os.environ.get("N_FAIL",    "0") or "0")
          n_pass    = int(os.environ.get("N_PASS",    "0") or "0")
          n_warn    = int(os.environ.get("N_WARN",    "0") or "0")
          n_missing = int(os.environ.get("N_MISSING", "0") or "0")
          open_nb   = int(os.environ.get("OPEN_ISSUES","0") or "0")

          print()
          print(SEP)
          print("  HYPATIA X  —  JMLR REVIEWER PIPELINE SUMMARY (standalone)")
          print(SEP)
          print(f"  Bundle source: {bundle}")
          print(SEP)
          print(f"  {'Stage':<40}  {'Status'}")
          print(f"  {'-'*40}  {'------'}")
          print(f"  {'R1 · C1+C2  Analysis + figures/tables':<40}  {gate(col, ('success',))}")
          print(f"  {'R2 · C3     Checkpoint (qualify_run.log)':<40}  {gate(ck)}")

          audit_label = f"R3 · C4     Paper audit  (P:{n_pass} W:{n_warn} F:{n_fail} M:{n_missing})"
          print(f"  {audit_label:<40}  {gate(au)}")

          nb_label = f"R4 · C5     Notebooks   ({open_nb} open FIX-* issues)"
          nb_gate  = "✅" if open_nb == 0 else "⚠ "
          print(f"  {nb_label:<40}  {nb_gate}")

          print(SEP)

          if pages:
            print(f"\n  📄  GitHub Pages report URL:")
            print(f"      {pages}")
            print()

          overall_ok = (n_fail == 0 and n_missing == 0 and ck in ("present",) and col == "success")
          if overall_ok:
            print("  ✅  Overall: PIPELINE EVIDENCE COMPLETE — ready for review.")
          else:
            print("  ⚠   Overall: SOME EVIDENCE MISSING OR FAILING — see jobs above.")
            if n_fail > 0 or n_missing > 0:
              print(f"      Paper audit: {n_fail} FAIL  {n_missing} MISSING — see R3 job log.")
            if ck not in ("present",):
              print("      Checkpoint log: missing from bundle — re-export with ci_export_reviewer_bundle.yml.")
            if col != "success":
              print("      C1+C2 artefacts: collection step did not succeed.")
          print(SEP)
          print()

          # Notebook open issues are advisory — do not fail the workflow for them.
          # Audit FAIL or MISSING values DO fail the workflow.
          sys.exit(0 if (n_fail == 0 and n_missing == 0) else 1)
          PYEOF
