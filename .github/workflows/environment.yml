name: hypatiax
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.12.3

  # Scientific core
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.3
  - scikit-learn=1.4.2

  # Neural networks
  - pytorch=2.3.0
  - cpuonly                        # remove and add pytorch-cuda=12.1 for GPU

  # Symbolic regression
  - pip:
    - pysr==0.18.3                 # PySR requires pip install
    - juliapkg==0.1.13             # Julia interface for PySR

    # LLM
    - pip:
      # BUG 10 FIX: anthropic==0.28.0 predates the claude-sonnet-4-20250514 model
      # string required by repro.yaml / ci_trace_pipeline.yml.  Updated to 0.40.0
      # which introduced support for that model family.
      - anthropic==0.40.0

  # Visualisation
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - plotly=5.22.0

  # Symbolic math
  - sympy=1.12

  # Data / IO
  - jsonschema=4.22.0
  - pyyaml=6.0.1
  - tqdm=4.66.4
  - click=8.1.7
  - pip:
    - pmlb==1.0.2               # Penn Machine Learning Benchmarks (env_check verifies this)
    - python-dotenv==1.0.1      # .env file loading for ANTHROPIC_API_KEY

  # Dev / linting
  - pip:
    - ruff==0.4.4
    - pytest==8.2.0
    - pytest-timeout==2.3.1
    - ipykernel==6.29.4
    - nbformat==5.10.4

  # Build
  - pip:
    - setuptools==70.0.0
    - wheel==0.43.0

# ─── Notes ────────────────────────────────────────────────────────────────────
# Create:   conda env create -f environment.yml
# Activate: conda activate hypatiax
# Update:   conda env update -f environment.yml --prune
#
# Julia 1.11 is required for the noise-sweep and sample-complexity experiments.
# Install: https://julialang.org/downloads/
# Or use the provided Dockerfile which bundles Julia 1.11.
#
# GPU (optional): replace `cpuonly` with `pytorch-cuda=12.1` and ensure
# CUDA 12.1 drivers are installed.
