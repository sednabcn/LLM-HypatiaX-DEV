name: Run Symbolic Engine v2 (Exp-2 Method 5)

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/run_sym_engine_v2.ipynb'
      - '.github/workflows/ci_run_sym_engine_v2.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/run_sym_engine_v2.ipynb'
  schedule:
    - cron: '30 9 * * *'   # 10:30 AM BST (UTC+1) = 09:30 UTC — job 1 of 4
  workflow_dispatch:
    inputs:
      pysr_timeout:
        description: 'PySR timeout in seconds per equation'
        required: false
        default: '1100'
      one_equation:
        description: 'Run a single equation only (e.g. "Kinetic") — leave blank for all 30'
        required: false
        default: ''
      resume:
        description: 'Resume from checkpoint (true/false)'
        required: false
        default: 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  run-sym-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 1440   # 24 h ceiling — matches the ~12-24 h runtime estimate

    env:
      JULIA_VERSION: "1.11.4"
      JULIA_MINOR: "1.11"
      JULIA_NUM_THREADS: "4"   # ubuntu-latest runners have 4 vCPUs
      JULIA_EXCLUSIVE: "0"
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
      LLM_MODEL: "claude-sonnet-4-20250514"
      PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pysr \
            scikit-learn \
            scipy \
            numpy \
            pandas \
            anthropic \
            nbconvert \
            nbformat \
            nbclient \
            ipykernel

      # ── Julia ─────────────────────────────────────────────────────────────
      - name: Install Julia ${{ env.JULIA_VERSION }}
        run: |
          TARBALL="julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          URL="https://julialang-s3.julialang.org/bin/linux/x64/${JULIA_MINOR}/${TARBALL}"
          wget -q "$URL"
          tar -xzf "$TARBALL"
          echo "${GITHUB_WORKSPACE}/julia-${JULIA_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Julia threads
        run: |
          julia -e 'println("Julia threads: ", Threads.nthreads())'

      # ── Secrets ───────────────────────────────────────────────────────────
      - name: Set Anthropic API key
        run: echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> "$GITHUB_ENV"

      # ── Checkpoint cache (resume support) ─────────────────────────────────
      - name: Restore checkpoint cache
        uses: actions/cache@v5
        with:
          path: logs/exp2_symbolic_engine_checkpoint.json
          key: sym-engine-checkpoint-${{ github.ref_name }}
          restore-keys: |
            sym-engine-checkpoint-

      - name: Create log directory
        run: mkdir -p logs

      # ── Notebook execution ─────────────────────────────────────────────────
      - name: Fix cell IDs and execute notebook
        run: |
          python3 - <<'EOF'
          import json, uuid, os, nbformat, nbclient
          from pathlib import Path

          NB_PATH = Path(".github/scripts/run_sym_engine_v2.ipynb")

          # 1. Load as raw JSON and patch any missing/empty cell IDs
          raw = json.loads(NB_PATH.read_text())
          fixed = 0
          for cell in raw.get("cells", []):
              cid = cell.get("id", "")
              if not cid or not str(cid).strip():
                  cell["id"] = uuid.uuid4().hex[:8]
                  fixed += 1
          print(f"Fixed {fixed} cell(s) with missing/empty id")

          # 2. Write back so nbformat reads a valid notebook
          NB_PATH.write_text(json.dumps(raw, indent=1))

          # 3. Read with nbformat (validation now passes) and execute via nbclient
          nb = nbformat.read(str(NB_PATH), as_version=4)
          timeout = int(os.environ.get("PYSR_TIMEOUT", "1100")) * 60
          client = nbclient.NotebookClient(
              nb,
              timeout=timeout if timeout > 0 else -1,
              kernel_name="python3",
              resources={"metadata": {"path": str(NB_PATH.parent)}},
          )
          client.execute()

          # 4. Write executed notebook back
          nbformat.write(nb, str(NB_PATH))
          print("Notebook executed and saved.")
          EOF
        env:
          PYSR_TIMEOUT: ${{ env.PYSR_TIMEOUT }}

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sym-engine-notebook-${{ github.run_id }}
          path: .github/scripts/run_sym_engine_v2.ipynb
          retention-days: 30

      - name: Upload logs and checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sym-engine-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
