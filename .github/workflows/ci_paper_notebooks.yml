name: "HypatiaX - paper notebooks"
run-name: >-
  HypatiaX paper notebooks — run ${{ github.run_id }}

on:
  # Fires when ci_paper_audit.yml (name: "HypatiaX - paper audit") completes.
  # The ci_pipeline.yml C5 job also dispatches this via workflow_dispatch.
  # NOTE: workflow_run triggers only when the workflow file is on the default branch.
  workflow_run:
    workflows: ["HypatiaX - paper audit"]
    types:
      - completed

  # Allow manual trigger for debugging / re-runs, and for dispatch from ci_pipeline.yml C5
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────
  # Job 1 — audit-setup
  # Checks out the repo, sets up Python/Jupyter,
  # and copies .tex source files into notebooks/
  # ──────────────────────────────────────────────
  audit-setup:
    name: "audit-setup: copy .tex files into notebooks/"
    runs-on: ubuntu-latest

    # Only run when the triggering workflow succeeded
    # (remove this condition if you want non-blocking / always-run behaviour)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          # Install any additional requirements your notebooks need
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi

      - name: Register IPython kernel
        run: python -m ipykernel install --user --name python3

      - name: Copy .tex files into notebooks/
        run: |
          # Mirrors the audit-setup step in run_all_checkpoint.py
          mkdir -p notebooks
          find . -maxdepth 2 -name "*.tex" \
            ! -path "./notebooks/*" \
            ! -path "./.git/*" \
            -exec cp -v {} notebooks/ \;

      # Upload the prepared notebooks/ directory so downstream jobs can use it
      - name: Upload notebooks workspace
        uses: actions/upload-artifact@v4.3.6
        with:
          name: notebooks-workspace
          path: notebooks/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Job 2 — nb-01-citations
  # Catches: koza1994genetic missing,
  #          cranmer2023pysr/cranmer2023interp alias collision
  # ──────────────────────────────────────────────
  nb-01-citations:
    name: "NB-01: Citation & Bibliography Audit"
    runs-on: ubuntu-latest
    needs: audit-setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-01
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-01_Citation_Bibliography_Audit.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-01_Citation_Bibliography_Audit
          path: notebooks/NB-01_Citation_Bibliography_Audit.ipynb
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3 — nb-02-crossref
  # Catches: undefined refs, duplicate labels,
  #          \label inside \item,
  #          Supp A section 7.3 → 7.4 mismatch
  # ──────────────────────────────────────────────
  nb-02-crossref:
    name: "NB-02: Cross-Reference & Label Integrity"
    runs-on: ubuntu-latest
    needs: nb-01-citations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-02
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-02_CrossReference_Label_Audit.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-02_CrossRef_Label_Audit
          path: notebooks/NB-02_CrossReference_Label_Audit.ipynb
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 4 — nb-03-structure
  # Catches: section structure and numbering issues
  # ──────────────────────────────────────────────
  nb-03-structure:
    name: "NB-03: Section Structure & Numbering"
    runs-on: ubuntu-latest
    needs: nb-02-crossref

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-03
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-03_Section_Structure_Numbering.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-03_Section_Structure_Audit
          path: notebooks/NB-03_Section_Structure_Numbering.ipynb
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 5 — nb-04-numerical
  # Catches: abstract claim presence,
  #          70 vs 71 discrepancy,
  #          five-stage vs five-layer,
  #          timing arithmetic errors
  # ──────────────────────────────────────────────
  nb-04-numerical:
    name: "NB-04: Numerical Consistency & Abstract Claims"
    runs-on: ubuntu-latest
    needs: nb-03-structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-04
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-04_Numerical_Consistency_Checker.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-04_Numerical_Consistency_Audit
          path: notebooks/NB-04_Numerical_Consistency_Checker.ipynb
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 6 — nb-05-figures
  # Catches: all 5 \includegraphics on disk,
  #          \fbox placeholder detection,
  #          figure environment completeness
  # ──────────────────────────────────────────────
  nb-05-figures:
    name: "NB-05: Figure Files & Environment Audit"
    runs-on: ubuntu-latest
    needs: nb-04-numerical

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-05
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-05_Figure_Image_Dependency_Checker.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-05_Figure_Audit
          path: notebooks/NB-05_Figure_Image_Dependency_Checker.ipynb
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 7 — nb-06-integrity
  # Catches: code quality and pipeline integrity
  # ──────────────────────────────────────────────
  nb-06-integrity:
    name: "NB-06: Code Quality & Pipeline Integrity"
    runs-on: ubuntu-latest
    needs: nb-05-figures

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi
          python -m ipykernel install --user --name python3

      - name: Download notebooks workspace
        uses: actions/download-artifact@v4.1.8
        with:
          name: notebooks-workspace
          path: notebooks/

      - name: Execute NB-06
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=300 \
            notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: NB-06_Code_Quality_Pipeline_Integrity
          path: notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb
          retention-days: 7

  bundle-artifacts:
    name: "Bundle Notebook Artifacts"
    runs-on: ubuntu-latest

    needs:
      - nb-01-citations
      - nb-02-crossref
      - nb-03-structure
      - nb-04-numerical
      - nb-05-figures
      - nb-06-integrity

    if: always()

    steps:

      - name: Download all notebook artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: notebooks

      - name: Show contents
        run: |
          find notebooks -type f

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: paper-audit-notebooks
          path: notebooks/
          retention-days: 30

  # Job 8 (report) has been moved to ci_report.yml.
  # ci_report.yml triggers on completion of this workflow, downloads the
  # NB-01…NB-06 artifacts produced above, converts them to HTML, builds the
  # combined audit report, and deploys it to GitHub Pages — without re-running
  # any notebooks.
