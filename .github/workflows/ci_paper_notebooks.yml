                          patch_entries.append({
                              "id":     m2.group(1),
                              "status": m2.group(2).lower(),
                              "source": f"{nb_id}/step8",
                          })

          if not patch_entries:
              print(f"No registry patches found in {nb_id} outputs — skipping patch artifact")
              import sys; sys.exit(0)

          # Deduplicate: last entry per id wins (later cells override earlier)
          seen = {}
          for e in patch_entries:
              seen[e["id"]] = e
          patch_entries = list(seen.values())

          out_path = Path(f"logs/registry_patch_{nb_id}.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps({
              "nb":           nb_id,
              "run_id":       run_id,
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "patches":      patch_entries,
          }, indent=2))
          print(f"Registry patch written: {out_path} ({len(patch_entries)} entry/entries)")
          for e in patch_entries:
              print(f"  {e['id']} → {e['status']}  [{e['source']}]")
          PYREG

      - name: Upload registry patch artifact
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: registry-patch-NB-06-${{ github.run_id }}
          path: logs/registry_patch_NB-06.json
          if-no-files-found: ignore
          retention-days: 7


  bundle-artifacts:
    name: "Bundle Notebook Artifacts"
    runs-on: ubuntu-latest

    needs:
      - nb-01-citations
      - nb-02-crossref
      - nb-03-structure
      - nb-04-numerical
      - nb-05-figures
      - nb-06-integrity

    if: >
      always() &&
      github.event.inputs.apply_fixes_only != 'true'

    steps:

      - name: Download all notebook artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4.1.8
        with:
          path: notebooks

      - name: Show contents
        run: |
          if [ -d notebooks ] && [ -n "$(ls -A notebooks 2>/dev/null)" ]; then
            find notebooks -type f
          else
            echo "notebooks/ is empty or does not exist — no artifacts to list."
          fi

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: paper-audit-notebooks
          path: notebooks/
          retention-days: 30

      # ── Persist $ROOT/figures/ and $ROOT/tables/ from the workspace artifact ─
      # FIX: audit-setup committed figures/tables from ITS runner, but the
      # bundle-artifacts job runs on a fresh runner with a clean checkout.
      # We re-download the workspace artifact (already downloaded above into
      # notebooks/) and copy figures/ + tables/ back out, then commit again
      # in case any NB job added or modified files during execution.
      - name: Checkout repository (for commit)
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: "Re-commit $ROOT/figures/ and $ROOT/tables/ (bundle step)"
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin "${{ github.ref_name }}" 2>/dev/null || true

          mkdir -p figures tables

          # Lift figures and tables from the downloaded workspace artifact.
          if [[ -d notebooks/figures ]]; then
            cp -r notebooks/figures/. figures/
          fi
          if [[ -d notebooks/tables ]]; then
            cp -r notebooks/tables/. tables/
          fi

          # Also re-sweep for any tables written since audit-setup ran.
          RESULTS_BASE="hypatiax/data/results"
          while IFS= read -r -d '' tex_file; do
            dest="tables/$(basename "$tex_file")"
            [[ -f "$dest" ]] && echo "  [COLLISION] $(basename "$tex_file")"
            cp "$tex_file" "$dest"
          done < <(find "$RESULTS_BASE" -path "*/tables/*.tex" -type f -print0 2>/dev/null)

          [[ -d figures ]] && git add -f figures/ || true
          [[ -d tables  ]] && git add -f tables/  || true

          if git diff --cached --quiet; then
            echo "figures/ and tables/ already up-to-date in repo — nothing to commit."
          else
            STAGED=$(git diff --cached --name-only | wc -l)
            git commit -m "ci: re-sync paper figures+tables to repo root (${STAGED} file(s)) — run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed ${STAGED} file(s) → ${{ github.ref_name }}"
          fi

      # ── Normalised summary for ci_report dynamic conclusions ─────────────────
      # Reads findings.json produced by hypatia_inspector.py (from the
      # hypatia-findings-setup-* artifact) plus live notebook outputs, and
      # writes a merged notebooks_audit_summary.json in the shared schema.
      - name: Download hypatia findings artifact
        continue-on-error: true
        uses: actions/download-artifact@v4.1.8
        with:
          name: hypatia-findings-setup-${{ github.run_id }}
          path: /tmp/hypatia_findings

      - name: Download NB registry patch artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          RUN_ID:   ${{ github.run_id }}
        run: |
          mkdir -p /tmp/nb_patches
          for nb_id in NB-01 NB-02 NB-03 NB-04 NB-05 NB-06; do
            gh run download "$RUN_ID" \
              --repo "$REPO" \
              --name "registry-patch-${nb_id}-${RUN_ID}" \
              --dir  "/tmp/nb_patches" 2>/dev/null || true
          done
          echo "Patch files downloaded:"
          ls -la /tmp/nb_patches/ 2>/dev/null || echo "  (none)"

      - name: Merge NB registry patches into issue_registry.json and commit
        if: always()
        env:
          REGISTRY_PATH: ${{ env.REGISTRY_PATH }}
          GIT_AUTHOR_NAME:  github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME:  github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          python3 - <<'PYMERGE'
          import json, subprocess, sys, datetime
          from pathlib import Path

          registry_path = Path("${{ env.REGISTRY_PATH }}")
          patches_dir   = Path("/tmp/nb_patches")

          if not registry_path.exists():
              print(f"::warning::Registry not found at {registry_path} — skipping NB merge")
              sys.exit(0)

          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          reg_index = {e["id"]: i for i, e in enumerate(registry)}
          today = datetime.date.today().isoformat()

          patch_files = sorted(patches_dir.glob("registry_patch_NB-*.json"))
          if not patch_files:
              print("No NB registry patches found — registry unchanged")
              sys.exit(0)

          diff_rows = []
          for pf in patch_files:
              try:
                  patch = json.loads(pf.read_text())
              except Exception as exc:
                  print(f"  Could not read {pf}: {exc}")
                  continue
              for entry in patch.get("patches", []):
                  eid      = entry["id"]
                  new_st   = entry["status"].lower()
                  source   = entry.get("source", pf.stem)

                  if eid in reg_index:
                      existing = registry[reg_index[eid]]
                      old_st   = existing.get("status", "open")

                      if old_st == "false_positive":
                          continue
                      if old_st == "resolved" and new_st == "open":
                          continue

                      if old_st != new_st:
                          existing["status"]  = new_st
                          existing["updated"] = today
                          diff_rows.append((eid, old_st, new_st, source))
                  else:
                      registry.append({
                          "id":       eid,
                          "status":   new_st,
                          "severity": entry.get("severity", "medium"),
                          "nb_source": entry.get("source", source),
                          "updated":  today,
                      })
                      reg_index[eid] = len(registry) - 1
                      diff_rows.append((eid, "new", new_st, source))

          if not diff_rows:
              print("Registry already reflects notebook findings — no changes")
              sys.exit(0)

          col = "{:<14} {:<12} {:<12} {}"
          print("")
          print("=== NB registry patch merge ===")
          print(col.format("ID", "OLD", "NEW", "SOURCE"))
          print("-" * 56)
          for row in diff_rows:
              print("  -> " + col.format(*row))

          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          subprocess.run(["git", "config", "user.name",  "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "pull",   "--rebase", "--autostash",
                          "origin", "${{ github.ref_name }}"], capture_output=True)
          subprocess.run(["git", "add", str(registry_path)], check=True)

          ids_changed = [f"{e}: {o}>{n}" for e, o, n, _ in diff_rows]
          msg = f"ci: nb-registry-merge {chr(44).join(ids_changed)} [skip ci]"
          subprocess.run(["git", "commit", "-m", msg], check=True)

          for attempt in range(1, 4):
              r = subprocess.run(["git", "push"])
              if r.returncode == 0:
                  break
              subprocess.run(["git", "pull", "--rebase", "--autostash"], capture_output=True)
              subprocess.run(["git", "checkout", "--ours", str(registry_path)], check=True)
              subprocess.run(["git", "add", str(registry_path)], check=True)
              subprocess.run(["git", "rebase", "--continue"],
                  env={**__import__("os").environ, "GIT_EDITOR": "true"}, check=True)
          else:
              raise RuntimeError("git push failed after 3 attempts")

          print(f"Registry committed — {len(diff_rows)} update(s): {msg}")
          PYMERGE

      - name: Upload merged registry artifact
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: issue-registry-merged-${{ github.run_id }}
          path: ${{ env.REGISTRY_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Write notebooks audit summary JSON (live — no hardcoded statuses)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          pip install --quiet jupyter nbconvert ipykernel 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, os, re, datetime
          from pathlib import Path

          run_id = os.environ["RUN_ID"]

          # ── Load hypatia_inspector findings (status overrides only) ──────────
          inspector_status: dict[str, str] = {}
          for candidate in ["/tmp/hypatia_findings/findings.json"]:
              try:
                  raw = json.loads(Path(candidate).read_text())
                  for f in (raw if isinstance(raw, list) else raw.get("findings", [])):
                      fid = f.get("fix_id") or f.get("id", "")
                      st  = f.get("status", "")
                      if fid and st:
                          inspector_status[fid] = (
                              "RESOLVED" if st == "fixed" else
                              "OPEN"     if st in ("detected", "manual") else
                              st.upper()
                          )
                  print(f"Loaded {len(inspector_status)} inspector statuses")
                  break
              except Exception as exc:
                  print(f"Inspector findings unavailable: {exc}")

          # ── Load live notebook outputs (ONLY source for findings) ────────────
          nb_findings: dict[str, dict] = {}
          for nb_path in sorted(Path("notebooks").rglob("*.ipynb")):
              try:
                  nb = json.loads(nb_path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for cell in nb.get("cells", []):
                  tags    = cell.get("metadata", {}).get("tags", [])
                  outputs = cell.get("outputs", [])
                  is_findings = "audit_findings" in tags
                  for out in outputs:
                      raw = out.get("text") or out.get("data", {}).get("text/plain", "")
                      text = "".join(raw) if isinstance(raw, list) else str(raw)
                      text = re.sub(r"^```json\s*", "", text.strip(), flags=re.MULTILINE)
                      text = re.sub(r"```\s*$",      "", text.strip(), flags=re.MULTILINE)
                      if is_findings or (text.startswith("{") and '"findings"' in text):
                          try:
                              data = json.loads(text)
                              for f in (data if isinstance(data, list) else data.get("findings", [])):
                                  fid = f.get("id") or f.get("fix_id", "")
                                  if not fid:
                                      continue
                                  # Inspector can promote open→resolved, never resolved→open
                                  status = f.get("status", "OPEN").upper()
                                  if status != "RESOLVED" and fid in inspector_status:
                                      status = inspector_status[fid]
                                  nb_findings[fid] = {
                                      "id":          fid,
                                      "severity":    f.get("severity", "MEDIUM").upper(),
                                      "status":      status,
                                      "description": f.get("description", ""),
                                      "action":      f.get("action", ""),
                                      "nb":          f.get("nb", nb_path.stem),
                                  }
                          except Exception:
                              pass

          # ── Also pick up step8 write-back outputs from NB-05 ────────────────
          for nb_path in sorted(Path("notebooks").rglob("NB-05*.ipynb")):
              try:
                  nb = json.loads(nb_path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for cell in nb.get("cells", []):
                  if cell.get("id", "") != "step8_writeback":
                      continue
                  for out in cell.get("outputs", []):
                      raw = out.get("text", "")
                      text = "".join(raw) if isinstance(raw, list) else str(raw)
                      for line in text.splitlines():
                          m = re.match(r"\s*\[(?:UPDATED|ADDED)\]\s+(FIX-\w+):\s*(\w+)\s*→\s*(\w+)", line)
                          if m:
                              fid, new_st = m.group(1), m.group(3).upper()
                              if fid in nb_findings:
                                  nb_findings[fid]["status"] = new_st
                              else:
                                  nb_findings[fid] = {
                                      "id": fid, "severity": "MEDIUM",
                                      "status": new_st, "description": "",
                                      "action": "", "nb": "NB-05",
                                  }

          findings = list(nb_findings.values())
          print(f"Live findings: {len(findings)} from notebooks "
                f"({len(inspector_status)} inspector overrides applied)")

          summary = {
              "source":       "ci_paper_notebooks",
              "run_id":       run_id,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "findings":     findings,
          }
          out = Path("notebooks/notebooks_audit_summary.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, indent=2))
          print(f"Wrote {out} — {len(findings)} live finding(s)")
          PYEOF

      - name: Upload notebooks audit summary
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: notebooks-audit-summary-${{ github.run_id }}
          path: notebooks/notebooks_audit_summary.json
          if-no-files-found: warn
          retention-days: 30

      # ── Dispatch ci_report.yml to regenerate the Pages report ───────────────
      # Fires after every bundle-artifacts run (both workflow_run and
      # workflow_dispatch paths) so the live Pages report always reflects the
      # latest notebook findings without requiring a manual trigger.
      - name: Dispatch ci_report (auto-regenerate report)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          RUN_ID:   ${{ github.run_id }}
          BRANCH:   ${{ github.ref_name }}
        run: |
          gh workflow run ci_report.yml \
            --repo "$REPO" \
            --ref  "$BRANCH" \
            --field summary_run_id="$RUN_ID" \
            --field no_notebooks="false" \
            2>/dev/null && echo "ci_report.yml dispatched (run $RUN_ID)" \
            || echo "::warning::Failed to dispatch ci_report.yml — report may be stale"

  # Job 8 (report) lives in ci_report.yml.
