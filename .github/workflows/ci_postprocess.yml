name: "HypatiaX - post-process (figures + tables)"

# ==============================================================================
# ci_postprocess.yml — generic, config-driven figures + tables generation.
#
# Every experiment's source dir, output dirs, and which generators apply to
# it lives in config/experiments.yml — NOT in this file. To add, remove, or move an
# experiment, edit config/experiments.yml only; nothing here should need to change.
#
# GitHub Actions limitation: workflow_dispatch `options:` and push `paths:`
# must be static YAML — Actions evaluates triggers before running any code,
# so it can't read config/experiments.yml to build them. Both lists below are
# therefore mirrored by hand from config/experiments.yml. The "Validate config
# sync" step fails the run loudly the moment they drift apart, instead of
# silently misrouting a run the way the old three-file-duplicated mapping
# did.
# ==============================================================================

on:
  push:
    branches: ["main", "master"]
    paths:
      - "config/experiments.yml"
      - "scripts/generate_figures.py"
      - "scripts/generate_tables.py"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/15/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi_pca/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/15_pca/**/*.json"
      - "hypatiax/data/results/ablation/exp1_ablation/**/*.json"
      - "hypatiax/data/results/five_systems/exp1_five/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_extrap/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_pca_4060/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_multi/**/*.json"
      - "hypatiax/data/results/five_systems/exp2_five/**/*.json"
      - "hypatiax/data/results/extrapolation/**/*.json"
      - "hypatiax/data/results/hybrid_pysr/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/noise-sweep/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/sample-complexity/**/*.json"
      - "hypatiax/data/results/hybrid_llm_nn/**/*.json"
      - "hypatiax/data/results/comparison_results/extrapolation/**/*.json"
      - "hypatiax/data/results/figures/**/*.json"

  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID — must be a key (or alias) in config/experiments.yml"
        required: true
        type: choice
        default: exp1_ablation
        options:
          - exp1
          - exp1b
          - exp1_pca
          - exp1b_pca
          - exp1_ablation
          - exp1_five
          - exp2_feynman
          - exp2_feynman_extrap
          - exp2_feynman_pca
          - exp2
          - exp2_five
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap
          - figures_deploy

permissions:
  contents: write

env:
  CONFIG_FILE: "config/experiments.yml"

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" matplotlib seaborn \
                      "sympy>=1.12" "tabulate>=0.9" "PyYAML>=6.0"

      # ------------------------------------------------------------------
      # Step 0 — fail loudly if this workflow's static dispatch/push lists
      # have drifted out of sync with config/experiments.yml, rather than silently
      # misrouting or refusing a valid run.
      # ------------------------------------------------------------------
      - name: Validate config sync
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, yaml

          with open("${{ env.CONFIG_FILE }}") as f:
              cfg = yaml.safe_load(f)

          # Combine experiments + aggregates so the push.paths check below
          # (which needs each entry's trigger_paths) can iterate all of them.
          # This step runs as its own isolated process — it can't reuse
          # all_entries from the separate "Resolve experiment from config"
          # step, even though that step defines the identically-named var.
          all_entries = {**cfg.get("experiments", {}), **cfg.get("aggregates", {})}
          config_ids = set(cfg["experiments"]) | set(cfg["aggregates"])

          dispatch_options = set("""
          exp1 exp1b exp1_pca exp1b_pca exp1_ablation exp1_five
          exp2_feynman exp2_feynman_extrap exp2_feynman_pca exp2 exp2_five
          exp3 exp3b suppA suppB suppB_sc hybrid_all_domains instability
          extrap figures_deploy
          """.split())

          missing_from_dispatch = config_ids - dispatch_options
          missing_from_config   = dispatch_options - config_ids
          if missing_from_dispatch or missing_from_config:
              print("::error::ci_postprocess.yml's workflow_dispatch options "
                    "have drifted from config/experiments.yml.")
              if missing_from_dispatch:
                  print(f"  In config/experiments.yml but NOT in this workflow's "
                        f"dispatch options: {sorted(missing_from_dispatch)}")
              if missing_from_config:
                  print(f"  In this workflow's dispatch options but NOT in "
                        f"config/experiments.yml: {sorted(missing_from_config)}")
              print("Fix: update the workflow_dispatch.inputs.experiment.options "
                    "list (and the push.paths list, if a source_dir changed) "
                    "in ci_postprocess.yml to match config/experiments.yml.")
              sys.exit(1)

          print(f"OK — {len(config_ids)} experiment/aggregate IDs in sync "
                f"between config/experiments.yml and ci_postprocess.yml (dispatch options).")

          # --------------------------------------------------------------
          # The comment at the top of this workflow claims THIS step also
          # catches drift in `on.push.paths` — it previously didn't; only
          # dispatch options were checked. push.paths drift is the more
          # dangerous failure mode: it doesn't error, it just means the
          # workflow never fires for a changed directory, silently.
          #
          # Gotcha: PyYAML (1.1 resolver) parses the bare key `on:` as the
          # boolean True, not the string "on" — so this workflow's own
          # trigger block is parsed_self[True], not parsed_self["on"].
          # --------------------------------------------------------------
          self_path = ".github/workflows/ci_postprocess.yml"
          with open(self_path) as f:
              self_cfg = yaml.safe_load(f)

          on_block = self_cfg.get("on", self_cfg.get(True))
          if on_block is None:
              print(f"::error::Could not find an 'on:' trigger block in {self_path} "
                    f"(checked both 'on' and boolean-True keys — PyYAML parses the "
                    f"bare 'on:' key as True under the YAML 1.1 resolver).")
              sys.exit(1)

          # Paths that trigger the workflow globally but aren't tied to any
          # single experiment's trigger_paths (the config file itself, and
          # the two generator scripts every experiment's tables/figures
          # depend on) — these are expected to be in push.paths without a
          # matching trigger_paths entry, so exclude them from the diff.
          INFRA_PUSH_PATHS = {
              "config/experiments.yml",
              "scripts/generate_figures.py",
              "scripts/generate_tables.py",
          }

          declared_push_paths = set(on_block.get("push", {}).get("paths", []))

          config_trigger_paths = set()
          for entry in all_entries.values():
              for p in entry.get("trigger_paths", []):
                  if not p.startswith("!"):  # ignore negation patterns
                      config_trigger_paths.add(p)

          def covered(trigger_path: str, push_paths: set) -> bool:
              """A trigger_path is covered if it's an exact match, or if some
              declared push path is a '**/*.json'-style glob whose fixed
              prefix is a prefix of trigger_path (a broader glob already
              matches every file the narrower one would)."""
              if trigger_path in push_paths:
                  return True
              for pp in push_paths:
                  if pp.endswith("/**/*.json"):
                      prefix = pp[: -len("/**/*.json")]
                      if trigger_path.startswith(prefix + "/"):
                          return True
              return False

          missing_from_push = {
              t for t in (config_trigger_paths - INFRA_PUSH_PATHS)
              if not covered(t, declared_push_paths)
          }
          missing_from_config_paths = {
              p for p in (declared_push_paths - INFRA_PUSH_PATHS)
              if not covered(p, config_trigger_paths)
          }
          if missing_from_push or missing_from_config_paths:
              print("::error::ci_postprocess.yml's on.push.paths list has "
                    "drifted from config/experiments.yml's trigger_paths.")
              if missing_from_push:
                  print(f"  In config/experiments.yml trigger_paths but NOT in "
                        f"on.push.paths: {sorted(missing_from_push)}")
              if missing_from_config_paths:
                  print(f"  In on.push.paths but NOT in any trigger_paths: "
                        f"{sorted(missing_from_config_paths)}")
              print("Fix: update the on.push.paths list in ci_postprocess.yml "
                    "to match config/experiments.yml's trigger_paths.")
              sys.exit(1)

          print(f"OK — {len(config_trigger_paths)} trigger path(s) in sync "
                f"between config/experiments.yml and ci_postprocess.yml (push.paths).")
          PY

      # ------------------------------------------------------------------
      # Step 1 — resolve which experiment this run is for, and every path
      # it needs, purely by reading config/experiments.yml. Nothing below this
      # step contains a hardcoded experiment name or directory.
      # ------------------------------------------------------------------
      - name: Resolve experiment from config
        id: resolve
        shell: bash
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.experiment }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, sys, json, yaml

          # NOTE: every diagnostic/error print in this step must go to stderr,
          # not stdout — stdout here is redirected straight into $GITHUB_OUTPUT,
          # and anything that isn't a "key=value" line makes GitHub reject the
          # whole step with "Invalid format".
          def die(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          experiments = cfg["experiments"]
          aggregates  = cfg["aggregates"]
          all_entries = {**experiments, **aggregates}
          results_root = cfg["results_root"]

          def glob_to_regex(pat: str) -> re.Pattern:
              pat = re.escape(pat)
              pat = pat.replace(r"\*\*/", "(?:.*/)?")
              pat = pat.replace(r"\*\*", ".*")
              pat = pat.replace(r"\*", "[^/]*")
              return re.compile("^" + pat + "$")

          def matches(entry_id: str, changed_path: str) -> bool:
              trig = all_entries[entry_id].get("trigger_paths", [])
              positives = [p for p in trig if not p.startswith("!")]
              negatives = [p[1:] for p in trig if p.startswith("!")]
              if any(glob_to_regex(p).match(changed_path) for p in negatives):
                  return False
              return any(glob_to_regex(p).match(changed_path) for p in positives)

          def resolve_id(raw: str) -> str:
              if raw in all_entries:
                  return raw
              for eid, entry in all_entries.items():
                  if raw in entry.get("aliases", []):
                      return eid
              die(f"'{raw}' is not a known experiment ID or alias "
                  f"in {os.environ['CONFIG_FILE']}.")

          def changed_files_via_git() -> list[str]:
              # github.event.head_commit.modified/added/removed is unreliable:
              # it's empty for merge commits (e.g. a squash-merged PR), and it
              # only reflects the single head commit, not the full push range.
              # actions/checkout already ran with fetch-depth: 0, so diffing
              # before..after directly is both correct and simple.
              before = os.environ.get("BEFORE_SHA", "")
              after  = os.environ.get("AFTER_SHA", "")
              all_zero = set("0")
              if after and set(after) == all_zero:
                  return []  # branch/tag deletion — nothing to diff
              if not before or set(before) == all_zero:
                  # first push to a new branch: no "before" to diff against,
                  # fall back to the files touched by the head commit itself.
                  cmd = ["git", "show", "--name-only", "--pretty=format:", after or "HEAD"]
              else:
                  cmd = ["git", "diff", "--name-only", before, after]
              try:
                  out = subprocess.run(cmd, capture_output=True, text=True, check=True)
              except subprocess.CalledProcessError as e:
                  die(f"git diff failed while resolving changed files: {e.stderr.strip()}")
              return [p for p in out.stdout.splitlines() if p]

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              exp_id = resolve_id(os.environ["DISPATCH_INPUT"])
          else:
              changed = changed_files_via_git()

              # If the push only changed infra/global files (config or generator scripts),
              # treat this as an assembly run: use the 'figures_deploy' aggregate id if present.
              infra_files = {os.environ["CONFIG_FILE"], "scripts/generate_figures.py", "scripts/generate_tables.py"}
              if changed:
                  if all(p in infra_files for p in changed):
                      if "figures_deploy" in all_entries:
                          exp_id = "figures_deploy"
                      else:
                          die("Push touched only infra files, but no 'figures_deploy' aggregate is defined in the config.")
                  else:
                      exp_id = None
              else:
                  exp_id = None

              for path in changed:
                  for eid in all_entries:
                      if matches(eid, path):
                          exp_id = eid
                          break
                  if exp_id:
                      break
              if exp_id is None:
                  die("No changed file matched any experiment's trigger_paths "
                      f"in {os.environ['CONFIG_FILE']} — cannot determine which "
                      f"experiment this push run is for. Changed files were: {changed}")

          entry = all_entries[exp_id]
          is_aggregate = exp_id in aggregates

          if is_aggregate:
              figures_dir = entry["figures_dir"]
              tables_dir  = entry.get("tables_dir")
              source_dir  = figures_dir   # aggregates read from their own figures dir
          else:
              source_dir  = entry["source_dir"]
              figures_dir = f"{source_dir}/figures"
              tables_dir  = f"{source_dir}/tables"

          out = {
              "id": exp_id,
              "is_aggregate": str(is_aggregate).lower(),
              "results_root": results_root,
              "source_dir_abs":  f"{results_root}/{source_dir}",
              "figures_dir_abs": f"{results_root}/{figures_dir}",
              "tables_dir_abs":  f"{results_root}/{tables_dir}" if tables_dir else "",
              "generates_tables":  str(entry.get("generates_tables", False)).lower(),
              "generates_figures": str(entry.get("generates_figures", False)).lower(),
              "extra_stage_files": json.dumps(entry.get("extra_stage_files", [])),
              "description": entry.get("description", exp_id),
          }
          for k, v in out.items():
              print(f"{k}={v}")
          PY

      - name: Create output directories
        shell: bash
        run: |
          mkdir -p "${{ steps.resolve.outputs.figures_dir_abs }}"
          if [ -n "${{ steps.resolve.outputs.tables_dir_abs }}" ]; then
            mkdir -p "${{ steps.resolve.outputs.tables_dir_abs }}"
          fi

      # ------------------------------------------------------------------
      # Step 2 — cross-experiment write guards (config/experiments.yml: guards:).
      # Snapshot every directory this run does NOT own, before generation.
      # ------------------------------------------------------------------
      - name: Snapshot guarded directories
        id: guard_pre
        shell: bash
        run: |
          python3 - <<'PY'
          import os, hashlib, json, yaml

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          exp_id = "${{ steps.resolve.outputs.id }}"
          root = "${{ steps.resolve.outputs.results_root }}"
          snapshot = {}

          for guard in cfg.get("guards", []):
              if exp_id in guard["owners"]:
                  continue   # this run legitimately owns this directory
              for d in guard["dirs"]:
                  path = os.path.join(root, d)
                  files = {}
                  if os.path.isdir(path):
                      for dirpath, _, filenames in os.walk(path):
                          for fn in filenames:
                              fp = os.path.join(dirpath, fn)
                              files[fp] = hashlib.sha256(open(fp, "rb").read()).hexdigest()
                  snapshot[path] = files

          with open("/tmp/guard_snapshot.json", "w") as f:
              json.dump(snapshot, f)
          print(f"Guarding {len(snapshot)} directory(ies) not owned by '{exp_id}'.")
          PY

      # ------------------------------------------------------------------
      # Step 3 — generate. Both scripts already warn-and-skip on missing
      # data (config/experiments.yml: on_missing_data) and always exit 0; no
      # hardcoded/paper-verified value is ever substituted by either.
      # ------------------------------------------------------------------
      - name: "Generate tables"
        if: steps.resolve.outputs.generates_tables == 'true'
        shell: bash
        run: |
          python3 scripts/generate_tables.py \
            --experiment "${{ steps.resolve.outputs.id }}" \
            --results-dir "${{ steps.resolve.outputs.source_dir_abs }}" \
            --output-dir "${{ steps.resolve.outputs.tables_dir_abs }}"

      - name: "Generate figures"
        if: steps.resolve.outputs.generates_figures == 'true'
        shell: bash
        run: |
          python3 scripts/generate_figures.py \
            --experiment "${{ steps.resolve.outputs.id }}" \
            --results-dir "${{ steps.resolve.outputs.source_dir_abs }}" \
            --figures-dir "${{ steps.resolve.outputs.figures_dir_abs }}"

      # ------------------------------------------------------------------
      # Step 4 — figures_deploy is an assembly step, not a generator: pull
      # every experiment's own canonical figures into one flat directory
      # for the LaTeX build.
      #
      # Two different situations both produce a "same filename, different
      # content" case, and they are NOT the same thing:
      #   1. The already-deployed copy differs from its (single, unambiguous)
      #      source experiment — the source is stale-deployed and gets
      #      overwritten. Safe: there is only one possible correct answer.
      #   2. Two DIFFERENT source experiments produce the same filename
      #      with different content — there is no correct answer to pick
      #      automatically, so this fails the build loudly instead of
      #      silently choosing one based on dict/filesystem iteration
      #      order (which is what str/os.listdir ordering would otherwise
      #      do) — UNLESS config/experiments.yml's `figure_owners:` map
      #      names an explicit winner for that filename (see below).
      #      Iteration is explicitly sorted by experiment ID and filename
      #      so any output printed here is deterministic.
      #
      # FIX (figures_deploy filename collisions, e.g. suppB vs suppB_sc both
      # writing fig11_recovery_heatmap.{pdf,png} / fig_comparative_table.{pdf,png}
      # with different content): this step's own error message used to tell
      # the user to "give config/experiments.yml an explicit owner for this
      # filename," but nothing here ever read such an owner — the advice
      # described a feature that didn't exist, so every real collision was
      # an unconditional hard failure with no config-level fix available.
      #
      # `figure_owners:` in config/experiments.yml (optional top-level dict,
      # `{ filename: experiment_id }`) is an OPT-IN override for cases where
      # the colliding outputs really are duplicates/superseded and only one
      # should survive under the original name — that experiment's copy is
      # deployed and the others are logged as dropped.
      #
      # confirmed via config/experiments.yml (both suppB and suppB_sc are
      # `protected: true` canonical sources, and the figures_deploy aggregate
      # lists `depends_on: ["suppB", "suppB_sc"]`) that picking a winner is
      # NOT the right default here — collapsing to one name silently discards
      # the other experiment's canonical result. So anything left unresolved
      # after figure_owners is no longer a hard failure: each producer's copy
      # is deployed under its own suffixed filename
      # (`fig11_recovery_heatmap.pdf` -> `fig11_recovery_heatmap__suppB.pdf`,
      # `fig11_recovery_heatmap__suppB_sc.pdf`), so no canonical data is ever
      # dropped and the build doesn't fail. This is logged loudly (not
      # silently) because the LaTeX source needs to reference the new
      # filenames explicitly — \includegraphics on the old bare name will no
      # longer resolve for any auto-suffixed collision.
      # ------------------------------------------------------------------
      - name: "Deploy assembled figures"
        if: steps.resolve.outputs.id == 'figures_deploy'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil, hashlib, yaml

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          figure_owners = cfg.get("figure_owners", {})  # { filename: experiment_id }

          root = "${{ steps.resolve.outputs.results_root }}"
          dest = "${{ steps.resolve.outputs.figures_dir_abs }}"
          os.makedirs(dest, exist_ok=True)

          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest()

          # First pass: collect every (eid, path, sha) that wants to produce
          # each filename. Sorted by experiment ID / filename so results
          # are identical on every run, independent of dict or os.listdir
          # ordering.
          sources = {}  # fn -> [(eid, path, sha), ...]
          for eid, entry in sorted(cfg["experiments"].items()):
              if not entry.get("generates_figures"):
                  continue
              src_dir = os.path.join(root, entry["source_dir"], "figures")
              if not os.path.isdir(src_dir):
                  continue
              for fn in sorted(os.listdir(src_dir)):
                  src = os.path.join(src_dir, fn)
                  if not os.path.isfile(src):
                      continue
                  sources.setdefault(fn, []).append((eid, src, sha(src)))

          # Genuine cross-experiment collision: same filename, different
          # content, from two different experiments. No sort order makes
          # one of them "correct" — resolve via figure_owners (opt-in) if
          # configured; anything left is deployed multi-file (see header).
          collisions = {
              fn: entries for fn, entries in sources.items()
              if len({s for _, _, s in entries}) > 1
          }

          split_deploy = {}   # fn -> list of (eid, src, sha) to deploy suffixed
          resolved_owner_log = []
          for fn, entries in sorted(collisions.items()):
              owner = figure_owners.get(fn)
              owning_entries = [e for e in entries if e[0] == owner] if owner else []
              if owning_entries:
                  # Explicit opt-in: collapse to the owner's single entry
                  # under the original filename; the others are dropped.
                  sources[fn] = owning_entries
                  skipped_eids = sorted({eid for eid, _, _ in entries if eid != owner})
                  resolved_owner_log.append((fn, owner, skipped_eids))
              else:
                  # No override (or a misconfigured one naming a non-producer):
                  # deploy every producer's copy under its own suffixed name
                  # rather than silently dropping any canonical source.
                  del sources[fn]
                  split_deploy[fn] = entries
                  if owner:
                      print(f"::warning::figure_owners names '{owner}' for {fn}, but that "
                            f"experiment did not produce it — ignoring the override and "
                            f"deploying all producers under suffixed filenames instead.")

          if resolved_owner_log:
              print("figures_deploy: resolved filename collision(s) via config/experiments.yml figure_owners:")
              for fn, owner, skipped_eids in resolved_owner_log:
                  print(f"  {fn} — deployed from '{owner}', skipped: {', '.join(skipped_eids)}")

          copied, skipped, overwritten = 0, 0, []

          if split_deploy:
              print("::warning::Filename collision(s) with no figure_owners override — "
                    "deploying EACH producer's copy under a suffixed name so no canonical "
                    "result is dropped. Update the LaTeX source to reference these new "
                    "filenames (the old bare name is no longer deployed for these stems):")
              for fn, entries in sorted(split_deploy.items()):
                  stem, ext = os.path.splitext(fn)
                  for eid, src, src_sha in sorted(entries):
                      suffixed_fn = f"{stem}__{eid}{ext}"
                      dst = os.path.join(dest, suffixed_fn)
                      print(f"  {fn} ({eid}) -> {suffixed_fn}")
                      if os.path.exists(dst) and sha(dst) == src_sha:
                          skipped += 1
                          continue
                      is_overwrite = os.path.exists(dst)
                      shutil.copy2(src, dst)
                      if is_overwrite:
                          overwritten.append((suffixed_fn, eid))
                      else:
                          copied += 1

          for fn, entries in sorted(sources.items()):
              eid, src, src_sha = entries[0]  # all entries agree on content
              dst = os.path.join(dest, fn)
              if os.path.exists(dst):
                  if sha(dst) == src_sha:
                      skipped += 1
                      continue
                  shutil.copy2(src, dst)
                  overwritten.append((fn, eid))
                  continue
              shutil.copy2(src, dst)
              copied += 1

          print(f"figures_deploy: copied {copied}, already up to date {skipped}, "
                f"{len(overwritten)} overwritten.")
          if overwritten:
              print("::warning::Deployed copy differed from its source experiment "
                    "(stale deploy) and was overwritten:")
              for fn, eid in overwritten:
                  print(f"  {fn} <- {eid}")
          PY

      # ------------------------------------------------------------------
      # Step 5 — re-check guarded directories. A diff here means this run
      # wrote into a directory it doesn't own; that's a bug, not a
      # missing-data situation, so it fails the build.
      # ------------------------------------------------------------------
      - name: Check guarded directories unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys

          with open("/tmp/guard_snapshot.json") as f:
              before = json.load(f)

          violations = []
          for path, before_files in before.items():
              after_files = {}
              if os.path.isdir(path):
                  for dirpath, _, filenames in os.walk(path):
                      for fn in filenames:
                          fp = os.path.join(dirpath, fn)
                          after_files[fp] = hashlib.sha256(open(fp, "rb").read()).hexdigest()
              if after_files != before_files:
                  violations.append(path)

          if violations:
              print("::error::This run wrote into a directory it does not own:")
              for v in violations:
                  print(f"  {v}")
              print("See config/experiments.yml's guards: section for the owning experiment(s).")
              sys.exit(1)
          print("OK — no guarded directory was touched by this run.")
          PY

      # ------------------------------------------------------------------
      # Step 6 — commit whatever was actually generated. Skipped
      # tables/figures are (by design) simply absent, not staged, and any
      # previously-committed good output is left untouched.
      # ------------------------------------------------------------------
      - name: Commit generated outputs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.resolve.outputs.figures_dir_abs }}" 2>/dev/null || true
          if [ -n "${{ steps.resolve.outputs.tables_dir_abs }}" ]; then
            git add "${{ steps.resolve.outputs.tables_dir_abs }}" 2>/dev/null || true
          fi

          python3 - <<'PY'
          import json, subprocess, os
          extra = json.loads('''${{ steps.resolve.outputs.extra_stage_files }}''')
          src_dir = "${{ steps.resolve.outputs.source_dir_abs }}"
          for fn in extra:
              subprocess.run(["git", "add", f"{src_dir}/{fn}"], check=False)
          PY

          # ----------------------------------------------------------------
          # Count new/modified figures & tables for THIS run's SELECTED
          # experiment only (steps.resolve's own figures/tables dirs) — not
          # every experiment in the repo. Scoping the `git diff --cached`
          # to these two paths is what keeps the step summary honest when
          # only one experiment was post-processed.
          # ----------------------------------------------------------------
          count_new_modified() {
            local dir="$1"
            if [ -z "$dir" ]; then
              echo "0 0"
              return
            fi
            local status
            status="$(git diff --cached --name-status -- "$dir" || true)"
            local new_count modified_count
            new_count="$(printf '%s\n' "$status" | grep -c '^A' || true)"
            modified_count="$(printf '%s\n' "$status" | grep -c '^M' || true)"
            echo "${new_count:-0} ${modified_count:-0}"
          }

          read -r FIG_NEW FIG_MOD <<< "$(count_new_modified "${{ steps.resolve.outputs.figures_dir_abs }}")"
          read -r TAB_NEW TAB_MOD <<< "$(count_new_modified "${{ steps.resolve.outputs.tables_dir_abs }}")"

          echo "figures_new=${FIG_NEW}"      >> "$GITHUB_OUTPUT"
          echo "figures_modified=${FIG_MOD}" >> "$GITHUB_OUTPUT"
          echo "tables_new=${TAB_NEW}"       >> "$GITHUB_OUTPUT"
          echo "tables_modified=${TAB_MOD}"  >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "Nothing to commit — no tables/figures changed."
            exit 0
          fi

          git commit -m "postprocess(${{ steps.resolve.outputs.id }}): regenerate tables/figures [skip ci]"

          # Determine branch name (GITHUB_REF is e.g. refs/heads/<branch>)
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ -z "$BRANCH" ]; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD || echo "master")
          fi
          REMOTE="${REMOTE:-origin}"

          # Try a normal push first; if rejected, fetch+rebase and retry; fall back to --force-with-lease.
          if git push "${REMOTE}" "HEAD:${BRANCH}"; then
            echo "Pushed changes."
            exit 0
          fi

          echo "Push was rejected; fetching remote branch and attempting rebase..."
          git fetch "${REMOTE}" "${BRANCH}"
          if git rebase "${REMOTE}/${BRANCH}"; then
            if git push "${REMOTE}" "HEAD:${BRANCH}"; then
              echo "Pushed changes after rebase."
              exit 0
            fi
          else
            echo "::error::Rebase failed — aborting so the change can be resolved manually."
            git rebase --abort || true
            exit 1
          fi

          echo "Push still rejected; attempting git push --force-with-lease as a last resort."
          git push --force-with-lease "${REMOTE}" "HEAD:${BRANCH}"

      - name: Step summary
        if: always()
        shell: bash
        run: |
          FIG_NEW="${{ steps.commit.outputs.figures_new || '0' }}"
          FIG_MOD="${{ steps.commit.outputs.figures_modified || '0' }}"
          TAB_NEW="${{ steps.commit.outputs.tables_new || '0' }}"
          TAB_MOD="${{ steps.commit.outputs.tables_modified || '0' }}"
          FIG_TOTAL=$(( FIG_NEW + FIG_MOD ))
          TAB_TOTAL=$(( TAB_NEW + TAB_MOD ))

          {
            echo "### Post-process: \`${{ steps.resolve.outputs.id }}\`"
            echo "${{ steps.resolve.outputs.description }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source dir | \`${{ steps.resolve.outputs.source_dir_abs }}\` |"
            echo "| Figures dir | \`${{ steps.resolve.outputs.figures_dir_abs }}\` |"
            echo "| Tables dir | \`${{ steps.resolve.outputs.tables_dir_abs }}\` |"
            echo "| Generated tables | ${{ steps.resolve.outputs.generates_tables }} |"
            echo "| Generated figures | ${{ steps.resolve.outputs.generates_figures }} |"
            echo ""
            echo "#### Files new/modified this run — \`${{ steps.resolve.outputs.id }}\` only"
            echo "_Counts are scoped to this run's own figures/tables dirs, not every experiment in the repo._"
            echo ""
            echo "| Type | New | Modified | Total |"
            echo "|---|---|---|---|"
            echo "| Figures | ${FIG_NEW} | ${FIG_MOD} | ${FIG_TOTAL} |"
            echo "| Tables | ${TAB_NEW} | ${TAB_MOD} | ${TAB_TOTAL} |"
          } >> "$GITHUB_STEP_SUMMARY"

