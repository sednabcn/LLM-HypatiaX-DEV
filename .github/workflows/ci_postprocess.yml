name: "HypatiaX - post-process (figures + tables)"

# ==============================================================================
# ci_postprocess.yml — generic, config-driven figures + tables generation.
#
# Every experiment's source dir, output dirs, and which generators apply to
# it lives in ci_experiments.yml — NOT in this file. To add, remove, or move an
# experiment, edit ci_experiments.yml only; nothing here should need to change.
#
# GitHub Actions limitation: workflow_dispatch `options:` and push `paths:`
# must be static YAML — Actions evaluates triggers before running any code,
# so it can't read ci_experiments.yml to build them. Both lists below are
# therefore mirrored by hand from ci_experiments.yml. The "Validate config
# sync" step fails the run loudly the moment they drift apart, instead of
# silently misrouting a run the way the old three-file-duplicated mapping
# did.
# ==============================================================================

"on":
  push:
    branches: ["main", "master"]
    paths:
      - "ci_experiments.yml"
      - "scripts/generate_figures.py"
      - "scripts/generate_tables.py"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/15/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi_pca/**/*.json"
      - "hypatiax/data/results/comparison_results/noise-noiseless/15_pca/**/*.json"
      - "hypatiax/data/results/ablation/exp1_ablation/**/*.json"
      - "hypatiax/data/results/five_systems/exp1_five/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_extrap/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_pca_4060/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/exp2_multi/**/*.json"
      - "hypatiax/data/results/five_systems/exp2_five/**/*.json"
      - "hypatiax/data/results/extrapolation/**/*.json"
      - "hypatiax/data/results/hybrid_pysr/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/noise-sweep/**/*.json"
      - "hypatiax/data/results/comparison_results/feynman-tests/sample-complexity/**/*.json"
      - "hypatiax/data/results/hybrid_llm_nn/**/*.json"
      - "hypatiax/data/results/comparison_results/extrapolation/**/*.json"
      - "hypatiax/data/results/figures/**/*.json"

  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID — must be a key (or alias) in ci_experiments.yml"
        required: true
        type: choice
        options:
          - exp1
          - exp1b
          - exp1_pca
          - exp1b_pca
          - exp1_ablation
          - exp1_five
          - exp2_feynman
          - exp2_feynman_extrap
          - exp2_feynman_pca
          - exp2
          - exp2_five
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap
          - figures_deploy

permissions:
  contents: write

env:
  CONFIG_FILE: "ci_experiments.yml"

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" matplotlib seaborn \
                      "sympy>=1.12" "tabulate>=0.9" "PyYAML>=6.0"

      # ------------------------------------------------------------------
      # Step 0 — fail loudly if this workflow's static dispatch/push lists
      # have drifted out of sync with ci_experiments.yml, rather than silently
      # misrouting or refusing a valid run.
      # ------------------------------------------------------------------
      - name: Validate config sync
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, yaml

          with open("${{ env.CONFIG_FILE }}") as f:
              cfg = yaml.safe_load(f)

          config_ids = set(cfg["experiments"]) | set(cfg["aggregates"])

          dispatch_options = set("""
          exp1 exp1b exp1_pca exp1b_pca exp1_ablation exp1_five
          exp2_feynman exp2_feynman_extrap exp2_feynman_pca exp2 exp2_five
          exp3 exp3b suppA suppB suppB_sc hybrid_all_domains instability
          extrap figures_deploy
          """.split())

          missing_from_dispatch = config_ids - dispatch_options
          missing_from_config   = dispatch_options - config_ids
          if missing_from_dispatch or missing_from_config:
              print("::error::ci_postprocess.yml's workflow_dispatch options "
                    "have drifted from ci_experiments.yml.")
              if missing_from_dispatch:
                  print(f"  In ci_experiments.yml but NOT in this workflow's "
                        f"dispatch options: {sorted(missing_from_dispatch)}")
              if missing_from_config:
                  print(f"  In this workflow's dispatch options but NOT in "
                        f"ci_experiments.yml: {sorted(missing_from_config)}")
              print("Fix: update the workflow_dispatch.inputs.experiment.options "
                    "list (and the push.paths list, if a source_dir changed) "
                    "in ci_postprocess.yml to match ci_experiments.yml.")
              sys.exit(1)

          print(f"OK — {len(config_ids)} experiment/aggregate IDs in sync "
                f"between ci_experiments.yml and ci_postprocess.yml.")
          PY

      # ------------------------------------------------------------------
      # Step 1 — resolve which experiment this run is for, and every path
      # it needs, purely by reading ci_experiments.yml. Nothing below this
      # step contains a hardcoded experiment name or directory.
      # ------------------------------------------------------------------
      - name: Resolve experiment from config
        id: resolve
        shell: bash
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.experiment }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event_name == 'push' && format('{0}\n{1}\n{2}', join(github.event.head_commit.modified, '\n'), join(github.event.head_commit.added, '\n'), join(github.event.head_commit.removed, '\n')) || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys, json, yaml

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          experiments = cfg["experiments"]
          aggregates  = cfg["aggregates"]
          all_entries = {**experiments, **aggregates}
          results_root = cfg["results_root"]

          def glob_to_regex(pat: str) -> re.Pattern:
              pat = re.escape(pat)
              pat = pat.replace(r"\*\*/", "(?:.*/)?")
              pat = pat.replace(r"\*\*", ".*")
              pat = pat.replace(r"\*", "[^/]*")
              return re.compile("^" + pat + "$")

          def matches(entry_id: str, changed_path: str) -> bool:
              trig = all_entries[entry_id].get("trigger_paths", [])
              positives = [p for p in trig if not p.startswith("!")]
              negatives = [p[1:] for p in trig if p.startswith("!")]
              if any(glob_to_regex(p).match(changed_path) for p in negatives):
                  return False
              return any(glob_to_regex(p).match(changed_path) for p in positives)

          def resolve_id(raw: str) -> str:
              if raw in all_entries:
                  return raw
              for eid, entry in all_entries.items():
                  if raw in entry.get("aliases", []):
                      return eid
              print(f"::error::'{raw}' is not a known experiment ID or alias "
                    f"in {os.environ['CONFIG_FILE']}.")
              sys.exit(1)

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              exp_id = resolve_id(os.environ["DISPATCH_INPUT"])
          else:
              changed = [p for p in os.environ.get("CHANGED_FILES", "").splitlines() if p]
              exp_id = None
              for path in changed:
                  for eid in all_entries:
                      if matches(eid, path):
                          exp_id = eid
                          break
                  if exp_id:
                      break
              if exp_id is None:
                  print("::error::No changed file matched any experiment's "
                        "trigger_paths in ci_experiments.yml — cannot determine "
                        "which experiment this push run is for.")
                  sys.exit(1)

          entry = all_entries[exp_id]
          is_aggregate = exp_id in aggregates

          if is_aggregate:
              figures_dir = entry["figures_dir"]
              tables_dir  = entry.get("tables_dir")
              source_dir  = figures_dir   # aggregates read from their own figures dir
          else:
              source_dir  = entry["source_dir"]
              figures_dir = f"{source_dir}/figures"
              tables_dir  = f"{source_dir}/tables"

          out = {
              "id": exp_id,
              "is_aggregate": str(is_aggregate).lower(),
              "results_root": results_root,
              "source_dir_abs":  f"{results_root}/{source_dir}",
              "figures_dir_abs": f"{results_root}/{figures_dir}",
              "tables_dir_abs":  f"{results_root}/{tables_dir}" if tables_dir else "",
              "generates_tables":  str(entry.get("generates_tables", False)).lower(),
              "generates_figures": str(entry.get("generates_figures", False)).lower(),
              "extra_stage_files": json.dumps(entry.get("extra_stage_files", [])),
              "description": entry.get("description", exp_id),
          }
          for k, v in out.items():
              print(f"{k}={v}")
          PY

      - name: Create output directories
        shell: bash
        run: |
          mkdir -p "${{ steps.resolve.outputs.figures_dir_abs }}"
          if [ -n "${{ steps.resolve.outputs.tables_dir_abs }}" ]; then
            mkdir -p "${{ steps.resolve.outputs.tables_dir_abs }}"
          fi

      # ------------------------------------------------------------------
      # Step 2 — cross-experiment write guards (ci_experiments.yml: guards:).
      # Snapshot every directory this run does NOT own, before generation.
      # ------------------------------------------------------------------
      - name: Snapshot guarded directories
        id: guard_pre
        shell: bash
        run: |
          python3 - <<'PY'
          import os, hashlib, json, yaml

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          exp_id = "${{ steps.resolve.outputs.id }}"
          root = "${{ steps.resolve.outputs.results_root }}"
          snapshot = {}

          for guard in cfg.get("guards", []):
              if exp_id in guard["owners"]:
                  continue   # this run legitimately owns this directory
              for d in guard["dirs"]:
                  path = os.path.join(root, d)
                  files = {}
                  if os.path.isdir(path):
                      for dirpath, _, filenames in os.walk(path):
                          for fn in filenames:
                              fp = os.path.join(dirpath, fn)
                              files[fp] = hashlib.sha256(open(fp, "rb").read()).hexdigest()
                  snapshot[path] = files

          with open("/tmp/guard_snapshot.json", "w") as f:
              json.dump(snapshot, f)
          print(f"Guarding {len(snapshot)} directory(ies) not owned by '{exp_id}'.")
          PY

      # ------------------------------------------------------------------
      # Step 3 — generate. Both scripts already warn-and-skip on missing
      # data (ci_experiments.yml: on_missing_data) and always exit 0; no
      # hardcoded/paper-verified value is ever substituted by either.
      # ------------------------------------------------------------------
      - name: "Generate tables"
        if: steps.resolve.outputs.generates_tables == 'true'
        shell: bash
        run: |
          python3 scripts/generate_tables.py \
            --experiment "${{ steps.resolve.outputs.id }}" \
            --results-dir "${{ steps.resolve.outputs.source_dir_abs }}" \
            --output-dir "${{ steps.resolve.outputs.tables_dir_abs }}"

      - name: "Generate figures"
        if: steps.resolve.outputs.generates_figures == 'true'
        shell: bash
        run: |
          python3 scripts/generate_figures.py \
            --experiment "${{ steps.resolve.outputs.id }}" \
            --results-dir "${{ steps.resolve.outputs.source_dir_abs }}" \
            --figures-dir "${{ steps.resolve.outputs.figures_dir_abs }}"

      # ------------------------------------------------------------------
      # Step 4 — figures_deploy is an assembly step, not a generator: pull
      # every experiment's own canonical figures into one flat directory
      # for the LaTeX build. Real filename conflicts (same name, different
      # content) are logged and left for manual review rather than guessed
      # at — this never overwrites silently.
      # ------------------------------------------------------------------
      - name: "Deploy assembled figures"
        if: steps.resolve.outputs.id == 'figures_deploy'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil, hashlib, yaml

          with open(os.environ["CONFIG_FILE"]) as f:
              cfg = yaml.safe_load(f)

          root = "${{ steps.resolve.outputs.results_root }}"
          dest = "${{ steps.resolve.outputs.figures_dir_abs }}"
          os.makedirs(dest, exist_ok=True)

          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest()

          copied, skipped, conflicts = 0, 0, []
          for eid, entry in cfg["experiments"].items():
              if not entry.get("generates_figures"):
                  continue
              src_dir = os.path.join(root, entry["source_dir"], "figures")
              if not os.path.isdir(src_dir):
                  continue
              for fn in os.listdir(src_dir):
                  src = os.path.join(src_dir, fn)
                  dst = os.path.join(dest, fn)
                  if not os.path.isfile(src):
                      continue
                  if os.path.exists(dst):
                      if sha(src) == sha(dst):
                          skipped += 1
                          continue
                      conflicts.append((fn, eid))
                      continue
                  shutil.copy2(src, dst)
                  copied += 1

          print(f"figures_deploy: copied {copied}, already up to date {skipped}, "
                f"{len(conflicts)} conflict(s).")
          if conflicts:
              print("::warning::Filename conflicts (same name, different content) "
                    "left untouched — resolve manually:")
              for fn, eid in conflicts:
                  print(f"  {fn} (from {eid}) differs from existing figures/{fn}")
          PY

      # ------------------------------------------------------------------
      # Step 5 — re-check guarded directories. A diff here means this run
      # wrote into a directory it doesn't own; that's a bug, not a
      # missing-data situation, so it fails the build.
      # ------------------------------------------------------------------
      - name: Check guarded directories unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys

          with open("/tmp/guard_snapshot.json") as f:
              before = json.load(f)

          violations = []
          for path, before_files in before.items():
              after_files = {}
              if os.path.isdir(path):
                  for dirpath, _, filenames in os.walk(path):
                      for fn in filenames:
                          fp = os.path.join(dirpath, fn)
                          after_files[fp] = hashlib.sha256(open(fp, "rb").read()).hexdigest()
              if after_files != before_files:
                  violations.append(path)

          if violations:
              print("::error::This run wrote into a directory it does not own:")
              for v in violations:
                  print(f"  {v}")
              print("See ci_experiments.yml's guards: section for the owning experiment(s).")
              sys.exit(1)
          print("OK — no guarded directory was touched by this run.")
          PY

      # ------------------------------------------------------------------
      # Step 6 — commit whatever was actually generated. Skipped
      # tables/figures are (by design) simply absent, not staged, and any
      # previously-committed good output is left untouched.
      # ------------------------------------------------------------------
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.resolve.outputs.figures_dir_abs }}" 2>/dev/null || true
          if [ -n "${{ steps.resolve.outputs.tables_dir_abs }}" ]; then
            git add "${{ steps.resolve.outputs.tables_dir_abs }}" 2>/dev/null || true
          fi

          python3 - <<'PY'
          import json, subprocess
          extra = json.loads('''${{ steps.resolve.outputs.extra_stage_files }}''')
          src_dir = "${{ steps.resolve.outputs.source_dir_abs }}"
          for fn in extra:
              subprocess.run(["git", "add", f"{src_dir}/{fn}"], check=False)
          PY

          if git diff --cached --quiet; then
            echo "Nothing to commit — no tables/figures changed."
          else
            git commit -m "postprocess(${{ steps.resolve.outputs.id }}): regenerate tables/figures [skip ci]"
            git push
          fi

      - name: Step summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Post-process: \`${{ steps.resolve.outputs.id }}\`"
            echo "${{ steps.resolve.outputs.description }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source dir | \`${{ steps.resolve.outputs.source_dir_abs }}\` |"
            echo "| Figures dir | \`${{ steps.resolve.outputs.figures_dir_abs }}\` |"
            echo "| Tables dir | \`${{ steps.resolve.outputs.tables_dir_abs }}\` |"
            echo "| Generated tables | ${{ steps.resolve.outputs.generates_tables }} |"
            echo "| Generated figures | ${{ steps.resolve.outputs.generates_figures }} |"
          } >> "$GITHUB_STEP_SUMMARY"
