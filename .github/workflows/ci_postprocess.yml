name: "HypatiaX - post-process (figures + tables)"
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID"
        required: true
        type: string
      result_subdir:
        description: "Result subdirectory (derived from experiment if blank)"
        required: false
        type: string
        default: ""

# ISSUE 5 FIX: declare write permission so git push succeeds on repos
# that default to contents: read.
permissions:
  contents: write

env:
  OUT_BASE: "hypatiax/data/results"

jobs:
  postprocess:
    runs-on: ubuntu-latest
    # FIX: increased from 20 — SymPy classification across 12 tasks × 2 systems
    # × multiple seeds can take 30–40 min in the worst case.
    timeout-minutes: 60
    steps:
      # ISSUE 6 FIX: pass token explicitly (matches ci_analysis.yml pattern)
      # so the checkout carries write credentials for the subsequent git push.
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.12" }

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" matplotlib seaborn "sympy>=1.12"

      # ISSUE 3 FIX: resolve result_subdir from experiment name (same canonical
      # mapping used by ci_analysis.yml) so the scripts receive the correct
      # per-experiment subtree instead of the entire results tree.
      - name: Resolve result_subdir
        id: meta
        env:
          DISPATCH_EXP: ${{ github.event.inputs.experiment }}
          DISPATCH_SUB: ${{ github.event.inputs.result_subdir }}
        shell: bash
        run: |
          set -euo pipefail
          SUB="${DISPATCH_SUB}"
          if [[ -z "$SUB" ]]; then
            SUB=$(EXP_ID="$DISPATCH_EXP" python3 -c "
          import os
          mapping = {
              'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
              'exp1b':              'comparison_results/noise-noiseless/15',
              'exp2_feynman':       'comparison_results/feynman-tests/exp2',
              'exp2_feynman_extrap': 'comparison_results/feynman-tests/exp2_extrap',
              'exp2_feynman_pca':   'comparison_results/feynman-tests/exp2_pca_4060',
              'exp2':               'comparison_results/feynman-tests/exp2_multi',
              'exp3':               'extrapolation',
              'exp3b':              'extrapolation/multi_seed',
              'suppA':              'hybrid_pysr/defi',
              'suppB':              'comparison_results/feynman-tests/noise-sweep/noise-sweep',
              'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
              'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
              'instability':        'figures',
              'extrap':             'comparison_results/extrapolation',
          }
          exp = os.environ['EXP_ID']
          print(mapping.get(exp, exp))
          ")
          fi
          echo "result_subdir=${SUB}" >> "$GITHUB_OUTPUT"
          echo "Resolved result_subdir=${SUB} for experiment=${DISPATCH_EXP}"

      - name: Detect existing figures and tables (overwrite audit)
        id: overwrite_audit
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          set -euo pipefail
          FIGS="${OUT_BASE}/${SUB}/figures"
          TABS="${OUT_BASE}/${SUB}/tables"

          # Snapshot which files already exist so we can report overwrites after
          # the generator scripts run.  Files are listed with their sizes so the
          # operator can spot unexpectedly large replacements.
          echo "--- Pre-run snapshot ---"
          if [[ -d "$FIGS" ]]; then
            EXISTING_FIGS=$(find "$FIGS" -maxdepth 1 -type f \( -name "*.pdf" -o -name "*.png" \) | sort)
            N_EXISTING_FIGS=$(echo "$EXISTING_FIGS" | grep -c . || true)
            echo "Figures dir  : $FIGS"
            echo "  Existing   : ${N_EXISTING_FIGS} file(s)"
            if [[ $N_EXISTING_FIGS -gt 0 ]]; then
              echo "$EXISTING_FIGS" | while IFS= read -r f; do
                printf "    [WILL OVERWRITE] %s  (%s)\n" "$(basename "$f")" "$(du -sh "$f" | cut -f1)"
              done
            fi
          else
            N_EXISTING_FIGS=0
            echo "Figures dir  : $FIGS  (does not exist yet — no overwrites)"
          fi

          if [[ -d "$TABS" ]]; then
            EXISTING_TABS=$(find "$TABS" -maxdepth 1 -type f -name "*.tex" | sort)
            N_EXISTING_TABS=$(echo "$EXISTING_TABS" | grep -c . || true)
            echo "Tables dir   : $TABS"
            echo "  Existing   : ${N_EXISTING_TABS} file(s)"
            if [[ $N_EXISTING_TABS -gt 0 ]]; then
              echo "$EXISTING_TABS" | while IFS= read -r f; do
                printf "    [WILL OVERWRITE] %s  (%s)\n" "$(basename "$f")" "$(du -sh "$f" | cut -f1)"
              done
            fi
          else
            N_EXISTING_TABS=0
            echo "Tables dir   : $TABS  (does not exist yet — no overwrites)"
          fi

          # Export counts for the post-run diff step.
          echo "n_existing_figs=${N_EXISTING_FIGS}" >> "$GITHUB_OUTPUT"
          echo "n_existing_tabs=${N_EXISTING_TABS}" >> "$GITHUB_OUTPUT"

          # Persist the file lists to temp files so the diff step can compare.
          mkdir -p /tmp/postprocess_audit
          find "$FIGS" -maxdepth 1 -type f \( -name "*.pdf" -o -name "*.png" \) 2>/dev/null | sort > /tmp/postprocess_audit/figs_before.txt || true
          find "$TABS" -maxdepth 1 -type f -name "*.tex" 2>/dev/null | sort > /tmp/postprocess_audit/tabs_before.txt || true

      - name: Generate figures
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          # Pre-create output dirs — the generator scripts may not create them,
          # and git add must find the paths even when no files are produced.
          # BUG 2b FIX: tables dir was missing; only figures dir was pre-created,
          # so git add "${TABS}/" would warn and tables were never committed.
          mkdir -p "${OUT_BASE}/${SUB}/figures"
          mkdir -p "${OUT_BASE}/${SUB}/tables"
          # BUG 2a FIX: script was invoked as figures/generate_figures.py — that path
          # resolves to the output subdirectory, not the script source location.
          # Scripts live under scripts/ (same prefix as scripts/patches/paper_targets.json).
          python scripts/generate_figures.py \
            --repo-root   "${OUT_BASE}/${SUB}" \
            --figures-dir "${OUT_BASE}/${SUB}/figures" \
            --source auto

      - name: Generate tables
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          # BUG 2a FIX: same wrong-path bug as generate_figures — was tables/generate_tables.py.
          python scripts/generate_tables.py \
            --results-dir "${OUT_BASE}/${SUB}" \
            --output-dir  "${OUT_BASE}/${SUB}/tables"

      # ── Symbolic equivalence (exp3 / exp3b only) ───────────────────────────
      #
      # FIX: split into two steps — (1) run check_symbolic_equivalence.py to
      # produce/refresh the CSV from the committed JSON result files, then
      # (2) generate the LaTeX table from the CSV.
      #
      # Previously the step only called the table generator and assumed the CSV
      # was already present (produced by ci_analysis.yml).  That assumption
      # fails when ci_analysis hasn't run, or wrote the CSV to a different path,
      # or the CSV is header-only because the JSON files weren't found.
      #
      # FIX: the `if` expression used `||` (invalid in GitHub Actions expression
      # syntax).  Correct operator is `||` inside ${{ }}.  The multi-line `if`
      # block with bare `||` was silently evaluated as always-false in some
      # runner versions.  Moved to a single-line expression.

      - name: Check symbolic equivalence (exp3 / exp3b)
        if: ${{ github.event.inputs.experiment == 'exp3' || github.event.inputs.experiment == 'exp3b' }}
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          set -euo pipefail

          RESULTS_DIR="${OUT_BASE}/${SUB}"
          CSV="${RESULTS_DIR}/symbolic_equivalence_report.csv"

          # Locate JSON result files.  exp3 keeps them flat; exp3b uses
          # multi_seed/<seed>/ subdirectories — the script handles both via its
          # recursive glob when no explicit files are passed.
          JSON_FILES=$(find "${RESULTS_DIR}" -name "exp3_nguyen12_seed*.json" | sort)

          if [[ -z "$JSON_FILES" ]]; then
            echo "::error::No exp3_nguyen12_seed*.json files found under ${RESULTS_DIR}"
            echo "  Make sure ci_analysis.yml for ${{ github.event.inputs.experiment }} has run and committed results."
            exit 1
          fi

          N_JSON=$(echo "$JSON_FILES" | wc -l)
          echo "Found ${N_JSON} JSON file(s) — running symbolic equivalence check..."

          # --append lets us safely accumulate rows if this step is re-run;
          # for a fresh run it is equivalent to overwrite because the CSV either
          # doesn't exist yet or will be superseded by the same seeds.
          # shellcheck disable=SC2086
          python scripts/check_symbolic_equivalence.py \
            --output-dir "${RESULTS_DIR}" \
            --append \
            $JSON_FILES

          # Verify the CSV is non-empty (has at least one data row beyond header).
          if [[ ! -f "$CSV" ]]; then
            echo "::error::check_symbolic_equivalence.py did not produce ${CSV}"
            exit 2
          fi

          DATA_ROWS=$(tail -n +2 "$CSV" | grep -c . || true)
          if [[ "$DATA_ROWS" -eq 0 ]]; then
            echo "::error::${CSV} contains only a header row — no data was classified."
            echo "  This usually means the JSON files were parsed but contained no"
            echo "  'hypatiax' or 'pysr' entries.  Check the JSON structure."
            exit 2
          fi

          echo "CSV verified: ${DATA_ROWS} data row(s) written to ${CSV}"

      - name: Generate symbolic equivalence table (exp3 / exp3b)
        if: ${{ github.event.inputs.experiment == 'exp3' || github.event.inputs.experiment == 'exp3b' }}
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          set -euo pipefail

          RESULTS_DIR="${OUT_BASE}/${SUB}"
          CSV="${RESULTS_DIR}/symbolic_equivalence_report.csv"
          TABS="${RESULTS_DIR}/tables"

          # Sanity-check: the previous step should have ensured this, but guard
          # here too so a skipped/failed prior step gives a clear message.
          if [[ ! -f "$CSV" ]] || [[ $(tail -n +2 "$CSV" | grep -c . || true) -eq 0 ]]; then
            echo "::error::${CSV} is missing or empty — cannot generate LaTeX table."
            exit 1
          fi

          python scripts/patches/generate_nguyen12_symequiv_table.py \
            --results-dir "${RESULTS_DIR}" \
            --output-dir  "${TABS}"

          # Also stage the freshly-written CSV so it is committed alongside the
          # table (useful when postprocess is the only workflow run for exp3b).
          git add "${CSV}" 2>/dev/null || true

      - name: Generate PCA comparison table (exp2_feynman_pca)
        if: ${{ github.event.inputs.experiment == 'exp2_feynman_pca' }}
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          set -euo pipefail

          # The comparison script reads BOTH exp2 (random 80/20) and exp2_pca_4060
          # result trees from the committed repo.  Output is written directly into
          # the exp2_pca_4060 subdirectory (tables are committed by the Commit step).
          python scripts/patches/generate_exp2_pca_comparison_table.py \
            --results-dir "${OUT_BASE}" \
            --output-dir  "${OUT_BASE}/${SUB}" \
            --formats     "tex,csv,md"

      - name: Post-run overwrite summary
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
          N_EXISTING_FIGS: ${{ steps.overwrite_audit.outputs.n_existing_figs }}
          N_EXISTING_TABS: ${{ steps.overwrite_audit.outputs.n_existing_tabs }}
        shell: bash
        run: |
          set -euo pipefail
          FIGS="${OUT_BASE}/${SUB}/figures"
          TABS="${OUT_BASE}/${SUB}/tables"

          echo "--- Post-run overwrite summary ---"

          # Figures
          find "$FIGS" -maxdepth 1 -type f \( -name "*.pdf" -o -name "*.png" \) 2>/dev/null | sort > /tmp/postprocess_audit/figs_after.txt || true
          N_AFTER_FIGS=$(wc -l < /tmp/postprocess_audit/figs_after.txt || echo 0)
          N_OVERWRITTEN_FIGS=$(comm -12 /tmp/postprocess_audit/figs_before.txt /tmp/postprocess_audit/figs_after.txt | wc -l || echo 0)
          N_NEW_FIGS=$(comm -13 /tmp/postprocess_audit/figs_before.txt /tmp/postprocess_audit/figs_after.txt | wc -l || echo 0)
          N_DELETED_FIGS=$(comm -23 /tmp/postprocess_audit/figs_before.txt /tmp/postprocess_audit/figs_after.txt | wc -l || echo 0)
          echo "Figures: ${N_AFTER_FIGS} total  |  ${N_OVERWRITTEN_FIGS} overwritten  |  ${N_NEW_FIGS} new  |  ${N_DELETED_FIGS} deleted"
          if [[ $N_OVERWRITTEN_FIGS -gt 0 ]]; then
            echo "  Overwritten figures:"
            comm -12 /tmp/postprocess_audit/figs_before.txt /tmp/postprocess_audit/figs_after.txt | while IFS= read -r f; do
              printf "    ✏  %s\n" "$(basename "$f")"
            done
          fi
          if [[ $N_NEW_FIGS -gt 0 ]]; then
            echo "  New figures:"
            comm -13 /tmp/postprocess_audit/figs_before.txt /tmp/postprocess_audit/figs_after.txt | while IFS= read -r f; do
              printf "    ✚  %s\n" "$(basename "$f")"
            done
          fi

          # Tables
          find "$TABS" -maxdepth 1 -type f -name "*.tex" 2>/dev/null | sort > /tmp/postprocess_audit/tabs_after.txt || true
          N_AFTER_TABS=$(wc -l < /tmp/postprocess_audit/tabs_after.txt || echo 0)
          N_OVERWRITTEN_TABS=$(comm -12 /tmp/postprocess_audit/tabs_before.txt /tmp/postprocess_audit/tabs_after.txt | wc -l || echo 0)
          N_NEW_TABS=$(comm -13 /tmp/postprocess_audit/tabs_before.txt /tmp/postprocess_audit/tabs_after.txt | wc -l || echo 0)
          N_DELETED_TABS=$(comm -23 /tmp/postprocess_audit/tabs_before.txt /tmp/postprocess_audit/tabs_after.txt | wc -l || echo 0)
          echo "Tables:  ${N_AFTER_TABS} total  |  ${N_OVERWRITTEN_TABS} overwritten  |  ${N_NEW_TABS} new  |  ${N_DELETED_TABS} deleted"
          if [[ $N_OVERWRITTEN_TABS -gt 0 ]]; then
            echo "  Overwritten tables:"
            comm -12 /tmp/postprocess_audit/tabs_before.txt /tmp/postprocess_audit/tabs_after.txt | while IFS= read -r f; do
              printf "    ✏  %s\n" "$(basename "$f")"
            done
          fi
          if [[ $N_NEW_TABS -gt 0 ]]; then
            echo "  New tables:"
            comm -13 /tmp/postprocess_audit/tabs_before.txt /tmp/postprocess_audit/tabs_after.txt | while IFS= read -r f; do
              printf "    ✚  %s\n" "$(basename "$f")"
            done
          fi

          # Emit GitHub step summary
          {
            echo "## Post-process output summary — ${{ github.event.inputs.experiment }}"
            echo "| Dir | Before | After | Overwritten | New | Deleted |"
            echo "|-----|-------:|------:|------------:|----:|--------:|"
            echo "| figures | ${N_EXISTING_FIGS} | ${N_AFTER_FIGS} | ${N_OVERWRITTEN_FIGS} | ${N_NEW_FIGS} | ${N_DELETED_FIGS} |"
            echo "| tables  | ${N_EXISTING_TABS} | ${N_AFTER_TABS} | ${N_OVERWRITTEN_TABS} | ${N_NEW_TABS} | ${N_DELETED_TABS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset index before rebasing — matches ci_analysis.yml pattern.
          # Without this, a dirty index from prior steps causes rebase to refuse.
          git reset HEAD 2>/dev/null || true
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          # Stage outputs; warn explicitly if either directory is empty or missing
          # rather than hiding it with a bare || true.
          FIGS="${OUT_BASE}/${SUB}/figures"
          TABS="${OUT_BASE}/${SUB}/tables"

          if [[ ! -d "$FIGS" ]] || [[ -z "$(ls -A "$FIGS" 2>/dev/null)" ]]; then
            echo "::warning::figures directory is empty or missing: ${FIGS}"
          fi
          if [[ ! -d "$TABS" ]] || [[ -z "$(ls -A "$TABS" 2>/dev/null)" ]]; then
            echo "::warning::tables directory is empty or missing: ${TABS}"
          fi

          git add "${FIGS}/" "${TABS}/" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to post-process outputs — results unchanged from previous run."
          else
            git commit -m "ci: figures+tables for ${{ github.event.inputs.experiment }} - run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed figures+tables for ${{ github.event.inputs.experiment }}."
          fi
