# ==============================================================================
#  ci_analysis.yml - HypatiaX post-consolidation statistical analysis
#
#  Architecture contract (read before editing):
#    This workflow runs AFTER ci_runner.yml has completed and committed result
#    files to the repository.  It is the ONLY stage that may perform statistical
#    analysis.  Workers MUST NOT run statistical tests.
#
#  Single-worker vs multi-worker experiments:
#    exp1b, exp3b  — 4 workers each.  ci_runner.yml runs merge_shards.py in its
#                    consolidate job and commits _merged.json to the repo.
#                    ci_analysis.yml reads that _merged.json directly.
#    exp2_feynman  — 1 worker.  Worker commits benchmark_results.json (raw
#                    runner output).  ci_analysis.yml runs merge_shards.py
#                    inline to produce _merged.json with the ablation schema
#                    (hypatia/pysr_only keys + extrap_r2_far) that
#                    analyse_ablation() requires.  No separate consolidation
#                    job needed or used.
#    all others    — 1 worker.  Worker commits a shard result file directly.
#                    ci_analysis.yml reads that file as-is (run_analysis.py
#                    accepts shapes A/B/C).  No merging needed or performed.
#
#  Responsibilities:
#    - Mann-Whitney U tests (per-method, cross-method)
#    - R² distribution analysis and per-method success rates
#    - Method summary tables (coverage, median R², rank)
#    - Coverage gap detection
#    - Instability / domain-consistency metrics (exp: instability, hybrid_all_domains)
#    - Extrapolation checks (exp: extrap)
#    - Publication-quality table generation
#    - Markdown report (_report.md) and structured output (_analysis.json)
#    - Fatal-condition abort (exits non-zero; PR merge blocked by branch protection)
#
#  Outputs committed to master:
#    hypatiax/data/results/{result_subdir}/_report.md
#    hypatiax/data/results/{result_subdir}/_analysis.json
#
#  Triggering modes:
#    1. Scheduled chain (workflow_dispatch from ci_schedule_all.yml): called
#       automatically after ci_runner.yml completes.  Passes experiment and
#       source_run_id; result_subdir is derived from experiment name.
#    2. Manual (workflow_dispatch): re-runs analysis on already-committed
#       result files.  Requires experiment; result_subdir derived automatically.
#
#  COMMIT RESILIENCE:
#    Uses save-to-/tmp → git reset --hard → restore pattern instead of
#    git pull --rebase --autostash.  Hard reset unconditionally wipes untracked
#    ghost files left by prior failed runs, eliminating the recurring
#    "would be overwritten by merge / Aborting" error.  Safe because all
#    experiment result files are committed to master by ci_runner.yml before
#    this workflow ever runs.
# ==============================================================================

name: "HypatiaX - analysis"
run-name: "HypatiaX - analysis . ${{ github.event.inputs.experiment }}"

# -- Triggers ------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment ID (must match a committed result_subdir)"
        required: true
        type: choice
        options:
          - exp1
          - exp1b
          - exp2_feynman
          - exp2
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap

      result_subdir:
        description: "Canonical result subdirectory — leave blank to derive from experiment name"
        required: false
        default: ""

      source_run_id:
        description: "ci_runner.yml run ID to download the merged artifact from (exp1b/exp3b only; leave blank to use committed files)"
        required: false
        default: ""

# -- Permissions ---------------------------------------------------------------
permissions:
  contents: write   # commit report + analysis outputs
  actions:  read    # download artifacts from ci_runner.yml (exp1b/exp3b)

# -- Global env ----------------------------------------------------------------
env:
  OUT_BASE: hypatiax/data/results
  PYSR_FIT_WALL_TIMEOUT: ${{ vars.PYSR_FIT_WALL_TIMEOUT }}
  PYSR_FIT_GRACE_SECS:   ${{ vars.PYSR_FIT_GRACE_SECS }}


# ==============================================================================
#  JOB: analysis
# ==============================================================================
jobs:

  analysis:
    name: "Analysis - ${{ github.event.inputs.experiment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: github.event_name == 'workflow_dispatch'

    steps:

      # -----------------------------------------------------------------------
      - name: Checkout master
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      - name: Cache analysis pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: analysis-pip-${{ runner.os }}-numpy-scipy-pandas
          restore-keys: analysis-pip-${{ runner.os }}-

      # -----------------------------------------------------------------------
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # scipy required for Mann-Whitney U tests (this is the ONLY job
          # that installs scipy; workers must not use it).
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0"

      # -----------------------------------------------------------------------
      # exp1b and exp3b are the ONLY multi-worker experiments.
      # ci_runner.yml already ran merge_shards.py and committed _merged.json.
      # Download that artifact here when source_run_id is provided; fall back
      # to the committed copy when running manually without source_run_id.
      # All other experiments are single-worker — no artifact download needed.
      - name: Download merged artifact (exp1b / exp3b only)
        if: >
          (github.event.inputs.experiment == 'exp1b' ||
           github.event.inputs.experiment == 'exp3b') &&
          github.event.inputs.source_run_id != ''
        continue-on-error: true
        id: download_artifact
        uses: actions/download-artifact@v4
        with:
          run-id:         ${{ github.event.inputs.source_run_id }}
          github-token:   ${{ secrets.GITHUB_TOKEN }}
          path:           merged_artifact
          pattern:        "merged-${{ github.event.inputs.experiment }}-*"
          merge-multiple: true

      # -----------------------------------------------------------------------
      - name: Log artifact download outcome
        if: >
          (github.event.inputs.experiment == 'exp1b' ||
           github.event.inputs.experiment == 'exp3b') &&
          github.event.inputs.source_run_id != ''
        run: |
          if [[ "${{ steps.download_artifact.outcome }}" == "success" ]]; then
            echo "Artifact downloaded from run ${{ github.event.inputs.source_run_id }}."
          else
            echo "::warning::Artifact download failed — falling back to committed _merged.json."
          fi

      # -----------------------------------------------------------------------
      # instability has no _merged.json and no method analysis.
      # Write stub outputs and short-circuit all downstream steps.
      - name: Short-circuit for instability experiment
        if: github.event.inputs.experiment == 'instability'
        id: short_circuit
        run: |
          set -euo pipefail
          OUT_DIR="${OUT_BASE}/figures"
          mkdir -p "${OUT_DIR}"
          python3 -c '
          import json, os
          out = os.environ["OUT_BASE"] + "/figures"
          stub = {
            "experiment": "instability",
            "experiment_mode": "instability",
            "n_total": 0,
            "fatal_conditions": [
              "WARN_INSTABILITY_NO_MERGED_JSON: instability outputs are CSVs/figures only; statistical method analysis was skipped."
            ]
          }
          open(out + "/_analysis.json", "w").write(json.dumps(stub, indent=2))
          open(out + "/_report.md", "w").write(
            "# HypatiaX Analysis Report -- instability\n\n"
            "Instability experiment: method comparison analysis not applicable.\n"
            "See figures/instability_analysis.csv for results.\n"
          )
          print("Stub outputs written -- instability short-circuit done.")
          '
          echo "result_subdir=figures" >> "$GITHUB_OUTPUT"
          echo "exp_id=instability"    >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Resolve exp_id and result_subdir from workflow_dispatch inputs.
      # Single source of truth for result_subdir paths — mirrors
      # run_analysis.py RESULT_SUBDIR and ci_runner.yml plan meta step.
      - name: Resolve experiment metadata
        if: github.event.inputs.experiment != 'instability'
        id: meta
        env:
          DISPATCH_EXP: ${{ github.event.inputs.experiment }}
          DISPATCH_SUB: ${{ github.event.inputs.result_subdir }}
        run: |
          set -euo pipefail

          EXP="${DISPATCH_EXP}"

          # Derive result_subdir from experiment name when not provided.
          if [[ -n "${DISPATCH_SUB}" ]]; then
            SUB="${DISPATCH_SUB}"
          else
            SUB=$(EXP_ID="${EXP}" python3 -c "
          import os
          mapping = {
              'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
              'exp1b':              'comparison_results/noise-noiseless/15',
              'exp2_feynman':       'comparison_results/feynman-tests/exp2',
              'exp2':               'comparison_results/feynman-tests/exp2_multi',
              'exp3':               'extrapolation',
              'exp3b':              'extrapolation/multi_seed',
              'suppA':              'hybrid_pysr/defi',
              'suppB':              'comparison_results/feynman-tests/noise-sweep',
              'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
              'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
              'instability':        'figures',
              'extrap':             'comparison_results/extrapolation',
          }
          exp = os.environ['EXP_ID']
          print(mapping.get(exp, exp))
          ")
          fi

          if [[ -z "${EXP}" || -z "${SUB}" ]]; then
            echo "::error::Cannot resolve experiment or result_subdir."
            exit 1
          fi

          echo "exp_id=${EXP}"        >> "$GITHUB_OUTPUT"
          echo "result_subdir=${SUB}" >> "$GITHUB_OUTPUT"
          echo "Resolved: exp=${EXP}  subdir=${SUB}"

      # -----------------------------------------------------------------------
      # exp2_feynman — single worker, ablation schema required.
      # The worker commits benchmark_results.json (raw runner output).
      # run_analysis.py in ablation mode needs hypatia/pysr_only keys and
      # extrap_r2_far — produced only by merge_shards.py normalisation.
      # Run merge_shards.py inline here; no separate consolidation job needed.
      - name: Produce _merged.json for exp2_feynman (inline merge)
        if: github.event.inputs.experiment == 'exp2_feynman'
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail

          OUT_DIR="${OUT_BASE}/${SUB}"
          echo "=== Inline merge_shards for exp2_feynman ==="
          echo "  Input dir:  ${OUT_DIR}"

          # Stage shard files into a temp input-root for merge_shards.py.
          mkdir -p /tmp/exp2_feynman_input
          # Copy all non-underscore JSON files (exclude pipeline metadata).
          find "${OUT_DIR}" -maxdepth 1 -type f -name "*.json" ! -name "_*.json" \
            -exec cp {} /tmp/exp2_feynman_input/ \;

          echo "  Staged files:"
          ls -lah /tmp/exp2_feynman_input/

          python .github/scripts/merge_shards.py \
            --experiment    exp2_feynman \
            --input-root    /tmp/exp2_feynman_input \
            --output-dir    "${OUT_DIR}" \
            --result-subdir "${SUB}"

          echo "  _merged.json produced:"
          ls -lah "${OUT_DIR}/_merged.json"

      # -----------------------------------------------------------------------
      # Locate the input JSON for run_analysis.py.
      #
      # Priority order:
      #   1. Downloaded artifact _merged.json  (exp1b/exp3b with source_run_id)
      #   2. Committed _merged.json            (exp1b/exp3b manual; exp2_feynman
      #                                         after inline merge above)
      #   3. Primary committed shard file      (all other single-worker exps)
      #
      # Files starting with "_" are pipeline metadata — never used as input.
      - name: Locate input JSON
        if: github.event.inputs.experiment != 'instability'
        id: locate
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail

          ARTIFACT_JSON=$(find merged_artifact -name "_merged.json" 2>/dev/null | head -1 || true)
          COMMITTED_JSON="${OUT_BASE}/${SUB}/_merged.json"

          if [[ -f "${ARTIFACT_JSON}" ]]; then
            INPUT_JSON="${ARTIFACT_JSON}"
            echo "Using artifact _merged.json: ${INPUT_JSON}"
          elif [[ -f "${COMMITTED_JSON}" ]]; then
            INPUT_JSON="${COMMITTED_JSON}"
            echo "Using committed _merged.json: ${INPUT_JSON}"
          else
            # Single-worker experiment with no _merged.json — use shard file directly.
            # run_analysis.py accepts shapes A (merge_shards output), B (flat dict),
            # and C (list), so any committed shard file is valid input.
            SHARD_JSON=$(find "${OUT_BASE}/${SUB}" -maxdepth 1 -type f -name "*.json" \
              ! -name "_*.json" 2>/dev/null | sort | head -1 || true)
            if [[ -n "${SHARD_JSON}" && -f "${SHARD_JSON}" ]]; then
              INPUT_JSON="${SHARD_JSON}"
              echo "Using committed shard file: ${INPUT_JSON}"
            else
              echo "::error::No input JSON found for experiment '${SUB}'."
              echo "  Searched:"
              echo "    artifact:   merged_artifact/**/_merged.json"
              echo "    committed:  ${COMMITTED_JSON}"
              echo "    shard file: ${OUT_BASE}/${SUB}/*.json (excluding _*.json)"
              echo "  Ensure ci_runner.yml worker committed results to the repo."
              exit 1
            fi
          fi

          # Sanity-check: valid JSON with at least one record.
          python3 -c "
          import json, sys
          path = '${INPUT_JSON}'
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f'::error::Input JSON is not valid: {e}')
              sys.exit(1)
          if isinstance(data, dict) and isinstance(data.get('results'), dict):
              n = len(data['results'])
              label = f'{n} records (shape A)'
          elif isinstance(data, dict):
              n = sum(1 for k, v in data.items()
                      if isinstance(v, dict) and not k.startswith('_') and k != 'stats')
              label = f'{n} records (shape B)'
          elif isinstance(data, list):
              n = len(data)
              label = f'{n} records (shape C)'
          else:
              print(f'::error::Unexpected top-level type: {type(data).__name__}')
              sys.exit(1)
          if n == 0:
              print('::error::Input JSON contains 0 task records.')
              sys.exit(1)
          print(f'Input JSON OK — {label}.')
          "

          echo "input_json=${INPUT_JSON}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      - name: Run statistical analysis and write report
        if: github.event.inputs.experiment != 'instability'
        id: run_analysis
        env:
          EXP:        ${{ steps.meta.outputs.exp_id }}
          SUB:        ${{ steps.meta.outputs.result_subdir }}
          INPUT_JSON: ${{ steps.locate.outputs.input_json }}
          PYSR_FIT_WALL_TIMEOUT: ${{ env.PYSR_FIT_WALL_TIMEOUT }}
          PYSR_FIT_GRACE_SECS:   ${{ env.PYSR_FIT_GRACE_SECS }}
        run: |
          set -euo pipefail

          OUT_DIR="${OUT_BASE}/${SUB}"
          mkdir -p "${OUT_DIR}"

          echo "=== Running analysis for ${EXP} ==="
          echo "  Input:  ${INPUT_JSON}"
          echo "  Output: ${OUT_DIR}"

          python .github/scripts/run_analysis.py \
            --experiment  "${EXP}"        \
            --merged-json "${INPUT_JSON}" \
            --output-dir  "${OUT_DIR}"

      # -----------------------------------------------------------------------
      - name: Verify report outputs
        if: github.event.inputs.experiment != 'instability'
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail
          OUT_DIR="${OUT_BASE}/${SUB}"

          echo "=== Output directory ==="
          ls -lah "${OUT_DIR}"

          test -f "${OUT_DIR}/_report.md"     || { echo "::error::_report.md missing";    exit 1; }
          test -f "${OUT_DIR}/_analysis.json" || { echo "::error::_analysis.json missing"; exit 1; }

          python3 -c "
          import json, sys
          path = '${OUT_DIR}/_analysis.json'
          try:
              d = json.load(open(path))
          except Exception as e:
              print(f'::error::_analysis.json is not valid JSON: {e}')
              sys.exit(1)
          required = ('experiment', 'experiment_mode', 'n_total', 'fatal_conditions')
          missing  = [k for k in required if k not in d]
          if missing:
              print(f'::error::_analysis.json missing required keys: {missing}')
              sys.exit(1)
          hard = [c for c in d['fatal_conditions']
                  if not (c.startswith('INFO_') or c.startswith('WARN_'))]
          print(f'_analysis.json OK: experiment={d[\"experiment\"]}, '
                f'mode={d[\"experiment_mode\"]}, n_total={d[\"n_total\"]}, '
                f'fatal_conditions={len(d[\"fatal_conditions\"])} '
                f'({len(hard)} hard, {len(d[\"fatal_conditions\"])-len(hard)} soft)')
          "
          echo "All expected analysis outputs present and valid."

      # -----------------------------------------------------------------------
      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ steps.short_circuit.outputs.exp_id || steps.meta.outputs.exp_id }}-${{ github.run_id }}
          path: |
            ${{ env.OUT_BASE }}/${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}/_report.md
            ${{ env.OUT_BASE }}/${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}/_analysis.json
          if-no-files-found: warn
          retention-days: 30

      # -----------------------------------------------------------------------
      # COMMIT RESILIENCE — save → hard-reset → restore → commit.
      #
      # Replaces git pull --rebase --autostash which aborts when ghost
      # _analysis.json / _report.md files exist as untracked (left by a prior
      # run that wrote outputs but failed before committing).
      #
      # The hard reset is safe: all experiment result files are already
      # committed to master by ci_runner.yml before this workflow runs.
      - name: Commit and push analysis outputs to master
        env:
          EXP: ${{ steps.short_circuit.outputs.exp_id || steps.meta.outputs.exp_id }}
          SUB: ${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Step 1 — save freshly generated outputs before touching the git tree.
          cp "${OUT_BASE}/${SUB}/_analysis.json" /tmp/_analysis.json
          cp "${OUT_BASE}/${SUB}/_report.md"     /tmp/_report.md

          # Step 2 — hard-reset to origin/master, eliminating all untracked
          # files and unstaged changes unconditionally.
          git fetch origin "${{ github.ref_name }}"
          git reset --hard origin/"${{ github.ref_name }}"

          # Step 3 — restore outputs into the clean tree and commit.
          mkdir -p "${OUT_BASE}/${SUB}"
          cp /tmp/_analysis.json "${OUT_BASE}/${SUB}/_analysis.json"
          cp /tmp/_report.md     "${OUT_BASE}/${SUB}/_report.md"

          git add \
            "${OUT_BASE}/${SUB}/_report.md"     \
            "${OUT_BASE}/${SUB}/_analysis.json"

          if git diff --cached --quiet; then
            echo "No changes to analysis outputs — results unchanged from previous run."
          else
            git commit -m "ci: ${EXP} analysis report - run ${{ github.run_id }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed analysis outputs to master."
          fi

      # -----------------------------------------------------------------------
      # Abort on hard fatal conditions only.
      # INFO_ and WARN_ conditions are logged but do not fail the workflow.
      - name: Abort on fatal conditions
        env:
          SUB: ${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          sub      = os.environ["SUB"]
          out_base = os.environ.get("OUT_BASE", "hypatiax/data/results")
          path     = f"{out_base}/{sub}/_analysis.json"

          if not os.path.exists(path):
              print("No _analysis.json found; skipping fatal-condition check.")
              sys.exit(0)

          with open(path) as f:
              analysis = json.load(f)

          all_conds = analysis.get("fatal_conditions", [])
          hard = [c for c in all_conds if not (c.startswith("INFO_") or c.startswith("WARN_"))]
          soft = [c for c in all_conds if c.startswith("INFO_") or c.startswith("WARN_")]

          if soft:
              print(f"Informational/warning conditions ({len(soft)}):")
              for i, c in enumerate(soft, 1):
                  print(f"  {i}. {c}")

          if not hard:
              print("No fatal conditions detected. Analysis complete.")
              sys.exit(0)

          print(f"::error::Fatal conditions detected ({len(hard)}):")
          for i, cond in enumerate(hard, 1):
              print(f"  {i}. {cond}")
          print()
          print("Review _report.md for full diagnostic details.")
          print("To re-run analysis after fixes: use workflow_dispatch with the same experiment.")
          sys.exit(1)
          PYEOF
