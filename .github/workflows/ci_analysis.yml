# ci_analysis.yml (Full Rewrite)

```yaml
name: "HypatiaX - analysis"

run-name: >-
  HypatiaX analysis ::
  ${{ github.event.inputs.experiment }}

on:
  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment identifier"
        required: true
        type: string

      result_subdir:
        description: "Optional explicit result subdirectory"
        required: false
        default: ""
        type: string

      source_run_id:
        description: "Optional workflow run id"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-analysis-${{ github.event.inputs.experiment }}
  cancel-in-progress: false

jobs:

  analyze:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      EXPERIMENT: ${{ github.event.inputs.experiment }}
      INPUT_RESULT_SUBDIR: ${{ github.event.inputs.result_subdir }}
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # Python
      # ----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

          pip install scipy pandas numpy tabulate

      # ----------------------------------------------------------------------
      # Resolve result directory
      # ----------------------------------------------------------------------

      - name: Resolve result directory
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          EXPERIMENT="${EXPERIMENT}"
          INPUT_RESULT_SUBDIR="${INPUT_RESULT_SUBDIR}"

          if [[ -n "${INPUT_RESULT_SUBDIR}" ]]; then
            RESULT_SUBDIR="${INPUT_RESULT_SUBDIR}"
          else
            RESULT_SUBDIR="${EXPERIMENT}"
          fi

          RESULT_DIR="hypatiax/data/results/${RESULT_SUBDIR}"

          echo "RESULT_SUBDIR=${RESULT_SUBDIR}" >> "$GITHUB_ENV"
          echo "RESULT_DIR=${RESULT_DIR}" >> "$GITHUB_ENV"

          echo "Resolved RESULT_DIR=${RESULT_DIR}"

      # ----------------------------------------------------------------------
      # Optional artifact download
      # ----------------------------------------------------------------------

      - name: Download merged artifact (exp1b / exp3b only)
        if: |
          github.event.inputs.source_run_id != '' &&
          (
            contains(github.event.inputs.experiment, 'exp1b') ||
            contains(github.event.inputs.experiment, 'exp3b')
          )
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.source_run_id }}
          path: consolidated_artifact

      # ----------------------------------------------------------------------
      # Locate analysis input
      # ----------------------------------------------------------------------

      - name: Locate analysis input
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          RESULT_DIR="${RESULT_DIR}"
          EXPERIMENT="${EXPERIMENT}"

          echo "=== RESULT DIRECTORY ==="
          echo "$RESULT_DIR"

          echo
          echo "=== TREE ==="

          if [[ -d "$RESULT_DIR" ]]; then
            find "$RESULT_DIR" -maxdepth 2 -type f | sort
          else
            echo "Directory does not exist"
          fi

          echo
          echo "=== DETERMINE INPUT MODE ==="

          REQUIRE_MERGE=false

          if [[ "$EXPERIMENT" == *"exp1b"* ]] || [[ "$EXPERIMENT" == *"exp3b"* ]]; then
            REQUIRE_MERGE=true
          fi

          echo "REQUIRE_MERGE=$REQUIRE_MERGE"

          # ------------------------------------------------------------------
          # MERGED MODE
          # ------------------------------------------------------------------

          if [[ "$REQUIRE_MERGE" == "true" ]]; then

            echo
            echo "Merged mode activated"

            CANDIDATES=()

            while IFS= read -r path; do
              CANDIDATES+=("$path")
            done < <(
              find consolidated_artifact "$RESULT_DIR" \
                -type f \
                -name '_merged.json' \
                2>/dev/null \
                | sort
            )

            if [[ ${#CANDIDATES[@]} -eq 0 ]]; then

              echo
              echo "ERROR: merged experiment requires _merged.json"
              echo
              echo "Searched:"
              echo "  consolidated_artifact/**/_merged.json"
              echo "  ${RESULT_DIR}/_merged.json"
              echo
              echo "Run ci_consolidate_experiment.yml first."

              exit 1
            fi

            INPUT_JSON="${CANDIDATES[0]}"

            echo "INPUT_MODE=merged" >> "$GITHUB_ENV"
            echo "INPUT_JSON=$INPUT_JSON" >> "$GITHUB_ENV"

            echo
            echo "Selected merged input:"
            echo "$INPUT_JSON"

          # ------------------------------------------------------------------
          # SHARD MODE
          # ------------------------------------------------------------------

          else

            echo
            echo "Shard mode activated"

            mapfile -t SHARD_FILES < <(
              find "$RESULT_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.json' \
                ! -name '_*.json' \
                ! -name 'benchmark_results.json' \
                | sort
            )

            if [[ ${#SHARD_FILES[@]} -eq 0 ]]; then

              echo
              echo "ERROR: No shard JSON files found"
              echo
              echo "Expected files like:"
              echo "  worker_0.json"
              echo "  shard_1.json"
              echo "  results_part_a.json"
              echo
              echo "Searched:"
              echo "  ${RESULT_DIR}/*.json"
              echo "  excluding _*.json"

              exit 1
            fi

            printf '%s\n' "${SHARD_FILES[@]}" > shard_manifest.txt

            echo "INPUT_MODE=shards" >> "$GITHUB_ENV"
            echo "SHARD_MANIFEST=shard_manifest.txt" >> "$GITHUB_ENV"

            echo
            echo "Selected shard files:"
            cat shard_manifest.txt

          fi

      # ----------------------------------------------------------------------
      # Validate input data
      # ----------------------------------------------------------------------

      - name: Validate input data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os
          import pathlib
          import sys

          mode = os.environ['INPUT_MODE']

          def load_records(path):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  if 'results' in data:
                      results = data['results']
                      if isinstance(results, list):
                          return results

              return []

          total = 0

          if mode == 'merged':
              path = os.environ['INPUT_JSON']
              records = load_records(path)

              print(f"Merged file: {path}")
              print(f"Records: {len(records)}")

              total += len(records)

          else:
              manifest = pathlib.Path(os.environ['SHARD_MANIFEST'])

              for line in manifest.read_text().splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  records = load_records(line)

                  print(f"Shard: {line}")
                  print(f"Records: {len(records)}")

                  total += len(records)

          print(f"TOTAL_RECORDS={total}")

          if total == 0:
              print()
              print('FATAL: EMPTY DATASET')
              sys.exit(1)
          PYEOF

      # ----------------------------------------------------------------------
      # Run analysis
      # ----------------------------------------------------------------------

      - name: Run statistical analysis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RESULT_DIR"

          python3 hypatiax/tools/run_analysis.py \
            --experiment "$EXPERIMENT" \
            --result-dir "$RESULT_DIR" \
            $(
              if [[ "$INPUT_MODE" == "merged" ]]; then
                echo "--input-json '$INPUT_JSON'"
              else
                echo "--shard-manifest '$SHARD_MANIFEST'"
              fi
            )

      # ----------------------------------------------------------------------
      # Verify outputs
      # ----------------------------------------------------------------------

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          REPORT_MD="$RESULT_DIR/_report.md"
          ANALYSIS_JSON="$RESULT_DIR/_analysis.json"

          [[ -f "$REPORT_MD" ]] || {
            echo "Missing report markdown"
            exit 1
          }

          [[ -f "$ANALYSIS_JSON" ]] || {
            echo "Missing analysis json"
            exit 1
          }

          echo
          echo "=== OUTPUTS ==="
          ls -lh "$REPORT_MD" "$ANALYSIS_JSON"

      # ----------------------------------------------------------------------
      # Commit outputs
      # ----------------------------------------------------------------------

      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            "$RESULT_DIR/_report.md" \
            "$RESULT_DIR/_analysis.json"

          if git diff --cached --quiet; then
            echo "No analysis changes to commit"
            exit 0
          fi

          git commit -m "analysis: ${EXPERIMENT}"

          git push

      # ----------------------------------------------------------------------
      # Upload outputs
      # ----------------------------------------------------------------------

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.event.inputs.experiment }}
          path: |
            ${{ env.RESULT_DIR }}/_report.md
            ${{ env.RESULT_DIR }}/_analysis.json
          if-no-files-found: error
```

# Key Architectural Changes

## 1. Correct Merge Logic

Only these experiments require `_merged.json`:

- exp1b
- exp3b

Everything else uses shard JSON files directly.

---

## 2. Removed Contradiction

The original file simultaneously claimed:

- "_merged.json ONLY"
- "fallback to shard files"

This rewrite cleanly separates the two modes.

---

## 3. Hard Failure Diagnostics

Every failure now prints:

- searched paths
- selected files
- record counts
- execution mode

instead of ambiguous generic failures.

---

## 4. Empty Dataset Detection

Validation now explicitly counts records before analysis starts.

---

## 5. Safe Git Handling

Uses:

```bash
 git add -f
```

for generated outputs.

---

## 6. No Hidden State

All runtime variables are exported explicitly:

- RESULT_DIR
- INPUT_MODE
- INPUT_JSON
- SHARD_MANIFEST

No implicit assumptions remain.

