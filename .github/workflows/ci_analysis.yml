# ==============================================================================
#  ci_analysis.yml - HypatiaX post-consolidation statistical analysis
#
#  Architecture contract (read before editing):
#    This workflow runs AFTER ci_runner.yml has completed and
#    committed result files to the repository.  It is the ONLY stage that may
#    perform statistical analysis.  Workers MUST NOT run statistical tests;
#    see ci_runner.yml for the architectural rationale.
#
#  NOTE: ci_runner.yml has NO consolidate job — each worker shard
#    commits its own result files directly to the repo.  _merged.json is NOT
#    automatically produced for most experiments; run ci_consolidate_experiment.yml
#    manually if a merged view is needed for exp1b / exp3b.
#
#  Input modes (set by "Locate analysis input" → $INPUT_MODE env var):
#
#    MERGED  (exp1b, exp3b only):
#      Reads _merged.json produced by ci_consolidate_experiment.yml.
#      Hard-fails if _merged.json is absent.
#      run_analysis.py flag: --input-json <path>
#
#    DIRECT  (NSHARDS=1 / single-file experiments — exp1 and any other
#             experiment whose worker commits exactly one result JSON):
#      Reads the single committed result file directly.
#      No shard_manifest.txt is written; no merge step needed.
#      Covers two sub-cases:
#        • benchmark-format (tests[] array) — in-memory merge to
#          _merged_benchmark.json, then --input-json.
#        • flat/list JSON — --input-json on the single file directly.
#      run_analysis.py flag: --input-json <path>
#
#    SHARDS  (multi-shard, non-benchmark-format experiments):
#      Reads multiple committed shard *.json files listed in shard_manifest.txt.
#      Hard-fails if no shard files are found.
#      run_analysis.py flag: --shard-manifest shard_manifest.txt
#
#  Responsibilities:
#    - Mann-Whitney U tests (per-method, cross-method)
#    - R² distribution analysis and per-method success rates
#    - Method summary tables (coverage, median R², rank)
#    - Coverage gap detection
#    - Instability / domain-consistency metrics (exp: instability, hybrid_all_domains)
#    - Extrapolation checks (exp: extrap)
#    - Publication-quality table generation
#    - Markdown report (_report.md) and structured output (_analysis.json)
#    - Fatal-condition abort (exits non-zero; PR merge blocked by branch protection)
#
#  Outputs committed to master:
#    hypatiax/data/results/{result_subdir}/_report.md
#    hypatiax/data/results/{result_subdir}/_analysis.json
#
#  Triggering modes:
#    1. Scheduled chain (workflow_dispatch from ci_pipeline.yml): called
#       automatically after ci_runner.yml completes.  Passes
#       experiment and source_run_id; result_subdir is derived from the
#       checkpoint.
#    2. Manual (workflow_dispatch): re-runs analysis on already-committed
#       result files.  Requires experiment; result_subdir is optional (derived
#       from experiment name if omitted); source_run_id optional.
#
#  WHY ci_analysis.yml IS A STANDALONE WORKFLOW (not workflow_run):
#    GitHub does NOT fire the workflow_run event when the triggering workflow
#    was itself started by another workflow via gh workflow run / workflow_dispatch
#    (chained dispatch).  Because ci_pipeline.yml dispatches
#    ci_runner.yml programmatically, a workflow_run trigger on
#    ci_runner.yml would never fire in the normal scheduled
#    pipeline.  ci_pipeline.yml therefore dispatches ci_analysis.yml
#    explicitly from its run-finalize job after ci_runner.yml
#    completes.  The standalone design also allows manual reruns without
#    re-running the expensive experiment workers.
#
#  PURGE RESILIENCE:
#    purge_old_runs in ci_runner.yml and ci_pipeline.yml can
#    delete a completed ci_runner.yml run (and its shard artifact)
#    before a queued ci_analysis.yml job has had a chance to start and download
#    it.  To handle this, the "Download merged artifact" step uses
#    continue-on-error: true.  The "Locate analysis input" step falls back to
#    the committed copy in the repository, which is always present because
#    ci_runner.yml worker shards commit their result files to
#    master directly before ci_analysis.yml is ever dispatched.
#    In manual mode, omit source_run_id entirely to use the committed files
#    directly (the download step is skipped when source_run_id is blank).
# ==============================================================================

name: "HypatiaX - analysis"

run-name: >-
  HypatiaX analysis ::
  ${{ github.event.inputs.experiment }}

# -- Triggers ------------------------------------------------------------------
on:

  # Dispatched explicitly by ci_pipeline.yml after ci_runner.yml
  # completes, or run manually to re-analyse committed result files.
  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment identifier"
        required: true
        type: string

      result_subdir:
        description: "Optional explicit result subdirectory"
        required: false
        default: ""
        type: string

      source_run_id:
        description: "Optional workflow run id"
        required: false
        default: ""
        type: string

# -- Permissions ---------------------------------------------------------------
permissions:
  contents: write   # commit report + analysis outputs
  actions:  read    # download artifacts from triggering workflow run

# -- Concurrency ---------------------------------------------------------------
concurrency:
  group: ci-analysis-${{ github.event.inputs.experiment }}
  cancel-in-progress: false

# ==============================================================================
#  JOB: analyze
# ==============================================================================
jobs:

  analyze:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      EXPERIMENT:        ${{ github.event.inputs.experiment }}
      INPUT_RESULT_SUBDIR: ${{ github.event.inputs.result_subdir }}
      SOURCE_RUN_ID:     ${{ github.event.inputs.source_run_id }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" "tabulate>=0.9"

      # -----------------------------------------------------------------------
      # Resolve result directory
      # -----------------------------------------------------------------------

      - name: Resolve result directory
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # FIX: replaced nested heredoc (caused PYEOF indentation error when bash
          # stripped only the minimum common YAML indent, leaving PYEOF with residual
          # leading spaces that bash never recognised as the closing delimiter).
          # python3 -c avoids all heredoc/YAML indentation interactions entirely.
          RESULT_SUBDIR=$(python3 -c "
          import os, sys
          inp = os.environ.get('INPUT_RESULT_SUBDIR', '').strip()
          if inp:
              print(inp)
              sys.exit(0)
          MAPPING = {
              'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
              'exp1b':              'comparison_results/noise-noiseless/15',
              'exp2_feynman':       'comparison_results/feynman-tests/exp2',
              'exp2_feynman_extrap': 'comparison_results/feynman-tests/exp2_extrap',
              'exp2':               'comparison_results/feynman-tests/exp2_multi',
              'exp3':               'extrapolation',
              'exp3b':              'extrapolation/multi_seed',
              'suppA':              'hybrid_pysr/defi',
              'suppB':              'comparison_results/feynman-tests/noise-sweep/noise-sweep',
              'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
              'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
              'instability':        'figures',
              'extrap':             'comparison_results/extrapolation',
          }
          exp = os.environ['EXPERIMENT']
          result = MAPPING.get(exp, exp)
          if result == exp:
              print(f'::warning::No canonical subdir mapping for \"{exp}\" — using experiment name as subdir.', file=sys.stderr)
          print(result)
          ")

          RESULT_DIR="hypatiax/data/results/${RESULT_SUBDIR}"

          echo "RESULT_SUBDIR=${RESULT_SUBDIR}" >> "$GITHUB_ENV"
          echo "RESULT_DIR=${RESULT_DIR}"       >> "$GITHUB_ENV"

          echo "Resolved: experiment=${EXPERIMENT}  subdir=${RESULT_SUBDIR}"
          echo "          RESULT_DIR=${RESULT_DIR}"
          echo "          source=pipeline-forwarded (${INPUT_RESULT_SUBDIR:+yes}${INPUT_RESULT_SUBDIR:-no, used fallback MAPPING})"

      # -----------------------------------------------------------------------
      # Optional artifact download
      # -----------------------------------------------------------------------

      # Download consolidated artifact from a ci_consolidate_experiment.yml run.
      # source_run_id is provided by ci_pipeline.yml; omit when
      # re-running analysis manually against already-committed files.
      #
      # MERGE-REQUIRED GATE: only exp1b and exp3b are multi-shard experiments
      # whose workers feed merge_shards.py to produce a _merged.json via a
      # consolidate job.  All other experiments commit individual shard files
      # directly to the repo — there is no consolidated artifact to download
      # for them.
      #
      # NSHARDS=1 — exp1 is always single-shard (NSHARDS=NWORKERS=1).
      # It never produces a _merged.json and never needs the consolidate job.
      # The single worker commits its result JSON directly to the repo under
      # hypatiax/data/results/comparison_results/noise-noiseless/noiseless/defi/.
      # The "Locate analysis input" step detects benchmark-format and merges
      # the tests[] array in-memory into _merged_benchmark.json, then routes
      # to run_analysis.py --input-json. No download, no merge_shards.py call.
      # Do NOT add exp1 to the REQUIRE_MERGE gate below.
      #
      # PURGE RESILIENCE: continue-on-error: true prevents hard-failing when
      # the referenced run has been deleted by purge_old_runs.  The
      # "Locate analysis input" step falls back to the committed copy.
      - name: Download merged artifact (exp1b / exp3b only)
        if: |
          github.event.inputs.source_run_id != '' &&
          (
            github.event.inputs.experiment == 'exp1b' ||
            github.event.inputs.experiment == 'exp3b'
          )
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id:         ${{ github.event.inputs.source_run_id }}
          github-token:   ${{ secrets.GITHUB_TOKEN }}
          path:           consolidated_artifact
          pattern:        "consolidated-${{ github.event.inputs.experiment }}-*"
          merge-multiple: true

      # -----------------------------------------------------------------------
      # Locate analysis input
      # -----------------------------------------------------------------------

      - name: Locate analysis input
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          RESULT_DIR="${RESULT_DIR}"
          EXPERIMENT="${EXPERIMENT}"

          echo "=== RESULT DIRECTORY ==="
          echo "$RESULT_DIR"

          echo
          echo "=== TREE ==="

          if [[ -d "$RESULT_DIR" ]]; then
            find "$RESULT_DIR" -maxdepth 2 -type f | sort
          else
            echo "Directory does not exist"
          fi

          echo
          echo "=== DETERMINE INPUT MODE ==="

          # ================================
          
          # Multi-shard merge criterion
          #
          # REQUIRE_MERGE=true ONLY for:
          #
          #   exp1b  — DeFi seed sweep (4 workers)
          #   exp3b  — Nguyen-12 multi-seed (4 workers)
          #
          # These experiments produce shard JSON outputs that must
          # be merged before analysis.
          #
          # All other experiments run with NSHARDS=1 and commit
          # result JSONs directly without shard merging.
          #
          # Exact equality is required to avoid substring
          # false positives:
          #
          #   exp1  != exp1b
          #
          # ----------------------------------------------------------

          REQUIRE_MERGE=false

          if [[ "$EXPERIMENT" == "exp1b" ]] || [[ "$EXPERIMENT" == "exp3b" ]]; then
              REQUIRE_MERGE=true
          fi

          echo "REQUIRE_MERGE=$REQUIRE_MERGE"


          # ------------------------------------------------------------------
          # MERGED MODE (exp1b / exp3b)
          # ------------------------------------------------------------------

          if [[ "$REQUIRE_MERGE" == "true" ]]; then

            echo
            echo "Merged mode activated"

            CANDIDATES=()

            while IFS= read -r path; do
              CANDIDATES+=("$path")
            done < <(
              find consolidated_artifact "$RESULT_DIR" \
                -type f \
                -name '_merged.json' \
                2>/dev/null \
                | sort
            )

            if [[ ${#CANDIDATES[@]} -gt 0 ]]; then

              # ── Fast path: pre-built _merged.json exists ─────────────────────
              INPUT_JSON="${CANDIDATES[0]}"
              echo "INPUT_MODE=merged" >> "$GITHUB_ENV"
              echo "INPUT_JSON=$INPUT_JSON" >> "$GITHUB_ENV"
              echo "SHARD_MANIFEST="        >> "$GITHUB_ENV"
              echo
              echo "Selected merged input: $INPUT_JSON"

            else

              # ── Fallback: collect committed shard files and merge in-memory ──
              # Workers may commit files named *_shard*_run*.json (re-run pattern).
              # The normal shard-mode find excludes these, but for exp1b/exp3b we
              # accept ALL *.json files that are not underscore-prefixed meta files.
              echo
              echo "No _merged.json found — falling back to in-memory merge of committed shards."

              mapfile -t EXP1B_SHARDS < <(
                find "$RESULT_DIR" \
                  -maxdepth 2 \
                  -type f \
                  -name '*.json' \
                  ! -name '_*.json' \
                  | sort
              )

              if [[ ${#EXP1B_SHARDS[@]} -eq 0 ]]; then
                echo "::error::No shard JSON files found in ${RESULT_DIR} and no _merged.json."
                echo "         Ensure workers have committed result files or run ci_consolidate_experiment.yml."
                exit 1
              fi

              echo "  Found ${#EXP1B_SHARDS[@]} shard file(s) — merging via merge_shards.py..."

              # merge_shards.py knows exp1b's shard globs, handles all JSON shapes,
              # and writes _merged.json directly to RESULT_DIR.
              python3 .github/scripts/merge_shards.py \
                --experiment    "$EXPERIMENT" \
                --input-root    "$RESULT_DIR" \
                --output-dir    "$RESULT_DIR" \
                --result-subdir "$RESULT_SUBDIR"

              echo "INPUT_MODE=merged"              >> "$GITHUB_ENV"
              echo "INPUT_JSON=$RESULT_DIR/_merged.json" >> "$GITHUB_ENV"
              echo "SHARD_MANIFEST="                >> "$GITHUB_ENV"
              echo
              echo "Merge complete → $RESULT_DIR/_merged.json"

            fi

          # ------------------------------------------------------------------
          # SHARD MODE (all other experiments)
          # ------------------------------------------------------------------

          else

            echo
            echo "Shard mode activated"

            # maxdepth 2: some experiments (e.g. suppB / noise-sweep) store
            # their shard JSONs one level deeper than RESULT_DIR, in a same-named
            # subdirectory (noise-sweep/noise-sweep/*.json).  Depth 2 catches both
            # flat layouts (depth 1) and that one nested layout without over-reaching.
            # Tables subdirs contain only .tex files, so no false positives.
            mapfile -t SHARD_FILES < <(
              find "$RESULT_DIR" \
                -maxdepth 2 \
                -type f \
                -name '*.json' \
                ! -name '_*.json' \
                ! -name 'benchmark_results.json' \
                | sort
            )

            if [[ ${#SHARD_FILES[@]} -eq 0 ]]; then

              echo
              echo "ERROR: No shard JSON files found"
              echo
              echo "Expected files like:"
              echo "  worker_0.json"
              echo "  shard_1.json"
              echo "  results_part_a.json"
              echo
              echo "Searched:"
              echo "  ${RESULT_DIR}/**/*.json (maxdepth 2)"
              echo "  excluding _*.json, benchmark_results.json, and *_shard*_run*.json"

              exit 1
            fi

            # ----------------------------------------------------------------
            # INPUT MODE SELECTION
            #
            # Three cases, evaluated in order:
            #
            #  DIRECT (NSHARDS=1 / single-file):
            #    The worker committed exactly one JSON — no manifest needed.
            #    Pass the file directly as --input-json.  This is the correct
            #    path for exp1 and any other experiment dispatched with
            #    n_shards=1.  Avoids the quoting bug that existed in the old
            #    "$(...) echo '--shard-manifest ...'" expansion, which caused
            #    literal single-quote characters to reach Python's argparse.
            #
            #  MERGED-FOR-BENCHMARK (N>1 benchmark-format shards):
            #    Each shard has a tests[] array.  Concatenate in-memory into
            #    _merged_benchmark.json and pass as --input-json.
            #
            #  SHARDS (N>1 flat/list-format shards):
            #    Write shard_manifest.txt; pass as --shard-manifest.
            # ----------------------------------------------------------------

            N_SHARDS=${#SHARD_FILES[@]}

            # ── DIRECT: single committed result file ─────────────────────────
            if [[ $N_SHARDS -eq 1 ]]; then
              SINGLE_FILE="${SHARD_FILES[0]}"
              echo "  DIRECT mode: single result file — using --input-json directly."
              echo "  File: ${SINGLE_FILE}"
              echo "INPUT_MODE=direct"             >> "$GITHUB_ENV"
              echo "INPUT_JSON=${SINGLE_FILE}"     >> "$GITHUB_ENV"
              # Always define SHARD_MANIFEST so validate_analysis_input.py
              # can read os.environ["SHARD_MANIFEST"] without KeyError.
              echo "SHARD_MANIFEST="               >> "$GITHUB_ENV"

            else
              # ── Probe first shard to detect benchmark vs flat format ──────
              USE_MERGED_FOR_BENCHMARK=$(SHARD0="${SHARD_FILES[0]}" python3 -c '
          import json, sys, os
          path = os.environ["SHARD0"]
          if not path or not os.path.exists(path):
              print("false"); sys.exit(0)
          try:
              data = json.load(open(path))
          except Exception:
              print("false"); sys.exit(0)
          if isinstance(data, list):
              print("false"); sys.exit(0)
          if isinstance(data, dict) and isinstance(data.get("results"), list):
              print("false"); sys.exit(0)
          if isinstance(data, dict) and isinstance(data.get("tests"), list):
              print("true"); sys.exit(0)
          if isinstance(data, dict):
              non_meta = {k: v for k, v in data.items()
                          if not k.startswith("_") and k not in ("stats","summary","metadata")}
              if non_meta and isinstance(next(iter(non_meta.values())), dict):
                  print("true"); sys.exit(0)
          print("false")
          ')

              # ── MERGED-FOR-BENCHMARK: N>1 benchmark-format shards ─────────
              # Only exp1b and exp3b use the merge path (REQUIRE_MERGE=true routes
              # to the block above).  All other experiments — exp1, exp2, exp3,
              # exp4, suppB, noise-sweep, etc. — pass their shards directly to
              # run_analysis.py without merging.  Forcing SHARDS here prevents
              # field-name mismatches (e.g. exp2/Feynman records don't have
              # far-R² which the merged benchmark path expects).
              if [[ "$USE_MERGED_FOR_BENCHMARK" == "true" && "$REQUIRE_MERGE" == "true" ]]; then

                echo "  Benchmark-format shards detected (${N_SHARDS} file(s))."
                echo "  Merging tests arrays → _merged_benchmark.json ..."

                # Write the list of shard paths to a temp file so Python can
                # read them without hitting shell argument-length limits.
                printf '%s\n' "${SHARD_FILES[@]}" > _shard_paths_for_merge.txt

                python3 -c "
          import json, sys
          paths = open('_shard_paths_for_merge.txt').read().splitlines()

          # FIX-MERGE-KEY: experiments write records under different top-level keys
          # (tests, results, records, data, experiments) or as a dict-of-dicts keyed
          # by equation/task ID.  The original code only checked 'tests', producing
          # Records: 0 for any other layout.  find_records() probes all known layouts.
          def find_records(d):
              for key in ('tests', 'results', 'records', 'data', 'experiments'):
                  if isinstance(d.get(key), list) and d[key]:
                      return key, d[key]
              # dict-of-dicts: equation_id → result_dict (e.g. {'amm': {...}, ...})
              non_meta = {k: v for k, v in d.items()
                          if not k.startswith('_') and k not in
                          ('stats', 'summary', 'metadata', 'protocol', 'methods',
                           'config', 'parameters', 'total_tests')}
              if non_meta and all(isinstance(v, dict) for v in non_meta.values()):
                  return '_dict_values', list(non_meta.values())
              # fallback: any list value that is non-empty
              for key, val in d.items():
                  if isinstance(val, list) and val and key not in ('fatal_conditions',):
                      return key, val
              return None, []

          merged = None
          records_key_used = None
          total_tests = 0
          for p in paths:
              try:
                  d = json.load(open(p))
              except Exception as e:
                  print(f'::warning::Skipping unreadable shard {p}: {e}', file=sys.stderr)
                  continue
              if not isinstance(d, dict):
                  print(f'::warning::Skipping non-dict shard {p}', file=sys.stderr)
                  continue
              key, records = find_records(d)
              if key is None:
                  print(f'::warning::Skipping shard {p}: no recognisable records list found. Keys: {list(d.keys())[:8]}', file=sys.stderr)
                  continue
              if merged is None:
                  # Copy all metadata keys except the records list itself
                  skip = {k for k in d if k in ('tests','results','records','data','experiments') or k == key}
                  merged = {k: v for k, v in d.items() if k not in skip}
                  merged['tests'] = []
                  records_key_used = key
              merged['tests'].extend(records)
              total_tests += len(records)
          if merged is None:
              print('::error::No readable benchmark-format shards found after merge pass.')
              sys.exit(1)
          merged['total_tests'] = total_tests
          print(f'  Records key used: {records_key_used}')
          json.dump(merged, open('_merged_benchmark.json', 'w'), indent=2)
          print(f'  Merged {len(paths)} shard(s) → {total_tests} total tests.')
          "

                echo "INPUT_MODE=merged"                    >> "$GITHUB_ENV"
                echo "INPUT_JSON=_merged_benchmark.json"    >> "$GITHUB_ENV"
                echo "SHARD_MANIFEST="                      >> "$GITHUB_ENV"

              # ── SHARDS: N>1 flat/list-format shards ───────────────────────
              else
                printf '%s\n' "${SHARD_FILES[@]}" > shard_manifest.txt

                echo "INPUT_MODE=shards"                    >> "$GITHUB_ENV"
                echo "SHARD_MANIFEST=shard_manifest.txt"    >> "$GITHUB_ENV"

                echo
                echo "Selected shard files (${N_SHARDS} file(s)):"
                cat shard_manifest.txt
              fi
            fi

          fi

      # -----------------------------------------------------------------------
      # Validate input data
      # -----------------------------------------------------------------------

      - name: Validate input data
        shell: bash
        run: |
          set -euo pipefail

          # ── Pre-flight: validate env vars before handing off to Python ────────
          # INPUT_MODE is always set by "Locate analysis input"; an empty value
          # means that step was skipped or failed silently.
          if [[ -z "${INPUT_MODE:-}" ]]; then
            echo "::error::INPUT_MODE is not set — 'Locate analysis input' step may have failed."
            exit 1
          fi

          case "$INPUT_MODE" in
            merged|direct)
              if [[ -z "${INPUT_JSON:-}" ]]; then
                echo "::error::INPUT_MODE=${INPUT_MODE} but INPUT_JSON is not set or empty."
                exit 1
              fi
              if [[ ! -f "$INPUT_JSON" ]]; then
                echo "::error::INPUT_JSON='${INPUT_JSON}' does not exist or is not a file."
                exit 1
              fi
              ;;
            shards)
              if [[ -z "${SHARD_MANIFEST:-}" ]]; then
                echo "::error::INPUT_MODE=shards but SHARD_MANIFEST is not set or empty."
                exit 1
              fi
              # Path("") → Path(".") is the exact crash we saw; catch it here
              # before Python touches it.
              if [[ ! -f "$SHARD_MANIFEST" ]]; then
                echo "::error::SHARD_MANIFEST='${SHARD_MANIFEST}' is not a file (got a directory or missing path)."
                echo "         Resolved: $(realpath "${SHARD_MANIFEST}" 2>/dev/null || echo 'could not resolve')"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown INPUT_MODE='${INPUT_MODE}'. Expected: merged | direct | shards"
              exit 1
              ;;
          esac

          echo "Pre-flight OK: INPUT_MODE=${INPUT_MODE}"

          # ── Delegate record-counting to Python ────────────────────────────────
          # Logic lives in .github/scripts/validate_analysis_input.py —
          # reads INPUT_MODE / INPUT_JSON / SHARD_MANIFEST from the environment.
          # Valid INPUT_MODE values: merged | direct | shards
          python3 .github/scripts/validate_analysis_input.py

      # -----------------------------------------------------------------------
      # Merge extrap into benchmark (exp2_feynman_extrap only)
      # -----------------------------------------------------------------------
      # merge_extrap_into_benchmark.py joins benchmark_results.json (train r2)
      # with benchmark_results_extrap.json (extrap_r2_far / extrap_r2_near) into
      # ablation_paired.json -- the schema that analyse_ablation() in run_analysis.py
      # requires.  After the merge, INPUT_JSON and INPUT_MODE are overridden so the
      # analysis step reads the paired file rather than the raw benchmark JSON.
      #
      # Primary source  : benchmark_results_extrap.json  (v2.2+ runner --extrap flag)
      # Legacy fallback : extrap_results_*.json           (passed via --extrap-dir)
      # Both live in RESULT_DIR; the script picks extrap_benchmark_dir first per-eq.
      # -----------------------------------------------------------------------

      - name: Merge extrap into benchmark (exp2_feynman_extrap)
        if: github.event.inputs.experiment == 'exp2_feynman_extrap'
        shell: bash
        run: |
          set -euo pipefail

          PAIRED="${RESULT_DIR}/ablation_paired.json"

          python3 scripts/merge_extrap_into_benchmark.py \
            --benchmark-dir        "${RESULT_DIR}" \
            --extrap-benchmark-dir "${RESULT_DIR}" \
            --extrap-dir           "${RESULT_DIR}" \
            --output               "${PAIRED}"

          if [[ ! -f "${PAIRED}" ]]; then
            echo "::error::merge_extrap_into_benchmark.py did not produce ${PAIRED}"
            exit 1
          fi

          N_RECORDS=$(python3 -c "import json; print(len(json.load(open('${PAIRED}'))))")
          echo "  ablation_paired.json: ${N_RECORDS} paired record(s) -> ${PAIRED}"

          # Override INPUT_JSON / INPUT_MODE so the analysis step reads the merged file.
          # INPUT_MODE stays 'direct' -- ablation_paired.json is a single flat list.
          echo "INPUT_JSON=${PAIRED}" >> "$GITHUB_ENV"
          echo "INPUT_MODE=direct"    >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Run analysis
      # -----------------------------------------------------------------------

      - name: Run statistical analysis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RESULT_DIR"

          # Build the input-source flag without any subshell quoting.
          # The old "$(...) echo '--flag \'$VAR\''" pattern passed literal
          # single-quote characters to Python (bash does NOT strip quotes from
          # command-substitution output), causing Path("'shard_manifest.txt'")
          # to fail with "not found".  A case statement with bare variable
          # references is unambiguous and covers all three INPUT_MODE values.
          #
          #   merged  — _merged.json from ci_consolidate, or _merged_benchmark.json
          #             assembled in-memory from benchmark-format shards
          #   direct  — single committed result file (NSHARDS=1, e.g. exp1)
          #   shards  — multiple flat/list-format shard files via manifest
          INPUT_FLAG=()
          case "$INPUT_MODE" in
            merged|direct)
              INPUT_FLAG=(--input-json "$INPUT_JSON")
              ;;
            shards)
              INPUT_FLAG=(--shard-manifest "$SHARD_MANIFEST")
              ;;
            *)
              echo "::error::Unknown INPUT_MODE='${INPUT_MODE}'. Expected merged, direct, or shards."
              exit 1
              ;;
          esac

          echo "INPUT_MODE  : ${INPUT_MODE}"
          echo "INPUT_FLAG  : ${INPUT_FLAG[*]}"
          echo "RESULT_DIR  : ${RESULT_DIR}"

          python3 .github/scripts/run_analysis.py \
            --experiment "$EXPERIMENT" \
            --result-dir "$RESULT_DIR" \
            "${INPUT_FLAG[@]}" 

      # -----------------------------------------------------------------------
      # Verify outputs
      # -----------------------------------------------------------------------

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          REPORT_MD="$RESULT_DIR/_report.md"
          ANALYSIS_JSON="$RESULT_DIR/_analysis.json"

          [[ -f "$REPORT_MD" ]] || {
            echo "::error::Missing report markdown: $REPORT_MD"
            exit 1
          }

          [[ -f "$ANALYSIS_JSON" ]] || {
            echo "::error::Missing analysis json: $ANALYSIS_JSON"
            exit 1
          }

          # Verify _analysis.json is valid JSON and contains required top-level keys.
          # FIX: use printf to write checker script (avoids heredoc/multiline python3 -c,
          # both of which produce unindented lines that YAML parses as mapping keys).
          printf '%s\n' \
            'import json, os, sys' \
            'path = os.environ["RESULT_DIR"] + "/_analysis.json"' \
            'try:' \
            '    d = json.load(open(path))' \
            'except Exception as e:' \
            '    print("::error::_analysis.json is not valid JSON: " + str(e)); sys.exit(1)' \
            'required = ("experiment","experiment_mode","n_total","fatal_conditions")' \
            'missing = [k for k in required if k not in d]' \
            'if missing:' \
            '    print("::error::_analysis.json missing required keys: " + str(missing)); sys.exit(1)' \
            'hard = [c for c in d["fatal_conditions"] if not (c.startswith("INFO_") or c.startswith("WARN_"))]' \
            'soft = len(d["fatal_conditions"]) - len(hard)' \
            'exp,mode,n,nf = d["experiment"],d["experiment_mode"],d["n_total"],len(d["fatal_conditions"])' \
            'print(f"_analysis.json OK: experiment={exp}, mode={mode}, n_total={n}, fatal_conditions={nf} ({len(hard)} hard, {soft} soft)")' \
            > /tmp/_verify_analysis.py
          python3 /tmp/_verify_analysis.py
          echo
          echo "=== OUTPUTS ==="
          ls -lh "$REPORT_MD" "$ANALYSIS_JSON"

      # -----------------------------------------------------------------------
      # Commit outputs
      # -----------------------------------------------------------------------

      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            "$RESULT_DIR/_report.md" \
            "$RESULT_DIR/_analysis.json"

          if git diff --cached --quiet; then
            echo "No analysis changes to commit"
            exit 0
          fi

          git commit -m "analysis: ${EXPERIMENT} - run ${{ github.run_id }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed analysis outputs to master."

      # -----------------------------------------------------------------------
      # Upload outputs
      # -----------------------------------------------------------------------

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.event.inputs.experiment }}-${{ github.run_id }}
          path: |
            ${{ env.RESULT_DIR }}/_report.md
            ${{ env.RESULT_DIR }}/_analysis.json
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # Abort on fatal conditions flagged by run_analysis.py.
      # _analysis.json["fatal_conditions"] is a list of strings (empty = OK).
      # Non-zero exit here fails the workflow, which can block PR merges via
      # branch protection rules.  This step runs AFTER the commit so the
      # report is always available even when the run is aborted.
      # -----------------------------------------------------------------------

      - name: Abort on fatal conditions
        shell: bash
        run: |
          python3 -c '
          import json, os, sys
          path = os.environ["RESULT_DIR"] + "/_analysis.json"
          if not os.path.exists(path):
              print("No _analysis.json found; skipping fatal-condition check.")
              sys.exit(0)
          analysis  = json.load(open(path))
          fatal     = analysis.get("fatal_conditions", [])
          hard      = [c for c in fatal if not (c.startswith("INFO_") or c.startswith("WARN_"))]
          if not hard:
              if fatal:
                  print(f"Soft conditions only ({len(fatal)}):")
                  for i, c in enumerate(fatal, 1):
                      print(f"  {i}. {c}")
              print("No fatal conditions detected. Analysis complete.")
              sys.exit(0)
          print(f"::error::Fatal conditions detected ({len(hard)}):")
          for i, c in enumerate(hard, 1):
              print(f"  {i}. {c}")
          print()
          print("Review _report.md for full diagnostic details.")
          print("To re-run analysis after fixes: use workflow_dispatch with the same experiment.")
          sys.exit(1)
          '
