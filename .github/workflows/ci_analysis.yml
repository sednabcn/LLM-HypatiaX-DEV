# ==============================================================================
#  ci_analysis.yml - HypatiaX post-consolidation statistical analysis
#
#  Architecture contract (read before editing):
#    This workflow runs AFTER ci_runner.yml has completed and
#    committed result files to the repository.  It is the ONLY stage that may
#    perform statistical analysis.  Workers MUST NOT run statistical tests;
#    see ci_runner.yml for the architectural rationale.
#
#  NOTE: ci_runner.yml has NO consolidate job — each worker shard
#    commits its own result files directly to the repo.  _merged.json is NOT
#    automatically produced; run ci_consolidate_experiment.yml manually if a
#    merged view is needed.  ci_analysis.yml therefore falls back to the
#    committed shard files when _merged.json is absent.
#
#  Responsibilities:
#    - Mann-Whitney U tests (per-method, cross-method)
#    - R² distribution analysis and per-method success rates
#    - Method summary tables (coverage, median R², rank)
#    - Coverage gap detection
#    - Instability / domain-consistency metrics (exp: instability, hybrid_all_domains)
#    - Extrapolation checks (exp: extrap)
#    - Publication-quality table generation
#    - Markdown report (_report.md) and structured output (_analysis.json)
#    - Fatal-condition abort (exits non-zero; PR merge blocked by branch protection)
#
#  Inputs:
#    _merged.json ONLY.  Never reads raw shard artifacts.
#
#  Outputs committed to master:
#    hypatiax/data/results/{result_subdir}/_report.md
#    hypatiax/data/results/{result_subdir}/_analysis.json
#
#  Triggering modes:
#    1. Scheduled chain (workflow_dispatch from ci_schedule_all.yml): called
#       automatically after ci_runner.yml completes.  Passes
#       experiment and source_run_id; result_subdir is derived from the
#       checkpoint.
#    2. Manual (workflow_dispatch): re-runs analysis on already-committed
#       result files.  Requires experiment; result_subdir is optional (derived
#       from experiment name if omitted); source_run_id optional.
#
#  WHY ci_analysis.yml IS A STANDALONE WORKFLOW (not workflow_run):
#    GitHub does NOT fire the workflow_run event when the triggering workflow
#    was itself started by another workflow via gh workflow run / workflow_dispatch
#    (chained dispatch).  Because ci_schedule_all.yml dispatches
#    ci_runner.yml programmatically, a workflow_run trigger on
#    ci_runner.yml would never fire in the normal scheduled
#    pipeline.  ci_schedule_all.yml therefore dispatches ci_analysis.yml
#    explicitly from its run-finalize job after ci_runner.yml
#    completes.  The standalone design also allows manual reruns without
#    re-running the expensive experiment workers.
#
#  PURGE RESILIENCE:
#    purge_old_runs in ci_runner.yml and ci_schedule_all.yml can
#    delete a completed ci_runner.yml run (and its shard artifact)
#    before a queued ci_analysis.yml job has had a chance to start and download
#    it.  To handle this, the "Download consolidated artifact" step uses
#    continue-on-error: true.  The "Locate _merged.json" step falls back to
#    the committed copy in the repository, which is always present because
#    ci_runner.yml worker shards commit their result files to
#    master directly before ci_analysis.yml is ever dispatched.
#    In manual mode, omit source_run_id entirely to use the committed files
#    directly (the download step is skipped when source_run_id is blank).
# ==============================================================================

name: "HypatiaX - analysis"
run-name: "HypatiaX - analysis . ${{ github.event.inputs.experiment }}"

# -- Triggers ------------------------------------------------------------------
on:

  # Dispatched explicitly by ci_schedule_all.yml after ci_experiment.yml
  # completes, or run manually to re-analyse a committed _merged.json.
  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment ID (must match a committed result_subdir)"
        required: true
        type: choice
        options:
          - exp1
          - exp1b
          - exp2_feynman
          - exp2
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap

      result_subdir:
        description: "Canonical result subdirectory — leave blank to derive from experiment name"
        required: false
        default: ""

      source_run_id:
        description: "ci_runner.yml run ID to download the shard artifact from (leave blank to use committed result files)"
        required: false
        default: ""

# -- Permissions ---------------------------------------------------------------
permissions:
  contents: write   # commit report + analysis outputs
  actions:  read    # download artifacts from triggering workflow run

# -- Global env ----------------------------------------------------------------
env:
  OUT_BASE: hypatiax/data/results
  # PySR fit timeout parameters — must match the values used by ci_experiment.yml
  # workers.  Sourced from repository variables so both workflows share one
  # definition.  Passed explicitly to run_analysis.py so it can record them in
  # _analysis.json for reproducibility (not used to drive PySR here).
  PYSR_FIT_WALL_TIMEOUT: ${{ vars.PYSR_FIT_WALL_TIMEOUT }}
  PYSR_FIT_GRACE_SECS:   ${{ vars.PYSR_FIT_GRACE_SECS }}


# ==============================================================================
#  JOB: analysis
# ==============================================================================
jobs:

  analysis:
    name: "Analysis - ${{ github.event.inputs.experiment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15   # pip cache hit: ~3 min; cache miss: ~8 min; analysis itself: <10s

    if: github.event_name == 'workflow_dispatch'

    steps:

      # -----------------------------------------------------------------------
      - name: Checkout master
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      - name: Cache analysis pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: analysis-pip-${{ runner.os }}-numpy-scipy-pandas
          restore-keys: analysis-pip-${{ runner.os }}-

      # -----------------------------------------------------------------------
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # scipy required for Mann-Whitney U tests (this is the ONLY job
          # that installs scipy; workers and consolidate must not use it).
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0"

      # -----------------------------------------------------------------------
      # Download shard artifact from the ci_runner.yml run.
      # source_run_id is provided by ci_schedule_all.yml; omit when
      # re-running analysis manually against already-committed files.
      # instability has no _merged.json — skip download entirely.
      #
      # PURGE RESILIENCE: continue-on-error: true prevents this step from
      # hard-failing the job when the referenced run has been deleted by
      # purge_old_runs before this queued ci_analysis.yml job started.
      # The "Locate _merged.json" step below falls back to the committed copy.
      - name: Download consolidated artifact
        if: >
          github.event.inputs.source_run_id != '' &&
          github.event.inputs.experiment != 'instability'
        continue-on-error: true
        id: download_artifact
        uses: actions/download-artifact@v4
        with:
          run-id:         ${{ github.event.inputs.source_run_id }}
          github-token:   ${{ secrets.GITHUB_TOKEN }}
          path:           consolidated_artifact
          pattern:        "consolidated-${{ github.event.inputs.experiment }}-*"
          merge-multiple: true

      # -----------------------------------------------------------------------
      - name: Log artifact download outcome
        if: >
          github.event.inputs.source_run_id != '' &&
          github.event.inputs.experiment != 'instability'
        run: |
          if [[ "${{ steps.download_artifact.outcome }}" == "success" ]]; then
            echo "Artifact downloaded from run ${{ github.event.inputs.source_run_id }}."
          else
            echo "::warning::Artifact download failed (run may have been purged by purge_old_runs)."
            echo "  Falling back to committed _merged.json in the repository."
            echo "  source_run_id=${{ github.event.inputs.source_run_id }}"
          fi

      # -----------------------------------------------------------------------
      # so all downstream steps (locate, analysis, verify) are skipped.
      - name: Short-circuit for instability experiment
        if: github.event.inputs.experiment == 'instability'
        id: short_circuit
        env:
          SUB: figures
        run: |
          set -euo pipefail
          OUT_DIR="${OUT_BASE}/figures"
          mkdir -p "${OUT_DIR}"
          python3 -c 'import json,os; out=os.environ["OUT_BASE"]+"/figures"; stub={"experiment":"instability","experiment_mode":"instability","n_total":0,"fatal_conditions":["WARN_INSTABILITY_NO_MERGED_JSON: instability outputs are CSVs/figures only; statistical method analysis was skipped."]}; open(out+"/_analysis.json","w").write(json.dumps(stub,indent=2)); open(out+"/_report.md","w").write("# HypatiaX Analysis Report -- instability\n\nInstability experiment: method comparison analysis not applicable.\nSee figures/instability_analysis.csv for results.\n"); print("Stub outputs written -- instability short-circuit done.")'
          echo "result_subdir=figures" >> "$GITHUB_OUTPUT"
          echo "exp_id=instability" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      - name: List downloaded artifact tree
        if: github.event.inputs.experiment != 'instability'
        run: |
          echo "=== consolidated_artifact tree ==="
          find consolidated_artifact -type f 2>/dev/null | sort || echo "(empty or not downloaded)"

      # -----------------------------------------------------------------------
      # Resolve exp_id and result_subdir from:
      #   1. _checkpoint.json in the downloaded artifact (authoritative)
      #   2. workflow_dispatch inputs (fallback / manual mode)
      - name: Resolve experiment metadata
        if: github.event.inputs.experiment != 'instability'
        id: meta
        env:
          DISPATCH_EXP: ${{ github.event.inputs.experiment }}
          DISPATCH_SUB: ${{ github.event.inputs.result_subdir }}
        run: |
          set -euxo pipefail

          CKPT=$(find consolidated_artifact -name "_checkpoint.json" 2>/dev/null | head -1 || true)

          EXP=""
          SUB=""

          if [[ -n "$CKPT" ]]; then
            echo "Found checkpoint: $CKPT"
            # BUG FIX: pass checkpoint path via CKPT_PATH env var rather than
            # interpolating $CKPT directly into the python -c "..." string.
            # Shell string substitution inside double-quoted here-strings breaks
            # under set -euo pipefail when the path contains special characters,
            # and the interpolated value is also vulnerable to code injection.
            # Using an env var is the canonical safe pattern for this.
            EXP=$(CKPT_PATH="$CKPT" python -c "
          import json, os
          d = json.load(open(os.environ['CKPT_PATH']))
          v = d.get('experiment') or d.get('exp_id') or ''
          print(v.strip())
          ")
            # Derive result_subdir from experiment name if not in checkpoint.
            SUB=$(CKPT_PATH="$CKPT" python -c "
          import json, os
          d = json.load(open(os.environ['CKPT_PATH']))
          v = d.get('result_subdir') or ''
          if not v:
              # Derive result_subdir from experiment name using the canonical mapping.
              exp = d.get('experiment') or d.get('exp_id') or ''
              # Canonical mapping — single source of truth for result_subdir paths.
              # Must stay in sync with ci_experiment.yml plan meta step and
              # run_analysis.py RESULT_SUBDIR dict.
              # exp1_ablation removed: no worker, no result_subdir in CI.
              mapping = {
                  # ISSUE 1 FIX: ci_runner.yml plan writes exp1 results to
                  # .../noiseless/defi/ (line: RESULT_SUBDIR="comparison_results/noise-noiseless/noiseless/defi")
                  # The previous mapping stopped one level short (.../noiseless/),
                  # so _merged.json was never found for exp1 in automated runs.
                  'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
                  'exp1b':              'comparison_results/noise-noiseless/15',
                  'exp2_feynman':       'comparison_results/feynman-tests/exp2',
                  'exp2':               'comparison_results/feynman-tests/exp2_multi',
                  'exp3':               'extrapolation',
                  'exp3b':              'extrapolation/multi_seed',
                  'suppA':              'hybrid_pysr/defi',
                  'suppB':              'comparison_results/feynman-tests/noise-sweep',
                  'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
                  'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
                  'instability':        'figures',
                  'extrap':             'comparison_results/extrapolation',
              }
              v = mapping.get(exp, exp)
          print(v.strip())
          ")
          fi

          # Fall back to dispatch inputs (manual mode or checkpoint missing key).
          EXP="${EXP:-${DISPATCH_EXP}}"
          SUB="${SUB:-${DISPATCH_SUB}}"

          # Derive result_subdir from experiment name when DISPATCH_SUB is blank.
          # BUG FIX: pass EXP via env var (EXP_ID) not shell interpolation inside
          # the python -c string — interpolation breaks under set -euo pipefail.
          if [[ -z "$SUB" && -n "$EXP" ]]; then
            SUB=$(EXP_ID="$EXP" python -c "
          import os
          mapping = {
              # ISSUE 1 FIX: /defi leaf added — must match ci_runner.yml plan RESULT_SUBDIR.
              'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
              'exp1b':              'comparison_results/noise-noiseless/15',
              'exp2_feynman':       'comparison_results/feynman-tests/exp2',
              'exp2':               'comparison_results/feynman-tests/exp2_multi',
              'exp3':               'extrapolation',
              'exp3b':              'extrapolation/multi_seed',
              'suppA':              'hybrid_pysr/defi',
              'suppB':              'comparison_results/feynman-tests/noise-sweep',
              'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
              'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
              'instability':        'figures',
              'extrap':             'comparison_results/extrapolation',
          }
          exp = os.environ['EXP_ID']
          print(mapping.get(exp, exp))
          ")
          fi

          if [[ -z "$EXP" || -z "$SUB" ]]; then
            echo "::error::Cannot resolve experiment or result_subdir."
            echo "  Provide 'experiment' input (result_subdir is derived automatically)."
            exit 1
          fi

          echo "exp_id=${EXP}"         >> "$GITHUB_OUTPUT"
          echo "result_subdir=${SUB}"  >> "$GITHUB_OUTPUT"
          echo "Resolved: exp=${EXP}  subdir=${SUB}"

      # -----------------------------------------------------------------------
      # Locate _merged.json: prefer the downloaded artifact copy (guaranteed
      # consistent with the run that produced it), fall back to the committed
      # file (manual dispatch without source_run_id).
      - name: Locate _merged.json
        if: github.event.inputs.experiment != 'instability'
        id: locate
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail

          ARTIFACT_JSON=$(find consolidated_artifact -name "_merged.json" 2>/dev/null | head -1 || true)
          COMMITTED_JSON="${OUT_BASE}/${SUB}/_merged.json"

          if [[ -f "$ARTIFACT_JSON" ]]; then
            MERGED_JSON="$ARTIFACT_JSON"
            echo "Using artifact copy: $MERGED_JSON"
          elif [[ -f "$COMMITTED_JSON" ]]; then
            MERGED_JSON="$COMMITTED_JSON"
            echo "Using committed copy: $MERGED_JSON"
          else
            # Fallback: locate the primary committed shard result file.
            # Only exp1b and exp3b produce a _merged.json via merge_shards.py;
            # all other experiments commit individual shard files directly.
            # run_analysis.py accepts shapes A/B/C so a shard file is valid input.
            # Files starting with "_" are pipeline metadata (_analysis.json etc) — skip them.
            SHARD_JSON=$(find "${OUT_BASE}/${SUB}" -maxdepth 1 -type f -name "*.json" \
              ! -name "_*.json" 2>/dev/null | sort | head -1 || true)
            if [[ -n "$SHARD_JSON" && -f "$SHARD_JSON" ]]; then
              MERGED_JSON="$SHARD_JSON"
              echo "No _merged.json found — using primary shard result file: $MERGED_JSON"
            else
              echo "::error::No input JSON found for experiment '${SUB}'."
              echo "  Searched:"
              echo "    artifact:   consolidated_artifact/**/_merged.json"
              echo "    committed:  ${COMMITTED_JSON}"
              echo "    shard file: ${OUT_BASE}/${SUB}/*.json (excluding _*.json)"
              echo "  Ensure ci_runner.yml worker shard committed results to the repo,"
              echo "  or run ci_consolidate_experiment.yml to produce _merged.json first."
              exit 1
            fi
          fi

          # Sanity-check: file must be non-empty valid JSON with at least one record.
          python -c "
          import json, sys
          path = '$MERGED_JSON'
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f'::error::_merged.json is not valid JSON: {e}')
              sys.exit(1)
          # Shape A: merge_shards.py wraps records under 'results' key.
          # Shape B/C: flat dict or list (legacy).
          if isinstance(data, dict) and isinstance(data.get('results'), dict):
              n = len(data['results'])
              label = f'{n} task records (merge_shards.py shape A)'
          elif isinstance(data, dict):
              n = sum(1 for k, v in data.items()
                      if isinstance(v, dict) and not k.startswith('_') and k != 'stats')
              label = f'{n} task records (flat dict shape B)'
          elif isinstance(data, list):
              n = len(data)
              label = f'{n} task records (list shape C)'
          else:
              print(f'::error::_merged.json unexpected top-level type: {type(data).__name__}')
              sys.exit(1)
          if n == 0:
              print('::error::_merged.json contains 0 task records.')
              sys.exit(1)
          print(f'_merged.json OK — {label}.')
          "

          echo "merged_json=${MERGED_JSON}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # REPORT step: run full statistical analysis via .github/scripts/run_analysis.py
      #
      # scripts/run_analysis.py is responsible for:
      #   - Loading _merged.json
      #   - Mann-Whitney U tests (per-method and cross-method comparisons)
      #   - R² distribution analysis and per-method success rates
      #   - Method summary tables (coverage %, median R², rank)
      #   - Coverage gap detection (equations with no successful method)
      #   - Instability / domain-consistency metrics (instability, hybrid_all_domains)
      #   - Extrapolation OOD checks (extrap)
      #   - Writing _report.md  (Markdown, human-readable)
      #   - Writing _analysis.json (structured, machine-readable)
      #     including a "fatal_conditions" list for the abort check below.
      #
      # The script receives OUT_DIR so it can write to the correct location.
      # It must not commit anything — that is this workflow's responsibility.
      - name: Run statistical analysis and write report
        if: github.event.inputs.experiment != 'instability'
        id: run_analysis
        env:
          EXP:         ${{ steps.meta.outputs.exp_id }}
          SUB:         ${{ steps.meta.outputs.result_subdir }}
          MERGED_JSON: ${{ steps.locate.outputs.merged_json }}
          # Forward PySR timeout parameters so run_analysis.py can record them
          # in _analysis.json for provenance.  The global env vars are already
          # set above; re-declaring here is an explicit contract that makes the
          # dependency visible at the step level and survives future env refactors.
          PYSR_FIT_WALL_TIMEOUT: ${{ env.PYSR_FIT_WALL_TIMEOUT }}
          PYSR_FIT_GRACE_SECS:   ${{ env.PYSR_FIT_GRACE_SECS }}
        run: |
          set -euo pipefail

          OUT_DIR="${OUT_BASE}/${SUB}"
          mkdir -p "${OUT_DIR}"

          echo "=== Running analysis for ${EXP} ==="
          echo "  Input:  ${MERGED_JSON}"
          echo "  Output: ${OUT_DIR}"

          # BUG B FIX: --method-aliases and --r2-field were added to this call
          # but run_analysis.py's argparse only accepts --experiment, --merged-json,
          # and --output-dir.  The extra flags caused argparse to error out,
          # meaning every analysis run failed immediately after the consolidate
          # commit.  Removed: run_analysis.py already uses the correct canonical
          # method names (pure_llm / neural_network / hybrid) and field path
          # (results.<method>.test_r2) natively — no translation flags are needed.
          python .github/scripts/run_analysis.py \
            --experiment  "${EXP}"       \
            --merged-json "${MERGED_JSON}" \
            --output-dir  "${OUT_DIR}"

      # -----------------------------------------------------------------------
      - name: Verify report outputs
        if: github.event.inputs.experiment != 'instability'
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          set -euo pipefail
          OUT_DIR="${OUT_BASE}/${SUB}"

          echo "=== Output directory ==="
          ls -lah "${OUT_DIR}"

          test -f "${OUT_DIR}/_report.md"    || { echo "::error::_report.md missing";    exit 1; }
          test -f "${OUT_DIR}/_analysis.json" || { echo "::error::_analysis.json missing"; exit 1; }

          # Verify _analysis.json is valid JSON and contains required top-level keys.
          python -c "
          import json, sys
          path = '${OUT_DIR}/_analysis.json'
          try:
              d = json.load(open(path))
          except Exception as e:
              print(f'::error::_analysis.json is not valid JSON: {e}')
              sys.exit(1)
          required = ('experiment', 'experiment_mode', 'n_total', 'fatal_conditions')
          missing  = [k for k in required if k not in d]
          if missing:
              print(f'::error::_analysis.json missing required keys: {missing}')
              sys.exit(1)
          hard = [c for c in d['fatal_conditions']
                  if not (c.startswith('INFO_') or c.startswith('WARN_'))]
          print(f'_analysis.json OK: experiment={d[\"experiment\"]}, '
                f'mode={d[\"experiment_mode\"]}, n_total={d[\"n_total\"]}, '
                f'fatal_conditions={len(d[\"fatal_conditions\"])} '
                f'({len(hard)} hard, {len(d[\"fatal_conditions\"])-len(hard)} soft)')
          "

          echo "All expected analysis outputs present and valid."

      # -----------------------------------------------------------------------
      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ steps.short_circuit.outputs.exp_id || steps.meta.outputs.exp_id }}-${{ github.run_id }}
          path: |
            ${{ env.OUT_BASE }}/${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}/_report.md
            ${{ env.OUT_BASE }}/${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}/_analysis.json
          if-no-files-found: warn
          retention-days: 30

      # -----------------------------------------------------------------------
      - name: Commit and push analysis outputs to master
        env:
          EXP: ${{ steps.short_circuit.outputs.exp_id || steps.meta.outputs.exp_id }}
          SUB: ${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset index and pull before staging — rebase refuses to run
          # if the index contains staged entries (from checkout internals
          # or files written into the repo tree by prior steps).
          git reset HEAD 2>/dev/null || true
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          # Only commit under OUT_BASE (hypatiax/data/results/...) —
          # never the bare SUB path at repo root.
          git add \
            "${OUT_BASE}/${SUB}/_report.md"      \
            "${OUT_BASE}/${SUB}/_analysis.json"  \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to analysis outputs - results unchanged from previous run."
          else
            git commit -m "ci: ${EXP} analysis report - run ${{ github.run_id }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed analysis outputs to master."
          fi

      # -----------------------------------------------------------------------
      # Abort on fatal conditions flagged by scripts/run_analysis.py.
      # _analysis.json["fatal_conditions"] is a list of strings (empty = OK).
      # Non-zero exit here fails the workflow, which can block PR merges via
      # branch protection rules.  This step runs AFTER the commit so the
      # report is always available even when the run is aborted.
      - name: Abort on fatal conditions
        env:
          SUB: ${{ steps.short_circuit.outputs.result_subdir || steps.meta.outputs.result_subdir }}
        run: |
          python - <<'PYEOF'
          import json, os, sys

          sub      = os.environ["SUB"]
          out_base = os.environ.get("OUT_BASE", "hypatiax/data/results")
          path     = f"{out_base}/{sub}/_analysis.json"

          if not os.path.exists(path):
              print("No _analysis.json found; skipping fatal-condition check.")
              sys.exit(0)

          with open(path) as f:
              analysis = json.load(f)

          fatal = analysis.get("fatal_conditions", [])

          if not fatal:
              print("No fatal conditions detected. Analysis complete.")
              sys.exit(0)

          print(f"::error::Fatal conditions detected ({len(fatal)}):")
          for i, cond in enumerate(fatal, 1):
              print(f"  {i}. {cond}")
          print()
          print("Review _report.md for full diagnostic details.")
          print("To re-run analysis after fixes: use workflow_dispatch with the same result_subdir.")
          sys.exit(1)
          PYEOF
