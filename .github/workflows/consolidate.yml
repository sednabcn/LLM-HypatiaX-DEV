name: Consolidate Results

on:
  workflow_run:
    workflows: ["Experiment CI (Parallel Workers)"]
    types:
      - completed

jobs:
  consolidate:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # IMPORTANT FIX
      - name: Download experiment artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: all_results
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f

          if [ ! -d all_results ]; then
            echo "ERROR: all_results directory missing"
            exit 1
          fi

          if [ -z "$(ls -A all_results)" ]; then
            echo "ERROR: all_results is empty"
            exit 1
          fi

          echo "Artifacts successfully downloaded:"
          ls -R all_results

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run consolidation
        run: |
          python .github/scripts/consolidate.py \
            --input_dir all_results \
            --output final_result.json

      - name: Upload final result
        uses: actions/upload-artifact@v4
        with:
          name: final-consolidated-result
          path: final_result.json
