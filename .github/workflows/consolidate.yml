name: Consolidate Results

on:
  workflow_run:
    workflows: ["Experiment CI (Parallel Workers)"]
    types:
      - completed

jobs:
  consolidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_results

      - name: Show artifact structure
        run: ls -R all_results

      - name: Run consolidation
        run: |
          python .github/scripts/consolidate.py \
            --input_dir all_results \
            --output final_result.json

      - name: Upload final result
        uses: actions/upload-artifact@v4
        with:
          name: final-consolidated-result
          path: final_result.json
