name: Exp 2 — HypatiaX v5.3 Feynman Extrapolation (n=30)

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/exp2_hypatiax_v53_feynman.ipynb'
      - '.github/workflows/ci_exp2_hypatiax_v53_feynman.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/exp2_hypatiax_v53_feynman.ipynb'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint (true/false)'
        required: false
        default: 'true'
      pysr_timeout:
        description: 'PySR timeout in seconds per equation'
        required: false
        default: '1100'

jobs:
  run-exp2-feynman:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JULIA_VERSION: "1.12.6"
      JULIA_NUM_THREADS: "4"
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
      LLM_MODEL: "claude-sonnet-4-20250514"
      PYSR_PARALLELISM: "multithreading"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESUME: ${{ github.event.inputs.resume || 'true' }}
      PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir pysr scikit-learn scipy numpy pandas nbconvert ipykernel

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Verify Julia threads
        run: julia -e 'println("Julia threads: ", Threads.nthreads())'

      - name: Restore checkpoint cache
        uses: actions/cache@v5
        with:
          path: logs/
          key: feynman-checkpoint-${{ github.ref_name }}
          restore-keys: |
            feynman-checkpoint-

      - name: Create log directory
        run: mkdir -p logs

      - name: Patch notebook (fix empty blocks & paths)
        run: python3 .github/scripts/patch_notebook_feynman.py

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 \
          .github/scripts/exp2_hypatiax_v53_feynman.ipynb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-all-${{ github.run_id }}
          path: |
            .github/scripts/exp2_hypatiax_v53_feynman.ipynb
            logs/
            logs/*.json
            logs/*.csv
          if-no-files-found: ignore
          retention-days: 30
