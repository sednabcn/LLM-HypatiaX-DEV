name: Exp 2 — HypatiaX v5.3 Feynman Extrapolation (n=30)

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/exp2_hypatiax_v53_feynman.ipynb'
      - '.github/workflows/ci_exp2_hypatiax_v53_feynman.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/exp2_hypatiax_v53_feynman.ipynb'
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 01:30 BST (UTC+1) — job 4 of 4 (+13 h from job 3)
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint (true/false)'
        required: false
        default: 'true'
      pysr_timeout:
        description: 'PySR timeout in seconds per equation'
        required: false
        default: '1100'

jobs:

  run-exp2-feynman:
    runs-on: ubuntu-latest
    # Ceiling: ~12-24 h on 4 vCPUs; GitHub Actions max is 6 h on standard runners.
    # For the full run use a self-hosted runner and raise this value.
    # For a smoke-test (one_equation) the 360 min limit is ample.
    timeout-minutes: 360

    env:
      JULIA_VERSION: "1.12.6"
      JULIA_MINOR: "1.12"
      # ubuntu-latest runners: 4 vCPUs — matches Kaggle CPU notebook
      JULIA_NUM_THREADS: "4"
      JULIA_EXCLUSIVE: "0"
      # Segfault guard: set before any juliacall / pysr import
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
      LLM_MODEL: "claude-sonnet-4-20250514"
      # parallelism=multithreading — no Distributed workers, immune to
      # ProcessExitedException (see notebook header for full rationale)
      PYSR_PARALLELISM: "multithreading"
      # Passed directly here rather than via a `run: echo … >> $GITHUB_ENV`
      # step to avoid unnecessarily echoing the masked secret in shell logs.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        # Matches Cell 2 of the notebook exactly
        run: |
          python -m pip install --upgrade pip
          pip install \
            pysr \
            scikit-learn \
            scipy \
            numpy \
            pandas \
            nbconvert \
            ipykernel

      # ── Julia ─────────────────────────────────────────────────────────────
      - name: Install Julia ${{ env.JULIA_VERSION }}
        run: |
          TARBALL="julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          URL="https://julialang-s3.julialang.org/bin/linux/x64/${JULIA_MINOR}/${TARBALL}"
          wget -q "$URL"
          tar -xzf "$TARBALL"
          echo "${GITHUB_WORKSPACE}/julia-${JULIA_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Julia threads
        # Should print 4 on ubuntu-latest; confirms JULIA_NUM_THREADS was picked up
        run: |
          julia -e 'println("Julia threads: ", Threads.nthreads())'

      # ── Checkpoint cache (resume support) ─────────────────────────────────
      - name: Restore checkpoint cache
        uses: actions/cache@v5
        with:
          path: logs/
          key: feynman-checkpoint-${{ github.ref_name }}
          restore-keys: |
            feynman-checkpoint-

      - name: Create log directory
        run: mkdir -p logs

      # ── Notebook execution ─────────────────────────────────────────────────
      # PYTHON_JULIACALL_HANDLE_SIGNALS must be in the kernel environment
      # before juliacall is imported (Cell 2). Passing it via `env:` here
      # ensures it is set before the notebook kernel forks.
      #
      # The notebook hardcodes absolute paths (/hypatiax/... or /kaggle/working)
      # that the GitHub Actions runner cannot write to (PermissionError: '/').
      # The fix step below patches the notebook source before execution:
      #   1. Fixes any empty cell IDs (nbformat validation requirement)
      #   2. Rewrites ALL /hypatiax/* and /kaggle/working* literals using
      #      regexes so os.makedirs never tries to write under /.
      #   3. Injects a runtime override cell that reads OUTPUT_DIR / LOGS_DIR
      #      from env vars (set in the job env block above) and redirects any
      #      surviving absolute-path variable before the notebook uses them.
      - name: Fix notebook cell IDs and output paths
        run: |
          python3 - <<'EOF'
          import json, re, uuid
          from pathlib import Path

          NB_PATH = Path(".github/scripts/exp2_hypatiax_v53_feynman.ipynb")
          raw = json.loads(NB_PATH.read_text())
          cells = raw.get("cells", [])

          # 1. Fix missing/empty cell IDs
          fixed_ids = 0
          for cell in cells:
              cid = cell.get("id", "")
              if not cid or not str(cid).strip():
                  cell["id"] = uuid.uuid4().hex[:8]
                  fixed_ids += 1

          # 2. Replace ALL absolute path literals that the runner cannot write to.
          #    Covers /kaggle/working* and /hypatiax/* — both map to logs/.
          #    The env vars OUTPUT_DIR / LOGS_DIR are also honoured at runtime
          #    via the override cell injected in step 3.
          KAGGLE_RE   = re.compile(r"(['\"/])(/kaggle/working/?)(['\"/]?)")
          HYPATIAX_RE = re.compile(
              r"(['\"])"
              r"(/hypatiax(?:/data/results|/logs)?/?)"
              r"(['\"])"
          )
          def _repl_kaggle(m):
              return m.group(1) + "logs/" + m.group(3)
          def _repl_hypatiax(m):
              # /hypatiax/logs  → logs/
              # /hypatiax/data/results → logs/results/
              # /hypatiax      → logs/
              inner = m.group(2)
              if "data/results" in inner:
                  replacement = "logs/results/"
              elif inner.rstrip("/").endswith("/logs") or inner.rstrip("/") == "/hypatiax/logs":
                  replacement = "logs/"
              else:
                  replacement = "logs/"
              return m.group(1) + replacement + m.group(3)

          fixed_literal = 0
          for cell in cells:
              if cell.get("cell_type") != "code":
                  continue
              src = cell["source"]
              new_src = [KAGGLE_RE.sub(_repl_kaggle, HYPATIAX_RE.sub(_repl_hypatiax, line))
                         for line in src]
              if new_src != src:
                  cell["source"] = new_src
                  fixed_literal += 1

          # 3. Inject a safety-net override cell after the last cell that defines
          #    any of the known path variables or CFG — catches dynamic assembly
          #    like: LOG_DIR = OUTPUT_DIR + 'logs/'
          #    Also honours OUTPUT_DIR / LOGS_DIR env vars set by the CI yml so
          #    any surviving absolute-path variable is redirected at runtime.
          patch_src = (
              "import os as _os\n"
              "_ws   = _os.environ.get('GITHUB_WORKSPACE', '.')\n"
              "_out  = _os.environ.get('OUTPUT_DIR', _os.path.join(_ws, 'logs', 'results'))\n"
              "_logs = _os.environ.get('LOGS_DIR',   _os.path.join(_ws, 'logs'))\n"
              "_os.makedirs(_out,  exist_ok=True)\n"
              "_os.makedirs(_logs, exist_ok=True)\n"
              "# Redirect any surviving absolute-path references\n"
              "for _var, _val in [('OUTPUT_DIR', _out), ('LOGS_DIR', _logs),\n"
              "                   ('WORKING_DIR', _logs), ('LOG_DIR', _logs)]:\n"
              "    if _var in dir():\n"
              "        globals()[_var] = _val\n"
              "try:\n"
              "    CFG.update({k: v.replace('/hypatiax/data/results', _out)\n"
              "                     .replace('/hypatiax/logs', _logs)\n"
              "                     .replace('/hypatiax', _logs)\n"
              "                     .replace('/kaggle/working', _logs)\n"
              "                for k, v in CFG.items() if isinstance(v, str)\n"
              "                and any(p in v for p in ('/hypatiax', '/kaggle'))})\n"
              "except NameError:\n"
              "    pass\n"
          )

          already_patched = any(
              "Redirect any surviving absolute-path" in "".join(c.get("source", []))
              for c in cells
          )

          if not already_patched:
              insert_after = 0
              for i, cell in enumerate(cells):
                  src_text = "".join(cell.get("source", []))
                  if any(kw in src_text for kw in
                         ("OUTPUT_DIR", "WORKING_DIR", "LOG_DIR", "CFG", "CHECKPOINT_PATH")):
                      insert_after = i
              patch_cell = {
                  "cell_type": "code",
                  "id": uuid.uuid4().hex[:8],
                  "metadata": {},
                  "outputs": [],
                  "source": patch_src.splitlines(keepends=True),
                  "execution_count": None,
              }
              cells.insert(insert_after + 1, patch_cell)
              raw["cells"] = cells
              print(f"  Injected path-override cell after cell {insert_after}")

          NB_PATH.write_text(json.dumps(raw, indent=1))
          print(f"Fixed {fixed_ids} cell ID(s), {fixed_literal} cell(s) with absolute path literals")
          EOF

      - name: Execute notebook (Feynman n=30 equations)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=-1 \
            .github/scripts/exp2_hypatiax_v53_feynman.ipynb
        env:
          PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
          JULIA_NUM_THREADS: ${{ env.JULIA_NUM_THREADS }}
          PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}
          RESUME: ${{ github.event.inputs.resume || 'true' }}

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-notebook-${{ github.run_id }}
          path: .github/scripts/exp2_hypatiax_v53_feynman.ipynb
          retention-days: 30

      - name: Upload logs and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-results-${{ github.run_id }}
          path: |
            logs/*.json
            logs/*.csv
          if-no-files-found: ignore
          retention-days: 30
