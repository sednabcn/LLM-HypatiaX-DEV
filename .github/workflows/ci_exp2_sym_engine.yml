name: Exp 2 — Symbolic Engine v2 (Method 5) · run_all.sh (exp2_sym)

# Mirrors the exp2_sym step from run_all.sh:
#   bash run_all.sh --step exp2_sym
# Runs run_exp2_symbolic_engine.py directly (no notebook kernel),
# so output streams live to the Actions log without buffering.
#
# Differences vs ci_run_sym_engine_v2.yml (notebook-based):
#   • Python 3.12 (run_all.sh requires 3.12+)
#   • Julia 1.11.5 (matches ci_exp2_hypatiax_v53_feynman_sh.yml)
#   • Runs the Python script directly — no nbconvert, no path-patching step
#   • ANTHROPIC_API_KEY injected via step env: (never echoed to shell log)
#   • resume / one_equation inputs correctly forwarded to script flags
#   • Explicit cache save step (actions/cache/save@v5) for partial-progress resume
#   • PYTHONUNBUFFERED=1 + python3 -u to prevent pipe-buffer log blackout
#
# Sharding (5 parallel jobs, ~6 equations each):
#   • matrix.shard ∈ {0,1,2,3,4} — each job receives --shard N/5
#   • Fits full 30-equation run within the 6 h Actions hard limit
#     (worst-case ~48 min/eq × 6 eq = ~5 h, leaving headroom for Julia JIT)
#   • Per-shard checkpoint files prevent cross-job cache collisions
#   • fail-fast: false — a single shard timeout doesn't cancel siblings
#   • one_equation: only shard 0 executes; shards 1-4 skip the run step

on:
  push:
    branches: [master]
    paths:
      - 'hypatiax/experiments/benchmarks/run_exp2_symbolic_engine.py'
      - '.github/workflows/ci_exp2_sym_engine.yml'
      - 'run_all.sh'
  pull_request:
    branches: [master]
    paths:
      - 'hypatiax/experiments/benchmarks/run_exp2_symbolic_engine.py'
  schedule:
    - cron: '30 9 * * *'   # 09:30 UTC = 10:30 BST — job 1 of 4
  workflow_dispatch:
    inputs:
      pysr_timeout:
        description: 'PySR timeout in seconds per equation (run_all.sh default: 1100)'
        required: false
        default: '1100'
      one_equation:
        description: 'Run a single equation only (e.g. "Kinetic") — leave blank for all 30'
        required: false
        default: ''
      resume:
        description: 'Resume from checkpoint (true/false)'
        required: false
        default: 'true'
      dry_run:
        description: 'Dry-run only — print commands, skip execution (true/false)'
        required: false
        default: 'false'

jobs:

  run-exp2-sym-engine:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # 5 parallel shards × ~6 equations each.
    # Worst case: ~48 min/eq × 6 eq + ~10 min Julia JIT warmup ≈ 5 h 10 min.
    # 360 min (6 h) gives ~50 min headroom per shard.
    timeout-minutes: 360
    strategy:
      fail-fast: false          # a timed-out shard doesn't cancel siblings
      matrix:
        shard: [0, 1, 2, 3, 4]  # 5 jobs × 6 equations = 30 total

    env:
      # ── Node.js 24 opt-in (silences deprecation warnings for all actions) ──
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      # ── Julia ──────────────────────────────────────────────────────────────
      JULIA_VERSION: "1.11.5"
      JULIA_MINOR: "1.11"
      JULIA_NUM_THREADS: "4"          # ubuntu-latest: 4 vCPUs
      JULIA_EXCLUSIVE: "0"
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"

      # ── LLM ────────────────────────────────────────────────────────────────
      LLM_MODEL: "claude-sonnet-4-20250514"
      # Secret injected directly — avoids echoing the masked value in shell logs
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # required for _push_result_to_branch()

      # ── Paths (mirrors run_all.sh RESULTS_DIR / EXPERIMENTS_DIR) ───────────
      RESULTS_DIR: ${{ github.workspace }}/hypatiax/data/results
      EXPERIMENTS_DIR: ${{ github.workspace }}/hypatiax/experiments/benchmarks

    steps:
      # ── Repo ───────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python 3.12 (run_all.sh requirement) ───────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        # Matches run_all.sh env_check: pysr, torch, anthropic, sympy, scipy
        # plus scikit-learn, numpy, pandas used by the script directly.
        # torch installed separately so --index-url applies only to it.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            pysr \
            anthropic \
            sympy \
            scikit-learn \
            scipy \
            numpy \
            pandas

      # ── Julia ──────────────────────────────────────────────────────────────
      - name: Install Julia ${{ env.JULIA_VERSION }}
        run: |
          TARBALL="julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          URL="https://julialang-s3.julialang.org/bin/linux/x64/${JULIA_MINOR}/${TARBALL}"
          wget -q "$URL"
          tar -xzf "$TARBALL"
          echo "${GITHUB_WORKSPACE}/julia-${JULIA_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Julia threads
        run: |
          julia -e 'println("Julia threads: ", Threads.nthreads())'

      # ── env_check (mirrors run_all.sh STEP 0) ──────────────────────────────
      - name: Environment check (mirrors run_all.sh env_check)
        run: |
          echo "Python: $(python3 --version)"
          python3 -c "import pysr;      print('PySR:        ', pysr.__version__)"
          python3 -c "import torch;     print('PyTorch:     ', torch.__version__)"
          python3 -c "import anthropic; print('anthropic SDK: ok')"
          python3 -c "import sympy;     print('SymPy:       ', sympy.__version__)"
          python3 -c "import scipy;     print('SciPy:       ', scipy.__version__)"
          python3 -c "import sklearn;   print('scikit-learn:', sklearn.__version__)"
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "ERROR: ANTHROPIC_API_KEY not set"; exit 1; }
          echo "ANTHROPIC_API_KEY: set (${#ANTHROPIC_API_KEY} chars)"
          echo "JULIA_NUM_THREADS: ${JULIA_NUM_THREADS}"
          echo "PYSR_TIMEOUT:      ${{ github.event.inputs.pysr_timeout || '1100' }}s"
          echo "RESULTS_DIR:       ${RESULTS_DIR}"
          echo "SHARD:             ${{ matrix.shard }}/5"

      # ── Directory structure (mirrors run_all.sh env_check mkdir -p) ─────────
      - name: Create results directory structure
        run: |
          mkdir -p \
            "${RESULTS_DIR}/comparison_results/feynman-tests/exp2" \
            "${RESULTS_DIR}/comparison_results/feynman-tests/noise-sweep" \
            "${RESULTS_DIR}/comparison_results/noise-noiseless/noiseless" \
            "${RESULTS_DIR}/comparison_results/noise-noiseless/15" \
            "${RESULTS_DIR}/comparison_results/extrapolation" \
            "${RESULTS_DIR}/extrapolation" \
            "${RESULTS_DIR}/hybrid_llm_nn/all_domains" \
            "${RESULTS_DIR}/hybrid_llm_nn/defi" \
            "${RESULTS_DIR}/hybrid_pysr/all_domains" \
            "${RESULTS_DIR}/hybrid_pysr/defi" \
            "${RESULTS_DIR}/llm_guided/all_domains" \
            "${RESULTS_DIR}/llm_guided/defi" \
            "${RESULTS_DIR}/standalone_llm_nn" \
            "${RESULTS_DIR}/figures" \
            "${RESULTS_DIR}/tables" \
            "${{ github.workspace }}/logs"

      # ── Checkpoint cache (resume support) ──────────────────────────────────
      # Per-shard checkpoint files prevent cross-job cache collisions.
      # Key strategy:
      #   Primary : branch + run_id + shard → always unique, always saves fresh data
      #   Fallback: branch + shard prefix   → picks up the most recent run's checkpoint
      #   Fallback: bare shard prefix       → cross-branch fallback
      - name: Restore checkpoint cache
        id: checkpoint-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/logs/exp2_sym_checkpoint_shard${{ matrix.shard }}.json
          key: sym-engine-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sym-engine-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-
            sym-engine-checkpoint-shard${{ matrix.shard }}-

      # ── Seed checkpoint from committed file (cache miss only) ───────────────
      - name: Seed checkpoint from committed results
        if: steps.checkpoint-restore.outputs.cache-hit != 'true'
        run: |
          COMMITTED="${{ github.workspace }}/logs/exp2_sym_checkpoint_shard${{ matrix.shard }}.json"
          if [ -f "$COMMITTED" ]; then
            echo "Checkpoint already in place from git — $(jq -r '.completed | length' "$COMMITTED") equations done"
          else
            echo "No committed checkpoint for shard ${{ matrix.shard }} — starting from scratch"
          fi

      # ── exp2_sym (mirrors run_all.sh STEP 6) ───────────────────────────────

      # Pre-flight: verify the script exists and imports resolve before the
      # real run. Any crash surfaces as a clear error, not silent pipe death.
      - name: Pre-flight — verify script and imports
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        env:
          PYTHONUNBUFFERED: "1"
          PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
          JULIA_NUM_THREADS: "4"
        run: |
          echo "=== working directory ==="
          pwd
          echo "=== script present ==="
          ls -lh run_exp2_symbolic_engine.py
          echo "=== syntax check ==="
          python3 -m py_compile run_exp2_symbolic_engine.py && echo "syntax OK"

      # Main run.
      # PYTHONUNBUFFERED=1 — forces Python to flush every print() immediately
      #                      instead of accumulating an 8 KB pipe buffer.
      # python3 -u         — belt-and-braces unbuffered flag alongside the env var.
      # --shard N/5        — each job processes its slice of the 30 equations.
      # --resume flag      — forwarded from workflow_dispatch input (default: true).
      # --one-equation     — forwarded when set; only shard 0 runs (shards 1-4 skip).
      - name: Run exp2_sym — Symbolic Engine Method 5 (shard ${{ matrix.shard }}/5)
        if: >-
          github.event.inputs.dry_run != 'true' &&
          (github.event.inputs.one_equation == '' || matrix.shard == 0)
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        env:
          PYTHONUNBUFFERED: "1"
          PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
          # env.* context is unavailable in step env: blocks — use literal
          JULIA_NUM_THREADS: "4"
          PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # required for _push_result_to_branch()
        run: |
          LOG="${RESULTS_DIR}/exp2_sym_run_shard${{ matrix.shard }}.log"

          ARGS="--pysr-timeout ${{ github.event.inputs.pysr_timeout || '1100' }}"
          ARGS="$ARGS --shard ${{ matrix.shard }}/5"
          if [[ "${{ github.event.inputs.resume || 'true' }}" == "true" ]]; then
            ARGS="$ARGS --resume"
          fi
          ONE_EQ="${{ github.event.inputs.one_equation }}"
          if [[ -n "$ONE_EQ" ]]; then
            ARGS="$ARGS --one-equation $ONE_EQ"
          fi

          python3 -u run_exp2_symbolic_engine.py $ARGS \
            2>&1 | tee "$LOG"

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        run: |
          echo "[dry-run] shard ${{ matrix.shard }}/5 would execute:"
          echo "  python3 -u run_exp2_symbolic_engine.py \\"
          echo "    --pysr-timeout ${{ github.event.inputs.pysr_timeout || '1100' }} \\"
          echo "    --shard ${{ matrix.shard }}/5 \\"
          ONE_EQ="${{ github.event.inputs.one_equation }}"
          [[ "${{ github.event.inputs.resume || 'true' }}" == "true" ]] && echo "    --resume \\"
          [[ -n "$ONE_EQ" ]] && echo "    --one-equation $ONE_EQ \\"
          echo ""
          echo "  Env:"
          echo "    JULIA_NUM_THREADS=4"
          echo "    PYSR_TIMEOUT=${{ github.event.inputs.pysr_timeout || '1100' }}"
          echo "    RESULTS_DIR=${RESULTS_DIR}"

      # ── Ensure checkpoint exists before cache save ──────────────────────────
      # actions/cache/save@v5 errors with "Cache save failed" when the target
      # path doesn't exist. This happens when the script crashes, times out, or
      # --shard is not yet implemented and the file is never written.
      # We write a minimal stub so the save always succeeds, and the next run
      # can detect a fresh start (completed=[]) vs real partial progress.
      - name: Ensure checkpoint file exists
        if: always()
        run: |
          CHECKPOINT="${{ github.workspace }}/logs/exp2_sym_checkpoint_shard${{ matrix.shard }}.json"
          if [ -f "$CHECKPOINT" ]; then
            COUNT=$(jq -r '.completed | length' "$CHECKPOINT" 2>/dev/null || echo "?")
            echo "Checkpoint present — $COUNT equations completed"
          else
            mkdir -p "${{ github.workspace }}/logs"
            echo '{"completed":[],"shard":"${{ matrix.shard }}/5","stub":true}' > "$CHECKPOINT"
            echo "No checkpoint written by script — saved empty stub for shard ${{ matrix.shard }}"
          fi

      # ── Save checkpoint cache ───────────────────────────────────────────────
      # Runs even on failure or timeout so partial progress is preserved
      # for the next resume run.
      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/logs/exp2_sym_checkpoint_shard${{ matrix.shard }}.json
          key: sym-engine-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-${{ github.run_id }}

      # ── Artifacts ──────────────────────────────────────────────────────────
      - name: Upload exp2_sym run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-sym-engine-log-shard${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/exp2_sym_run_shard${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload checkpoint JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-sym-engine-checkpoint-shard${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ github.workspace }}/logs/exp2_sym_checkpoint_shard${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload full results directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-sym-engine-results-shard${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
