name: Auto-patch audit notebooks (FIX-D1 / FIX-N4)

# Automatic trigger conditions:
#   1. A new/updated corrected DeFi result file lands under
#      hypatiax/data/results/defi/ (i.e. a benchmark rerun completed and
#      was committed) -- this is the event that actually resolves FIX-D1.
#   2. issue_registry.json or paper_targets.json changes -- a status flip
#      there should be reflected in the notebooks, not just asserted in JSON.
#   3. Manual dispatch, for re-running on demand.
#   4. Weekly schedule, as a drift-detector safety net even if nothing
#      else triggered it (catches cases where a result file was committed
#      without CI running, e.g. a direct push that skipped hooks).
on:
  push:
    branches: [master]
    paths:
      - "hypatiax/data/results/defi/hypatix_defi_benchmark_v3c_corrected_*.json"
      - "issue_registry.json"
      - "paper_targets.json"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  check-drift:
    # Runs on every trigger, including PRs implicitly via push to main.
    # Fails the job (non-zero exit) if the notebooks are stale relative to
    # what update_notebooks.py would apply -- this is the CI gate.
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.check.outputs.drift }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for pending notebook status drift
        id: check
        run: |
          set +e
          python3 scripts/patches/update_notebooks.py --check
          code=$?
          if [ $code -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected exit code $code from update_notebooks.py"
            exit $code
          fi

  apply-and-verify:
    needs: check-drift
    if: needs.check-drift.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook execution deps
        run: pip install nbconvert jupyter-client ipykernel --quiet

      - name: Apply notebook patches (status text + stage result file)
        run: python3 scripts/patches/update_notebooks.py

      - name: Actually execute notebooks — do not trust the patch alone
        # This is the step that matters: a status-text patch with no live
        # execution check would repeat the exact "0 open issues" banner
        # mismatch this audit process exists to catch. Both notebooks
        # must genuinely produce [OK], not just claim to.
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/NB-04_Numerical_Consistency_Checker.ipynb
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb

      - name: Verify Step 6c / Step 3c actually report OK (not MISSING/FAIL)
        run: |
          python3 - <<'PY'
          import json, sys

          checks = [
              ("notebooks/NB-04_Numerical_Consistency_Checker.ipynb",
               "FIX-D1: corrected DeFi benchmark file check"),
              ("notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb",
               "FIX-D1: corrected DeFi benchmark verification"),
          ]
          failed = False
          for path, marker in checks:
              nb = json.load(open(path))
              found = False
              for cell in nb["cells"]:
                  src = cell.get("source", "")
                  if isinstance(src, list):
                      src = "".join(src)
                  if marker not in src or cell["cell_type"] != "code":
                      continue
                  found = True
                  text = "".join(
                      "".join(o.get("text", []))
                      if isinstance(o.get("text"), list) else o.get("text", "")
                      for o in cell.get("outputs", [])
                  )
                  if "[MISSING]" in text or "[FAIL]" in text:
                      print(f"FAIL: {path} still shows MISSING/FAIL after patch+execute")
                      print(text)
                      failed = True
                  elif text.count("[OK]") < 3:
                      print(f"FAIL: {path} did not produce the expected 3+ [OK] lines")
                      failed = True
                  else:
                      print(f"PASS: {path} — live execution confirms [OK]")
              if not found:
                  print(f"FAIL: {path} — could not locate the FIX-D1 check cell at all")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Commit patched notebooks + staged result file together
        # Deliberately one commit for both — a notebook-only commit without
        # the result file (or vice versa) is the exact failure mode this
        # whole process exists to prevent.
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add notebooks/NB-04_Numerical_Consistency_Checker.ipynb \
                  notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb \
                  hypatiax/data/results/defi/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "auto: patch NB-04/NB-06 status text for FIX-D1/FIX-N4 (verified by live execution)"
          git push
