name: Exp 2 — HypatiaX v5.3 Feynman Extrapolation · run_all.sh (n=30)

# Mirrors the exp2_feynman step from run_all.sh:
#   bash run_all.sh --step exp2_feynman
# Runs exp2_feynman_colab_multithreaded.py directly (no notebook kernel),
# so output streams live to the Actions log without buffering.
#
# Differences vs ci_exp2_hypatiax_v53_feynman.yml (notebook-based):
#   • Python 3.12 (run_all.sh requires 3.12+, notebook used 3.11)
#   • Adds torch, anthropic, sympy (run_all.sh env_check requirements)
#   • FEYNMAN_TIMEOUT=1100 s (paper value; matches notebook)
#   • PYSR_POPULATIONS=4 (4 vCPUs on ubuntu-latest; paper used 2)
#   • Runs the Python script directly — no nbconvert, no path-patching step
#   • Results land in hypatiax/data/results/ (matches run_all.sh RESULTS_DIR)
#
# Bug fixes vs original:
#   • FIX: checkpoint self-copy — CHECKPOINT_SRC and CHECKPOINT_DST resolved to
#     the same path (both under github.workspace/hypatiax/data/results/…).
#     Checkpoints now staged in $GITHUB_WORKSPACE/logs/ which is outside
#     RESULTS_DIR, making src ≠ dst and the cp meaningful.
#   • FIX: --resume never reached the script — RESUME was set as an env var
#     but the python3 invocation only passed --samples and --no-llm-cache.
#     Now forwarded as a CLI flag consistent with the sym-engine workflow.
#
# Sharding (plan + 2 parallel worker jobs):
#   • plan job — restores the shared checkpoint, computes pending equations,
#     splits them into 2 JSON arrays, outputs shard0_ids / shard1_ids.
#   • run-exp2-feynman-sh workers — receive --equation-ids from plan outputs;
#     never slice by blind index, always run exactly what they're told.
#   • fail-fast: false — a single shard timeout doesn't cancel the sibling
#
# FIX: previously each shard independently decided its own slice by positional
# index, which broke resume: partial results in the checkpoint did not align
# with a clean 0–14 / 15–29 split, causing equations to be re-run or skipped.

on:
  push:
    branches: [master]
    paths:
      - 'hypatiax/experiments/benchmarks/exp2_feynman_colab_multithreaded.py'
      - '.github/workflows/ci_exp2_hypatiax_v53_feynman_sh.yml'
      - 'run_all.sh'
  pull_request:
    branches: [master]
    paths:
      - 'hypatiax/experiments/benchmarks/exp2_feynman_colab_multithreaded.py'
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 01:30 BST — job 4 of 4 (+13 h from job 3)
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint (true/false)'
        required: false
        default: 'true'
      feynman_timeout:
        description: 'PySR timeout per equation in seconds (blank = read from repro.yaml)'
        required: false
        default: ''
      feynman_samples:
        description: 'Training samples per equation (blank = 200)'
        required: false
        default: '200'
      pysr_populations:
        description: 'PySR populations (blank = read from repro.yaml)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run only — print commands, skip execution (true/false)'
        required: false
        default: 'false'

jobs:

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shard0_ids: ${{ steps.split.outputs.shard0_ids }}
      shard1_ids: ${{ steps.split.outputs.shard1_ids }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RESULTS_DIR: ${{ github.workspace }}/hypatiax/data/results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore the shared checkpoint so plan can compute pending equations.
      # FIX B4: restore-keys no longer include the bare "feynman-sh-checkpoint-"
      # suffix. That prefix matches per-shard worker cache entries (which carry
      # a shard index in their keys), so the plan job could have loaded a partial
      # single-shard checkpoint and computed a wrong pending-equation list.
      # The branch-scoped fallback is enough; cross-branch fallback is intentionally dropped.
      - name: Restore shared checkpoint cache
        id: checkpoint-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/logs/exp2_feynman_checkpoint.json
          key: feynman-sh-checkpoint-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            feynman-sh-checkpoint-${{ github.ref_name }}-

      - name: Seed checkpoint from committed results (cache miss only)
        if: steps.checkpoint-restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/logs"
          COMMITTED="${RESULTS_DIR}/comparison_results/feynman-tests/exp2/exp2_feynman_checkpoint.json"
          STAGED="${{ github.workspace }}/logs/exp2_feynman_checkpoint.json"
          if [ -f "$COMMITTED" ]; then
            cp "$COMMITTED" "$STAGED"
            N=$(python3 -c "import json; d=json.load(open('$STAGED')); print(len([k for k in d if not k.startswith('_')]))" 2>/dev/null || echo "?")
            echo "Seeded from committed checkpoint (${N} equations done)"
          else
            echo '{}' > "$STAGED"
            echo "No committed checkpoint found — starting fresh"
          fi

      # Compute pending equations and split them into 2 balanced JSON arrays.
      # Write the script to a temp file to avoid YAML/heredoc indentation issues.
      - name: Compute and split pending equations
        id: split
        run: |
          cat > /tmp/plan_split.py << 'ENDOFSCRIPT'
          import json, os, pathlib
          ALL_IDS = [
            "I.6.2", "I.12.2", "I.15.10", "I.34.8", "I.50.26",
            "I.12.4", "I.34.27", "II.34.29b", "I.34.14", "II.2.42",
            "I.26.2", "II.11.3", "I.18.12", "I.37.4", "II.11.27",
            "I.41.16", "custom.hbar_omega", "II.34.2a", "III.4.32",
            "I.12.1", "custom.kepler_period", "II.11.17", "I.30.5",
            "I.29.4", "I.48.2", "I.34.27b", "I.34.10",
            "II.2.4", "I.43.31", "II.34.29a",
          ]
          ckpt = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "logs" / "exp2_feynman_checkpoint.json"
          try:
            done = {k for k in json.loads(ckpt.read_text()) if not k.startswith('_')}
          except Exception:
            done = set()
          pending = [e for e in ALL_IDS if e not in done]
          mid = len(pending) // 2
          s0, s1 = pending[:mid], pending[mid:]
          print(f"Checkpoint: {len(done)}/30 done, {len(pending)} pending")
          print(f"Shard 0 ({len(s0)}): {s0}")
          print(f"Shard 1 ({len(s1)}): {s1}")
          gho = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with gho.open('a') as f:
            f.write(f"shard0_ids={json.dumps(s0)}\n")
            f.write(f"shard1_ids={json.dumps(s1)}\n")
          ENDOFSCRIPT
          python3 /tmp/plan_split.py

  run-exp2-feynman-sh:
    needs: plan
    runs-on: ubuntu-latest
    # 2 parallel shards × ~15 equations each.
    # Worst case: ~48 min/eq × 15 eq + ~10 min Julia JIT warmup ≈ 13 h — still
    # over the 6 h limit. For a guaranteed sub-6 h run use a self-hosted runner
    # or increase the shard count. For smoke-testing one equation this is fine.
    timeout-minutes: 360
    strategy:
      fail-fast: false          # a timed-out shard doesn't cancel the sibling
      matrix:
        shard: [0, 1]           # shard index only used for cache/artifact naming

    env:
      # ── Node.js 24 opt-in (silences deprecation warnings for all actions) ──
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      # ── Julia ──────────────────────────────────────────────────────────────
      JULIA_VERSION: "1.11.5"
      JULIA_MINOR: "1.11"
      JULIA_NUM_THREADS: "4"          # ubuntu-latest: 4 vCPUs
      JULIA_EXCLUSIVE: "0"
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"   # segfault guard; set before any juliacall import

      # ── PySR hyperparameters (Table 23 / run_all.sh) ───────────────────────
      PYSR_GENERATIONS: "10000"
      PYSR_POPULATION: "100"
      PYSR_TOURNAMENT_SIZE: "3"
      PYSR_CROSSOVER: "0.9"
      PYSR_MUTATION: "0.1"
      PYSR_PARETO_PRESSURE: "0.001"
      PYSR_SEED: "42"
      PYSR_PARALLELISM: "multithreading"   # immune to ProcessExitedException

      # ── LLM ────────────────────────────────────────────────────────────────
      LLM_MODEL: "claude-sonnet-4-20250514"
      # Secret injected directly — avoids echoing the masked value in shell logs
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Paths (mirrors run_all.sh RESULTS_DIR / EXPERIMENTS_DIR) ───────────
      RESULTS_DIR: ${{ github.workspace }}/hypatiax/data/results
      EXPERIMENTS_DIR: ${{ github.workspace }}/hypatiax/experiments/benchmarks

    steps:
      # ── Repo ───────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python 3.12 (run_all.sh requirement) ───────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        # Matches run_all.sh env_check: pysr, torch, anthropic, sympy, scipy
        # plus scikit-learn, numpy, pandas used by exp2_feynman script directly
        # FIX: torch installed separately so --index-url applies only to it.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            pysr \
            anthropic \
            sympy \
            scikit-learn \
            scipy \
            numpy \
            pandas

      # ── Julia ──────────────────────────────────────────────────────────────
      - name: Install Julia ${{ env.JULIA_VERSION }}
        run: |
          TARBALL="julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          URL="https://julialang-s3.julialang.org/bin/linux/x64/${JULIA_MINOR}/${TARBALL}"
          wget -q "$URL"
          tar -xzf "$TARBALL"
          echo "${GITHUB_WORKSPACE}/julia-${JULIA_VERSION}/bin" >> "$GITHUB_PATH"

      # FIX: use block scalar (|) so the single quotes inside the julia -e
      # argument are not interpreted by the YAML parser.
      - name: Verify Julia threads
        run: |
          julia -e 'println("Julia threads: ", Threads.nthreads())'

      # ── env_check (mirrors run_all.sh STEP 0) ──────────────────────────────
      - name: Environment check (mirrors run_all.sh env_check)
        run: |
          echo "Python: $(python3 --version)"
          python3 -c "import pysr;      print('PySR:        ', pysr.__version__)"
          python3 -c "import torch;     print('PyTorch:     ', torch.__version__)"
          python3 -c "import anthropic; print('anthropic SDK: ok')"
          python3 -c "import sympy;     print('SymPy:       ', sympy.__version__)"
          python3 -c "import scipy;     print('SciPy:       ', scipy.__version__)"
          python3 -c "import sklearn;   print('scikit-learn:', sklearn.__version__)"
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "ERROR: ANTHROPIC_API_KEY not set"; exit 1; }
          echo "ANTHROPIC_API_KEY: set (${#ANTHROPIC_API_KEY} chars)"
          echo "JULIA_NUM_THREADS: ${JULIA_NUM_THREADS}"
          echo "FEYNMAN_SAMPLES:   ${{ github.event.inputs.feynman_samples || '200' }}"
          echo "RESULTS_DIR:       ${RESULTS_DIR}"
          echo "=== repro.yaml (paper-quality values) ==="
          python3 "${{ github.workspace }}/.github/scripts/print_repro.py"
          echo "SHARD:             (assigned by plan job)"

      # ── Directory structure (mirrors run_all.sh env_check mkdir -p) ─────────
      - name: Create results directory structure
        run: |
          mkdir -p \
            "${RESULTS_DIR}/comparison_results/feynman-tests/exp2" \
            "${RESULTS_DIR}/comparison_results/feynman-tests/noise-sweep" \
            "${RESULTS_DIR}/comparison_results/noise-noiseless/noiseless" \
            "${RESULTS_DIR}/comparison_results/noise-noiseless/15" \
            "${RESULTS_DIR}/comparison_results/extrapolation" \
            "${RESULTS_DIR}/extrapolation" \
            "${RESULTS_DIR}/hybrid_llm_nn/all_domains" \
            "${RESULTS_DIR}/hybrid_llm_nn/defi" \
            "${RESULTS_DIR}/hybrid_pysr/all_domains" \
            "${RESULTS_DIR}/hybrid_pysr/defi" \
            "${RESULTS_DIR}/llm_guided/all_domains" \
            "${RESULTS_DIR}/llm_guided/defi" \
            "${RESULTS_DIR}/standalone_llm_nn" \
            "${RESULTS_DIR}/figures" \
            "${RESULTS_DIR}/tables" \
            "${{ github.workspace }}/logs"   # staging area for per-shard checkpoints

      # ── Checkpoint cache (resume support) ──────────────────────────────────
      # Checkpoints are staged in $GITHUB_WORKSPACE/logs/ — outside RESULTS_DIR —
      # so CHECKPOINT_SRC (git-committed, inside the workspace clone) and
      # CHECKPOINT_DST (the staging area) are always different paths.
      # This was the root bug in the original: both paths resolved to the same
      # absolute location, making cp a no-op and leaving the script without
      # any checkpoint to resume from.
      #
      # Key strategy:
      #   Primary : branch + shard + run_id → always unique, always saves fresh data
      #   Fallback: branch + shard prefix   → picks up the most recent run's checkpoint for this shard
      # FIX B2: the shard index is now part of every key. Previously both shards
      # used an identical key, so whichever finished last silently overwrote the
      # other shard's partial progress.
      - name: Restore checkpoint cache
        id: checkpoint-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/logs/exp2_feynman_checkpoint_shard${{ matrix.shard }}.json
          key: feynman-sh-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            feynman-sh-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-

      # ── Seed checkpoint from committed results (cache miss only) ────────────
      # FIX B3: the old seed step sliced ALL_IDS by blind positional index
      # (0-14 / 15-29), ignoring the plan-computed pending list entirely.
      # On a cache miss the checkpoint was therefore seeded with a fixed half
      # rather than the equations actually assigned to this shard by the plan job.
      # Now we filter the committed master checkpoint by the plan-output shard IDs.
      - name: Seed checkpoint from committed results
        if: steps.checkpoint-restore.outputs.cache-hit != 'true'
        run: |
          STAGED="${{ github.workspace }}/logs/exp2_feynman_checkpoint_shard${{ matrix.shard }}.json"
          COMMITTED_MASTER="${RESULTS_DIR}/comparison_results/feynman-tests/exp2/exp2_feynman_checkpoint.json"

          # Derive this shard's equation list from plan outputs (same source of truth
          # the main run step uses), not from a hard-coded positional index.
          SHARD_IDS='${{ matrix.shard == 0 && needs.plan.outputs.shard0_ids || needs.plan.outputs.shard1_ids }}'

          if [ -f "$COMMITTED_MASTER" ]; then
            # Filter master checkpoint to only the keys assigned to this shard.
            jq --argjson keys "$SHARD_IDS" \
              'with_entries(select(.key as $k | $keys | index($k) != null))' \
              "$COMMITTED_MASTER" > "$STAGED"
            N=$(jq 'keys | length' "$STAGED" 2>/dev/null || echo "?")
            echo "Seeded shard ${{ matrix.shard }} checkpoint (${N} equations) from committed master"
          else
            echo '{}' > "$STAGED"
            echo "No committed checkpoint found — shard ${{ matrix.shard }} starts from scratch"
          fi

      # ── exp2_feynman (mirrors run_all.sh STEP 5) ───────────────────────────

      # Pre-flight: verify the script exists and imports resolve before the
      # real run. Any crash here surfaces as a clear error, not silent pipe death.
      - name: Pre-flight — verify script and imports
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        env:
          PYTHONUNBUFFERED: "1"
          PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
          JULIA_NUM_THREADS: "4"
        run: |
          echo "=== working directory ==="
          pwd
          echo "=== script present ==="
          ls -lh exp2_feynman_colab_multithreaded.py
          echo "=== import check ==="
          python3 -c "import py_compile, sys; py_compile.compile('exp2_feynman_colab_multithreaded.py', doraise=True); print('syntax OK')"
          python3 exp2_feynman_colab_multithreaded.py --help > /dev/null && echo "imports + argparse OK" 

      # Main run.
      # PYTHONUNBUFFERED=1 — forces Python to flush every print() immediately
      #                      instead of accumulating an 8 KB pipe buffer.
      # python3 -u         — belt-and-braces unbuffered flag alongside the env var.
      # --resume           — FIX: was set only as RESUME env var; script never
      #                      received it as a CLI flag. Now forwarded explicitly.
      # --equation-ids    — JSON array from plan job; no blind positional slicing.
      # --checkpoint       — points the script at the per-shard staging file.
      - name: Run exp2_feynman — Feynman SR benchmark Phase 2 (shard ${{ matrix.shard }}/2)
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        env:
          PYTHONUNBUFFERED: "1"
          PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
          JULIA_NUM_THREADS: "4"
          # All paper-quality values come from repro.yaml read at runtime.
          # REPRO_CFG tells the script exactly where to find the file.
          REPRO_CFG: ${{ github.workspace }}/config/repro.yaml
          # CI dispatch overrides (absent = script reads repro.yaml directly).
          PYSR_POPULATIONS: ${{ github.event.inputs.pysr_populations || '' }}
          FEYNMAN_TIMEOUT: ${{ github.event.inputs.feynman_timeout || '' }}
          FEYNMAN_SAMPLES: ${{ github.event.inputs.feynman_samples || '200' }}
          FEYNMAN_NOISELESS_THRESHOLD: "0.9999"
          # PYSR_FIT_WALL_TIMEOUT / PYSR_FIT_GRACE_SECS / METHOD_TIMEOUT:
          # NOT set here — script reads them from repro.yaml via REPRO_CFG.
          RESUME: ${{ github.event.inputs.resume || 'true' }}
          # GITHUB_TOKEN: needed by _push_result_to_branch to push the results branch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          LOG="${RESULTS_DIR}/comparison_results/feynman-tests/exp2/exp2_run_shard${{ matrix.shard }}.log"
          CHECKPOINT="${{ github.workspace }}/logs/exp2_feynman_checkpoint_shard${{ matrix.shard }}.json"

          # Compute the wall-clock deadline: 330 min from now (30 min before the 360 min hard limit).
          # Exported so the Python script can read it and stop cleanly rather than being SIGKILL'd.
          export JOB_DEADLINE=$(python3 -c "import time; print(int(time.time()) + 330*60)")
          echo "JOB_DEADLINE set: $(python3 -c "import time,os; print(time.strftime('%H:%M:%S UTC', time.gmtime(int(os.environ['JOB_DEADLINE']))))")"

          ARGS="--samples ${{ github.event.inputs.feynman_samples || '200' }}"
          ARGS="$ARGS --checkpoint $CHECKPOINT"
          ARGS="$ARGS --no-llm-cache"
          if [[ "${{ github.event.inputs.resume || 'true' }}" == "true" ]]; then
            ARGS="$ARGS --resume"
          fi

          # FIX B1: consume the plan job's outputs so each worker runs only
          # the equations assigned to its shard, not all 30 unconditionally.
          SHARD_IDS='${{ matrix.shard == 0 && needs.plan.outputs.shard0_ids || needs.plan.outputs.shard1_ids }}'
          ARGS="$ARGS --equation-ids $SHARD_IDS"

          python3 -u exp2_feynman_colab_multithreaded.py $ARGS \
            2>&1 | tee "$LOG"

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        working-directory: ${{ env.EXPERIMENTS_DIR }}
        run: |
          echo "[dry-run] shard ${{ matrix.shard }}/2 would execute:"
          echo "  python3 -u exp2_feynman_colab_multithreaded.py \\"
          echo "    --samples ${{ github.event.inputs.feynman_samples || '200' }} \\"
          echo "    --equation-ids '<from plan outputs>' \\"
          echo "    --checkpoint ${{ github.workspace }}/logs/feynman_checkpoint_shard${{ matrix.shard }}.json \\"
          echo "    --no-llm-cache \\"
          [[ "${{ github.event.inputs.resume || 'true' }}" == "true" ]] && echo "    --resume \\"
          echo ""
          echo "  Env:"
          echo "    JULIA_NUM_THREADS=${JULIA_NUM_THREADS}"
          echo "    PYSR_POPULATIONS=${{ github.event.inputs.pysr_populations || '30' }}"
          echo "    FEYNMAN_TIMEOUT=${{ github.event.inputs.feynman_timeout || '1100' }}"
          echo "    FEYNMAN_SAMPLES=${{ github.event.inputs.feynman_samples || '200' }}"
          echo "    RESULTS_DIR=${RESULTS_DIR}"

      # ── Ensure checkpoint exists before cache save ──────────────────────────
      # actions/cache/save@v5 errors with "Cache save failed" when the target
      # path doesn't exist. This happens when the script crashes, times out, or
      # --checkpoint is not yet written (crash/timeout before first equation).
      # We write a minimal stub so the save always succeeds, and the next run
      # can detect a fresh start (completed=[]) vs real partial progress.
      - name: Ensure checkpoint file exists
        if: always()
        run: |
          CHECKPOINT="${{ github.workspace }}/logs/exp2_feynman_checkpoint_shard${{ matrix.shard }}.json"
          if [ -f "$CHECKPOINT" ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('$CHECKPOINT')); print(len([k for k in d if not k.startswith('_')]))" 2>/dev/null || echo "?")
            echo "Checkpoint present — $COUNT equations completed"
          else
            mkdir -p "${{ github.workspace }}/logs"
            echo '{"_meta":{"stub":true}}' > "$CHECKPOINT"
            echo "No checkpoint written by script — saved empty stub"
          fi

      # ── Save checkpoint cache ───────────────────────────────────────────────
      # Runs even if the experiment step was skipped (dry-run) or failed
      # mid-way, so partial progress is preserved for the next resume.
      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/logs/exp2_feynman_checkpoint_shard${{ matrix.shard }}.json
          key: feynman-sh-checkpoint-shard${{ matrix.shard }}-${{ github.ref_name }}-${{ github.run_id }}

      # ── Artifacts ──────────────────────────────────────────────────────────
      - name: Upload exp2 run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-sh-log-shard${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/comparison_results/feynman-tests/exp2/exp2_run_shard${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload exp2 result JSONs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-sh-results-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}/comparison_results/feynman-tests/exp2/*.json
            ${{ env.RESULTS_DIR }}/comparison_results/feynman-tests/exp2/*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload full results directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-sh-all-shard${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: ignore
          retention-days: 30
