# ══════════════════════════════════════════════════════════════════════════════
# ci-colab.yml  — HypatiaX Notebook CI
# Runs HypatiaX_progressive_working_colab.ipynb automatically via nbconvert.
#
# Repo layout — notebook lives INSIDE LLM-HypatiaX-PAPERS-Public:
#
#   LLM-HypatiaX-PAPERS-Public/               ← this IS the GitHub repo
#   ├── .github/workflows/ci-colab.yml
#   ├── HypatiaX_progressive_working_colab.ipynb
#   ├── run_all_checkpoint.py
#   ├── requirements.txt
#   └── hypatiax/ ...
#
# At CI runtime github.workspace IS the repo root:
#
#   github.workspace/
#   ├── HypatiaX_progressive_working_colab.ipynb   ✓
#   ├── run_all_checkpoint.py                       ✓
#   ├── requirements.txt                            ✓
#   └── hypatiax/ ...                               ✓
#
# Three notebook cells compute the repo path.  The patcher (Step 6) rewrites
# all three so they never attempt to clone or look outside github.workspace:
#
#   Cell 1  (Restore Session)  — else-branch: REPO = Path('..') / GITHUB_REPO
#   Cell 16 (0-A Clone cell)   — else-branch: src  = Path.cwd().parent / GITHUB_REPO
#   Cell 20 (0-C sys.path)     — checks REPO_ROOT_PATH env-var first → safe as-is
#                                but patcher injects the env-var before any cell runs
#
# Secrets required (repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY   — Anthropic API key (sk-ant-...)
#
# Julia / PySR note:
#   exp1, exp1b, exp2, exp3, exp3b require Julia and are SKIPPED by default.
#   Set skip_julia to "false" on manual dispatch to enable — runtime 15-25 h;
#   a self-hosted or GitHub Large Runner is needed.
# ══════════════════════════════════════════════════════════════════════════════

name: HypatiaX Notebook CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.ipynb"
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/ci-colab.yml"
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full run — Sunday 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      fast_mode:
        description: "FAST=1 (smoke-test, ~minutes) or FAST=0 (paper-quality, 15-25 h)"
        required: false
        default: "1"
        type: choice
        options: ["0", "1"]
      skip_julia:
        description: "Skip Julia/PySR experiments (exp1/exp2/exp3/exp3b)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      only_exp:
        description: "Run only one experiment (e.g. exp1, exp3, supp_a). Leave blank for all."
        required: false
        default: ""

# Cancel in-progress runs on the same branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Reproducibility seeds (match paper) ───────────────────────────────────
  NN_SEED: "42"
  PYSR_SEED: "42"
  PYTHONHASHSEED: "42"

  # ── Default timeouts (paper-quality; overridden in FAST mode) ─────────────
  METHOD_TIMEOUT: "900"
  PYSR_TIMEOUT: "1100"

  # ── Notebook filename ─────────────────────────────────────────────────────
  NOTEBOOK: "HypatiaX_progressive_working_colab.ipynb"

  # ── Skip optional heavy deps if unavailable ───────────────────────────────
  SKIP_PKG_CHECK: "1"
  HYPATIAX_CORE_OPTIONAL: "1"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  run-notebook:
    name: Run HypatiaX Notebook
    runs-on: ubuntu-latest          # swap for self-hosted GPU runner for full runs
    timeout-minutes: 360            # 6 h cap; increase to 1440 for paper-quality

    steps:
      # ── 1. Checkout LLM-HypatiaX-PAPERS-Public ────────────────────────────
      # After this step github.workspace == repo root == where hypatiax/ lives.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1b. Restore checkpoint cache ──────────────────────────────────────
      # Restores HypatiaX_persistent/ from a previous run so already-completed
      # experiments are skipped automatically on re-runs.
      - name: Restore checkpoint cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/HypatiaX_persistent
          key: hypatiax-checkpoint-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            hypatiax-checkpoint-${{ github.ref_name }}-

      # ── 2. Set up Python 3.12 ─────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install Python dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Core notebook runner
          pip install jupyter nbconvert nbformat ipykernel
          # HypatiaX requirements (exclude pysr — needs Julia, handled separately)
          if [ -f "requirements.txt" ]; then
            grep -v -i pysr requirements.txt | pip install -r /dev/stdin || true
          fi
          pip install anthropic pint python-dotenv pyyaml \
                      scikit-learn numpy pandas gitpython==3.1.47
          # Register the kernel
          python -m ipykernel install --user --name python3

      # ── 4. (Optional) Install Julia + PySR ────────────────────────────────
      - name: Install Julia and PySR
        if: >
          github.event.inputs.skip_julia != 'true' &&
          github.event_name != 'push' &&
          github.event_name != 'pull_request'
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes
          echo "$HOME/.juliaup/bin" >> $GITHUB_PATH
          julia --version
          pip install pysr
          python -c "import pysr; pysr.install()"

      # ── 5. Configure environment variables ────────────────────────────────
      - name: Configure environment variables
        run: |
          # FAST mode (default 1 = smoke-test)
          FAST_VAL="${{ github.event.inputs.fast_mode }}"
          echo "FAST=${FAST_VAL:-1}" >> $GITHUB_ENV

          # Skip Julia experiments unless explicitly enabled
          SKIP_JULIA="${{ github.event.inputs.skip_julia }}"
          echo "SKIP_JULIA_EXPERIMENTS=${SKIP_JULIA:-true}" >> $GITHUB_ENV

          # Persistent storage: workspace subfolder (no Drive in CI)
          PERSISTENT="${{ github.workspace }}/HypatiaX_persistent"
          mkdir -p "$PERSISTENT"
          echo "PERSISTENT_DIR=$PERSISTENT" >> $GITHUB_ENV

          # CRITICAL: github.workspace IS the repo root (notebook lives inside it).
          # Setting these env vars causes Cell 20 (0-C) to use the correct path
          # directly, and the patcher (Step 6) rewrites Cells 1 and 16 to honour
          # them too — so Path.cwd().parent / GITHUB_REPO is never evaluated in CI.
          echo "REPRO_ROOT=${{ github.workspace }}"     >> $GITHUB_ENV
          echo "REPO_ROOT_PATH=${{ github.workspace }}" >> $GITHUB_ENV

          # Relax timeouts in FAST mode
          if [ "${FAST_VAL:-1}" = "1" ]; then
            echo "METHOD_TIMEOUT=120" >> $GITHUB_ENV
            echo "PYSR_TIMEOUT=180"   >> $GITHUB_ENV
            echo "ONE_EQUATION=1"     >> $GITHUB_ENV
          fi

          # Anthropic API key from GitHub Secret
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV

      # ── 6. Patch notebook for headless CI execution ────────────────────────
      # What this step fixes:
      #
      #   Cell 1  (Restore Session) — the else-branch sets:
      #       REPO = Path('..') / GITHUB_REPO
      #     which is wrong when the notebook sits inside the repo.
      #     Patched to:
      #       REPO = Path(os.environ['REPO_ROOT_PATH'])
      #     and the clone + Drive-mount blocks are skipped (repo is already checked out).
      #
      #   Cell 16 (0-A Clone cell) — the else-branch sets:
      #       src = Path.cwd().parent / GITHUB_REPO
      #     same problem.  Patched to:
      #       src = Path(os.environ['REPO_ROOT_PATH'])
      #     and the git-clone block is a no-op (repo is already present).
      #
      #   Cell 20 (0-C sys.path) — already checks REPO_ROOT_PATH first; safe as-is.
      #     The preamble ensures the env var is set before this cell runs.
      #
      #   All cells containing drive.mount / userdata.get / UserSecretsClient
      #   are replaced with a CI no-op print statement.
      - name: Patch notebook for CI
        run: |
          python - <<'EOF'
          import json, re, pathlib, os, textwrap

          ws      = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          nb_path = ws / "HypatiaX_progressive_working_colab.ipynb"
          nb      = json.loads(nb_path.read_text())

          # ── CI preamble — injected into the very first code cell ──────────
          # Sets IS_COLAB/IS_KAGGLE/IS_CI and all path env vars BEFORE any
          # other cell executes.  Uses os.environ.get so a value already set
          # by the runner (Step 5) takes precedence.
          CI_PREAMBLE = textwrap.dedent("""\
              import os, sys, pathlib as _pl
              # ── CI overrides injected by ci-colab.yml ──────────────────
              _ws = os.environ.get('REPO_ROOT_PATH') or os.environ.get('REPRO_ROOT') or os.getcwd()
              os.environ['REPO_ROOT_PATH']    = _ws
              os.environ['REPRO_ROOT']        = _ws
              os.environ['PERSISTENT_DIR']    = os.environ.get('PERSISTENT_DIR', '/tmp/HypatiaX')
              os.environ['FAST']              = os.environ.get('FAST', '1')
              os.environ['ANTHROPIC_API_KEY'] = os.environ.get('ANTHROPIC_API_KEY', '')
              IS_COLAB  = False
              IS_KAGGLE = False
              IS_CI     = True
              _pl.Path(os.environ['PERSISTENT_DIR']).mkdir(parents=True, exist_ok=True)
              _pl.Path(os.environ['REPRO_ROOT']).mkdir(parents=True, exist_ok=True)
              sys.path.insert(0, os.environ['REPRO_ROOT'])
              os.chdir(os.environ['REPRO_ROOT'])
              print('[CI] preamble: REPRO_ROOT =', os.environ['REPRO_ROOT'])
              # ────────────────────────────────────────────────────────────
          """)

          # Inject into first code cell
          for cell in nb['cells']:
              if cell['cell_type'] == 'code':
                  cell['source'] = CI_PREAMBLE + ''.join(cell['source'])
                  break

          # ── Patterns that identify Colab/Kaggle-only cells ────────────────
          SKIP_CELL_RE = re.compile(
              r'drive\.mount'
              r'|userdata\.get'
              r'|UserSecretsClient'
              r'|from google\.colab import drive'
          )

          # ── Cell 1 fix: Restore Session ───────────────────────────────────
          # Replace the wrong else-branch that sets REPO = Path('..') / GITHUB_REPO
          # and attempts a git clone.  In CI the repo is already checked out at
          # REPO_ROOT_PATH; we just point REPO there and skip the clone.
          CELL1_OLD = "    REPO = Path('..') / GITHUB_REPO"
          CELL1_NEW = (
              "    # [CI] notebook lives inside the repo — use REPO_ROOT_PATH\n"
              "    REPO = Path(os.environ.get('REPO_ROOT_PATH', os.getcwd()))"
          )

          # ── Cell 16 fix: 0-A Clone cell ───────────────────────────────────
          # Replace the wrong else-branch that sets src = Path.cwd().parent / GITHUB_REPO
          CELL16_OLD = "    src = Path.cwd().parent / GITHUB_REPO   # local: sibling of notebook directory"
          CELL16_NEW = (
              "    # [CI] notebook lives inside the repo — use REPO_ROOT_PATH\n"
              "    src = Path(os.environ.get('REPO_ROOT_PATH', os.getcwd()))"
          )

          for cell in nb['cells']:
              if cell['cell_type'] != 'code':
                  continue
              src_text = ''.join(cell['source'])

              # Skip Drive-mount / secret cells
              if SKIP_CELL_RE.search(src_text):
                  cell['source'] = [
                      "# [CI] Skipped — Drive/Colab-secrets unavailable in CI\n",
                      "print('[CI] Drive mount / secret cell skipped')\n",
                  ]
                  continue

              # Fix Cell 1 (Restore Session) — wrong else-branch REPO path
              if CELL1_OLD in src_text:
                  cell['source'] = src_text.replace(CELL1_OLD, CELL1_NEW)
                  # Also neutralise the git-clone block inside the restore cell:
                  # the repo is already present so the `if not REPO.exists()` branch
                  # will never fire — no further surgery needed.
                  print('[CI patcher] Cell 1 (Restore Session): REPO path fixed')

              # Fix Cell 16 (0-A Clone) — wrong else-branch src path
              if CELL16_OLD in src_text:
                  cell['source'] = src_text.replace(CELL16_OLD, CELL16_NEW)
                  print('[CI patcher] Cell 16 (0-A Clone): src path fixed')

          nb_path.write_text(json.dumps(nb, indent=1))
          print(f'[CI patcher] Written: {nb_path}')
          EOF

      # ── 7. Smoke-test: verify the patched notebook parses cleanly ──────────
      - name: Verify patched notebook
        run: |
          python - <<'EOF'
          import json, pathlib, os, sys

          ws      = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          nb_path = ws / "HypatiaX_progressive_working_colab.ipynb"
          nb      = json.loads(nb_path.read_text())

          issues = []
          for i, cell in enumerate(nb['cells']):
              if cell['cell_type'] != 'code':
                  continue
              src = ''.join(cell['source'])
              # These strings must NOT appear after patching
              bad = [
                  "Path('..') / GITHUB_REPO",
                  "Path.cwd().parent / GITHUB_REPO",
                  "drive.mount",
              ]
              for b in bad:
                  if b in src:
                      issues.append(f"  Cell {i}: still contains '{b}'")

          if issues:
              print("PATCH VERIFICATION FAILED:")
              for iss in issues:
                  print(iss)
              sys.exit(1)
          else:
              print(f"✓ Patch verification passed ({len(nb['cells'])} cells checked)")
          EOF

      # ── 8. Execute the notebook ────────────────────────────────────────────
      # --allow-errors: record cell errors in output and keep going rather than
      # aborting — ensures executed_notebook.ipynb is always written.
      # continue-on-error: true — lets Steps 9/10 (HTML + upload) always run.
      - name: Execute notebook
        continue-on-error: true
        run: |
          ONLY="${{ github.event.inputs.only_exp }}"
          [ -n "$ONLY" ] && export HYPATIAX_ONLY_EXP="$ONLY"

          jupyter nbconvert \
            --to notebook \
            --execute \
            --allow-errors \
            --ExecutePreprocessor.timeout=21600 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output "${{ github.workspace }}/executed_notebook.ipynb" \
            "${{ github.workspace }}/${{ env.NOTEBOOK }}"

      # ── 8b. Fallback — copy source notebook if execution never wrote output ──
      # Guarantees the artifact upload always has a file to work with.
      - name: Ensure executed notebook exists (fallback)
        if: always()
        run: |
          NB="${{ github.workspace }}/executed_notebook.ipynb"
          if [ ! -f "$NB" ]; then
            echo "[CI] Execution did not produce output — copying source notebook as fallback"
            cp "${{ github.workspace }}/${{ env.NOTEBOOK }}" "$NB"
          fi

      # ── 9. Convert executed notebook to HTML report ────────────────────────
      - name: Convert notebook to HTML
        if: always()
        run: |
          NB="${{ github.workspace }}/executed_notebook.ipynb"
          [ -f "$NB" ] && jupyter nbconvert --to html "$NB" \
            --output "${{ github.workspace }}/notebook_report.html"

      # ── 10. Collect all result files into one folder ──────────────────────
      # Gathers notebook, HTML report, experiment data, logs, and persistent
      # state into ci_results/ so the artifact upload always has a single
      # known root — even if individual sub-paths don't exist.
      - name: Collect results
        if: always()
        run: |
          RESULTS="${{ github.workspace }}/ci_results"
          mkdir -p "$RESULTS"

          # Notebook outputs
          cp -v "${{ github.workspace }}/executed_notebook.ipynb" "$RESULTS/" 2>/dev/null || true
          cp -v "${{ github.workspace }}/notebook_report.html"    "$RESULTS/" 2>/dev/null || true

          # Experiment data, logs, and persistent state
          for dir in \
            "${{ github.workspace }}/hypatiax/data/results" \
            "${{ github.workspace }}/logs" \
            "${{ env.PERSISTENT_DIR }}"; do
            if [ -d "$dir" ]; then
              cp -rv "$dir" "$RESULTS/"
            fi
          done

          echo "=== Files collected ==="
          find "$RESULTS" -type f | sort

      # ── 11. Upload all results (unified) ──────────────────────────────────
      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypatiax-results-${{ github.run_number }}
          path: ${{ github.workspace }}/ci_results/
          retention-days: 90
          if-no-files-found: warn

      # ── 12. Save checkpoint cache ──────────────────────────────────────────
      # Persists HypatiaX_persistent/ so the next run can skip completed steps.
      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/HypatiaX_persistent
          key: hypatiax-checkpoint-${{ github.ref_name }}-${{ github.run_number }}

      # ── 13. Post job summary ───────────────────────────────────────────────
      - name: Post run summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib, os

          ws = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", "."))
          summary = [
              "## HypatiaX Notebook Run Summary\n",
              f"- **FAST mode**: {os.environ.get('FAST','?')}\n",
              f"- **Skip Julia**: {os.environ.get('SKIP_JULIA_EXPERIMENTS','?')}\n",
              f"- **REPRO_ROOT**: `{os.environ.get('REPRO_ROOT','?')}`\n",
              f"- **Anthropic key present**: "
              f"{'yes' if os.environ.get('ANTHROPIC_API_KEY') else 'NO — LLM cells will fail'}\n",
          ]

          # Checkpoint
          for cp in [
              pathlib.Path(os.environ.get('PERSISTENT_DIR','')) / 'pipeline_checkpoint.json',
              ws / 'logs' / 'pipeline_checkpoint.json',
          ]:
              if cp.exists():
                  done = json.loads(cp.read_text()).get('completed', [])
                  summary.append(f"\n### Checkpoint\n- Completed: `{done}`\n")
                  break

          # Cell error summary
          nb = ws / 'executed_notebook.ipynb'
          if nb.exists():
              cells = json.loads(nb.read_text()).get('cells', [])
              code  = [c for c in cells if c['cell_type'] == 'code']
              errs  = [c for c in code
                       if any(o.get('output_type') == 'error'
                              for o in c.get('outputs', []))]
              summary += [
                  f"\n### Notebook\n- Code cells: {len(code)}\n",
                  f"- Cells with errors: {len(errs)}\n",
              ]
              for ec in errs[:5]:
                  for o in ec.get('outputs', []):
                      if o.get('output_type') == 'error':
                          summary.append(
                              f"  - `{o.get('ename')}: {o.get('evalue','')[:120]}`\n"
                          )

          out = pathlib.Path(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'))
          out.write_text(''.join(summary))
          print(''.join(summary))
          EOF
