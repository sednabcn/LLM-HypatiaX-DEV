  # ────────────────────────────────────────────────────────────────────────────
  # Job: deploy
  #
  # Deploys the Pages artifact produced by build-report.
  # Runs only after build-report succeeds.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to GitHub Pages"
    needs: build-report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
