name: "HypatiaX - CI Report & GitHub Pages"
run-name: "HypatiaX CI Report — run ${{ github.run_id }}"

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
#   • workflow_run on "HypatiaX - paper notebooks" completing (auto, primary).
#   • workflow_dispatch: manual re-runs, apply_fixes_only path, slot-13 dispatch.
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["HypatiaX - paper notebooks"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      no_notebooks:
        description: "Set to 'true' when dispatched from apply_fixes_only path (no NB artifacts exist)"
        required: false
        default: "false"
      summary_run_id:
        description: "Run ID of the ci_paper_notebooks run that produced the audit summary artifact"
        required: false
        default: ""

permissions:
  contents: read
  pages:    write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  REGISTRY_PATH: "_repo/scripts/patches/issue_registry.json"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job: build-report
  # ────────────────────────────────────────────────────────────────────────────
  build-report:
    name: "Build Combined Audit Report"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'

    steps:

      - name: Set run metadata
        id: set-run-meta
        run: echo "run_date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # ── Checkout scripts (build_report.py lives here) ─────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          path: _repo

      # ── Python + nbconvert ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --upgrade pip jupyter nbconvert

      # ── Step 1: Resolve the notebook run ID ──────────────────────────────
      # Writes notebooks_run_id to $GITHUB_OUTPUT.
      - name: Resolve notebook run ID
        id: resolve-run
        env:
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          EVENT_RUN_ID:    ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.summary_run_id }}
        run: python _repo/scripts/build_report.py resolve-run-id

      # ── Download the six executed-notebook artifacts ──────────────────────
      - name: Download NB-01 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-01_Citation_Bibliography_Audit
          path: notebooks/NB-01
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download NB-02 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-02_CrossReference_Label_Audit
          path: notebooks/NB-02
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download NB-03 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-03_Section_Structure_Numbering
          path: notebooks/NB-03
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download NB-04 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-04_Numerical_Consistency_Checker
          path: notebooks/NB-04
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download NB-05 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-05_Figure_Image_Dependency_Checker
          path: notebooks/NB-05
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download NB-06 artifact
        uses: actions/download-artifact@v4
        with:
          name: NB-06_Code_Quality_Pipeline_Integrity
          path: notebooks/NB-06
          run-id: ${{ steps.resolve-run.outputs.notebooks_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Show downloaded files
        run: find notebooks -type f | sort || echo "(none)"

      # ── Download supporting artifacts ─────────────────────────────────────
      - name: Download merged registry artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          NB_RUN:   ${{ steps.resolve-run.outputs.notebooks_run_id }}
        run: |
          mkdir -p /tmp/live_registry
          [[ -n "$NB_RUN" ]] && gh run download "$NB_RUN" \
            --repo "$REPO" \
            --name "issue-registry-merged-${NB_RUN}" \
            --dir "/tmp/live_registry" 2>/dev/null || true
          [[ -f "/tmp/live_registry/issue_registry.json" ]] \
            && echo "Live registry: $(wc -c < /tmp/live_registry/issue_registry.json) bytes" \
            || echo "::notice::Merged registry not found — will use checked-out version"

      - name: Checkout (for issue_registry.json)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          path: _repo

      - name: Download audit summary artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          SUM_RUN:  ${{ github.event.inputs.summary_run_id || steps.resolve-run.outputs.notebooks_run_id }}
        run: |
          mkdir -p /tmp/audit_summary
          [[ -n "$SUM_RUN" ]] && {
            gh run download "$SUM_RUN" --repo "$REPO" \
              --name "notebooks-audit-summary-${SUM_RUN}" \
              --dir /tmp/audit_summary 2>/dev/null || true
            gh run download "$SUM_RUN" --repo "$REPO" \
              --name "paper-audit-notebooks" \
              --dir /tmp/audit_summary 2>/dev/null || true
          }
          ls -la /tmp/audit_summary/ 2>/dev/null || echo "No audit summary artifacts downloaded"

      - name: Download hypatia inspector findings artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          SUM_RUN:  ${{ github.event.inputs.summary_run_id || steps.resolve-run.outputs.notebooks_run_id }}
        run: |
          mkdir -p /tmp/hypatia_findings
          [[ -n "$SUM_RUN" ]] && {
            gh run download "$SUM_RUN" --repo "$REPO" \
              --name "hypatia-findings-setup-${SUM_RUN}" \
              --dir /tmp/hypatia_findings 2>/dev/null || true
            gh run download "$SUM_RUN" --repo "$REPO" \
              --name "hypatia-findings-audit-${SUM_RUN}" \
              --dir /tmp/hypatia_findings 2>/dev/null || true
          }
          ls -la /tmp/hypatia_findings/ 2>/dev/null || echo "No hypatia findings artifacts downloaded"

      # ── Step 2: Build the full HTML report ───────────────────────────────
      - name: Build combined audit report
        env:
          GITHUB_RUN_ID:  ${{ github.run_id }}
          UPSTREAM_RUN:   ${{ steps.resolve-run.outputs.notebooks_run_id }}
          NO_NOTEBOOKS:   ${{ github.event.inputs.no_notebooks || 'false' }}
          REGISTRY_PATH:  ${{ env.REGISTRY_PATH }}
          SITE_DIR:       site
        run: python _repo/scripts/build_report.py build-report

      # ── Backup + Pages artifacts ──────────────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HypatiaX_Audit_Report
          path: site/index.html
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ────────────────────────────────────────────────────────────────────────────
  # Job: deploy
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to GitHub Pages"
    needs: build-report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
