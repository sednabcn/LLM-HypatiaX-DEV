name: "CI Report + Pages"
run-name: "CI Report — run ${{ github.run_id }}"

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install deps
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f notebooks/requirements.txt ]; then pip install -r notebooks/requirements.txt; fi

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      # Run notebooks
      - name: Execute notebooks
        run: |
          mkdir -p site
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir=site \
              --ExecutePreprocessor.timeout=600
          done

      # Convert to HTML
      - name: Convert to HTML
        run: |
          for nb in site/*.ipynb; do
            jupyter nbconvert --to html "$nb" --output-dir=site
          done

      # Create index page
      - name: Generate index.html
        run: |
          echo "<h1>CI Reports</h1><ul>" > site/index.html
          for f in site/*.html; do
            name=$(basename "$f")
            echo "<li><a href=\"$name\">$name</a></li>" >> site/index.html
          done
          echo "</ul>" >> site/index.html

      # Upload Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build-report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
