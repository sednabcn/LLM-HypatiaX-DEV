# ==============================================================================
# .github/workflows/ci_consolidate_experiment.yml
#
# Consolidates shard artifacts produced by the experiment workflow.
# Compatible with Python 3.12 and GitHub Actions artifact v4.
#
# Expected uploaded artifact names from experiment workflow:
#
#   results-<experiment>-shard1
#   results-<experiment>-shard2
#   results-<experiment>-shard3
#   results-<experiment>-shard4
#
# Example:
#   results-exp2_feynman-shard1
#
# ==============================================================================

name: "Consolidate experiment results"

on:
  workflow_run:
    workflows:
      - "HypatiaX - experiment runner . run_all.sh"
    types:
      - completed

  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment ID"
        required: true
        type: choice
        options:
          - exp1
          - exp1b
          - exp2_feynman
          - exp2
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap
        default: exp2_feynman

      run_id:
        description: "Optional source workflow run ID"
        required: false
        default: ""

permissions:
  actions: read
  contents: write

env:
  OUT_BASE: hypatiax/data/results

jobs:

  consolidate:
    name: Consolidate shard results
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Python
      # ----------------------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy

      # ----------------------------------------------------------------------
      # Resolve experiment ID
      # ----------------------------------------------------------------------
      - name: Resolve experiment ID
        id: experiment
        run: |
          EXPLICIT="${{ github.event.inputs.experiment }}"
          TITLE="${{ github.event.workflow_run.display_title }}"

          if [[ -n "$EXPLICIT" ]]; then
            EXP="$EXPLICIT"
          else
            EXP=$(echo "$TITLE" | sed 's/.*- \(.*\) \. .*/\1/')
          fi

          if [[ -z "$EXP" ]]; then
            echo "ERROR: failed to resolve experiment ID"
            exit 1
          fi

          echo "experiment=$EXP" >> "$GITHUB_OUTPUT"

          echo "Experiment:"
          echo "$EXP"

      # ----------------------------------------------------------------------
      # Resolve source run ID
      # ----------------------------------------------------------------------
      - name: Resolve source run ID
        id: runid
        run: |
          INPUT_RUN="${{ github.event.inputs.run_id }}"
          EVENT_RUN="${{ github.event.workflow_run.id }}"

          if [[ -n "$INPUT_RUN" ]]; then
            RID="$INPUT_RUN"
          else
            RID="$EVENT_RUN"
          fi

          if [[ -z "$RID" ]]; then
            echo "ERROR: failed to resolve run ID"
            exit 1
          fi

          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

          echo "Source Run ID:"
          echo "$RID"

      # ----------------------------------------------------------------------
      # Download artifacts
      # ----------------------------------------------------------------------
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.runid.outputs.run_id }}
          pattern: results-${{ steps.experiment.outputs.experiment }}-shard*
          path: downloaded_artifacts
          merge-multiple: true

      # ----------------------------------------------------------------------
      # Verify artifacts
      # ----------------------------------------------------------------------
      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded files:"
          find downloaded_artifacts -type f | sort

          COUNT=$(find downloaded_artifacts -type f | wc -l)

          if [[ "$COUNT" -eq 0 ]]; then
            echo "ERROR: no artifacts downloaded"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Consolidate JSON results
      # ----------------------------------------------------------------------
      - name: Consolidate results
        env:
          EXP: ${{ steps.experiment.outputs.experiment }}
        run: |
          python <<'PYEOF'

          import os
          import json
          import glob
          import numpy as np
          from datetime import datetime, timezone

          EXP = os.environ["EXP"]

          INPUT_DIR = "downloaded_artifacts"

          OUTPUT_DIR = os.path.join(
              "hypatiax",
              "data",
              "results",
              EXP
          )

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          json_files = glob.glob(
              f"{INPUT_DIR}/**/*.json",
              recursive=True
          )

          print("\nJSON FILES FOUND:")
          for f in json_files:
              print(" ", f)

          merged = {}

          for path in json_files:

              try:

                  with open(path) as f:
                      data = json.load(f)

                  if isinstance(data, list):

                      for item in data:

                          if not isinstance(item, dict):
                              continue

                          key = (
                              item.get("task_id")
                              or item.get("equation_id")
                              or item.get("id")
                          )

                          if key:
                              merged[key] = item

                  elif isinstance(data, dict):

                      if "results" in data:

                          for item in data["results"]:

                              key = (
                                  item.get("task_id")
                                  or item.get("equation_id")
                                  or item.get("id")
                              )

                              if key:
                                  merged[key] = item

                      else:

                          merged.update(data)

              except Exception as e:
                  print(f"SKIP {path}: {e}")

          print(f"\nMerged entries: {len(merged)}")

          # ------------------------------------------------------------------
          # Compute statistics
          # ------------------------------------------------------------------

          hyp_scores = []
          nn_scores = []

          for v in merged.values():

              if not isinstance(v, dict):
                  continue

              hyp = (v.get("hypatia") or {}).get("extrap_r2")
              nn  = (v.get("nn") or {}).get("extrap_r2")

              if isinstance(hyp, (int, float)):
                  hyp_scores.append(float(hyp))

              if isinstance(nn, (int, float)):
                  nn_scores.append(float(nn))

          stats = {
              "experiment": EXP,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "n_merged": len(merged),
              "hyp_mean": float(np.mean(hyp_scores)) if hyp_scores else None,
              "hyp_median": float(np.median(hyp_scores)) if hyp_scores else None,
              "nn_mean": float(np.mean(nn_scores)) if nn_scores else None,
              "nn_median": float(np.median(nn_scores)) if nn_scores else None,
          }

          # ------------------------------------------------------------------
          # Write outputs
          # ------------------------------------------------------------------

          merged_path = os.path.join(
              OUTPUT_DIR,
              f"{EXP}_merged.json"
          )

          stats_path = os.path.join(
              OUTPUT_DIR,
              f"{EXP}_stats.json"
          )

          with open(merged_path, "w") as f:
              json.dump(merged, f, indent=2)

          with open(stats_path, "w") as f:
              json.dump(stats, f, indent=2)

          print("\nOUTPUTS:")
          print(" ", merged_path)
          print(" ", stats_path)

          print("\nDONE.")

          PYEOF

      # ----------------------------------------------------------------------
      # Upload consolidated outputs
      # ----------------------------------------------------------------------
      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-${{ steps.experiment.outputs.experiment }}
          path: |
            hypatiax/data/results/${{ steps.experiment.outputs.experiment }}/*.json

      # ----------------------------------------------------------------------
      # Commit results
      # ----------------------------------------------------------------------
      - name: Commit consolidated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hypatiax/data/results/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: consolidated experiment results"
            git push
          fi
