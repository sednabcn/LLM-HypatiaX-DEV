name: "Consolidate experiment results"

on:
  workflow_run:
    workflows:
      - "HypatiaX - experiment runner . run_all.sh"
    types: [completed]

  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment ID"
        required: true
        type: choice
        options:
          - exp1
          - exp1b
          - exp2_feynman
          - exp2
          - exp3
          - exp3b
          - suppA
          - suppB
          - suppB_sc
          - hybrid_all_domains
          - instability
          - extrap

      run_id:
        description: "Source workflow run ID"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  OUT_BASE: "hypatiax/data/results"

jobs:

  consolidate:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Resolve experiment
        id: exp
        run: |
          EXP="${{ github.event.inputs.experiment }}"

          if [[ -z "$EXP" ]]; then
            TITLE="${{ github.event.workflow_run.display_title }}"
            EXP=$(echo "$TITLE" | sed 's/.*- \(.*\) \. .*/\1/')
          fi

          echo "id=$EXP" >> "$GITHUB_OUTPUT"

      - name: Resolve run ID
        id: runid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          EXPLICIT="${{ github.event.inputs.run_id }}"

          if [[ -n "$EXPLICIT" ]]; then
            echo "id=$EXPLICIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EVENT_ID="${{ github.event.workflow_run.id }}"

          if [[ -n "$EVENT_ID" ]]; then
            echo "id=$EVENT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: no run id resolved"
          exit 1

      - name: Resolve metadata
        id: meta
        env:
          EXP: ${{ steps.exp.outputs.id }}
        run: |

          python3 - <<'PYEOF'

          import json
          import os

          EXP = os.environ["EXP"]

          DEFI_TASKS = [
              "amm",
              "risk_var",
              "liquidity",
              "expected_shortfall",
              "liquidation",
              "risk",
              "lending",
              "staking",
              "trading",
              "derivatives",
          ]

          FEYNMAN_DOMAINS = [
              "feynman_biology",
              "feynman_chemistry",
              "feynman_electrochemistry",
              "feynman_electromagnetism",
              "feynman_electrostatics",
              "feynman_magnetism",
              "feynman_mechanics",
              "feynman_optics",
              "feynman_probability",
              "feynman_quantum",
              "feynman_thermodynamics",
          ]

          REGISTRY = {
              "exp1": DEFI_TASKS,
              "suppA": DEFI_TASKS,
              "instability": DEFI_TASKS,
              "exp2_feynman": FEYNMAN_DOMAINS,
              "extrap": FEYNMAN_DOMAINS,
          }

          SUBDIRS = {
              "exp1": "comparison_results/noise-noiseless/noiseless",
              "suppA": "hybrid_pysr/defi",
              "instability": "figures",
              "exp2_feynman": "comparison_results/feynman-tests/exp2",
              "extrap": "comparison_results/extrapolation",
          }

          pending = REGISTRY.get(EXP, [])
          subdir = SUBDIRS.get(EXP, EXP)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"pending={json.dumps(pending)}\n")
              fh.write(f"subdir={subdir}\n")

          PYEOF

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded_artifacts
          pattern: results-${{ steps.exp.outputs.id }}-shard*

      - name: Debug artifact tree
        run: |
          echo "ARTIFACT FILES"
          find downloaded_artifacts -type f | sort

      - name: Run unified merge engine
        env:
          EXP: ${{ steps.exp.outputs.id }}
          RESULT_SUBDIR: ${{ steps.meta.outputs.subdir }}
          ALL_PENDING: ${{ steps.meta.outputs.pending }}
        run: |

          python3 merged_shards.py \
            --exp "$EXP" \
            --result-subdir "$RESULT_SUBDIR" \
            --artifact-dir downloaded_artifacts \
            --pending '$ALL_PENDING'

      - name: Validate outputs
        env:
          EXP: ${{ steps.exp.outputs.id }}
          RESULT_SUBDIR: ${{ steps.meta.outputs.subdir }}
        run: |

          python3 - <<'PYEOF'

          import json
          import os
          import sys

          exp = os.environ["EXP"]
          sub = os.environ["RESULT_SUBDIR"]

          root = os.path.join(
              "hypatiax/data/results",
              sub,
          )

          merged = os.path.join(root, f"{exp}_merged.json")
          stats = os.path.join(root, f"{exp}_stats.json")
          csvf = os.path.join(root, f"{exp}_merged.csv")

          for p in [merged, stats, csvf]:
              if not os.path.exists(p):
                  print(f"MISSING OUTPUT: {p}")
                  sys.exit(1)

          data = json.load(open(stats))

          if data.get("n_merged", 0) == 0:
              print("FATAL: n_merged=0")
              sys.exit(1)

          print("VALIDATION OK")

          PYEOF

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-${{ steps.exp.outputs.id }}-${{ github.run_id }}
          path: |
            hypatiax/data/results/${{ steps.meta.outputs.subdir }}/${{ steps.exp.outputs.id }}_merged.json
            hypatiax/data/results/${{ steps.meta.outputs.subdir }}/${{ steps.exp.outputs.id }}_stats.json
            hypatiax/data/results/${{ steps.meta.outputs.subdir }}/${{ steps.exp.outputs.id }}_merged.csv

      - name: Commit results
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hypatiax/data/results || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "ci: consolidated ${{ steps.exp.outputs.id }}"

          git push
