name: Consolidate exp2 Feynman results

# ── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatically after the main exp2 workflow completes (any conclusion).
# 2. Manually via workflow_dispatch — re-run consolidation without re-running
#    the expensive 14-hour experiment.
on:
  workflow_run:
    workflows: ["Exp 2 — HypatiaX v5.3 Feynman Extrapolation · run_all.sh (n=30)"]   # must match `name:` of the main workflow exactly
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID whose artifacts to consolidate (blank = triggering run)"
        required: false
        default: ""

permissions:
  contents: write   # push consolidated results to master
  actions: read     # download artifacts from other runs

env:
  OUT_DIR: hypatiax/data/results/comparison_results/feynman-tests/exp2

jobs:
  consolidate:
    name: Merge shard results and push to master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "pandas==2.2.3" numpy scipy

      - name: Resolve target run ID
        id: run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Priority:
          #  1. Explicit run_id passed via workflow_dispatch input
          #  2. workflow_run event (automatic trigger) — id is a real integer
          #  3. Fallback: query the API for the latest completed run of the main workflow
          EXPLICIT="${{ github.event.inputs.run_id }}"
          EVENT_ID="${{ github.event.workflow_run.id }}"

          if [[ -n "$EXPLICIT" && "$EXPLICIT" =~ ^[0-9]+$ ]]; then
            echo "Using explicit run_id from input: $EXPLICIT"
            echo "id=$EXPLICIT" >> "$GITHUB_OUTPUT"

          elif [[ -n "$EVENT_ID" && "$EVENT_ID" =~ ^[0-9]+$ ]]; then
            echo "Using workflow_run event id: $EVENT_ID"
            echo "id=$EVENT_ID" >> "$GITHUB_OUTPUT"

          else
            # workflow_dispatch with no input and no workflow_run event:
            # fetch the latest completed run of the main workflow via the API.
            echo "No run_id provided — querying API for latest completed run..."
            LATEST=$(gh api               "/repos/${{ github.repository }}/actions/workflows"               --jq '.workflows[] | select(.name == "Exp 2 — HypatiaX v5.3 Feynman Extrapolation · run_all.sh (n=30)") | .id'               | head -1)
            if [[ -z "$LATEST" ]]; then
              echo "ERROR: could not find workflow named 'Exp 2 — HypatiaX v5.3 Feynman Extrapolation · run_all.sh (n=30)'"
              exit 1
            fi
            RUN_ID=$(gh api               "/repos/${{ github.repository }}/actions/workflows/${LATEST}/runs?status=completed&per_page=1"               --jq '.workflow_runs[0].id')
            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              echo "ERROR: no completed runs found for the main workflow"
              exit 1
            fi
            echo "Found latest completed run: $RUN_ID"
            echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all exp2 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded_artifacts

      - name: List downloaded artifacts
        run: find downloaded_artifacts -type f | sort

      - name: Merge shards and write consolidated outputs
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, sys
          from datetime import datetime
          import numpy as np
          from scipy import stats as scipy_stats

          ART_DIR = "downloaded_artifacts"
          OUT_DIR = os.environ["OUT_DIR"]
          os.makedirs(OUT_DIR, exist_ok=True)

          candidates = sorted(
              glob.glob(f"{ART_DIR}/**/*checkpoint*.json", recursive=True) +
              glob.glob(f"{ART_DIR}/**/*feynman_results_shard*.json", recursive=True) +
              glob.glob(f"{ART_DIR}/**/*feynman_merged*.json", recursive=True)
          )
          if not candidates:
              print("ERROR: no JSONs found in downloaded artifacts"); sys.exit(1)

          print(f"Candidate files ({len(candidates)}):")
          for p in candidates: print(f"  {p}")

          merged = {}
          for path in candidates:
              try:
                  with open(path) as f: data = json.load(f)
                  if not isinstance(data, dict): continue
                  if "results" in data and isinstance(data["results"], list):
                      rows = {r["equation_id"]: r for r in data["results"] if "equation_id" in r}
                  else:
                      rows = {k: v for k, v in data.items()
                              if isinstance(v, dict) and ("hypatia" in v or "nn" in v or "name" in v)}
                  merged.update(rows)
                  print(f"  +{len(rows)} equations from {os.path.basename(path)}")
              except Exception as e:
                  print(f"  SKIP {path}: {e}")

          if not merged: print("ERROR: nothing merged"); sys.exit(1)
          print(f"\nTotal: {len(merged)} equations")

          with open(os.path.join(OUT_DIR, "exp2_feynman_merged.json"), "w") as f:
              json.dump(merged, f, indent=2)

          hyp = [r.get("hypatia",{}).get("extrap_r2") for r in merged.values()
                 if r.get("hypatia",{}).get("extrap_r2") is not None]
          nn  = [r.get("nn",{}).get("extrap_r2") for r in merged.values()
                 if r.get("nn",{}).get("extrap_r2") is not None]
          succ = [v for v in hyp if v > 0.99]

          stats = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "source_run_id": os.environ.get("GITHUB_RUN_ID",""),
              "n_equations": len(merged), "n_successes": len(succ),
              "success_rate": len(succ)/len(merged) if merged else 0,
              "hyp_extrap_mean":   float(np.mean(hyp))   if hyp else None,
              "hyp_extrap_median": float(np.median(hyp)) if hyp else None,
              "nn_extrap_mean":    float(np.mean(nn))    if nn  else None,
              "nn_extrap_median":  float(np.median(nn))  if nn  else None,
          }
          if len(hyp) >= 5 and len(nn) >= 5:
              u, p = scipy_stats.mannwhitneyu(hyp, nn, alternative="greater")
              stats.update({"mw_all_U": float(u), "mw_all_p": float(p),
                            "mw_all_significant": bool(p < 0.05)})
          with open(os.path.join(OUT_DIR, "exp2_feynman_stats.json"), "w") as f:
              json.dump(stats, f, indent=2)

          csv = ["equation_id,name,domain,hyp_train_r2,hyp_extrap_r2,nn_extrap_r2,success,best_expression"]
          for eid, r in sorted(merged.items()):
              h = r.get("hypatia",{}); n = r.get("nn",{})
              ok = (h.get("extrap_r2") or -999) > 0.99
              csv.append(f'{eid},{r.get("name","")},{r.get("domain","")},'
                         f'{h.get("train_r2","")},{h.get("extrap_r2","")},{n.get("extrap_r2","")},'
                         f'{ok},{(h.get("best_expression") or "").replace(",",";")}')
          with open(os.path.join(OUT_DIR, "exp2_feynman_merged.csv"), "w") as f:
              f.write("\n".join(csv))

          print(f"\n{'='*65}")
          print(f"SUCCESS RATE: {len(succ)}/{len(merged)} ({len(succ)/len(merged)*100:.1f}%)")
          if "mw_all_p" in stats:
              sig = "SIGNIFICANT" if stats["mw_all_significant"] else "not significant"
              print(f"Mann-Whitney: U={stats['mw_all_U']:.0f}  p={stats['mw_all_p']:.4e}  [{sig}]")
          print(f"{'='*65}")
          print(f"  {'ID':<24} {'Name':<28} {'H-R²':>9} {'NN-R²':>9}  OK")
          print("  " + "-"*74)
          for eid, r in sorted(merged.items()):
              h = r.get("hypatia",{}); n = r.get("nn",{})
              he = h.get("extrap_r2"); ne = n.get("extrap_r2")
              ok = (he or -999) > 0.99
              print(f"  {eid:<24} {r.get('name','')[:27]:<28} "
                    f"{he:>+9.4f}" if he is not None else f"  {eid:<24} {'N/A':>37}", end="")
              print(f" {ne:>+9.4f}" if ne is not None else f" {'N/A':>9}", end="")
              print(f"  {'Y' if ok else 'N'}")
          PYEOF

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp2-feynman-consolidated-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/exp2_feynman_merged.json
            ${{ env.OUT_DIR }}/exp2_feynman_merged.csv
            ${{ env.OUT_DIR }}/exp2_feynman_stats.json
          if-no-files-found: error

      - name: Commit and push consolidated results to master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "${{ env.OUT_DIR }}/exp2_feynman_merged.json" \
            "${{ env.OUT_DIR }}/exp2_feynman_merged.csv"  \
            "${{ env.OUT_DIR }}/exp2_feynman_stats.json"

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit (results unchanged from previous run)"
          else
            git commit -m "ci: consolidated exp2 results — run ${{ steps.run_id.outputs.id }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master
            echo "Pushed consolidated results to master"
          fi
