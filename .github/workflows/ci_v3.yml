# =============================================================================
# .github/workflows/ci.yml
# HypatiaX — Continuous Integration (GitHub Actions)  v3
# =============================================================================
#
# v3 changes (paper-quality mode — synced with HypatiaX_Experiments_v7_PAPER_QUALITY.ipynb):
#   • PAPER-QUALITY: FAST=0 hardcoded in all jobs; smoke-test job removed
#   • Global env: PYSR_NITERATIONS=1000, PYSR_POPULATIONS=30,
#                 PYSR_TIMEOUT=1100, METHOD_TIMEOUT=900 (paper values)
#   • Global env: NN_TIME_LIMIT=120, LLM_RETRIES=3 (paper values)
#   • Global env: N_FEYNMAN_TASKS=30, N_NGUYEN_TASKS=12 (full counts)
#   • Global env: ONE_EQUATION unset; N_ITERATIONS/POPULATIONS smoke vars removed
#   • dispatch default for pysr_timeout changed from 360 → 1100 (paper value)
#   • dispatch default for skip_slow changed from true → false (run everything)
#   • full-pipeline: timeout-minutes raised 360 → 1440 (24 h) for paper run
#   • full-pipeline: --skip-slow removed from run_all invocation
#   • full-pipeline: paper-quality PySR env vars injected (N_ITERATIONS=1000,
#                    POPULATIONS=30); smoke-test conditional removed
#   • slow-pipeline: timeout-minutes raised 720 → 1440 (24 h ceiling)
#   • slow-pipeline: PYSR_TIMEOUT default guard changed 360 → 1100
#   • All jobs: FAST=0 added to every env block
#   • All jobs: N_FEYNMAN_TASKS=30, N_NGUYEN_TASKS=12 added to env blocks
#   • smoke-test job: REMOVED (paper-quality runs do not need a separate smoke gate)
#   • verify job: retained unchanged (verify-only is always fast)
#
# Triggers:
#   push / PR to main or develop branches
#   Manual dispatch (workflow_dispatch) with optional parameters (see inputs)
#
# Jobs:
#   lint          — code quality, import graph, stale-engine check      (<5 min)
#   full-pipeline — ALL experiments incl. slow steps, paper PySR config  (~15–25 h)
#   slow-pipeline — Same as full but manually triggered with LLM_K_RUNS=30 (~15–25 h)
#   verify        — verify_results.py + hash_lock against saved cache    (<20 min)
#
# Secrets required (Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY   — sk-ant-... (required for all LLM-using jobs)
#
# Result artefacts are uploaded to GitHub Artefacts and kept for 30 days.
# =============================================================================

name: HypatiaX Reproducibility CI — Paper Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      only_step:
        description: 'Run only this step ID (leave empty for full pipeline)'
        required: false
        default: ''
      skip_slow:
        description: 'Skip slow steps (exp2, suppB, instability) — default false for paper-quality'
        required: false
        default: 'false'
      # ── v3: one_equation removed — paper-quality runs always use full task counts ──
      seed:
        description: 'Override PYSR_SEED / NN_SEED / PYTHONHASHSEED (default: 42)'
        required: false
        default: '42'
      pysr_timeout:
        description: 'PySR wall-clock timeout in seconds (default: 1100 — paper value)'
        required: false
        default: '1100'
      skip_paper:
        description: 'Skip Phase 4-B paper audit notebook steps (NB-01 to NB-06)'
        required: false
        default: 'false'
      continue_on_fail:
        description: 'Log step failures but keep the pipeline running'
        required: false
        default: 'false'

# Cancel in-progress runs for the same ref on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # ── PAPER-QUALITY: FAST=0 hardcoded across all jobs (v3) ─────────────────
  FAST: "0"
  # ── Seeds (default from dispatch input or 42) ─────────────────────────────
  NN_SEED: ${{ github.event.inputs.seed || '42' }}
  PYSR_SEED: ${{ github.event.inputs.seed || '42' }}
  PYTHONHASHSEED: ${{ github.event.inputs.seed || '42' }}
  # ── Model ────────────────────────────────────────────────────────────────
  LLM_MODEL: "claude-sonnet-4-20250514"
  LLM_RETRIES: "3"                 # paper value (was 2 in smoke mode)
  LLM_K_RUNS: "1"
  # ── Task counts — FULL paper values ──────────────────────────────────────
  N_TASKS_DEFI: "74"
  N_TASKS_INSTABILITY: "70"        # FIX-T1: must be 70 (not 71)
  N_FEYNMAN_TASKS: "30"            # v3: full Feynman suite
  N_NGUYEN_TASKS: "12"             # v3: full Nguyen suite
  # ── Neural network — paper values ────────────────────────────────────────
  PCA_TRAIN_FRAC: "0.40"
  NN_TIME_LIMIT: "120"             # paper value (was 30 in smoke mode)
  # ── PySR — paper-quality values (v3) ─────────────────────────────────────
  PYSR_NITERATIONS: "1000"         # paper value (was 100 in smoke mode)
  PYSR_POPULATIONS: "30"           # paper value (was 15 in smoke mode)
  PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}   # paper: 1100 s/eq
  METHOD_TIMEOUT: "900"            # paper value (was 120 in smoke mode)
  # ── Engine & Julia ────────────────────────────────────────────────────────
  ENGINE_NAME: "hybrid_system_v50_2"   # FIX-C2: never v40
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"

# =============================================================================
# JOB 1 — Lint & code quality  (runs on every push/PR, no API key needed)
# =============================================================================
jobs:
  lint:
    name: "Lint & code quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting dependencies
        run: |
          pip install --quiet ruff pyflakes

      - name: Install pipeline dependencies (needed for patches)
        run: pip install --quiet -r requirements.txt

      - name: Apply patches before lint checks (FIX-C2 must run first)
        run: |
          python3 scripts/patches/generate_patches.py
          python3 scripts/patches/apply_patches.py

      - name: ruff — style & import checks
        run: |
          ruff check hypatiax/ protocols/ scripts/ core/ \
            --select E,F,W,I --ignore E501 \
            --output-format github || true
          # Treat as warning only in CI (--|| true); set to exit 1 to enforce

      - name: Check for stale v40 engine references (FIX-C2, post-patch)
        run: |
          # Exclude BACKUP/ — .bak files are historical copies, not live code.
          STALE=$(grep -r "hybrid_system_v40[^_]" hypatiax/ protocols/ scripts/ \
                    --include="*.py" \
                    --exclude-dir=BACKUP \
                    -l 2>/dev/null || true)
          if [ -n "$STALE" ]; then
            echo "::error ::Stale hybrid_system_v40 import found — must be v50_2:"
            echo "$STALE"
            exit 1
          fi
          echo "✓ No stale v40 engine references"

      - name: Check for exposed API keys
        run: |
          if grep -r "sk-ant-api" . --include="*.py" --include="*.ipynb" \
                --include="*.yaml" --include="*.yml" -l 2>/dev/null \
                | grep -v ".git"; then
            echo "::error ::Exposed API key found — revoke at console.anthropic.com"
            exit 1
          fi
          echo "✓ No exposed API keys"

      - name: Verify hypatiax/protocols/ input-data modules
        run: |
          python3 scripts/patches/check_hypatiax_protocols.py

      - name: Validate patched source syntax
        run: |
          python3 run_all_checkpoint.py --only fixup-tex
          python3 scripts/patches/validate_code.py

      # ── v2: NB-06 code-quality pre-audit (mirrors run_all main() NB-06 block) ──
      - name: NB-06 code-quality pre-audit (non-blocking)
        run: |
          NB="notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb"
          if [ -f "$NB" ]; then
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=120 "$NB" \
              && echo "✓ NB-06 clean" \
              || echo "⚠ NB-06 warnings (non-blocking)"
          else
            echo "  NB-06: not found — skipped (pip install notebook if needed)"
          fi
        continue-on-error: true



# =============================================================================
# JOB 3 — Full pipeline  (ALL steps including slow; paper-quality PySR config)
#          Triggered: push to main, or manual dispatch with skip_slow=false
# =============================================================================
  full-pipeline:
    name: "Full pipeline — paper-quality (all steps)"
    runs-on: ubuntu-latest
    timeout-minutes: 1440          # 24 h — paper run needs ~15-25 h
    needs: lint
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.skip_slow == 'false')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Julia (for PySR)
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      - name: Install Jupyter (for NB audit steps)
        run: pip install -q notebook nbconvert

      - name: Set PYTHONPATH & RESULTS_DIR
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
          echo "RESULTS_DIR=${{ github.workspace }}/hypatiax/data/results" >> $GITHUB_ENV

      # ── Restore checkpoint from a previous run ──────────────────────────
      - name: Restore checkpoint
        uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-full-${{ github.ref }}-${{ github.run_id }}
          restore-keys: checkpoint-full-${{ github.ref }}-

      # ── Restore cached result files so verify step can find them ────────
      - name: Restore result cache
        uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-full-${{ github.ref }}-${{ github.run_id }}
          restore-keys: results-full-${{ github.ref }}-

      # ── v3: full paper-quality pipeline — no --skip-slow ──────────────
      - name: Run pipeline (all steps, paper-quality, resume if checkpoint present)
        run: |
          RESUME_FLAG=""
          if [ -f logs/pipeline_checkpoint.json ]; then
            RESUME_FLAG="--resume"
          fi

          ONLY_FLAG=""
          if [ -n "${{ github.event.inputs.only_step }}" ]; then
            ONLY_FLAG="--only ${{ github.event.inputs.only_step }}"
          fi

          # v3: --seed flag
          SEED_FLAG=""
          if [ -n "${{ github.event.inputs.seed }}" ] && \
             [ "${{ github.event.inputs.seed }}" != "42" ]; then
            SEED_FLAG="--seed ${{ github.event.inputs.seed }}"
          fi

          # v3: --pysr-timeout flag (default 1100 for paper-quality)
          TIMEOUT_FLAG=""
          if [ -n "${{ github.event.inputs.pysr_timeout }}" ] && \
             [ "${{ github.event.inputs.pysr_timeout }}" != "1100" ]; then
            TIMEOUT_FLAG="--pysr-timeout ${{ github.event.inputs.pysr_timeout }}"
          fi

          # v3: --skip-paper flag
          PAPER_FLAG=""
          if [ "${{ github.event.inputs.skip_paper }}" = "true" ]; then
            PAPER_FLAG="--skip-paper"
          fi

          # v3: --continue-on-fail flag
          COF_FLAG=""
          if [ "${{ github.event.inputs.continue_on_fail }}" = "true" ]; then
            COF_FLAG="--continue-on-fail"
          fi

          # v3: --skip-slow REMOVED — paper-quality runs all experiments
          python3 run_all_checkpoint.py \
            --continue-on-fail \
            $RESUME_FLAG $ONLY_FLAG $SEED_FLAG $TIMEOUT_FLAG \
            $PAPER_FLAG $COF_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAST: "0"
          # v3: paper-quality PySR config (hardcoded — no smoke-test conditional)
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          # v3: full task counts
          N_FEYNMAN_TASKS: "30"
          N_NGUYEN_TASKS: "12"
          # v2: exp1b env vars (FIX-EXP1B-ARGS)
          DEFI_V3C_NO_TIMEOUT_FLAGS: "1"
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"
          # v2: exp3/3b env vars (FIX-EXP3-PKG)
          SKIP_PKG_CHECK: "1"
          # v2: suppA env vars (FIX-SUPPA)
          SKIP_PERF_ANALYSIS: "1"
          HYPATIAX_CORE_OPTIONAL: "1"

      - name: Generate figures & tables
        if: success()
        run: |
          python3 figures/generate_figures.py \
            --outdir hypatiax/data/results/figures
          python3 scripts/patches/generate_tables.py \
            --outdir hypatiax/data/results/tables
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAST: "0"
          # v3: tables env vars (FIX-TABLES)
          TABLE_OUTDIR: "${{ github.workspace }}/hypatiax/data/results/tables"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - name: Verify results against paper targets
        if: success()
        run: |
          python3 scripts/patches/verify_results.py --report
          python3 reproducibility/hash_lock.py --check
        env:
          # v2: verify env vars (FIX-VERIFY)
          PATCHED_DATA_DIR: "${{ github.workspace }}/hypatiax/data/results"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-full-${{ github.ref }}-${{ github.run_id }}

      - name: Save result cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: hypatiax/data/results/
          key: results-full-${{ github.ref }}-${{ github.run_id }}

      - name: Upload results artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-pipeline-results-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 30

      - name: Upload figures & tables artefact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: figures-tables-${{ github.sha }}
          path: |
            hypatiax/data/results/figures/
            hypatiax/data/results/tables/
          retention-days: 30


# =============================================================================
# JOB 4 — Slow / full sweep  (manually triggered only)
#          Identical to full-pipeline but with LLM_K_RUNS=30 for the complete
#          §10.9 instability sweep (Feynman, noise sweep, K=30 instability).
#          ~15–25 h wall time.
# =============================================================================
  slow-pipeline:
    name: "Full pipeline incl. slow steps — LLM_K_RUNS=30 (manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 1440          # 24 h ceiling (paper run needs ~15-25 h)
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.skip_slow == 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install all dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q notebook nbconvert

      - name: Set PYTHONPATH & RESULTS_DIR
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
          echo "RESULTS_DIR=${{ github.workspace }}/hypatiax/data/results" >> $GITHUB_ENV

      - name: Restore checkpoint
        uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-slow-${{ github.ref }}-${{ github.run_id }}
          restore-keys: checkpoint-slow-${{ github.ref }}-

      - name: Restore result cache
        uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-slow-${{ github.ref }}-${{ github.run_id }}
          restore-keys: results-slow-${{ github.ref }}-

      # ── v3: full paper-quality pipeline with K=30 instability sweep ────
      - name: Run full pipeline (all steps, paper-quality, K=30 instability)
        run: |
          RESUME_FLAG=""
          if [ -f logs/pipeline_checkpoint.json ]; then
            RESUME_FLAG="--resume"
          fi

          SEED_FLAG=""
          if [ -n "${{ github.event.inputs.seed }}" ] && \
             [ "${{ github.event.inputs.seed }}" != "42" ]; then
            SEED_FLAG="--seed ${{ github.event.inputs.seed }}"
          fi

          # v3: default guard updated to 1100 (paper value)
          TIMEOUT_FLAG=""
          if [ -n "${{ github.event.inputs.pysr_timeout }}" ] && \
             [ "${{ github.event.inputs.pysr_timeout }}" != "1100" ]; then
            TIMEOUT_FLAG="--pysr-timeout ${{ github.event.inputs.pysr_timeout }}"
          fi

          PAPER_FLAG=""
          if [ "${{ github.event.inputs.skip_paper }}" = "true" ]; then
            PAPER_FLAG="--skip-paper"
          fi

          COF_FLAG=""
          if [ "${{ github.event.inputs.continue_on_fail }}" = "true" ]; then
            COF_FLAG="--continue-on-fail"
          fi

          python3 run_all_checkpoint.py --continue-on-fail \
            $RESUME_FLAG $SEED_FLAG $TIMEOUT_FLAG $PAPER_FLAG $COF_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAST: "0"
          LLM_K_RUNS: "30"                  # Full instability sweep (K=30)
          # v3: paper-quality PySR config
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          # v3: full task counts
          N_FEYNMAN_TASKS: "30"
          N_NGUYEN_TASKS: "12"
          # v2: exp1b env vars (FIX-EXP1B-ARGS)
          DEFI_V3C_NO_TIMEOUT_FLAGS: "1"
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"
          # v2: exp3/3b (FIX-EXP3-PKG)
          SKIP_PKG_CHECK: "1"
          # v2: suppA (FIX-SUPPA)
          SKIP_PERF_ANALYSIS: "1"
          HYPATIAX_CORE_OPTIONAL: "1"

      - name: Verify results
        run: |
          python3 scripts/patches/verify_results.py --report
          python3 reproducibility/hash_lock.py --check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAST: "0"
          PATCHED_DATA_DIR: "${{ github.workspace }}/hypatiax/data/results"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-slow-${{ github.ref }}-${{ github.run_id }}

      - name: Save result cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: hypatiax/data/results/
          key: results-slow-${{ github.ref }}-${{ github.run_id }}

      - name: Upload all artefacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slow-pipeline-results-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 90        # Keep longer for paper archival


# =============================================================================
# JOB 5 — Verify-only  (runs on PR against cached results from main)
# =============================================================================
  verify:
    name: "Verify cached results"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore result cache from main branch
        uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          # Try to restore from main's latest full-pipeline run
          key: results-full-refs/heads/main-
          restore-keys: |
            results-full-refs/heads/main-
            results-full-

      # ── v2: --verify-only mirrors run_all main() verify-only shortcut ──
      - name: Run verify-only
        run: |
          python3 run_all_checkpoint.py --verify-only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # v2: FIX-VERIFY env vars
          PATCHED_DATA_DIR: "${{ github.workspace }}/hypatiax/data/results"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-${{ github.sha }}
          path: logs/
          retention-days: 7
