# =============================================================================
# Phase 1 — exp2  (30-equation multi-domain comparison)
# Step ID: exp2   inline_runner=False   script: run_comparative_suite_benchmark_v2.py
#
# IMPORTANT: exp2 does NOT use --case-range.
#   • run_comparative_suite_benchmark_v2.py --protocol all30 --resume handles
#     per-equation checkpointing internally via ProtocolBenchmarkSuite.
#   • Checkpoint written atomically to:
#       logs/exp2_symbolic_engine_checkpoint.json  (reused as the all30 marker)
#   • --resume is baked into the Step cmd in run_all_checkpoint.py so the
#     subprocess reloads completed_keys and skips finished equations on restart.
#   • Pass threshold: 9/30 equations.
#
# Cache: persist exp2 checkpoint so equation progress survives job reruns.
# =============================================================================
  exp2:
    name: "exp2 · 30-eq multi-domain (run_comparative_suite_benchmark_v2)"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 340
    needs: exp2-hyb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.11"}
      - run: bash .github/scripts/setup_env.sh --jupyter

      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp2-hyb
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp2-hyb
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp2-hyb
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp2-hyb
            results-${{ github.ref }}-
      # Per-equation checkpoint written by run_comparative_suite_benchmark_v2.py
      - uses: actions/cache@v5
        with:
          path: logs/exp2_symbolic_engine_checkpoint.json
          key: exp2-ckpt-${{ github.ref }}-${{ github.run_id }}
          restore-keys: exp2-ckpt-${{ github.ref }}-

      - name: "Run exp2  [step: exp2, run_comparative_suite_benchmark_v2.py --protocol all30 --resume]"
        # --resume forwarded into run_comparative_suite_benchmark_v2.py so it
        # reloads the checkpoint and skips completed equations.
        run: python3 run_all_checkpoint.py --only exp2 --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYSR_TIMEOUT: ${{ env.PYSR_TIMEOUT }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp2
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp2
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/exp2_symbolic_engine_checkpoint.json
          key: exp2-ckpt-${{ github.ref }}-${{ github.run_id }}-done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


