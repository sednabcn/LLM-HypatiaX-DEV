            results-${{ github.ref }}-${{ github.run_id }}-exp3
            results-${{ github.ref }}-

      - name: "Run exp3b  [step: exp3b, --seeds 99 123 777 2024]"
        run: python3 run_all_checkpoint.py --only exp3b --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_NGUYEN_TASKS: "12"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp3b
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp3b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3b-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


# =============================================================================
# Phase 2 — supp-fast  (suppA · extrap)
# Step IDs: suppA, extrap
# suppA env_extra : SKIP_PERF_ANALYSIS=1, HYPATIAX_CORE_OPTIONAL=1
# extrap env_extra: PROTOCOL_ROOT=..., HYPATIAX_CORE_OPTIONAL=1
# Combined runtime ~60-80 min; fits comfortably in 120 min.
# =============================================================================
  supp-fast:
    name: "Phase 2 · suppA + extrap"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 120
    needs: exp3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.11"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp3b
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp3b
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp3b
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp3b
            results-${{ github.ref }}-

      - name: "Run suppA  [step: suppA]"
        run: python3 run_all_checkpoint.py --only suppA --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP_PERF_ANALYSIS: "1"
          HYPATIAX_CORE_OPTIONAL: "1"

      - name: "Run extrap  [step: extrap]"
        run: python3 run_all_checkpoint.py --only extrap --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HYPATIAX_CORE_OPTIONAL: "1"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-supp-fast
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-supp-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supp-fast-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


# =============================================================================
# Phase 2 — supp-slow  (suppB · instability)
# Step IDs: suppB (6-12 h), instability (slow, LLM_K_RUNS=30)
# Both are long-running; 720 min (12 h) gives adequate headroom.
# =============================================================================
  supp-slow:
    name: "Phase 2 · suppB + instability"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 720
    needs: supp-fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.11"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-supp-fast
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-supp-fast
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-supp-fast
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-supp-fast
            results-${{ github.ref }}-

      - name: "Run suppB  [step: suppB, slow=True]"
        run: python3 run_all_checkpoint.py --only suppB --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "Run instability  [step: instability, slow=True, LLM_K_RUNS=30]"
        run: python3 run_all_checkpoint.py --only instability --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_K_RUNS: "30"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-supp
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-supp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supp-slow-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


# =============================================================================
# Phase 3 — audit-verify
# Step IDs: provenance, discover-provenance, scan-imports, verify, hashlock
# All run sequentially.  verify uses env_extra PATCHED_DATA_DIR / VERIFY_RESULTS_DIR.
# =============================================================================
  audit-verify:
    name: "Phase 3 · Provenance + verify + hashlock"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 60
    needs: supp-slow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-supp
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-supp
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-supp
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-supp
            results-${{ github.ref }}-

      - name: "Run provenance  [step: provenance]"
        run: python3 run_all_checkpoint.py --only provenance --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "Run discover-provenance  [step: discover-provenance]"
        run: python3 run_all_checkpoint.py --only discover-provenance --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "Run scan-imports  [step: scan-imports]"
        run: python3 run_all_checkpoint.py --only scan-imports --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "Run verify  [step: verify]"
        run: python3 run_all_checkpoint.py --only verify --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PATCHED_DATA_DIR: "${{ github.workspace }}/hypatiax/data/results"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - name: "Run hashlock  [step: hashlock]"
        run: python3 run_all_checkpoint.py --only hashlock --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-audit-verify
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-audit-verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-verify-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 14


# =============================================================================
# Phase 4 — outputs  (figures · tables)
# Step IDs: figures, tables
# tables env_extra: TABLE_OUTDIR, VERIFY_RESULTS_DIR
# =============================================================================
  outputs:
    name: "Phase 4 · Figures + tables"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 60
    needs: audit-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-audit-verify
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-audit-verify
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-audit-verify
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-audit-verify
            results-${{ github.ref }}-

      - name: "Run figures  [step: figures]"
        run: python3 run_all_checkpoint.py --only figures --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "Run tables  [step: tables]"
        run: python3 run_all_checkpoint.py --only tables --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TABLE_OUTDIR: "${{ github.workspace }}/hypatiax/data/results/tables"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-outputs
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-outputs
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ github.sha }}
          path: |
            hypatiax/data/results/figures/
            hypatiax/data/results/tables/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-pipeline-results-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 30


# =============================================================================
# Phase 4-B — paper-audit  (audit-setup + audit-NB-01..05)
# All steps have paper=True → skipped when --skip-paper is passed.
# Gated by workflow_dispatch input skip_paper.
# =============================================================================
  paper-audit:
    name: "Phase 4-B · Paper audit notebooks"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 60
    needs: outputs
    if: ${{ github.event.inputs.skip_paper != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: |
          pip install --quiet -r requirements.txt \
            || echo "::warning ::Some requirements failed"
          pip install --quiet notebook nbconvert
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-outputs
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-outputs
            results-${{ github.ref }}-

      - name: "audit-setup  [step: audit-setup]"
        run: python3 run_all_checkpoint.py --only audit-setup --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "audit-NB-01 · Citation & Bibliography  [step: audit-NB-01]"
        continue-on-error: true
        run: python3 run_all_checkpoint.py --only audit-NB-01 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "audit-NB-02 · Cross-Reference & Label  [step: audit-NB-02]"
        continue-on-error: true
        run: python3 run_all_checkpoint.py --only audit-NB-02 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "audit-NB-03 · Section Structure  [step: audit-NB-03]"
        continue-on-error: true
        run: python3 run_all_checkpoint.py --only audit-NB-03 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "audit-NB-04 · Numerical Consistency  [step: audit-NB-04]"
        continue-on-error: true
        run: python3 run_all_checkpoint.py --only audit-NB-04 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "audit-NB-05 · Figure & Image Dependencies  [step: audit-NB-05]"
        continue-on-error: true
        run: python3 run_all_checkpoint.py --only audit-NB-05 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-audit-${{ github.sha }}
          path: notebooks/
          retention-days: 30


# =============================================================================
# verify (PRs only — fast result check, runs in parallel with the lint chain)
# Step ID: verify   cmd: scripts/patches/verify_results.py --report
# env_extra: PATCHED_DATA_DIR, VERIFY_RESULTS_DIR
# Uses --verify-only mode so no experiments re-run.
# =============================================================================
  verify:
    name: "Verify cached results (PR)"
    runs-on: [self-hosted, linux, aws-c5-4xlarge]
    timeout-minutes: 20
    needs: [lint, validate-case-registry]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install --quiet -r requirements.txt
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-full-refs/heads/main-
          restore-keys: |
            results-full-refs/heads/main-
            results-full-
      - name: "Run verify-only  [step: verify, --verify-only]"
        run: python3 run_all_checkpoint.py --verify-only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PATCHED_DATA_DIR: "${{ github.workspace }}/hypatiax/data/results"
          VERIFY_RESULTS_DIR: "${{ github.workspace }}/hypatiax/data/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ github.sha }}
          path: logs/
          retention-days: 7
