# =============================================================================
# .github/workflows/ci.yml  —  HypatiaX CI v8
# =============================================================================
#
# WHAT CHANGED FROM v7
# ─────────────────────
# 1. cancel-in-progress: false on main/master — a long pipeline (75 h total
#    wall time) must never be killed mid-run by a follow-up push.  PRs still
#    cancel (fast feedback matters there).
#
# 2. ALL phases from run_all_checkpoint.py are now covered:
#      Phase 0  : setup          (lint job — deps, patches, fixups, validate)
#      Phase 1  : core-exps      (exp1 × 4 chunks, exp1b, exp2, exp3, exp3b)
#      Phase 2  : supp           (suppB, suppA, instability, extrap)
#      Phase 3  : audit          (provenance, discover-provenance, scan-imports,
#                                 verify, hashlock)
#      Phase 4  : outputs        (figures, tables)
#      Phase 4-B: paper-audit    (audit-setup, audit-NB-01..05)   [--skip-paper gate]
#
# 3. exp2 uses run_comparative_suite_benchmark_v2.py --protocol all30 --resume
#    (inline_runner=False).  Per-equation checkpoint written atomically to
#    hypatiax/data/results/comparison_results/exp2_all30_checkpoint.json.
#    The CI caches this file so equation progress survives job reruns.
#    One job, timeout-minutes: 340 (5 h 40 m), well under the 6-hour job cap.
#
# 4. exp3 / exp3b are each a single job — 12 tasks, no chunking needed.
#    exp3b (seeds 99/123/777/2024) runs after exp3 SEED=42.
#
# 5. exp1 still chunks into 4 jobs (cases 1-4 / 5-8 / 9-12 / 13-15) because
#    exp1 is the longest per-case step and respects --case-range.
#
# 6. Checkpoint cache key discipline:
#      - pipeline_checkpoint.json  (logs/)          — pipeline step pass/fail
#      - exp2_all30_checkpoint.json (data/results/comparison_results/) — exp2 state
#      - hypatiax/data/results/                     — result artefacts
#    Each job restores the key written by its predecessor (exact match) then
#    falls back to the branch-level prefix.  Saves always run (if: always()).
#
# 7. validate-case-registry is unchanged.
#
# STEP IDs (from STEP_IDS in run_all_checkpoint.py)
# ────────────────────────────────────────────────────
#   Phase 0 : deps  patches-gen  patches-apply  fixup-init  fixup-tex
#             validate  validate-paper-config  check-hypatiax-protocols
#   Phase 1 : exp1  exp1b  exp2  exp3  exp3b
#   Phase 2 : suppB  suppA  instability  extrap
#   Phase 3 : provenance  discover-provenance  scan-imports  verify  hashlock
#   Phase 4 : figures  tables
#   Phase 4-B: audit-setup  audit-NB-01..05
#
# JOB GRAPH (→ = needs)
# ──────────────────────────────────────────────────────────────────────
#   lint
#    └─ validate-case-registry
#        ├─ exp1-cases-01-04 → exp1-cases-05-08 → exp1-cases-09-12 → exp1-cases-13-15
#        │                                                                  └─ exp1b
#        │                                                                       └─ exp2
#        │                                                                            └─ exp3
#        │                                                                                 └─ exp3b
#        │                                                                                      └─ supp
#        │                                                                                           └─ audit-verify
#        │                                                                                                └─ outputs
#        │                                                                                                     └─ paper-audit  (--skip-paper gate)
#        └─ verify  (PRs only, parallel)
# =============================================================================

name: HypatiaX Reproducibility CI — v8

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed override (default 42)"
        required: false
        default: "42"
      pysr_timeout:
        description: "PySR timeout seconds (default 1100)"
        required: false
        default: "1100"
      skip_paper:
        description: "Skip Phase 4-B paper audit notebooks"
        required: false
        default: "false"
      continue_on_fail:
        description: "Keep pipeline running on step failure"
        required: false
        default: "false"

# ── Concurrency ────────────────────────────────────────────────────────────────
# PRs: cancel stale runs immediately (fast feedback).
# main/master + workflow_dispatch: never cancel — the pipeline is ~75 h
# end-to-end; killing it mid-run wastes all accumulated compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Global env ─────────────────────────────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  FAST: "0"
  LLM_MODEL: "claude-sonnet-4-20250514"
  LLM_RETRIES: "3"
  LLM_K_RUNS: "1"
  NN_SEED: ${{ github.event.inputs.seed || '42' }}
  PYSR_SEED: ${{ github.event.inputs.seed || '42' }}
  PYTHONHASHSEED: ${{ github.event.inputs.seed || '42' }}
  PYSR_NITERATIONS: "1000"
  PYSR_POPULATIONS: "30"
  PYSR_TIMEOUT: ${{ github.event.inputs.pysr_timeout || '1100' }}
  METHOD_TIMEOUT: "900"
  EQUATION_WALL_CLOCK: "1200"
  NN_TIME_LIMIT: "120"
  PCA_TRAIN_FRAC: "0.40"
  N_TASKS_DEFI: "74"
  N_TASKS_INSTABILITY: "70"
  N_NGUYEN_TASKS: "12"
  ENGINE_NAME: "hybrid_system_v50_2"
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
  SKIP_PKG_CHECK: "1"
  SKIP_PERF_ANALYSIS: "1"
  HYPATIAX_CORE_OPTIONAL: "1"
  DEFI_V3C_NO_TIMEOUT_FLAGS: "1"

jobs:

# =============================================================================
# Phase 0 — lint  (deps · patches · fixups · validate)
# Covers step IDs: deps, patches-gen, patches-apply, fixup-init, fixup-tex,
#                  validate, validate-paper-config, check-hypatiax-protocols
# =============================================================================
  lint:
    name: "Phase 0 · Lint & setup"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Deduplicate requirements.txt
        run: python3 .github/scripts/dedup_requirements.py

      - name: Install deps  [step: deps]
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet ruff pyflakes gitpython==3.1.47
          pip install --quiet --upgrade --upgrade-strategy eager -r requirements.txt \
            || echo "::warning ::Some requirements failed — lint continues"

      - name: Apply patches  [steps: patches-gen, patches-apply]
        run: |
          set -euo pipefail
          for s in scripts/patches/generate_patches.py scripts/patches/apply_patches.py; do
            [[ -f "$s" ]] && python3 "$s" || echo "::warning ::$s not found"
          done

      - name: Guard hypatiax/__init__.py  [step: fixup-init]
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          init = Path('hypatiax') / '__init__.py'
          if not init.exists():
              print('  ⚠ fixup-init: not found — skipping'); raise SystemExit(0)
          src = init.read_text(encoding='utf-8')
          BAD  = 'from hypatiax.core import HypatiaX'
          GOOD = ('try:\n'
                  '    from hypatiax.core import HypatiaX  # noqa: F401\n'
                  'except Exception:\n'
                  '    HypatiaX = None  # type: ignore')
          if BAD in src and 'except Exception:' not in src:
              init.write_text(src.replace(BAD, GOOD), encoding='utf-8')
              print('  ✓ fixup-init: patched')
          else:
              print('  ✓ fixup-init: already clean')
          EOF

      - name: Fix .tex bibkeys  [step: fixup-tex]
        run: |
          python3 - <<'EOF'
          import re; from pathlib import Path
          TEX = Path('paper') / 'jmlr-hypatiax-paper-final.tex'
          if not TEX.exists():
              print(f'  ⚠ fixup-tex: {TEX} not found — skipping'); raise SystemExit(0)
          src = original = TEX.read_text(encoding='utf-8')
          src = src.replace('Five-Layer Architecture Overview','Five-Stage Architecture Overview')
          for old, new in [('cranmer2023interpretable','cranmer2023interp'),
                           ('udrescu2020aifeynman','udrescu2020feynman')]:
              src = src.replace(old, new)
          if src != original:
              TEX.write_text(src, encoding='utf-8')
              print(f'  ✓ fixup-tex: patched')
          else:
              print('  ✓ fixup-tex: already clean')
          EOF

      - name: Validate patched source  [step: validate]
        run: python3 scripts/patches/validate_code.py

      - name: ruff
        run: |
          ruff check hypatiax/ scripts/ \
            --select E,F,W,I --ignore E501,F821,F404,E402,E701,E702,E741,F841 \
            --output-format github

      - name: pyflakes
        run: |
          python3 - <<'EOF'
          import subprocess, sys, re
          KNOWN = {"display", "_kill_thread", "plot"}
          KNOWN_F404 = {"hypatiax/protocols/experiment_protocol_benchmark.py"}
          r = subprocess.run(["python3","-m","pyflakes","hypatiax/","protocols/","scripts/"],
                             capture_output=True, text=True)
          errs = []
          for line in (r.stdout+r.stderr).splitlines():
              m = re.search(r"undefined name '(\w+)'", line)
              if m and m.group(1) not in KNOWN: errs.append(line)
              elif "from __future__" in line and not any(f in line for f in KNOWN_F404):
                  errs.append(line)
          if errs: [print(e) for e in errs]; sys.exit(1)
          print("OK")
          EOF

      - name: Code-quality checks
        run: bash .github/scripts/lint_checks.sh

      - name: NB-06 pre-audit
        continue-on-error: true
        run: |
          NB="notebooks/NB-06_Code_Quality_Pipeline_Integrity.ipynb"
          [ -f "$NB" ] && pip install -q notebook nbconvert \
            && jupyter nbconvert --to notebook --execute --inplace \
               --ExecutePreprocessor.timeout=120 "$NB" \
            && echo "NB-06 clean" || echo "NB-06 warnings (non-blocking)"


# =============================================================================
# validate-case-registry
# Enforces build_cases() / slice_cases() contract on all benchmark scripts.
# =============================================================================
  validate-case-registry:
    name: "Validate case registry"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet --upgrade --upgrade-strategy eager -r requirements.txt \
            || echo "::warning ::Some requirements failed — validation continues"
      - name: Validate case registry  [step: check-hypatiax-protocols]
        run: python3 .github/scripts/validate_case_registry.py


# =============================================================================
# Phase 1 — exp1  (15 cases → 4 sequential chunks)
# Step ID: exp1   cmd: experiment_protocol_ablation_exp1.py
# Uses --case-range → CASE_RANGE_START / CASE_RANGE_END env vars.
# Each chunk timeout-minutes: 340 (5 h 40 m) — 20 min headroom under 6-hour cap.
# =============================================================================
  exp1-cases-01-04:
    name: "exp1 · cases 1-4"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: [lint, validate-case-registry]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter

      # Restore checkpoint from previous run of this job (branch fallback).
      # No predecessor job on first run so only the branch prefix matters here.
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-00
          restore-keys: ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-00
          restore-keys: results-${{ github.ref }}-

      - name: Validate paper config  [step: validate-paper-config]
        run: python3 validation_paper_config.py
        env:
          PYSR_TIMEOUT: ${{ env.PYSR_TIMEOUT }}
          METHOD_TIMEOUT: ${{ env.METHOD_TIMEOUT }}
          EQUATION_WALL_CLOCK: ${{ env.EQUATION_WALL_CLOCK }}
          POPULATIONS: ${{ env.PYSR_POPULATIONS }}
          N_ITERATIONS: ${{ env.PYSR_NITERATIONS }}
          PYSR_POPULATION_SIZE: "33"
          PYSR_PARSIMONY: "0.01"
          PYSR_MAXSIZE: "30"
          PYSR_PARALLELISM: "multithreading"
          NN_SEED: ${{ env.NN_SEED }}
          PYSR_SEED: ${{ env.PYSR_SEED }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
          ENGINE_NAME: ${{ env.ENGINE_NAME }}
          PCA_TRAIN_FRAC: ${{ env.PCA_TRAIN_FRAC }}
          NN_TIME_LIMIT: ${{ env.NN_TIME_LIMIT }}

      - name: Preview exp1 cases 1-4 (dry-run)
        run: python3 run_all_checkpoint.py --only exp1 --case-range 1-4 --dry-run

      - name: Run exp1 cases 1-4  [step: exp1, CASE_RANGE_START=1 CASE_RANGE_END=4]
        run: python3 run_all_checkpoint.py --only exp1 --case-range 1-4 --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          EQUATION_WALL_CLOCK: ${{ env.EQUATION_WALL_CLOCK }}
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-04
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp1-01-04-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


  exp1-cases-05-08:
    name: "exp1 · cases 5-8"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: exp1-cases-01-04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-04
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-04
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-04
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp1-04
            results-${{ github.ref }}-

      - name: Run exp1 cases 5-8  [step: exp1, CASE_RANGE_START=5 CASE_RANGE_END=8]
        run: python3 run_all_checkpoint.py --only exp1 --case-range 5-8 --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          EQUATION_WALL_CLOCK: ${{ env.EQUATION_WALL_CLOCK }}
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-08
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-08
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp1-05-08-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


  exp1-cases-09-12:
    name: "exp1 · cases 9-12"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: exp1-cases-05-08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-08
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-08
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-08
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp1-08
            results-${{ github.ref }}-

      - name: Run exp1 cases 9-12  [step: exp1, CASE_RANGE_START=9 CASE_RANGE_END=12]
        run: python3 run_all_checkpoint.py --only exp1 --case-range 9-12 --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          EQUATION_WALL_CLOCK: ${{ env.EQUATION_WALL_CLOCK }}
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-12
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp1-09-12-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


  exp1-cases-13-15:
    name: "exp1 · cases 13-15"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: exp1-cases-09-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-12
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-12
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-12
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp1-12
            results-${{ github.ref }}-

      - name: Run exp1 cases 13-15  [step: exp1, CASE_RANGE_START=13 CASE_RANGE_END=15]
        run: python3 run_all_checkpoint.py --only exp1 --case-range 13-15 --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N_ITERATIONS: "1000"
          POPULATIONS: "30"
          EQUATION_WALL_CLOCK: ${{ env.EQUATION_WALL_CLOCK }}
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-15
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp1-13-15-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


# =============================================================================
# Phase 1 — exp1b  (Portfolio Variance seed sweep)
# Step ID: exp1b   cmd: experiment_protocol_defi_v3.py
# env_extra: DEFI_V3C_NO_TIMEOUT_FLAGS=1, DEFI_TASK_FILTER=portfolio,
#            DEFI_SEEDS=42,99,123,777,2024
# Does NOT use --case-range.  Single job.
# =============================================================================
  exp1b:
    name: "exp1b · Portfolio seed sweep"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: exp1-cases-13-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter
      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-15
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp1-15
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1-15
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp1-15
            results-${{ github.ref }}-

      - name: Run exp1b  [step: exp1b]
        run: python3 run_all_checkpoint.py --only exp1b --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEFI_V3C_NO_TIMEOUT_FLAGS: "1"
          DEFI_TASK_FILTER: "portfolio"
          DEFI_SEEDS: "42,99,123,777,2024"

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1b
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp1b-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


# =============================================================================
# Phase 1 — exp2  (30-equation multi-domain comparison)
# Step ID: exp2   inline_runner=False   script: run_comparative_suite_benchmark_v2.py
#
# IMPORTANT: exp2 does NOT use --case-range.
#   • run_comparative_suite_benchmark_v2.py --protocol all30 --resume handles
#     per-equation checkpointing internally via ProtocolBenchmarkSuite.
#   • Checkpoint written atomically to:
#       hypatiax/data/results/comparison_results/exp2_all30_checkpoint.json
#   • --resume is baked into the Step cmd in run_all_checkpoint.py so the
#     subprocess reloads completed_keys and skips finished equations on restart.
#   • Pass threshold: 9/30 equations.
#
# Cache: persist exp2_all30_checkpoint.json so equation progress survives
# job reruns from the GitHub UI.
# =============================================================================
  exp2:
    name: "exp2 · 30-eq multi-domain (run_comparative_suite_benchmark_v2)"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    needs: exp1b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: julia-actions/setup-julia@v2
        env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true}
        with: {version: "1.10"}
      - run: bash .github/scripts/setup_env.sh --jupyter

      - uses: actions/cache@v5
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp1b
          restore-keys: |
            ckpt-${{ github.ref }}-${{ github.run_id }}-exp1b
            ckpt-${{ github.ref }}-
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp1b
          restore-keys: |
            results-${{ github.ref }}-${{ github.run_id }}-exp1b
            results-${{ github.ref }}-
      # Per-equation checkpoint written by run_comparative_suite_benchmark_v2.py
      - uses: actions/cache@v5
        with:
          path: hypatiax/data/results/comparison_results/exp2_all30_checkpoint.json
          key: exp2-ckpt-${{ github.ref }}-${{ github.run_id }}
          restore-keys: exp2-ckpt-${{ github.ref }}-

      - name: Run exp2  [step: exp2, run_comparative_suite_benchmark_v2.py --protocol all30 --resume]
        # --resume forwarded into run_comparative_suite_benchmark_v2.py so it
        # reloads exp2_all30_checkpoint.json and skips completed equations.
        run: python3 run_all_checkpoint.py --only exp2 --resume --continue-on-fail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYSR_TIMEOUT: ${{ env.PYSR_TIMEOUT }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: logs/pipeline_checkpoint.json
          key: ckpt-${{ github.ref }}-${{ github.run_id }}-exp2
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/
          key: results-${{ github.ref }}-${{ github.run_id }}-exp2
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: hypatiax/data/results/comparison_results/exp2_all30_checkpoint.json
          key: exp2-ckpt-${{ github.ref }}-${{ github.run_id }}-done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 7


