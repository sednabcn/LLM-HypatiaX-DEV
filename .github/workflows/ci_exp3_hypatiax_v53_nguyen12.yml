name: Exp 3 — HypatiaX v5.3 Nguyen-12 Benchmark

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/exp3_hypatiax_v53_nguyen12.ipynb'
      - '.github/workflows/ci_exp3_hypatiax_v53_nguyen12.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/exp3_hypatiax_v53_nguyen12.ipynb'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      niterations:
        description: 'PySR niterations (default 1000; use 50 for a smoke-test)'
        required: false
        default: '1000'
      seed:
        description: 'Random seed'
        required: false
        default: '42'

jobs:
  run-exp3-nguyen12:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      JULIA_VERSION: "1.12.6"
      JULIA_NUM_THREADS: "4"
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
      LLM_MODEL: "claude-sonnet-4-20250514"
      RUN_ID: "paper_v3"
      RUN_VERSION: "3.0"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NITERATIONS: ${{ github.event.inputs.niterations || '1000' }}
      SEED: ${{ github.event.inputs.seed || '42' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir \
            pysr anthropic scikit-learn scipy sympy numpy pandas matplotlib nbconvert ipykernel

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Verify Julia threads
        run: julia -e 'println("Julia threads: ", Threads.nthreads())'

      - name: Patch notebook (fix empty blocks & paths)
        run: python3 .github/scripts/patch_notebook_nguyen12.py

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 \
          .github/scripts/exp3_hypatiax_v53_nguyen12.ipynb

      - name: Export HTML report
        run: |
          jupyter nbconvert --to html \
          .github/scripts/exp3_hypatiax_v53_nguyen12.ipynb \
          --output exp3_nguyen12_report.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp3-nguyen12-all-${{ github.run_id }}
          path: |
            .github/scripts/exp3_hypatiax_v53_nguyen12.ipynb
            exp3_nguyen12_report.html
            *.png
            *.json
            *.csv
          if-no-files-found: ignore
          retention-days: 30
