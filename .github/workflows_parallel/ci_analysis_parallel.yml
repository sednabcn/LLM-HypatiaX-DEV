# ==============================================================================
#  ci_analysis_parallel.yml  —  HypatiaX post-consolidation statistical analysis
#                               (parallel pipeline variant of ci_analysis.yml)
#
#  CHANGES vs ci_analysis.yml
#  ─────────────────────────────────────────────────────────────────────────────
#  This file is functionally identical to ci_analysis.yml with the following
#  adaptations for the parallel pipeline (ci_pipeline_parallel.yml):
#
#  PAR-A1  workflow name updated to "HypatiaX - analysis (parallel)" so that
#          gh run list queries in ci_pipeline_parallel.yml can filter by
#          --workflow ci_analysis_parallel.yml without ambiguity.
#
#  PAR-A2  run-name embeds "(parallel)" to distinguish runs in the GitHub UI
#          from sequential ci_analysis.yml runs that may overlap.
#
#  PAR-A3  concurrency group renamed to ci-analysis-parallel-<experiment> so
#          parallel analysis runs do not cancel or queue-block sequential ones.
#
#  PAR-A4  source_run_id handling preserved: ci_pipeline_parallel.yml wave jobs
#          forward the runner_run_id output as source_run_id, enabling artifact
#          download for exp1b / exp3b consolidated artifacts. Falls back to
#          committed files (purge resilience) when artifact is absent.
#
#  PAR-A5  No other logic changes.  All analysis, validation, commit, and
#          fatal-condition abort steps are identical to ci_analysis.yml.
#          This preserves a single source of truth for analysis logic while
#          giving ci_pipeline_parallel.yml a uniquely addressable workflow file.
#
#  DISPATCH CONTEXT
#  ─────────────────────────────────────────────────────────────────────────────
#  Dispatched by ci_pipeline_parallel.yml wave jobs immediately after each
#  experiment's runner (ci_runner.yml shards) completes.  The caller:
#    - passes experiment=<exp_id>
#    - passes source_run_id=<first_shard_run_id>  (or "" for idempotency skip)
#    - passes result_subdir=<canonical_subdir>    (from diagnose_map)
#  Polling is performed by the wave job; this workflow just runs and exits.
# ==============================================================================

name: "HypatiaX - analysis (parallel)"

run-name: >-
  HypatiaX analysis (parallel) ::
  ${{ github.event.inputs.experiment }}

# -- Triggers ------------------------------------------------------------------
on:

  # Dispatched explicitly by ci_pipeline_parallel.yml wave jobs after each
  # experiment's runner completes, or run manually to re-analyse committed files.
  workflow_dispatch:
    inputs:

      experiment:
        description: "Experiment identifier"
        required: true
        type: string

      result_subdir:
        description: "Optional explicit result subdirectory (forwarded from diagnose_map)"
        required: false
        default: ""
        type: string

      source_run_id:
        description: "Optional workflow run id of the runner (for artifact download)"
        required: false
        default: ""
        type: string

# -- Permissions ---------------------------------------------------------------
permissions:
  contents: write   # commit report + analysis outputs
  actions:  read    # download artifacts from triggering workflow run

# -- Concurrency ---------------------------------------------------------------
# PAR-A3: separate concurrency group from ci_analysis.yml to avoid
# cross-pipeline cancellation when both pipelines run simultaneously.
concurrency:
  group: ci-analysis-parallel-${{ github.event.inputs.experiment }}
  cancel-in-progress: false

# ==============================================================================
#  JOB: analyze
# ==============================================================================
jobs:

  analyze:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      EXPERIMENT:            ${{ github.event.inputs.experiment }}
      INPUT_RESULT_SUBDIR:   ${{ github.event.inputs.result_subdir }}
      SOURCE_RUN_ID:         ${{ github.event.inputs.source_run_id }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" "tabulate>=0.9"

      # -----------------------------------------------------------------------
      # Resolve result directory
      # -----------------------------------------------------------------------

      - name: Resolve result directory
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          EXPERIMENT="${EXPERIMENT}"
          INPUT_RESULT_SUBDIR="${INPUT_RESULT_SUBDIR}"

          if [[ -n "${INPUT_RESULT_SUBDIR}" ]]; then
            # Canonical subdir forwarded by ci_pipeline_parallel.yml (single source of truth).
            # When dispatched via ci_pipeline_parallel.yml this is always populated from the
            # diagnose-all job's diagnose_map, which mirrors ci_runner.yml exactly.
            RESULT_SUBDIR="${INPUT_RESULT_SUBDIR}"
          else
            # Fallback for manual workflow_dispatch without result_subdir.
            # WARNING: this mapping must stay in sync with ci_runner.yml plan job
            # and ci_pipeline_parallel.yml diagnose-all SUBDIR dict.  Prefer passing
            # result_subdir explicitly via diagnose_map rather than relying on this fallback.
            RESULT_SUBDIR=$(python3 << 'PYEOF'
          import os, sys
          MAPPING = {
              "exp1":               "comparison_results/noise-noiseless/noiseless/defi",
              "exp1b":              "comparison_results/noise-noiseless/15",
              "exp2_feynman":       "comparison_results/feynman-tests/exp2",
              "exp2":               "comparison_results/feynman-tests/exp2_multi",
              "exp3":               "extrapolation",
              "exp3b":              "extrapolation/multi_seed",
              "suppA":              "hybrid_pysr/defi",
              "suppB":              "comparison_results/feynman-tests/noise-sweep/noise-sweep",
              "suppB_sc":           "comparison_results/feynman-tests/sample-complexity",
              "hybrid_all_domains": "hybrid_llm_nn/all_domains",
              "instability":        "figures",
              "extrap":             "comparison_results/extrapolation",
          }
          exp = os.environ["EXPERIMENT"]
          result = MAPPING.get(exp, exp)
          if result == exp:
              print(f"::warning::No canonical subdir mapping for '{exp}' — using experiment name as subdir.", file=sys.stderr)
          print(result)
          PYEOF
          )
          fi

          RESULT_DIR="hypatiax/data/results/${RESULT_SUBDIR}"

          echo "RESULT_SUBDIR=${RESULT_SUBDIR}" >> "$GITHUB_ENV"
          echo "RESULT_DIR=${RESULT_DIR}"       >> "$GITHUB_ENV"

          echo "Resolved: experiment=${EXPERIMENT}  subdir=${RESULT_SUBDIR}"
          echo "          RESULT_DIR=${RESULT_DIR}"
          echo "          source=pipeline-forwarded (${INPUT_RESULT_SUBDIR:+yes}${INPUT_RESULT_SUBDIR:-no, used fallback MAPPING})"

      # -----------------------------------------------------------------------
      # Optional artifact download
      # -----------------------------------------------------------------------

      # PAR-A4: source_run_id forwarded from wave job's runner_run_id output.
      # Purge resilience: continue-on-error so the step never hard-fails
      # when the run has been deleted; Locate analysis input falls back to
      # committed files in that case (always present for parallel pipeline
      # because shards commit directly before this workflow is dispatched).
      - name: Download merged artifact (exp1b / exp3b only)
        if: |
          github.event.inputs.source_run_id != '' &&
          (
            contains(github.event.inputs.experiment, 'exp1b') ||
            contains(github.event.inputs.experiment, 'exp3b')
          )
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id:         ${{ github.event.inputs.source_run_id }}
          github-token:   ${{ secrets.GITHUB_TOKEN }}
          path:           consolidated_artifact
          pattern:        "consolidated-${{ github.event.inputs.experiment }}-*"
          merge-multiple: true

      # -----------------------------------------------------------------------
      # Locate analysis input
      # -----------------------------------------------------------------------

      - name: Locate analysis input
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          RESULT_DIR="${RESULT_DIR}"
          EXPERIMENT="${EXPERIMENT}"

          echo "=== RESULT DIRECTORY ==="
          echo "$RESULT_DIR"

          echo
          echo "=== TREE ==="

          if [[ -d "$RESULT_DIR" ]]; then
            find "$RESULT_DIR" -maxdepth 2 -type f | sort
          else
            echo "Directory does not exist"
          fi

          echo
          echo "=== DETERMINE INPUT MODE ==="

          REQUIRE_MERGE=false

          if [[ "$EXPERIMENT" == *"exp1b"* ]] || [[ "$EXPERIMENT" == *"exp3b"* ]]; then
            REQUIRE_MERGE=true
          fi

          echo "REQUIRE_MERGE=$REQUIRE_MERGE"

          # ------------------------------------------------------------------
          # MERGED MODE (exp1b / exp3b)
          # ------------------------------------------------------------------

          if [[ "$REQUIRE_MERGE" == "true" ]]; then

            echo
            echo "Merged mode activated"

            CANDIDATES=()

            while IFS= read -r path; do
              CANDIDATES+=("$path")
            done < <(
              find consolidated_artifact "$RESULT_DIR" \
                -type f \
                -name '_merged.json' \
                2>/dev/null \
                | sort
            )

            if [[ ${#CANDIDATES[@]} -eq 0 ]]; then

              echo
              echo "ERROR: merged experiment requires _merged.json"
              echo
              echo "Searched:"
              echo "  consolidated_artifact/**/_merged.json"
              echo "  ${RESULT_DIR}/_merged.json"
              echo
              echo "Run ci_consolidate_experiment.yml first."

              exit 1
            fi

            INPUT_JSON="${CANDIDATES[0]}"

            echo "INPUT_MODE=merged" >> "$GITHUB_ENV"
            echo "INPUT_JSON=$INPUT_JSON" >> "$GITHUB_ENV"

            echo
            echo "Selected merged input:"
            echo "$INPUT_JSON"

          # ------------------------------------------------------------------
          # SHARD MODE (all other experiments)
          # ------------------------------------------------------------------

          else

            echo
            echo "Shard mode activated"

            mapfile -t SHARD_FILES < <(
              find "$RESULT_DIR" \
                -maxdepth 2 \
                -type f \
                -name '*.json' \
                ! -name '_*.json' \
                ! -name 'benchmark_results.json' \
                | sort
            )

            if [[ ${#SHARD_FILES[@]} -eq 0 ]]; then

              echo
              echo "ERROR: No shard JSON files found"
              echo
              echo "Expected files like:"
              echo "  worker_0.json"
              echo "  shard_1.json"
              echo "  results_part_a.json"
              echo
              echo "Searched:"
              echo "  ${RESULT_DIR}/**/*.json (maxdepth 2)"
              echo "  excluding _*.json and benchmark_results.json"

              exit 1
            fi

            printf '%s\n' "${SHARD_FILES[@]}" > shard_manifest.txt

            echo "INPUT_MODE=shards"                    >> "$GITHUB_ENV"
            echo "SHARD_MANIFEST=shard_manifest.txt"   >> "$GITHUB_ENV"

            echo
            echo "Selected shard files:"
            cat shard_manifest.txt

          fi

      # -----------------------------------------------------------------------
      # Validate input data
      # -----------------------------------------------------------------------

      - name: Validate input data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os
          import pathlib
          import sys

          mode = os.environ['INPUT_MODE']

          def load_records(path):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  if 'results' in data:
                      results = data['results']
                      if isinstance(results, list):
                          return results

              return []

          total = 0

          if mode == 'merged':
              path = os.environ['INPUT_JSON']
              records = load_records(path)

              print(f"Merged file: {path}")
              print(f"Records: {len(records)}")

              total += len(records)

          else:
              manifest = pathlib.Path(os.environ['SHARD_MANIFEST'])

              for line in manifest.read_text().splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  records = load_records(line)

                  print(f"Shard: {line}")
                  print(f"Records: {len(records)}")

                  total += len(records)

          print(f"TOTAL_RECORDS={total}")

          if total == 0:
              print()
              print('FATAL: EMPTY DATASET')
              sys.exit(1)
          PYEOF

      # -----------------------------------------------------------------------
      # Run analysis
      # -----------------------------------------------------------------------

      - name: Run statistical analysis
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RESULT_DIR"

          python3 hypatiax/tools/run_analysis.py \
            --experiment "$EXPERIMENT" \
            --result-dir "$RESULT_DIR" \
            $(
              if [[ "$INPUT_MODE" == "merged" ]]; then
                echo "--input-json '$INPUT_JSON'"
              else
                echo "--shard-manifest '$SHARD_MANIFEST'"
              fi
            )

      # -----------------------------------------------------------------------
      # Verify outputs
      # -----------------------------------------------------------------------

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          REPORT_MD="$RESULT_DIR/_report.md"
          ANALYSIS_JSON="$RESULT_DIR/_analysis.json"

          [[ -f "$REPORT_MD" ]] || {
            echo "::error::Missing report markdown: $REPORT_MD"
            exit 1
          }

          [[ -f "$ANALYSIS_JSON" ]] || {
            echo "::error::Missing analysis json: $ANALYSIS_JSON"
            exit 1
          }

          python3 - <<'PYEOF'
          import json, os, sys

          path = os.environ['RESULT_DIR'] + '/_analysis.json'
          try:
              d = json.load(open(path))
          except Exception as e:
              print(f'::error::_analysis.json is not valid JSON: {e}')
              sys.exit(1)

          required = ('experiment', 'experiment_mode', 'n_total', 'fatal_conditions')
          missing  = [k for k in required if k not in d]
          if missing:
              print(f'::error::_analysis.json missing required keys: {missing}')
              sys.exit(1)

          hard = [c for c in d['fatal_conditions']
                  if not (c.startswith('INFO_') or c.startswith('WARN_'))]
          print(f'_analysis.json OK: experiment={d["experiment"]}, '
                f'mode={d["experiment_mode"]}, n_total={d["n_total"]}, '
                f'fatal_conditions={len(d["fatal_conditions"])} '
                f'({len(hard)} hard, {len(d["fatal_conditions"])-len(hard)} soft)')
          PYEOF

          echo
          echo "=== OUTPUTS ==="
          ls -lh "$REPORT_MD" "$ANALYSIS_JSON"

      # -----------------------------------------------------------------------
      # Commit outputs
      # -----------------------------------------------------------------------

      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset HEAD 2>/dev/null || true
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          git add -f \
            "$RESULT_DIR/_report.md" \
            "$RESULT_DIR/_analysis.json"

          if git diff --cached --quiet; then
            echo "No analysis changes to commit"
            exit 0
          fi

          git commit -m "analysis(parallel): ${EXPERIMENT} - run ${{ github.run_id }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push origin HEAD:${{ github.ref_name }}
          echo "Pushed analysis outputs to master."

      # -----------------------------------------------------------------------
      # Upload outputs
      # -----------------------------------------------------------------------

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-parallel-${{ github.event.inputs.experiment }}-${{ github.run_id }}
          path: |
            ${{ env.RESULT_DIR }}/_report.md
            ${{ env.RESULT_DIR }}/_analysis.json
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # Abort on fatal conditions flagged by run_analysis.py.
      # Runs AFTER commit so the report is always available even on abort.
      # -----------------------------------------------------------------------

      - name: Abort on fatal conditions
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          path = os.environ['RESULT_DIR'] + '/_analysis.json'

          if not os.path.exists(path):
              print("No _analysis.json found; skipping fatal-condition check.")
              sys.exit(0)

          with open(path) as f:
              analysis = json.load(f)

          fatal = analysis.get("fatal_conditions", [])

          # Hard fatals: anything not prefixed INFO_ or WARN_.
          hard_fatal = [c for c in fatal
                        if not (c.startswith("INFO_") or c.startswith("WARN_"))]

          if not hard_fatal:
              if fatal:
                  print(f"Soft conditions only ({len(fatal)}):")
                  for i, cond in enumerate(fatal, 1):
                      print(f"  {i}. {cond}")
              print("No fatal conditions detected. Analysis complete.")
              sys.exit(0)

          print(f"::error::Fatal conditions detected ({len(hard_fatal)}):")
          for i, cond in enumerate(hard_fatal, 1):
              print(f"  {i}. {cond}")
          print()
          print("Review _report.md for full diagnostic details.")
          print("To re-run analysis after fixes: use workflow_dispatch with the same experiment.")
          sys.exit(1)
          PYEOF
