# ==============================================================================
#  ci_pipeline_parallel.yml  —  HypatiaX parallel pipeline orchestrator
#  (parallel redesign of ci_pipeline.yml)
#
#  Runs all 12 experiments concurrently in 5 dependency waves derived from the
#  parallel_dispatch_dag.svg, then converges on a single postprocess + checkpoint
#  gate.  Wall-clock time: ~14 h sequential → ~8.5 h parallel (DAG critical path).
#
#  Wave topology (from parallel_dispatch_dag.svg):
#    Wave 1 (~5.5 h)  : exp1                              — blocked by nothing
#    Wave 2 (~5.5 h)  : exp1b, exp2_feynman, exp2,        — blocked by nothing
#                       hybrid_all_domains                   (runs concurrently with wave 1)
#    Wave 3 (~4.5 h)  : exp3, exp3b, extrap, suppA,       — blocked by nothing
#                       suppB, suppB_sc                      (runs concurrently with waves 1-2)
#    Wave 4 (~2 h)    : instability                       — blocked on exp1 (wave 1)
#    Wave 5 (~0.5 h)  : tables, figures                   — blocked on ALL above
#
#  Each wave is a GitHub Actions job that fans out via dispatch_parallel_experiment.sh
#  (FIX-D1…D5) for multi-shard parallelism, then polls each run ID to completion.
#  Analysis (ci_analysis_parallel.yml) and postprocess (ci_postprocess_parallel.yml) are dispatched
#  per-experiment immediately after each experiment runner completes within its wave.
#  The global checkpoint gate (ci_pipeline_check.yml) runs once at the very end
#  after all waves and all per-experiment postprocess passes.
#
#  Stage chain per experiment (mirrors ci_pipeline.yml):
#    C0 → ci_runner.yml          — sharded experiment workers
#    C1 → ci_analysis_parallel.yml    — statistical analysis / reports
#    C2 → ci_postprocess_parallel.yml — per-experiment figures + tables
#  Global convergence:
#    C3 → ci_pipeline_parallel_analysis.yml  — cross-experiment analysis
#    C4 → ci_pipeline_check.yml              — qualification + paper audit gate
#    C5 → self-dispatch                      — next full-pipeline run (if any)
#
#  Naming convention (parallel suffix):
#    ci_pipeline_parallel.yml           — this file (parallel orchestrator)
#    ci_runner.yml                      — experiment workers          (shared)
#    ci_analysis_parallel.yml          — per-experiment analysis     (parallel)
#    ci_postprocess_parallel.yml       — per-experiment postprocess  (parallel)
#    ci_pipeline_check.yml              — qualification gate          (shared)
#    ci_pipeline_parallel_analysis.yml  — cross-experiment analysis   (new)
#
#  IDEMPOTENCY
#  -----------
#  Each wave job has an idempotency guard (identical pattern to ci_pipeline.yml):
#  before dispatching an experiment it checks whether ci_runner.yml already
#  succeeded for that experiment since STARTED_AT.  If so the dispatch is
#  skipped and the wave proceeds with the already-committed outputs.
#
#  DISPATCH + POLL PATTERN (FIX-D1…D5 from dispatch_parallel_experiment.sh)
#  -------------------------------------------------------------------------
#  • FIX-D1: shard_index and n_shards passed as --field to every dispatch.
#  • FIX-D2: locate_run_id() matches displayTitle suffix "(shard N/M)".
#  • FIX-D3: pre-dispatch timestamp margin = 30 s.
#  • FIX-D4: gh run list --limit 100.
#  • FIX-D5: no dead-code poll loop; each wave polls its own run IDs.
# ==============================================================================

name: "HypatiaX - pipeline parallel"
run-name: >-
  HypatiaX pipeline parallel —
  ${{ github.event.inputs.wave_filter || 'all waves' }} —
  run ${{ github.run_id }}

on:
  schedule:
    # Weekly on Monday 01:00 UTC — full parallel run of all 12 experiments
    - cron: "0 1 * * 1"

  workflow_dispatch:
    inputs:
      n_shards:
        description: "Parallel worker shards per experiment (1-4)"
        required: false
        default: "2"

      wave_filter:
        description: >
          Limit run to a single wave (blank = all waves).
          Values: wave1 | wave2 | wave3 | wave4 | wave5 | postprocess | checkpoint
        required: false
        default: ""
        type: choice
        options:
          - ""
          - wave1
          - wave2
          - wave3
          - wave4
          - wave5
          - postprocess
          - checkpoint

      seeds:
        description: "Comma-separated seeds (overrides per-experiment default)"
        required: false
        default: ""

      n_samples:
        description: "Samples per equation (Feynman / suppB)"
        required: false
        default: "200"

      noise_levels:
        description: "Noise levels for suppB"
        required: false
        default: "0.0,0.5,1.0,5.0,10.0"

      dry_run:
        description: "Dry-run — print dispatch commands without executing (true/false)"
        required: false
        default: "false"

      fail_on_incomplete:
        description: "Fail checkpoint if any tasks are missing (true/false)"
        required: false
        default: "false"

      force_rerun:
        description: >
          Skip idempotency guards and re-run all experiments even if already
          committed (true/false).
        required: false
        default: "false"

permissions:
  contents: write
  actions:  write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OUT_BASE: "hypatiax/data/results"
  # Dispatch helper — shared by every wave job.
  DISPATCH_SCRIPT: ".github/scripts/dispatch_parallel_experiment.sh"

# ==============================================================================
#  REUSABLE INLINE FUNCTIONS
#
#  dispatch_and_poll <workflow_file> <experiment> <extra_fields...>
#  ---------------------------------------------------------------
#  Records BEFORE_TS, dispatches the workflow with all standard fields plus
#  any extras, then polls the specific run ID until completed.
#  Used verbatim in every wave job's per-experiment dispatch block.
#
#  locate_run_id <workflow_file> <before_ts> <limit>
#  -------------------------------------------------
#  Same logic as dispatch_parallel_experiment.sh locate_run_id() but for
#  single-dispatch workflows (ci_analysis_parallel.yml, ci_postprocess_parallel.yml) that
#  embed the experiment name in their displayTitle rather than "(shard N/M)".
# ==============================================================================

jobs:

  # ============================================================================
  #  JOB: setup  —  resolve global parameters and emit timestamps
  # ============================================================================
  setup:
    name: "Setup — resolve parameters"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      started_at:   ${{ steps.init.outputs.started_at }}
      n_shards:     ${{ steps.init.outputs.n_shards }}
      run_wave1:    ${{ steps.init.outputs.run_wave1 }}
      run_wave2:    ${{ steps.init.outputs.run_wave2 }}
      run_wave3:    ${{ steps.init.outputs.run_wave3 }}
      run_wave4:    ${{ steps.init.outputs.run_wave4 }}
      run_wave5:    ${{ steps.init.outputs.run_wave5 }}
      run_post:     ${{ steps.init.outputs.run_post }}
      run_check:    ${{ steps.init.outputs.run_check }}

    steps:
      - name: Resolve wave filter and parameters
        id: init
        env:
          WAVE_FILTER:  ${{ github.event.inputs.wave_filter || '' }}
          N_SHARDS_RAW: ${{ github.event.inputs.n_shards || '2' }}
        run: |
          python3 - <<'PYEOF'
          import os
          from datetime import datetime, timezone

          wf     = os.environ["WAVE_FILTER"].strip()
          n_raw  = os.environ["N_SHARDS_RAW"].strip()

          # Validate n_shards
          try:
              n = int(n_raw)
              assert 1 <= n <= 4
          except Exception:
              print(f"::error::n_shards must be 1-4, got '{n_raw}'")
              raise SystemExit(1)

          # If wave_filter is blank, run everything
          run_all   = wf == ""
          run_wave1 = run_all or wf == "wave1"
          run_wave2 = run_all or wf == "wave2"
          run_wave3 = run_all or wf == "wave3"
          run_wave4 = run_all or wf == "wave4"
          run_wave5 = run_all or wf == "wave5"
          run_post  = run_all or wf in ("wave5", "postprocess")
          run_check = run_all or wf == "checkpoint"

          started_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as fh:
              fh.write(f"started_at={started_at}\n")
              fh.write(f"n_shards={n}\n")
              for k, v in [
                  ("run_wave1", run_wave1), ("run_wave2", run_wave2),
                  ("run_wave3", run_wave3), ("run_wave4", run_wave4),
                  ("run_wave5", run_wave5), ("run_post",  run_post),
                  ("run_check", run_check),
              ]:
                  fh.write(f"{k}={'true' if v else 'false'}\n")

          print(f"started_at  : {started_at}")
          print(f"n_shards    : {n}")
          print(f"wave_filter : '{wf}' → "
                f"waves={'1' if run_wave1 else '-'}"
                f"{'2' if run_wave2 else '-'}"
                f"{'3' if run_wave3 else '-'}"
                f"{'4' if run_wave4 else '-'}"
                f"{'5' if run_wave5 else '-'}"
                f"  post={'Y' if run_post else 'N'}"
                f"  check={'Y' if run_check else 'N'}")
          PYEOF

  # ============================================================================
  #  JOB: diagnose-all  —  inspect repo state for all 12 experiments at once
  #
  #  Runs a single checkout and emits a JSON map:
  #      { exp_id: { runner_state, analysis_state, postprocess_state,
  #                  skip_runner, result_subdir } }
  #
  #  Wave jobs consume diagnose_map to decide whether to dispatch or skip.
  # ============================================================================
  diagnose-all:
    name: "Diagnose — all experiments"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      diagnose_map: ${{ steps.diagnose.outputs.diagnose_map }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Diagnose all experiments
        id: diagnose
        env:
          FORCE_RERUN:  ${{ github.event.inputs.force_rerun || 'false' }}
          SEEDS:        ${{ github.event.inputs.seeds || '42,99,123,777,2024' }}
          NOISE_LEVELS: ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          OUT_BASE:     hypatiax/data/results
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess
          from pathlib import Path

          FORCE_RERUN  = os.environ["FORCE_RERUN"].lower() == "true"
          OUT_BASE     = Path(os.environ["OUT_BASE"])
          SEEDS        = [s.strip() for s in os.environ["SEEDS"].split(",") if s.strip()]
          NOISE_LEVELS = [l.strip() for l in os.environ["NOISE_LEVELS"].split(",") if l.strip()]

          # ── Canonical subdirs (single source of truth) ────────────────────
          SUBDIR = {
              "exp1":               "comparison_results/noise-noiseless/noiseless/defi",
              "exp1b":              "comparison_results/noise-noiseless/15",
              "exp2_feynman":       "comparison_results/feynman-tests/exp2",
              "exp2":               "comparison_results/feynman-tests/exp2_multi",
              "exp3":               "extrapolation",
              "exp3b":              "extrapolation/multi_seed",
              "suppA":              "hybrid_pysr/defi",
              "suppB":              "comparison_results/feynman-tests/noise-sweep/noise-sweep",
              "suppB_sc":           "comparison_results/feynman-tests/sample-complexity",
              "hybrid_all_domains": "hybrid_llm_nn/all_domains",
              "instability":        "figures",
              "extrap":             "comparison_results/extrapolation",
          }

          RESULT_GLOBS = {
              "exp1":               ["hypatiax_defi_benchmark_v3*results*.json",
                                     "protocol_core_noiseless_*.json"],
              "exp1b":              ["comparison_FIXED_*.json",
                                     "hypatiax_defi_benchmark_v3*results*.json"],
              "exp2_feynman":       ["protocol_core_*.json", "benchmark_results.json"],
              "exp2":               ["protocol_core_*.json", "benchmark_results.json"],
              "exp3":               ["exp3_nguyen12_*.json", "*nguyen*seed*.json",
                                     "full_run_*.json"],
              "exp3b":              ["exp3_nguyen12_*.json", "*nguyen*seed*.json",
                                     "full_run_*.json"],
              "suppA":              ["consolidated_hybrid_*.json", "hybrid_system*.json",
                                     "*73cases*.json"],
              "suppB":              ["noise_sweep_*.json", "noise_sweep_*.csv"],
              "suppB_sc":           ["sample_complexity_*.json", "sample_complexity_*.csv"],
              "hybrid_all_domains": ["hybrid_llm_nn_all_domains_*.json"],
              "instability":        ["instability_analysis.csv", "*.pdf", "*.png"],
              "extrap":             ["all_domains_extrap_v4_*.json", "protocol_core_*.json"],
          }

          MIN_TASKS = {
              "exp1": 1, "exp1b": 4, "exp2_feynman": 1, "exp2": 1,
              "exp3": 1, "exp3b": 4, "suppA": 1,
              "suppB": len(NOISE_LEVELS), "suppB_sc": 1,
              "hybrid_all_domains": 1, "instability": 1, "extrap": 1,
          }

          def git_tracked(p):
              try:
                  r = subprocess.run(["git","ls-files","--error-unmatch",str(p)],
                                     capture_output=True)
                  return r.returncode == 0
              except Exception:
                  return False

          def json_valid(p):
              try:  json.loads(p.read_text()); return True
              except Exception: return False

          def classify_runner(exp):
              rdir   = OUT_BASE / SUBDIR.get(exp, "")
              files  = []
              if rdir.exists():
                  for g in RESULT_GLOBS.get(exp, ["*.json"]):
                      files.extend(f for f in rdir.glob(g)
                                   if not f.name.startswith("_"))
              files = list(set(files))
              min_t = MIN_TASKS.get(exp, 1)
              if not files:
                  return "missing"
              jf = [f for f in files if f.suffix == ".json"]
              valid   = json_valid(jf[0]) if jf else True
              tracked = git_tracked(files[0])
              if len(files) >= min_t and valid and tracked:
                  return "done"
              return "partial"

          def classify_analysis(exp):
              rdir   = OUT_BASE / SUBDIR.get(exp, "")
              report = rdir / "_report.md"
              afile  = rdir / "_analysis.json"
              if not (report.exists() and afile.exists()):
                  return "missing"
              try:
                  d = json.loads(afile.read_text())
                  if "experiment" in d and "fatal_conditions" in d:
                      return "done"
              except Exception:
                  pass
              return "partial"

          def classify_postprocess(exp):
              rdir = OUT_BASE / SUBDIR.get(exp, "")
              figs = list((rdir/"figures").glob("*.pdf")) + \
                     list((rdir/"figures").glob("*.png")) \
                     if (rdir/"figures").exists() else []
              tabs = list((rdir/"tables").glob("*.tex")) + \
                     list((rdir/"tables").glob("*.csv")) \
                     if (rdir/"tables").exists() else []
              if figs and tabs:  return "done"
              if not figs and not tabs: return "missing"
              return "partial"

          result = {}
          for exp in SUBDIR:
              if FORCE_RERUN:
                  rs, as_, ps = "missing", "missing", "missing"
              else:
                  rs  = classify_runner(exp)
                  as_ = classify_analysis(exp)
                  ps  = classify_postprocess(exp)
              result[exp] = {
                  "runner_state":      rs,
                  "analysis_state":    as_,
                  "postprocess_state": ps,
                  "skip_runner":       rs == "done" and not FORCE_RERUN,
                  "result_subdir":     SUBDIR[exp],
              }
              icon = {"done":"✅","partial":"⚠ ","missing":"❌"}.get(rs,"?")
              print(f"  {icon} {exp:<22} runner={rs:<8} analysis={as_:<8} postprocess={ps}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"diagnose_map={json.dumps(result)}\n")
          PYEOF

  # ============================================================================
  #  SHARED STEP TEMPLATE (documented here, embedded inline per wave)
  #
  #  dispatch_experiment <exp> <n_shards> <before_ts>
  #  -------------------------------------------------
  #  Uses dispatch_parallel_experiment.sh (FIX-D1…D5) to fan out shards
  #  and locate each run ID, then polls each run to completion.
  #
  #  dispatch_downstream <workflow> <exp> <extra_fields>
  #  ---------------------------------------------------
  #  Single-dispatch pattern for ci_analysis_parallel.yml and ci_postprocess_parallel.yml.
  #  Records BEFORE_TS, dispatches, waits 8 s, locates run ID, polls.
  # ============================================================================

  # ============================================================================
  #  WAVE 1  —  exp1 alone
  #  Runtime: ~5.5 h
  #  Unblocked: runs immediately after setup + diagnose-all.
  #  Downstream: instability (wave 4) depends on exp1 output.
  # ============================================================================
  wave1-exp1:
    name: "Wave 1 · exp1 (Core noiseless DeFi)"
    needs: [setup, diagnose-all]
    runs-on: ubuntu-latest
    timeout-minutes: 400
    if: needs.setup.outputs.run_wave1 == 'true'

    outputs:
      runner_run_id: ${{ steps.run_exp.outputs.runner_run_id }}
      exp1_done:     ${{ steps.run_exp.outputs.exp_done }}

    steps:
      - name: Dispatch + wait · exp1 runner
        id: run_exp
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          N_SHARDS:    ${{ needs.setup.outputs.n_shards }}
          SEEDS:       ${{ github.event.inputs.seeds || '' }}
          SAMPLES:     ${{ github.event.inputs.n_samples || '200' }}
          NOISE:       ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          STARTED_AT:  ${{ needs.setup.outputs.started_at }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail
          EXP="exp1"

          # ── Idempotency guard ──────────────────────────────────────────────
          SKIP=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys
          m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('skip_runner') and '${FORCE_RERUN}'!='true' else 'false')")
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::exp1 runner outputs already committed — skipping C0."
            echo "exp_done=true"  >> "$GITHUB_OUTPUT"
            echo "runner_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Multi-shard dispatch (FIX-D1…D4) ──────────────────────────────
          # FIX-D3: 30 s margin
          BEFORE_EPOCH=$(( $(date +%s) - 30 ))
          BEFORE_ISO=$(date -u -d "@${BEFORE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                       || date -u -r "${BEFORE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)

          echo "Dispatching exp1 · ${N_SHARDS} shard(s) · before=${BEFORE_ISO}"

          PARALLEL_RUN_IDS=""
          if [[ -f "${DISPATCH_SCRIPT}" ]]; then
            # Use the shared dispatch helper (FIX-D1…D5)
            RESULT=$(GITHUB_REPOSITORY="${REPO}" GITHUB_REF_NAME="${{ github.ref_name }}" \
              bash "${DISPATCH_SCRIPT}" "${EXP}" "${N_SHARDS}" "" "ci_runner.yml")
            PARALLEL_RUN_IDS=$(echo "$RESULT" | grep '^PARALLEL_RUN_IDS=' | cut -d= -f2-)
          else
            # Inline fallback (single shard)
            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci_runner.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field n_shards="${N_SHARDS}" --field shard_index="0" \
              --field seeds="${SEEDS}" --field n_samples="${SAMPLES}" \
              --field noise_levels="${NOISE}" --field dry_run="${DRY_RUN}"
            sleep 8
            for attempt in $(seq 1 12); do
              RID=$(gh run list --repo "${REPO}" --workflow ci_runner.yml \
                --event workflow_dispatch --limit 100 \
                --json databaseId,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "$RID" ]] && { PARALLEL_RUN_IDS="$RID"; break; }
              echo "  Attempt ${attempt}/12: run not visible yet — waiting 10 s..."
              sleep 10
            done
          fi

          [[ -z "$PARALLEL_RUN_IDS" ]] && { echo "::error::Could not locate run ID for exp1."; exit 1; }
          echo "exp1 run IDs: ${PARALLEL_RUN_IDS}"

          # ── Poll each shard run to completion ──────────────────────────────
          DEADLINE=$(( $(date +%s) + 22800 ))   # 380 min
          FIRST_RID=$(echo "${PARALLEL_RUN_IDS}" | tr ',' '\n' | head -1)

          for RID in $(echo "${PARALLEL_RUN_IDS}" | tr ',' ' '); do
            echo "Polling shard run ${RID} for exp1 ..."
            SLEEP=30
            while true; do
              RJ=$(gh run view "${RID}" --repo "${REPO}" \
                     --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] exp1 run=${RID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::exp1 shard run ${RID} failed: ${CN}"; exit 1; }
                echo "  exp1 shard run ${RID} completed successfully."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on exp1 run ${RID}."; exit 1; }
              sleep ${SLEEP}
              SLEEP=$(( SLEEP < 120 ? SLEEP + 10 : 120 ))
            done
          done

          echo "runner_run_id=${FIRST_RID}" >> "$GITHUB_OUTPUT"
          echo "exp_done=true"              >> "$GITHUB_OUTPUT"

      - name: Dispatch + wait · exp1 analysis (C1)
        if: steps.run_exp.outputs.exp_done == 'true'
        env:
          GH_TOKEN:      ${{ secrets.PAT_TOKEN }}
          REPO:          ${{ github.repository }}
          SOURCE_RUN_ID: ${{ steps.run_exp.outputs.runner_run_id }}
          DIAG_MAP:      ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail
          EXP="exp1"
          RESULT_SUBDIR=$(echo "${DIAG_MAP}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['${EXP}']['result_subdir'])")

          SKIP=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('analysis_state')=='done' and '${FORCE_RERUN:-false}'!='true' else 'false')" 2>/dev/null || echo "false")
          [[ "$SKIP" == "true" ]] && { echo "::notice::exp1 analysis already done — skipping C1."; exit 0; }

          BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci_analysis_parallel.yml \
            --repo "${REPO}" --ref "${{ github.ref_name }}" \
            --field experiment="${EXP}" \
            --field source_run_id="${SOURCE_RUN_ID}" \
            --field result_subdir="${RESULT_SUBDIR}"
          sleep 8

          DISPATCHED_ID=""
          for attempt in $(seq 1 6); do
            DISPATCHED_ID=$(gh run list --repo "${REPO}" --workflow ci_analysis_parallel.yml \
              --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt,headBranch \
              --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
              2>/dev/null || echo "")
            [[ -n "${DISPATCHED_ID}" ]] && break
            echo "  Attempt ${attempt}/6: not visible — waiting 5 s..."; sleep 5
          done
          [[ -z "${DISPATCHED_ID}" ]] && { echo "::error::No run ID for exp1 analysis."; exit 1; }

          echo "Polling exp1 analysis run ${DISPATCHED_ID} ..."
          DEADLINE=$(( $(date +%s) + 1800 ))
          SLEEP=20
          while true; do
            RJ=$(gh run view "${DISPATCHED_ID}" --repo "${REPO}" \
                   --json status,conclusion 2>/dev/null \
                 || echo '{"status":"unknown","conclusion":"none"}')
            ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
            echo "  [$(date -u +%H:%M:%SZ)] exp1 analysis run=${DISPATCHED_ID} status=${ST} conclusion=${CN}"
            if [[ "${ST}" == "completed" ]]; then
              [[ "${CN}" != "success" ]] && { echo "::error::exp1 analysis failed: ${CN}"; exit 1; }
              echo "  exp1 analysis completed successfully."; break
            fi
            [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on exp1 analysis."; exit 1; }
            sleep ${SLEEP}
          done

  # ============================================================================
  #  WAVE 2  —  exp1b, exp2_feynman, exp2, hybrid_all_domains
  #  Runtime: ~5.5 h
  #  Unblocked: runs concurrently with wave 1.
  #  Each experiment dispatched sequentially within this job; their runners
  #  execute in parallel on GitHub-hosted runners.
  # ============================================================================
  wave2-parallel:
    name: "Wave 2 · exp1b + exp2_feynman + exp2 + hybrid_all_domains"
    needs: [setup, diagnose-all]
    runs-on: ubuntu-latest
    timeout-minutes: 420
    if: needs.setup.outputs.run_wave2 == 'true'

    steps:
      - name: Dispatch + wait · Wave 2 experiments (parallel runners)
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          N_SHARDS:    ${{ needs.setup.outputs.n_shards }}
          SEEDS:       ${{ github.event.inputs.seeds || '' }}
          SAMPLES:     ${{ github.event.inputs.n_samples || '200' }}
          NOISE:       ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          STARTED_AT:  ${{ needs.setup.outputs.started_at }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail

          # Wave 2 experiments (no data dependency — run fully in parallel)
          EXPS=("exp1b" "exp2_feynman" "exp2" "hybrid_all_domains")

          # ── Phase A: fan-out all dispatches ───────────────────────────────
          # Dispatch all 4 experiments as quickly as possible so their runners
          # start concurrently.  Run IDs collected in associative array.
          declare -A EXP_RUN_IDS

          for EXP in "${EXPS[@]}"; do
            SKIP=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('skip_runner') and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
            if [[ "$SKIP" == "true" ]]; then
              echo "::notice::${EXP} runner outputs already committed — skipping C0."
              EXP_RUN_IDS["${EXP}"]="skipped"
              continue
            fi

            echo "--- Dispatching ${EXP} ---"
            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            gh workflow run ci_runner.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field n_shards="${N_SHARDS}" --field shard_index="0" \
              --field seeds="${SEEDS}" --field n_samples="${SAMPLES}" \
              --field noise_levels="${NOISE}" --field dry_run="${DRY_RUN}"
            sleep 8

            RID=""
            for attempt in $(seq 1 12); do
              RID=$(gh run list --repo "${REPO}" --workflow ci_runner.yml \
                --event workflow_dispatch --limit 100 \
                --json databaseId,displayTitle,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" --arg exp "${EXP}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts and (.displayTitle|test($exp;"i")))]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "$RID" ]] && break
              echo "  ${EXP}: attempt ${attempt}/12 — waiting 10 s..."; sleep 10
            done
            [[ -z "$RID" ]] && { echo "::error::Could not locate run ID for ${EXP}."; exit 1; }

            EXP_RUN_IDS["${EXP}"]="${RID}"
            echo "  ${EXP} → run ${RID}"
            sleep 5   # FIX-D3: stagger dispatches to reduce burst
          done

          # ── Phase B: poll all runners to completion ───────────────────────
          echo ""
          echo "=== Polling all Wave 2 runner runs ==="
          DEADLINE=$(( $(date +%s) + 25200 ))   # 420 min

          for EXP in "${EXPS[@]}"; do
            RID="${EXP_RUN_IDS[$EXP]}"
            [[ "$RID" == "skipped" ]] && continue

            echo "Polling runner run ${RID} for ${EXP} ..."
            SLEEP=30
            while true; do
              RJ=$(gh run view "${RID}" --repo "${REPO}" \
                     --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} run=${RID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::${EXP} runner run ${RID} failed: ${CN}"; exit 1; }
                echo "  ${EXP} runner completed successfully."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on ${EXP} run ${RID}."; exit 1; }
              sleep ${SLEEP}
              SLEEP=$(( SLEEP < 120 ? SLEEP + 10 : 120 ))
            done
          done

          # ── Phase C: dispatch analysis (C1) for each completed experiment ─
          echo ""
          echo "=== Dispatching Wave 2 analysis runs ==="
          declare -A ANALYSIS_RUN_IDS

          for EXP in "${EXPS[@]}"; do
            SKIP_A=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('analysis_state')=='done' and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
            if [[ "$SKIP_A" == "true" ]]; then
              echo "::notice::${EXP} analysis already done — skipping C1."
              ANALYSIS_RUN_IDS["${EXP}"]="skipped"
              continue
            fi

            RESULT_SUBDIR=$(echo "${DIAG_MAP}" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['${EXP}']['result_subdir'])")
            SRC_RID="${EXP_RUN_IDS[$EXP]:-}"
            [[ "$SRC_RID" == "skipped" ]] && SRC_RID=""

            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci_analysis_parallel.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field source_run_id="${SRC_RID}" \
              --field result_subdir="${RESULT_SUBDIR}"
            sleep 8

            ARID=""
            for attempt in $(seq 1 6); do
              ARID=$(gh run list --repo "${REPO}" --workflow ci_analysis_parallel.yml \
                --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "${ARID}" ]] && break
              echo "  ${EXP} analysis: attempt ${attempt}/6 — waiting 5 s..."; sleep 5
            done
            [[ -z "${ARID}" ]] && { echo "::error::No analysis run ID for ${EXP}."; exit 1; }
            ANALYSIS_RUN_IDS["${EXP}"]="${ARID}"
            echo "  ${EXP} analysis → run ${ARID}"
            sleep 3
          done

          # ── Phase D: poll all analysis runs ───────────────────────────────
          echo ""
          echo "=== Polling Wave 2 analysis runs ==="
          DEADLINE_A=$(( $(date +%s) + 1800 ))

          for EXP in "${EXPS[@]}"; do
            ARID="${ANALYSIS_RUN_IDS[$EXP]}"
            [[ "$ARID" == "skipped" ]] && continue
            echo "Polling analysis run ${ARID} for ${EXP} ..."
            SLEEP=20
            while true; do
              RJ=$(gh run view "${ARID}" --repo "${REPO}" \
                     --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} analysis run=${ARID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::${EXP} analysis failed: ${CN}"; exit 1; }
                echo "  ${EXP} analysis completed successfully."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE_A} ]] && { echo "::error::Timed out on ${EXP} analysis."; exit 1; }
              sleep ${SLEEP}
            done
          done
          echo "Wave 2 complete."

  # ============================================================================
  #  WAVE 3  —  exp3, exp3b, extrap, suppA, suppB, suppB_sc
  #  Runtime: ~4.5 h
  #  Unblocked: runs concurrently with waves 1 and 2.
  # ============================================================================
  wave3-parallel:
    name: "Wave 3 · exp3 + exp3b + extrap + suppA + suppB + suppB_sc"
    needs: [setup, diagnose-all]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: needs.setup.outputs.run_wave3 == 'true'

    steps:
      - name: Dispatch + wait · Wave 3 experiments (parallel runners)
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          N_SHARDS:    ${{ needs.setup.outputs.n_shards }}
          SEEDS:       ${{ github.event.inputs.seeds || '' }}
          SAMPLES:     ${{ github.event.inputs.n_samples || '200' }}
          NOISE:       ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail

          EXPS=("exp3" "exp3b" "extrap" "suppA" "suppB" "suppB_sc")
          declare -A EXP_RUN_IDS
          declare -A ANALYSIS_RUN_IDS

          # Phase A: fan-out runner dispatches
          for EXP in "${EXPS[@]}"; do
            SKIP=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('skip_runner') and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
            if [[ "$SKIP" == "true" ]]; then
              echo "::notice::${EXP} runner already committed — skipping C0."
              EXP_RUN_IDS["${EXP}"]="skipped"; continue
            fi

            echo "--- Dispatching ${EXP} ---"
            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci_runner.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field n_shards="${N_SHARDS}" --field shard_index="0" \
              --field seeds="${SEEDS}" --field n_samples="${SAMPLES}" \
              --field noise_levels="${NOISE}" --field dry_run="${DRY_RUN}"
            sleep 8

            RID=""
            for attempt in $(seq 1 12); do
              RID=$(gh run list --repo "${REPO}" --workflow ci_runner.yml \
                --event workflow_dispatch --limit 100 \
                --json databaseId,displayTitle,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" --arg exp "${EXP}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts and (.displayTitle|test($exp;"i")))]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "$RID" ]] && break
              echo "  ${EXP}: attempt ${attempt}/12 — waiting 10 s..."; sleep 10
            done
            [[ -z "$RID" ]] && { echo "::error::Could not locate run ID for ${EXP}."; exit 1; }
            EXP_RUN_IDS["${EXP}"]="${RID}"
            echo "  ${EXP} → run ${RID}"
            sleep 5
          done

          # Phase B: poll runners
          echo "=== Polling Wave 3 runner runs ==="
          DEADLINE=$(( $(date +%s) + 21600 ))   # 360 min

          for EXP in "${EXPS[@]}"; do
            RID="${EXP_RUN_IDS[$EXP]}"; [[ "$RID" == "skipped" ]] && continue
            SLEEP=30
            while true; do
              RJ=$(gh run view "${RID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} run=${RID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::${EXP} runner failed: ${CN}"; exit 1; }
                echo "  ${EXP} runner completed."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on ${EXP}."; exit 1; }
              sleep ${SLEEP}; SLEEP=$(( SLEEP < 120 ? SLEEP + 10 : 120 ))
            done
          done

          # Phase C: dispatch analysis runs
          echo "=== Dispatching Wave 3 analysis runs ==="
          for EXP in "${EXPS[@]}"; do
            SKIP_A=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('analysis_state')=='done' and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
            if [[ "$SKIP_A" == "true" ]]; then
              ANALYSIS_RUN_IDS["${EXP}"]="skipped"; continue
            fi
            RESULT_SUBDIR=$(echo "${DIAG_MAP}" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['${EXP}']['result_subdir'])")
            SRC_RID="${EXP_RUN_IDS[$EXP]:-}"; [[ "$SRC_RID" == "skipped" ]] && SRC_RID=""
            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci_analysis_parallel.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field source_run_id="${SRC_RID}" \
              --field result_subdir="${RESULT_SUBDIR}"
            sleep 8
            ARID=""
            for attempt in $(seq 1 6); do
              ARID=$(gh run list --repo "${REPO}" --workflow ci_analysis_parallel.yml \
                --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "${ARID}" ]] && break
              sleep 5
            done
            [[ -z "${ARID}" ]] && { echo "::error::No analysis run ID for ${EXP}."; exit 1; }
            ANALYSIS_RUN_IDS["${EXP}"]="${ARID}"
            echo "  ${EXP} analysis → run ${ARID}"; sleep 3
          done

          # Phase D: poll analysis runs
          echo "=== Polling Wave 3 analysis runs ==="
          DEADLINE_A=$(( $(date +%s) + 1800 ))
          for EXP in "${EXPS[@]}"; do
            ARID="${ANALYSIS_RUN_IDS[$EXP]}"; [[ "$ARID" == "skipped" ]] && continue
            SLEEP=20
            while true; do
              RJ=$(gh run view "${ARID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} analysis=${ARID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::${EXP} analysis failed: ${CN}"; exit 1; }
                echo "  ${EXP} analysis completed."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE_A} ]] && { echo "::error::Timed out on ${EXP} analysis."; exit 1; }
              sleep ${SLEEP}
            done
          done
          echo "Wave 3 complete."

  # ============================================================================
  #  WAVE 4  —  instability  (blocked on wave 1 / exp1)
  #  Runtime: ~2 h
  #  Dependency: needs wave1-exp1 to succeed (exp1 JSON is the input).
  # ============================================================================
  wave4-instability:
    name: "Wave 4 · instability (needs exp1)"
    needs: [setup, diagnose-all, wave1-exp1]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: |
      always() &&
      needs.setup.outputs.run_wave4 == 'true' &&
      (needs.wave1-exp1.result == 'success' || needs.wave1-exp1.result == 'skipped')

    steps:
      - name: Dispatch + wait · instability runner
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          N_SHARDS:    ${{ needs.setup.outputs.n_shards }}
          SEEDS:       ${{ github.event.inputs.seeds || '' }}
          SAMPLES:     ${{ github.event.inputs.n_samples || '200' }}
          NOISE:       ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail
          EXP="instability"

          SKIP=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('skip_runner') and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
          if [[ "$SKIP" == "true" ]]; then
            echo "::notice::instability runner already committed — skipping C0."; exit 0
          fi

          BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci_runner.yml \
            --repo "${REPO}" --ref "${{ github.ref_name }}" \
            --field experiment="${EXP}" \
            --field n_shards="${N_SHARDS}" --field shard_index="0" \
            --field seeds="${SEEDS}" --field n_samples="${SAMPLES}" \
            --field noise_levels="${NOISE}" --field dry_run="${DRY_RUN}"
          sleep 8

          RID=""
          for attempt in $(seq 1 12); do
            RID=$(gh run list --repo "${REPO}" --workflow ci_runner.yml \
              --event workflow_dispatch --limit 100 \
              --json databaseId,displayTitle,createdAt,headBranch \
              --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
              2>/dev/null || echo "")
            [[ -n "$RID" ]] && break
            echo "  Attempt ${attempt}/12 — waiting 10 s..."; sleep 10
          done
          [[ -z "$RID" ]] && { echo "::error::Could not locate instability run ID."; exit 1; }

          echo "Polling instability run ${RID} ..."
          DEADLINE=$(( $(date +%s) + 8400 ))   # 140 min
          SLEEP=30
          while true; do
            RJ=$(gh run view "${RID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                 || echo '{"status":"unknown","conclusion":"none"}')
            ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
            echo "  [$(date -u +%H:%M:%SZ)] instability run=${RID} status=${ST} conclusion=${CN}"
            if [[ "${ST}" == "completed" ]]; then
              [[ "${CN}" != "success" ]] && { echo "::error::instability runner failed: ${CN}"; exit 1; }
              echo "  instability runner completed."; break
            fi
            [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on instability."; exit 1; }
            sleep ${SLEEP}; SLEEP=$(( SLEEP < 120 ? SLEEP + 10 : 120 ))
          done

      - name: Dispatch + wait · instability analysis (C1)
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail
          EXP="instability"
          SKIP_A=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('analysis_state')=='done' and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
          [[ "$SKIP_A" == "true" ]] && { echo "::notice::instability analysis already done."; exit 0; }

          RESULT_SUBDIR=$(echo "${DIAG_MAP}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['${EXP}']['result_subdir'])")
          BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci_analysis_parallel.yml \
            --repo "${REPO}" --ref "${{ github.ref_name }}" \
            --field experiment="${EXP}" \
            --field source_run_id="" \
            --field result_subdir="${RESULT_SUBDIR}"
          sleep 8

          ARID=""
          for attempt in $(seq 1 6); do
            ARID=$(gh run list --repo "${REPO}" --workflow ci_analysis_parallel.yml \
              --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt,headBranch \
              --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
              2>/dev/null || echo "")
            [[ -n "${ARID}" ]] && break; sleep 5
          done
          [[ -z "${ARID}" ]] && { echo "::error::No analysis run ID for instability."; exit 1; }

          echo "Polling instability analysis ${ARID} ..."
          DEADLINE=$(( $(date +%s) + 1800 ))
          SLEEP=20
          while true; do
            RJ=$(gh run view "${ARID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                 || echo '{"status":"unknown","conclusion":"none"}')
            ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
            echo "  [$(date -u +%H:%M:%SZ)] instability analysis=${ARID} status=${ST} conclusion=${CN}"
            if [[ "${ST}" == "completed" ]]; then
              [[ "${CN}" != "success" ]] && { echo "::error::instability analysis failed: ${CN}"; exit 1; }
              echo "  instability analysis completed."; break
            fi
            [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on instability analysis."; exit 1; }
            sleep ${SLEEP}
          done

  # ============================================================================
  #  WAVE 5  —  tables + figures  (postprocess for all experiments)
  #  Runtime: ~0.5 h
  #  Dependency: ALL waves 1–4 must complete first.
  #  Dispatches ci_postprocess_parallel.yml for every experiment, then
  #  ci_pipeline_parallel_analysis.yml for the cross-experiment summary.
  # ============================================================================
  wave5-postprocess:
    name: "Wave 5 · tables + figures (all experiments)"
    needs: [setup, diagnose-all, wave1-exp1, wave2-parallel, wave3-parallel, wave4-instability]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: |
      always() &&
      needs.setup.outputs.run_wave5 == 'true' &&
      needs.wave1-exp1.result       != 'failure' &&
      needs.wave2-parallel.result   != 'failure' &&
      needs.wave3-parallel.result   != 'failure' &&
      needs.wave4-instability.result != 'failure'

    steps:
      - name: Dispatch + wait · per-experiment postprocess (C2 for all 12 exps)
        env:
          GH_TOKEN:    ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}
          DIAG_MAP:    ${{ needs.diagnose-all.outputs.diagnose_map }}
        run: |
          set -euo pipefail

          ALL_EXPS=(
            "exp1" "exp1b" "exp2_feynman" "exp2"
            "exp3" "exp3b" "extrap" "suppA"
            "suppB" "suppB_sc" "hybrid_all_domains"
            "instability"
          )
          declare -A POST_RUN_IDS

          # Fan-out: dispatch all postprocess runs
          echo "=== Dispatching postprocess (C2) for all experiments ==="
          for EXP in "${ALL_EXPS[@]}"; do
            SKIP_P=$(echo "${DIAG_MAP}" | python3 -c "
          import json,sys; m=json.load(sys.stdin)
          print('true' if m.get('${EXP}',{}).get('postprocess_state')=='done' and '${FORCE_RERUN}'!='true' else 'false')" 2>/dev/null || echo "false")
            if [[ "$SKIP_P" == "true" ]]; then
              echo "::notice::${EXP} postprocess already done — skipping C2."
              POST_RUN_IDS["${EXP}"]="skipped"; continue
            fi

            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci_postprocess_parallel.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}"
            sleep 8

            PRID=""
            for attempt in $(seq 1 6); do
              PRID=$(gh run list --repo "${REPO}" --workflow ci_postprocess_parallel.yml \
                --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "${PRID}" ]] && break; sleep 5
            done
            [[ -z "${PRID}" ]] && { echo "::error::No postprocess run ID for ${EXP}."; exit 1; }
            POST_RUN_IDS["${EXP}"]="${PRID}"
            echo "  ${EXP} postprocess → run ${PRID}"; sleep 3
          done

          # Poll: wait for all postprocess runs
          echo "=== Polling postprocess runs ==="
          DEADLINE=$(( $(date +%s) + 5400 ))   # 90 min
          for EXP in "${ALL_EXPS[@]}"; do
            PRID="${POST_RUN_IDS[$EXP]}"; [[ "$PRID" == "skipped" ]] && continue
            SLEEP=20
            while true; do
              RJ=$(gh run view "${PRID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} postprocess=${PRID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                [[ "${CN}" != "success" ]] && { echo "::error::${EXP} postprocess failed: ${CN}"; exit 1; }
                echo "  ${EXP} postprocess completed."; break
              fi
              [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on ${EXP} postprocess."; exit 1; }
              sleep ${SLEEP}
            done
          done
          echo "Wave 5 postprocess complete."

      - name: Dispatch + wait · cross-experiment analysis (ci_pipeline_parallel_analysis.yml)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail

          BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Dispatching ci_pipeline_parallel_analysis.yml ..."

          gh workflow run ci_pipeline_parallel_analysis.yml \
            --repo "${REPO}" --ref "${{ github.ref_name }}" \
            --field triggered_by="ci_pipeline_parallel" \
            --field run_id="${{ github.run_id }}"
          sleep 8

          XRID=""
          for attempt in $(seq 1 6); do
            XRID=$(gh run list --repo "${REPO}" \
              --workflow ci_pipeline_parallel_analysis.yml \
              --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt,headBranch \
              --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
              2>/dev/null || echo "")
            [[ -n "${XRID}" ]] && break; sleep 5
          done
          [[ -z "${XRID}" ]] && { echo "::warning::No cross-experiment analysis run ID found — skipping poll."; exit 0; }

          echo "Polling cross-experiment analysis run ${XRID} ..."
          DEADLINE=$(( $(date +%s) + 1800 ))
          SLEEP=20
          while true; do
            RJ=$(gh run view "${XRID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                 || echo '{"status":"unknown","conclusion":"none"}')
            ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
            echo "  [$(date -u +%H:%M:%SZ)] cross-analysis run=${XRID} status=${ST} conclusion=${CN}"
            if [[ "${ST}" == "completed" ]]; then
              [[ "${CN}" != "success" ]] && { echo "::error::Cross-experiment analysis failed: ${CN}"; exit 1; }
              echo "  Cross-experiment analysis completed."; break
            fi
            [[ $(date +%s) -ge ${DEADLINE} ]] && { echo "::error::Timed out on cross-experiment analysis."; exit 1; }
            sleep ${SLEEP}
          done

  # ============================================================================
  #  JOB: run-checkpoint  —  C4: global qualification + paper audit gate
  #  Mirrors ci_pipeline.yml run-checkpoint exactly.
  #  Runs once after ALL waves complete.
  # ============================================================================
  run-checkpoint:
    name: "C4 · Global checkpoint gate"
    needs: [setup, wave5-postprocess]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      always() &&
      needs.setup.outputs.run_check == 'true' &&
      (needs.wave5-postprocess.result == 'success' ||
       needs.wave5-postprocess.result == 'skipped')

    steps:
      - name: Dispatch + wait · ci_pipeline_check.yml (all experiments)
        env:
          GH_TOKEN:           ${{ secrets.PAT_TOKEN }}
          FAIL_ON_INCOMPLETE: ${{ github.event.inputs.fail_on_incomplete || 'false' }}
          SEEDS:              ${{ github.event.inputs.seeds || '42,99,123,777,2024' }}
          NOISE_LEVELS:       ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
          REPO:               ${{ github.repository }}
        run: |
          set -euo pipefail

          # Run checkpoint for each experiment sequentially
          # (checkpoint is cheap ~2 min per exp; full set ~25 min)
          ALL_EXPS=(
            "exp1" "exp1b" "exp2_feynman" "exp2"
            "exp3" "exp3b" "extrap" "suppA"
            "suppB" "suppB_sc" "hybrid_all_domains"
            "instability"
          )

          FAILED_EXPS=()

          for EXP in "${ALL_EXPS[@]}"; do
            echo "--- Checkpoint gate for ${EXP} ---"
            BEFORE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            gh workflow run ci_pipeline_check.yml \
              --repo "${REPO}" --ref "${{ github.ref_name }}" \
              --field experiment="${EXP}" \
              --field fail_on_incomplete="${FAIL_ON_INCOMPLETE}" \
              --field seeds="${SEEDS}" \
              --field noise_levels="${NOISE_LEVELS}"
            sleep 8

            CRID=""
            for attempt in $(seq 1 6); do
              CRID=$(gh run list --repo "${REPO}" --workflow ci_pipeline_check.yml \
                --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt,headBranch \
                --jq --arg ts "${BEFORE_TS}" --arg b "${{ github.ref_name }}" \
                  '[.[]|select(.headBranch==$b and .createdAt>=$ts)]|first|.databaseId//empty' \
                2>/dev/null || echo "")
              [[ -n "${CRID}" ]] && break; sleep 5
            done
            [[ -z "${CRID}" ]] && { echo "::error::No checkpoint run ID for ${EXP}."; exit 1; }

            echo "Polling checkpoint run ${CRID} for ${EXP} ..."
            DEADLINE=$(( $(date +%s) + 900 ))
            SLEEP=15
            while true; do
              RJ=$(gh run view "${CRID}" --repo "${REPO}" --json status,conclusion 2>/dev/null \
                   || echo '{"status":"unknown","conclusion":"none"}')
              ST=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
              CN=$(echo "${RJ}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('conclusion') or 'none')")
              echo "  [$(date -u +%H:%M:%SZ)] ${EXP} checkpoint=${CRID} status=${ST} conclusion=${CN}"
              if [[ "${ST}" == "completed" ]]; then
                if [[ "${CN}" == "success" ]]; then
                  echo "  ✅ ${EXP} checkpoint passed."; break
                else
                  echo "::error::${EXP} checkpoint FAILED (${CN}) — see run ${CRID}."
                  FAILED_EXPS+=("${EXP}")
                  break
                fi
              fi
              [[ $(date +%s) -ge ${DEADLINE} ]] && {
                echo "::error::Timed out on ${EXP} checkpoint."; FAILED_EXPS+=("${EXP}"); break; }
              sleep ${SLEEP}
            done
          done

          # Final gate
          if [[ "${#FAILED_EXPS[@]}" -gt 0 ]]; then
            echo ""
            echo "::error::Checkpoint gate FAILED for ${#FAILED_EXPS[@]} experiment(s): ${FAILED_EXPS[*]}"
            echo "  Fix the failed experiments and re-trigger ci_pipeline_parallel.yml"
            echo "  (use force_rerun=false — only failed stages will re-run)."
            exit 1
          fi

          echo ""
          echo "✅ All ${#ALL_EXPS[@]} experiment checkpoints passed — parallel pipeline qualified."

  # ============================================================================
  #  JOB: next-run  —  C5: self-dispatch next full parallel run
  #  Only fires after the global checkpoint passes.
  # ============================================================================
  next-run:
    name: "C5 · Schedule next parallel run"
    needs: [setup, run-checkpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.run-checkpoint.result == 'success'

    steps:
      - name: Dispatch next weekly run
        env:
          GH_TOKEN:  ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
          N_SHARDS:  ${{ needs.setup.outputs.n_shards }}
          SEEDS:     ${{ github.event.inputs.seeds || '' }}
          SAMPLES:   ${{ github.event.inputs.n_samples || '200' }}
          NOISE:     ${{ github.event.inputs.noise_levels || '0.0,0.5,1.0,5.0,10.0' }}
        run: |
          set -euo pipefail

          echo "Parallel pipeline completed successfully — scheduling next run."
          gh workflow run ci_pipeline_parallel.yml \
            --repo "${REPO}" \
            --ref "${{ github.ref_name }}" \
            --field n_shards="${N_SHARDS}" \
            --field seeds="${SEEDS}" \
            --field n_samples="${SAMPLES}" \
            --field noise_levels="${NOISE}" \
            --field fail_on_incomplete="false" \
            --field force_rerun="false" \
            --field dry_run="false"

          echo "Next parallel pipeline run dispatched."
