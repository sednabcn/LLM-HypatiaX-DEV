# =============================================================================
# .github/workflows/ci.yml
# HypatiaX — Continuous Integration (GitHub Actions)
# =============================================================================
#
# Triggers:
#   push / PR to main or develop branches
#   Manual dispatch (workflow_dispatch) with optional ONLY_STEP parameter
#
# Jobs:
#   lint          — code quality, import graph, stale-engine check  (fast, <5 min)
#   smoke-test    — Phase 0 setup + exp3/exp3b (Nguyen-12, all 5 seeds) (~90 min)
#   full-pipeline — All experiments except slow steps                 (~4 h)
#   slow-pipeline — Full pipeline including Feynman & instability     (manually triggered)
#   verify        — verify_results.py + hash_lock against saved cache
#
# Secrets required (Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY   — sk-ant-... (required for all LLM-using jobs)
#
# Result artefacts are uploaded to GitHub Artefacts and kept for 30 days.
# =============================================================================

name: HypatiaX Reproducibility CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      only_step:
        description: 'Run only this step ID (leave empty for full pipeline)'
        required: false
        default: ''
      skip_slow:
        description: 'Skip slow steps (exp2, suppB, instability)'
        required: false
        default: 'true'

# Cancel in-progress runs for the same ref on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NN_SEED: "42"
  PYSR_SEED: "42"
  LLM_MODEL: "claude-sonnet-4-20250514"
  LLM_RETRIES: "3"
  LLM_K_RUNS: "1"
  N_TASKS_DEFI: "74"
  N_TASKS_INSTABILITY: "70"
  PCA_TRAIN_FRAC: "0.40"
  NN_TIME_LIMIT: "120"
  ENGINE_NAME: "hybrid_system_v50_2"
  PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"

# =============================================================================
# JOB 1 — Lint & code quality  (runs on every push/PR, no API key needed)
# =============================================================================
jobs:
  lint:
    name: "Lint & code quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting dependencies
        run: |
          pip install --quiet ruff pyflakes

      - name: ruff — style & import checks
        run: |
          ruff check hypatiax/ protocols/ scripts/ core/ \
            --select E,F,W,I --ignore E501 \
            --output-format github || true
          # Treat as warning only in CI (--|| true); set to exit 1 to enforce

      - name: Check for stale v40 engine references (FIX-C2)
        run: |
          STALE=$(grep -r "hybrid_system_v40[^_]" hypatiax/ protocols/ \
                    --include="*.py" -l 2>/dev/null || true)
          if [ -n "$STALE" ]; then
            echo "::error ::Stale hybrid_system_v40 import found — must be v50_2:"
            echo "$STALE"
            exit 1
          fi
          echo "✓ No stale v40 engine references"

      - name: Check for exposed API keys
        run: |
          if grep -r "sk-ant-api" . --include="*.py" --include="*.ipynb" \
                --include="*.yaml" --include="*.yml" -l 2>/dev/null \
                | grep -v ".git"; then
            echo "::error ::Exposed API key found — revoke at console.anthropic.com"
            exit 1
          fi
          echo "✓ No exposed API keys"

      - name: Verify hypatiax/protocols/ input-data modules
        run: |
          python3 scripts/patches/check_hypatiax_protocols.py

      - name: Validate patched source syntax
        run: |
          pip install --quiet -r requirements.txt
          python3 scripts/patches/generate_patches.py
          python3 scripts/patches/apply_patches.py
          python3 run_all_checkpoint.py --only fixup-tex
          python3 scripts/patches/validate_code.py


# =============================================================================
# JOB 2 — Smoke test  (Phase 0 setup + exp3, no slow steps)
#          Runs on push/PR; needs ANTHROPIC_API_KEY.
# =============================================================================
  smoke-test:
    name: "Smoke test (setup + exp3)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: lint
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Julia (for PySR)
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      # ── Restore checkpoint if a previous run left one ───────────────────
      - name: Restore checkpoint (if any)
        uses: actions/cache@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-smoke-${{ github.ref }}-${{ github.run_id }}
          restore-keys: checkpoint-smoke-${{ github.ref }}-

      - name: Apply patches
        run: |
          python3 scripts/patches/generate_patches.py
          python3 scripts/patches/apply_patches.py
          python3 run_all_checkpoint.py --only fixup-tex
          python3 scripts/patches/validate_code.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Exp 3 — Nguyen-12 SEED=42 (smoke, §10.8 primary)
        run: |
          python3 run_all_checkpoint.py --only exp3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Exp 3b — Nguyen-12 seeds 99/123/777/2024 (§10.8 stability)
        run: |
          python3 run_all_checkpoint.py --only exp3b
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-smoke-${{ github.ref }}-${{ github.run_id }}

      - name: Upload smoke-test logs & results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/extrapolation/
          retention-days: 14


# =============================================================================
# JOB 3 — Full pipeline  (all non-slow steps; triggered by push to main or
#          manual dispatch with skip_slow=true)
# =============================================================================
  full-pipeline:
    name: "Full pipeline (no slow steps)"
    runs-on: ubuntu-latest
    timeout-minutes: 360           # 6 h generous budget
    needs: lint
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.skip_slow == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Julia (for PySR)
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      - name: Install Jupyter (for NB audit steps)
        run: pip install -q notebook nbconvert

      - name: Set PYTHONPATH & RESULTS_DIR
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
          echo "RESULTS_DIR=${{ github.workspace }}/hypatiax/data/results" >> $GITHUB_ENV

      # ── Restore checkpoint from a previous run ──────────────────────────
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-full-${{ github.ref }}-${{ github.run_id }}
          restore-keys: checkpoint-full-${{ github.ref }}-

      # ── Restore cached result files so verify step can find them ────────
      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: hypatiax/data/results/
          key: results-full-${{ github.ref }}-${{ github.run_id }}
          restore-keys: results-full-${{ github.ref }}-

      - name: Run pipeline (skip-slow, resume if checkpoint present)
        run: |
          RESUME_FLAG=""
          if [ -f logs/pipeline_checkpoint.json ]; then
            RESUME_FLAG="--resume"
          fi

          ONLY_FLAG=""
          if [ -n "${{ github.event.inputs.only_step }}" ]; then
            ONLY_FLAG="--only ${{ github.event.inputs.only_step }}"
          fi

          python3 run_all_checkpoint.py \
            --skip-slow \
            --continue-on-fail \
            $RESUME_FLAG $ONLY_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate figures & tables
        if: success()
        run: |
          python3 figures/generate_figures.py \
            --outdir hypatiax/data/results/figures
          python3 scripts/patches/generate_tables.py \
            --outdir hypatiax/data/results/tables
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify results against paper targets
        if: success()
        run: |
          python3 scripts/patches/verify_results.py --report
          python3 reproducibility/hash_lock.py --check

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-full-${{ github.ref }}-${{ github.run_id }}

      - name: Save result cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hypatiax/data/results/
          key: results-full-${{ github.ref }}-${{ github.run_id }}

      - name: Upload results artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-results-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 30

      - name: Upload figures & tables artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: figures-tables-${{ github.sha }}
          path: |
            hypatiax/data/results/figures/
            hypatiax/data/results/tables/
          retention-days: 30


# =============================================================================
# JOB 4 — Slow / full sweep  (manually triggered only)
#          Runs ALL steps including Feynman (4–8 h), noise sweep, instability.
# =============================================================================
  slow-pipeline:
    name: "Full pipeline incl. slow steps (manual)"
    runs-on: ubuntu-latest
    timeout-minutes: 720           # 12 h ceiling
    needs: lint
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.skip_slow == 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install all dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q notebook nbconvert

      - name: Set PYTHONPATH & RESULTS_DIR
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
          echo "RESULTS_DIR=${{ github.workspace }}/hypatiax/data/results" >> $GITHUB_ENV

      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-slow-${{ github.ref }}-${{ github.run_id }}
          restore-keys: checkpoint-slow-${{ github.ref }}-

      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: hypatiax/data/results/
          key: results-slow-${{ github.ref }}-${{ github.run_id }}
          restore-keys: results-slow-${{ github.ref }}-

      - name: Run full pipeline (all steps, with resume)
        run: |
          RESUME_FLAG=""
          if [ -f logs/pipeline_checkpoint.json ]; then
            RESUME_FLAG="--resume"
          fi
          python3 run_all_checkpoint.py --continue-on-fail $RESUME_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_K_RUNS: "30"        # Full instability sweep

      - name: Verify results
        run: |
          python3 scripts/patches/verify_results.py --report
          python3 reproducibility/hash_lock.py --check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/pipeline_checkpoint.json
          key: checkpoint-slow-${{ github.ref }}-${{ github.run_id }}

      - name: Save result cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hypatiax/data/results/
          key: results-slow-${{ github.ref }}-${{ github.run_id }}

      - name: Upload all artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-pipeline-results-${{ github.sha }}
          path: |
            logs/
            hypatiax/data/results/
          retention-days: 90        # Keep longer for paper archival


# =============================================================================
# JOB 5 — Verify-only  (runs on PR against cached results from main)
# =============================================================================
  verify:
    name: "Verify cached results"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Restore result cache from main branch
        uses: actions/cache@v4
        with:
          path: hypatiax/data/results/
          # Try to restore from main's latest full-pipeline run
          key: results-full-refs/heads/main-
          restore-keys: |
            results-full-refs/heads/main-
            results-full-

      - name: Run verify-only
        run: |
          python3 run_all_checkpoint.py --verify-only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}
          path: logs/
          retention-days: 7
