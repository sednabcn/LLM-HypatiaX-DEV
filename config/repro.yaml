# =============================================================================
# HypatiaX JMLR — PAPER-QUALITY REPRODUCIBILITY CONFIGURATION
# =============================================================================

run_id:       "paper_v3"
run_version:  "3.0"
date:         "2026-04"

paths:
  root:       "${HYPATIAX_ROOT}"
  results:    "hypatiax/data/results"
  patched:    "hypatiax/data/patched"
  paper:      "paper"
  figures:    "paper/figures"
  tables:     "paper/tables"
  patches:    "patches/generated"
  logs:       "logs"

seeds:
  default:    42
  pysr_seed:  42
  validation: [123]
  portfolio_variance: [42, 99, 123, 777, 2024]

llm_model:     "claude-sonnet-4-20250514"
llm_retries:   3
llm_k_runs:    30

n_tasks_defi:       74
n_tasks_instability: 70
pca_train_frac:     0.40
nn_time_limit:      120

timeouts:
  pysr_attempt_seconds: 1100
  method_seconds: 900
  equation_wall_clock: 1200
  feynman_pysr_seconds: 1100
  instability_pysr_seconds: 300

pysr:
  niterations: 1000
  populations: 30
  population_size: 33
  parsimony: 0.01
  maxsize: 30
  binary_operators: ["+", "-", "*", "/"]
  unary_operators: ["exp", "log", "sin", "cos", "sqrt"]
  use_transcendental_compositions: true
  deterministic: true
  parallelism: "multithreading"

engine:
  name: "hybrid_system_v50_2"
  version: "v5.1"
  max_retries: 3
  allow_nondeterministic: false

benchmarks:
  defi:
    enabled: true
    script: "hypatiax/experiments/benchmarks/hypatiax_defi_benchmark_v3c.py"
    output_subdir: "defi"
    split: "pca_40_60"
    train_frac: 0.40
    expected:
      accuracy: 0.892
      total_cases: 74
      catastrophic: 0
  core15:
    enabled: true
    script: "hypatiax/experiments/benchmarks/run_dual_condition_benchmark.py"
    output_subdir: "exp1_ablation"
    expected:
      mw_u: 126.0
      mw_p: 0.295
      speedup: 1.73
  feynman:
    enabled: true
    script: "hypatiax/experiments/benchmarks/run_comparative_suite_benchmark_v2.py"
    output_subdir: "feynman"
    split: "random_80_20"
    extrap_mult: 2.0
    expected:
      successes: 9
      total: 30
  nguyen12:
    enabled: true
    output_subdir: "nguyen12"
    expected:
      hypatia_success: 11
      pysr_success: 10
      nn_success: 0
      mw_u: 113
      mw_p: 0.0097
  noise_sweep:
    enabled: true
    script: "hypatiax/experiments/benchmarks/run_noise_sweep_benchmark.py"
    output_subdir: "noise"
    fast_skip: true
    expected:
      ehd_rate: 1.0
      plateau_n: 500
  routing:
    enabled: true
    script: "hypatiax/experiments/benchmarks/run_hybrid_system_benchmark.py"
    output_subdir: "routing"
    expected:
      fix1_improvement: 0.06
      fix2_improvement: 0.05
      fix3_improvement: 0.01
  instability:
    enabled: true
    script: "hypatiax/experiments/benchmarks/run_dual_sweep_benchmarks.py"
    output_subdir: "instability"
    fast_skip: true
    k_runs: 30
    total_tasks: 70
    expected:
      spearman_rho: -0.70
      p_value: 0.001
  extrapolation:
    enabled: true
    output_subdir: "extrapolation"
    regimes: ["near", "medium", "far"]
    extrap_mults: [1.2, 2.0, 5.0]

# ── Known paper fixes (applied by apply_patches.py) ──────────────────────────
fixes:
  FIX-C1:
    description: "Rename duplicate DeFi case names"
    status:      "applied_by_apply_patches.py"
    duplicates:
      - ["Constant product formula", "Constant product formula (basic)", "Constant product formula (multivariate)"]
      - ["Funding rate cost", "Funding rate cost (simple)", "Funding rate cost (extended)"]
      - ["Concentrated liquidity position width", "Concentrated liquidity position width", "Concentrated liquidity position width (v2)"]

  FIX-C2:
    description: "Replace hybrid_system_v40 with hybrid_system_v50_2 in all scripts"
    status:      "applied_by_run_all.sh_phase0"

  FIX-T1:
    description: "Fix '71 cases' → '70 tasks' in §10.9; instability sweep uses 70-task subset"
    target:      "paper/jmlr-hypatiax-paper-final.tex"

  FIX-T2:
    description: "Standardise 'five-stage' terminology in §8.3 heading"
    target:      "paper/jmlr-hypatiax-paper-final.tex"

  FIX-XR3:
    description: "Fix 'Section 7.3' → 'Section 7.4' in supp_routing_improvements.tex"
    target:      "paper/supp_routing_improvements.tex"

  FIX-B2:
    description: "Remove duplicate bibkey cranmer2023interpretable"
    target:      "paper/jmlr-hypatiax-paper-final.tex"

  FIX-B3:
    description: "Remove duplicate bibkey udrescu2020aifeynman"
    target:      "paper/jmlr-hypatiax-paper-final.tex"
 
