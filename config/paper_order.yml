# ==============================================================================
# config/paper_order.yml
#
# Declares, in the EXACT order they are displayed in the compiled paper, every
# figure and table across:
#   1. jmlr_paper_main.tex          (the main paper)
#   2. supp_routing_improvements.tex  (Supplementary A)
#   3. supp_benchmark_report.tex      (Supplementary B)
#
# ci_paper_fig_tables.yml reads this file — nothing about paper order is
# hardcoded in the workflow itself. To reorder, add, or remove an item, edit
# this file only.
#
# IMPORTANT — read before editing:
#   Every figure in the paper is \includegraphics{...}-ed from a file that
#   generate_figures.py produces, so all 5 figure entries below have
#   source: generated.
#
#   The tables are a different story: as of this file's creation, NONE of the
#   ~50 tables in the compiled paper are \input{}-ed from the .tex fragments
#   that generate_tables.py writes — every table is hand-authored directly in
#   the paper/supplement source. Where a table's numbers visibly correspond to
#   an existing generate_tables.py output (matched by label/section/content in
#   the docstring of generate_tables.py), it is listed as source: generated
#   and this workflow will sync that fragment for reference. Every other
#   table is source: manual — there is nothing for this workflow to copy, and
#   it is listed here only so the paper-order manifest/report stays complete
#   and the gap is visible rather than silently omitted.
#
# Fields:
#   order         - display order across the whole paper (1-indexed, global)
#   type          - figure | table
#   doc           - main | suppA | suppB
#   label         - the \label{} used in the .tex source (fig: or tab:),
#                   "none" if the item has no \label
#   source        - generated | manual
#   stem          - (figures only) the \includegraphics filename with no
#                   extension; both .png and .pdf variants are synced
#   generated_file - (tables with source: generated) the .tex fragment
#                    filename written by generate_tables.py
#   section       - short human label for the report / step summary
# ==============================================================================

items:
