# ==============================================================================
#  ci_postprocess_parallel.yml  —  HypatiaX per-experiment figures + tables
#                                  (parallel pipeline variant of ci_postprocess.yml)
#
#  CHANGES vs ci_postprocess.yml
#  ─────────────────────────────────────────────────────────────────────────────
#  PAR-P1  workflow name updated to "HypatiaX - post-process (parallel)" so that
#          gh run list in ci_pipeline_parallel.yml wave-5-postprocess can filter
#          by --workflow ci_postprocess_parallel.yml without matching sequential
#          ci_postprocess.yml runs.
#
#  PAR-P2  run-name embeds "(parallel)" to distinguish in the GitHub UI.
#
#  PAR-P3  concurrency group renamed to ci-postprocess-parallel-<experiment> to
#          avoid cross-pipeline queueing / cancellation.
#
#  PAR-P4  Script path fix from ci_postprocess.yml is preserved:
#          generate_figures.py and generate_tables.py are invoked as
#          scripts/generate_figures.py and scripts/generate_tables.py
#          (under scripts/, not figures/ or tables/).
#          See BUG 2a fix note in ci_postprocess.yml.
#
#  PAR-P5  No other logic changes — all generate, commit, and warning steps
#          are identical to ci_postprocess.yml.
#
#  DISPATCH CONTEXT
#  ─────────────────────────────────────────────────────────────────────────────
#  Dispatched by ci_pipeline_parallel.yml wave5-postprocess for every experiment
#  after all analysis jobs complete.  Caller passes:
#    - experiment=<exp_id>
#    - (result_subdir optional; resolved from experiment if blank)
# ==============================================================================

name: "HypatiaX - post-process (parallel)"

run-name: >-
  HypatiaX post-process (parallel) ::
  ${{ github.event.inputs.experiment }}

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID"
        required: true
        type: string
      result_subdir:
        description: "Result subdirectory (derived from experiment if blank)"
        required: false
        type: string
        default: ""

# PAR-P1: write permission so git push succeeds (mirrors ci_postprocess.yml ISSUE 5 FIX).
permissions:
  contents: write

# PAR-P3: separate concurrency group from ci_postprocess.yml.
concurrency:
  group: ci-postprocess-parallel-${{ github.event.inputs.experiment }}
  cancel-in-progress: false

env:
  OUT_BASE: "hypatiax/data/results"

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PAR-P1: pass token explicitly so checkout carries write credentials
      # for the subsequent git push (mirrors ci_postprocess.yml ISSUE 6 FIX).
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.0" matplotlib seaborn

      # PAR-P4 / ISSUE 3 FIX: resolve result_subdir from experiment name using the
      # same canonical mapping as ci_analysis_parallel.yml and ci_postprocess.yml.
      - name: Resolve result_subdir
        id: meta
        env:
          DISPATCH_EXP: ${{ github.event.inputs.experiment }}
          DISPATCH_SUB: ${{ github.event.inputs.result_subdir }}
        run: |
          set -euo pipefail
          SUB="${DISPATCH_SUB}"
          if [[ -z "$SUB" ]]; then
            SUB=$(EXP_ID="$DISPATCH_EXP" python3 -c "
          import os
          mapping = {
              'exp1':               'comparison_results/noise-noiseless/noiseless/defi',
              'exp1b':              'comparison_results/noise-noiseless/15',
              'exp2_feynman':       'comparison_results/feynman-tests/exp2',
              'exp2':               'comparison_results/feynman-tests/exp2_multi',
              'exp3':               'extrapolation',
              'exp3b':              'extrapolation/multi_seed',
              'suppA':              'hybrid_pysr/defi',
              'suppB':              'comparison_results/feynman-tests/noise-sweep/noise-sweep',
              'suppB_sc':           'comparison_results/feynman-tests/sample-complexity',
              'hybrid_all_domains': 'hybrid_llm_nn/all_domains',
              'instability':        'figures',
              'extrap':             'comparison_results/extrapolation',
          }
          exp = os.environ['EXP_ID']
          print(mapping.get(exp, exp))
          ")
          fi
          echo "result_subdir=${SUB}" >> "$GITHUB_OUTPUT"
          echo "Resolved result_subdir=${SUB} for experiment=${DISPATCH_EXP}"

      - name: Generate figures
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          # PAR-P4 / BUG 2b FIX: pre-create both output dirs.
          mkdir -p "${OUT_BASE}/${SUB}/figures"
          mkdir -p "${OUT_BASE}/${SUB}/tables"
          # PAR-P4 / BUG 2a FIX: script lives under scripts/, not figures/.
          python scripts/generate_figures.py \
            --repo-root   "${OUT_BASE}/${SUB}" \
            --figures-dir "${OUT_BASE}/${SUB}/figures" \
            --source auto

      - name: Generate tables
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          # PAR-P4 / BUG 2a FIX: script lives under scripts/, not tables/.
          python scripts/generate_tables.py \
            --results-dir "${OUT_BASE}/${SUB}" \
            --output-dir  "${OUT_BASE}/${SUB}/tables"

      - name: Commit outputs
        env:
          SUB: ${{ steps.meta.outputs.result_subdir }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset index before rebasing to avoid dirty-index rebase refusal.
          git reset HEAD 2>/dev/null || true
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          FIGS="${OUT_BASE}/${SUB}/figures"
          TABS="${OUT_BASE}/${SUB}/tables"

          if [[ ! -d "$FIGS" ]] || [[ -z "$(ls -A "$FIGS" 2>/dev/null)" ]]; then
            echo "::warning::figures directory is empty or missing: ${FIGS}"
          fi
          if [[ ! -d "$TABS" ]] || [[ -z "$(ls -A "$TABS" 2>/dev/null)" ]]; then
            echo "::warning::tables directory is empty or missing: ${TABS}"
          fi

          git add "${FIGS}/" "${TABS}/" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to post-process outputs — results unchanged from previous run."
          else
            git commit -m "ci(parallel): figures+tables for ${{ github.event.inputs.experiment }} - run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed figures+tables for ${{ github.event.inputs.experiment }}."
          fi
